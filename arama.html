<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:880px; margin:0 auto; padding:36px 32px 0;}
  .page-head .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--sage); font-weight:600; margin-bottom:10px;}
  .page-head h1{font-family:'Inter', sans-serif; font-size:26px; font-weight:700; margin:0 0 6px; word-break:break-word;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- RESULTS ---------- */
  .search-wrap{max-width:880px; margin:0 auto; padding:24px 32px 90px;}
  .result-group{margin-bottom:32px;}
  .result-group:last-child{margin-bottom:0;}
  .result-group-title{font-family:'Inter', sans-serif; font-size:16.5px; font-weight:700; margin:0 0 12px; display:flex; align-items:baseline; gap:8px;}
  .result-group-count{font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:500; color:var(--ink-soft);}
  .result-list{display:flex; flex-direction:column; gap:10px;}
  .result-row{
    display:flex; align-items:center; gap:14px; padding:12px 16px;
    border:1px solid var(--line-soft); border-radius:12px; background:var(--paper-card);
    transition:border-color .15s ease, transform .15s ease;
  }
  .result-row:hover{border-color:var(--brass); transform:translateY(-1px);}
  .result-avatar{
    width:44px; height:44px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter', sans-serif; font-weight:700; font-size:14px; color:#fff;
    position:relative; overflow:hidden; background:var(--paper-alt);
  }
  .result-avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:var(--paper-card);}
  .result-info{flex:1; min-width:0;}
  .result-title{font-weight:600; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .result-meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .result-go{flex-shrink:0; color:var(--ink-soft); font-size:20px;}
  .result-more-note{font-size:12px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- MİMARLAB AI ----------
     Faz 4 — kullanıcı isteği: ayrı bir "MİMARLAB AI" arama kutusu/butonu OLMASIN, üst nav'daki TEK
     arama kutusuna yazılan her sorgu hem normal (foldTr fuzzy) hem AI ile aransın; bu blok artık
     yalnızca AI sonucunu göstermek için var, kendi input/buton'u yok (bkz. aşağıdaki runAiSearch,
     runSearch() tarafından otomatik tetiklenir). */
  .ai-search-result{max-width:880px; margin:24px auto 0; padding:0 32px;}
  .ai-eyebrow{font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .ai-summary{background:var(--paper-alt); border-radius:12px; padding:14px 18px; font-size:14px; line-height:1.6; color:var(--ink); margin-bottom:16px; white-space:pre-line;}
  .ai-loading, .ai-error{padding:2px 2px 16px; font-size:13.5px; color:var(--ink-soft);}
  /* ai-facets — gerçek dağılım sayımları (bkz. src/routes/ai.js#computeFacets). Sayısal bir
     "eşleşme skoru" DEĞİL, yalnızca "kaç projede geçiyor" sayımı (bkz. kullanıcı isteği: "anlamsız
     yüzde skorları üretme") — bu yüzden görsel olarak da normal metinden ayrılmayan, sade bir bilgi
     satırı. */
  .ai-facets{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; padding:0 2px;}
  .ai-facet-row strong{color:var(--ink); font-weight:600;}

  .search-empty{text-align:center; padding:50px 20px;}
  .search-empty p{color:var(--ink-soft); font-size:15px; margin:0 0 22px; line-height:1.6; max-width:440px; margin-left:auto; margin-right:auto;}
  .search-empty .nav-search{max-width:420px; margin:0 auto;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }

  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .page-head{padding:24px 18px 0;}
    .search-wrap{padding:18px 18px 70px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }

<script>
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

const MAX_PER_GROUP = 20;

// badge: yalnızca Mimarlar/Firmalar gruplarında geçilir (bkz. kullanıcı isteği: mavi onay
// rozetinin arama sonuçlarında da görünmesi) — proje/ürün satırlarında rozet anlamsız
// olduğundan çağıranlar orada bu parametreyi hiç geçmez.
function rowHtml({href, avatarStyle, avatarContent, title, meta, badge}){
  return `<a class="result-row" href="${href}">
    <div class="result-avatar" style="${avatarStyle||''}">${avatarContent||''}</div>
    <div class="result-info">
      <div class="result-title">${escapeHtml(title)}${badge||''}</div>
      <div class="result-meta">${escapeHtml(meta||'')}</div>
    </div>
    <div class="result-go">→</div>
  </a>`;
}

// totalCount: her grup sunucu tarafından zaten kırpılmış (grup başına en fazla MAX_PER_GROUP)
// bir dizi döner ama GERÇEK toplam sayıyı ayrıca verir (mimar/firma/proje için /api/public/
// search#totals, ürün için /api/products#total) — "(N)" başlığı ve "+N sonuç daha var" notu bu
// gerçek sayıyı kullanmalı, `items.length`i DEĞİL, aksi halde hep MAX_PER_GROUP'ta tıkanır kalır.
function groupHtml(label, items, toRow, totalCount){
  if(!items.length) return '';
  const total = totalCount == null ? items.length : totalCount;
  const shown = items.slice(0, MAX_PER_GROUP);
  const rest = total - shown.length;
  return `<div class="result-group">
    <h2 class="result-group-title">${label} <span class="result-group-count">(${total})</span></h2>
    <div class="result-list">${shown.map(toRow).join('')}</div>
    ${rest > 0 ? `<div class="result-more-note">+${rest} sonuç daha var, aramanı daraltmayı dene</div>` : ''}
  </div>`;
}

// runSearch her çağrıldığında D1 fetch'leri (aşağıdaki /api/public/search + /api/products)
// tetiklediğinden, art arda hızlı iki çağrı arasında bir yarış durumu oluşabilir (ikinci çağrı
// DAHA ÖNCE dönerse, ilk çağrının GEÇ dönen yanıtı sonucu üzerine yazardı) — nav arama kutusundaki
// AYNI runToken/currentQuery karşılaştırma deseniyle en son başlatılan çağrı her zaman kazanır.
let searchRunToken = 0;

async function runSearch(){
  const runToken = ++searchRunToken;
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  const wrap = document.getElementById('search-wrap');
  const titleEl = document.getElementById('search-title');
  const subtitleEl = document.getElementById('search-subtitle');

  document.querySelectorAll('.nav-search input, .nav-mobile-search input').forEach(inp=>{ inp.value = query; });

  if(!query){
    titleEl.textContent = 'Arama';
    subtitleEl.textContent = '';
    wrap.innerHTML = `<div class="search-empty">
      <p>Mimar, firma, proje veya ürün aramak için üstteki arama kutusunu kullan.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Ara...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  titleEl.textContent = `"${query}" için sonuçlar`;
  const queryHtml = escapeHtml(query);

  // Mimar/Firma/Proje canonical D1'den (bkz. src/routes/legacyContent.js#handlePublicSearchFull),
  // Ürün/Malzeme de artık AYNI şekilde canonical `products` tablosundan (bkz. src/routes/
  // product.js#handleProductListRoute'un `search` parametresi) — statik urunler-data.js/
  // malzemeler-data.js dizileri kaldırıldı (kullanıcı isteği). İkisi de zaten hidden_at IS NULL
  // filtresini D1 tarafında uyguladığından ayrı bir gizleme kontrolüne gerek yok. Paralel çalıştırılır,
  // aksi halde ürün sorgusu toplam gecikmeyi ikiye katlardı.
  let full = { architects: [], offices: [], projects: [], totals: { architects: 0, offices: 0, projects: 0 } };
  let urunResults = [];
  let urunTotal = 0;
  const [fullRes, productsRes] = await Promise.allSettled([
    fetch('/api/public/search?q=' + encodeURIComponent(query)),
    fetch('/api/products?search=' + encodeURIComponent(query) + '&limit=' + MAX_PER_GROUP),
  ]);
  if(fullRes.status === 'fulfilled' && fullRes.value.ok) full = await fullRes.value.json();
  if(productsRes.status === 'fulfilled' && productsRes.value.ok){
    const data = await productsRes.value.json();
    urunResults = data.items || [];
    urunTotal = data.total || 0;
  }
  if(runToken !== searchRunToken) return; // yarış durumu — daha yeni bir çağrı zaten başladı

  const total = full.totals.architects + full.totals.offices + full.totals.projects + urunTotal;
  subtitleEl.textContent = total ? `${total} sonuç bulundu` : '';

  if(total === 0){
    wrap.innerHTML = `<div class="search-empty">
      <p>"${queryHtml}" için bir sonuç bulunamadı. Başka bir anahtar kelimeyle tekrar dene.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Tekrar arayın...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  wrap.innerHTML = [
    groupHtml('Mimarlar', full.architects, a => rowHtml({
      href: `/mimar/${encodeURIComponent(a.slug)}`,
      avatarStyle: `background:${officeColor(a.name)}`,
      avatarContent: `${initials(a.name)}${a.photo ? `<img src="${escapeAttr(cdnImg(a.photo, 200))}"${cdnSrcset(a.photo, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(a.photo, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
      title: a.name,
      meta: a.office || 'Mimar',
      badge: verifiedBadgeHtml('architect', a.name, a.badges, 13),
    }), full.totals.architects),
    groupHtml('Firmalar', full.offices, o => rowHtml({
      href: `/firma/${encodeURIComponent(o.slug)}`,
      avatarStyle: `background:${officeColor(o.name)}`,
      avatarContent: `${initials(o.name)}${logoUrl(o) ? `<img src="${escapeAttr(cdnImg(logoUrl(o), 200))}"${cdnSrcset(logoUrl(o), [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(logoUrl(o), [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
      title: o.name,
      meta: o.loc || '',
      badge: verifiedBadgeHtml('office', o.name, o.badges, 13),
    }), full.totals.offices),
    groupHtml('Projeler', full.projects, p => rowHtml({
      href: `/proje/${encodeURIComponent(p.slug)}`,
      avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
      title: p.title,
      meta: [p.location, p.date].filter(Boolean).join(' · '),
    }), full.totals.projects),
    groupHtml('Ürünler', urunResults, p => rowHtml({
      href: `/urun/${encodeURIComponent(p.slug)}`,
      avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
      title: p.title,
      meta: [p.category, p.brand].filter(Boolean).join(' · '),
    }), urunTotal),
  ].join('');

  wireNavSearch();
}



// MİMARLAB AI (bkz. kullanıcı isteği, Faz 4: ayrı bir arama kutusu/buton OLMASIN) — üst nav'daki
// TEK arama kutusuna yazılan sorgu artık HEM normal (foldTr fuzzy, runSearch) HEM AI (/api/ai/search)
// ile otomatik aranır, aynı groupHtml/rowHtml render mantığını (yukarısı) paylaşır ki AI sonuçları
// normal arama sonuçlarıyla BİREBİR aynı görünsün (bkz. kullanıcı isteği: "generic chatbot görünümü
// oluşturma"). Faz 3'teki (Araştırma Modu) sunucu tarafı previousFilters/daraltma desteği
// (src/routes/ai.js) burada KULLANILMAZ — tek giriş noktası artık her zaman TAM sayfa yenileyen nav
// arama kutusu olduğundan (bkz. wireNavSearch, site-chrome.js) istemci tarafı bir "konuşma durumu"
// tutmanın anlamı kalmadı, her /arama?q= YENİ ve bağımsız bir sorgu olarak ele alınır.
let aiRunToken = 0;
const aiResultEl = document.getElementById('ai-search-result');

const FACET_LABELS = { cities: 'Şehir', categories: 'Tip', discipline: 'Tür' };
// facetsHtml — computeFacets()'in (bkz. src/routes/ai.js) döndürdüğü GERÇEK sayımları düz metin
// olarak listeler, hiçbir yüzde/skor göstermez (bkz. kullanıcı isteği: "anlamsız yüzde skorları
// üretme").
function facetsHtml(facets){
  if(!facets) return '';
  const parts = [];
  ['cities', 'categories', 'discipline'].forEach(key => {
    const items = facets[key];
    if(items && items.length) parts.push(`<div class="ai-facet-row"><strong>${FACET_LABELS[key]}:</strong> ${items.map(i => `${escapeHtml(i.value)} (${i.count})`).join(', ')}</div>`);
  });
  if(facets.yearRange) parts.push(`<div class="ai-facet-row"><strong>Yıl Aralığı:</strong> ${facets.yearRange.from < 0 ? `MÖ ${-facets.yearRange.from}` : facets.yearRange.from} – ${facets.yearRange.to < 0 ? `MÖ ${-facets.yearRange.to}` : facets.yearRange.to}</div>`);
  if(!parts.length) return '';
  return `<div class="ai-facets">${parts.join('')}</div>`;
}

async function runAiSearch(q){
  q = (q || '').trim();
  if(!q) return;
  const runToken = ++aiRunToken;
  aiResultEl.hidden = false;
  aiResultEl.innerHTML = '<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-loading">MİMARLAB AI aranıyor…</div>';

  let res, data;
  try{
    res = await fetch('/api/ai/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
  } catch(e){
    if(runToken !== aiRunToken) return;
    aiResultEl.innerHTML = '<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-error">Bağlantı sorunu oluştu.</div>';
    return;
  }
  if(runToken !== aiRunToken) return;

  if(!res.ok){
    // 429 (hız sınırı) dahil — bkz. kullanıcı isteği: normal arama zaten aynı sonucu gösterdiğinden
    // AI tarafında bir hata olması TÜM sayfayı bozmamalı, yalnızca bu blok sessizce gizlenir.
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    return;
  }
  data = await res.json();
  if(runToken !== aiRunToken) return;

  const html = [`<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-summary">${escapeHtml(data.summary)}</div>`, facetsHtml(data.facets)];
  html.push(groupHtml('Mimarlar', data.architects, a => rowHtml({
    href: `/mimar/${encodeURIComponent(a.slug)}`,
    avatarStyle: `background:${officeColor(a.name)}`,
    avatarContent: `${initials(a.name)}${a.photo ? `<img src="${escapeAttr(cdnImg(a.photo, 200))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: a.name,
    meta: a.office || 'Mimar',
    badge: verifiedBadgeHtml('architect', a.name, a.badges, 13),
  }), data.totals.architects));
  html.push(groupHtml('Firmalar', data.offices, o => rowHtml({
    href: `/firma/${encodeURIComponent(o.slug)}`,
    avatarStyle: `background:${officeColor(o.name)}`,
    avatarContent: `${initials(o.name)}${logoUrl(o) ? `<img src="${escapeAttr(cdnImg(logoUrl(o), 200))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: o.name,
    meta: o.loc || '',
    badge: verifiedBadgeHtml('office', o.name, o.badges, 13),
  }), data.totals.offices));
  html.push(groupHtml('Projeler', data.projects, p => rowHtml({
    href: `/proje/${encodeURIComponent(p.slug)}`,
    avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}" alt="" loading="lazy" decoding="async">` : '',
    title: p.title,
    meta: [p.location, p.date].filter(Boolean).join(' · '),
  }), data.totals.projects));

  const total = data.totals.architects + data.totals.offices + data.totals.projects;
  if(!total && !data.aiAvailable){
    // AI hiç yanıt veremediyse VE sonuç da yoksa (bkz. src/routes/ai.js fallback metni) bu blok
    // normal arama sonuçlarının üstünde gereksiz bir "bulunamadı" tekrarı olur — sessizce gizlenir.
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    return;
  }
  aiResultEl.innerHTML = html.join('');
}

// AI araması runSearch()'ten AYRI tetiklenir (aynı sorguyla, paralel) — runSearch() rozetler
// hazır olduğunda (bkz. aşağısı) bir kez daha çalıştığından, AI'yı runSearch() İÇİNE koymak her
// rozet güncellemesinde gereksiz ikinci bir LLM çağrısına (maliyet/rate-limit) yol açardı. Sorgu
// değişmediği sürece (aynı sekme, aynı /arama?q=) yalnızca BİR kez tetiklenir.
let lastAiQuery = null;
function maybeRunAiSearch(){
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  if(!query){
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    lastAiQuery = null;
    return;
  }
  if(query === lastAiQuery) return;
  lastAiQuery = query;
  runAiSearch(query);
}

runSearch();
maybeRunAiSearch();
// Rozetler /api/public/badges'ten asenkron gelir (bkz. badge-shared.js) — ilk arama sonucu bu fetch
// tamamlanmadan çizilmişse Mimarlar/Firmalar satırları rozetsiz kalmış olabilir, bu yüzden rozetler
// gelince runSearch() bir kez daha (ve yalnızca bir kez) çalıştırılır. AI bloğu ZATEN doğru
// render edildiğinden (rozetler yalnızca normal sonuç satırlarını etkiler) burada tekrar
// tetiklenmez (bkz. yukarıdaki maybeRunAiSearch yorumu).
window.addEventListener('mimarlab-badges-ready', () => runSearch(), { once: true });
</script>
