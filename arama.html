<!-- Erken arama isteği (performans turu, 2026-09-08): ?q= varsa runSearch()'ün atacağı TEK isteği HTML
     ayrıştırılırken başlatır (kisi/firma/proje <head> shim'iyle aynı __mlPrefetch sözleşmesi). URL
     runSearch'ünkiyle BİREBİR aynı kurulur (trim + encodeURIComponent); eşleşmezse listFetch normal
     fetch'e düşer, ikinci istek DOĞMAZ. -->
<!-- mlPre (performans turu, 2026-09-08): Worker bu shim'in ÜRETECEĞİ URL'lerin yanıtını <head>'in EN
     BAŞINA #ml-list-data olarak gömer (bkz. src/index.js#HUB_SSR). Gömülü yanıt varsa (ve 60sn'den
     yeniyse; alt sınır -5dk = istemci saat sapması toleransı) ağa hiç çıkılmadan aynı __mlPrefetch
     sözlüğüne hazır bir Response yazılır; yoksa eskisi gibi erken fetch. listFetch() ikisini ayırt etmez. -->
<script>(function(){function mlPre(u){try{var el=document.getElementById('ml-list-data');if(el){var d=JSON.parse(el.textContent);var age=Date.now()-(d.t||0);if(d.v===1&&age>-300000&&age<60000&&d.entries&&d.entries[u]){return Promise.resolve(new Response(JSON.stringify(d.entries[u]),{status:200,headers:{'Content-Type':'application/json; charset=utf-8'}}));}}}catch(e){}var f=fetch(u,{cache:'no-store'});f.catch(function(){});return f;}try{
if(location.pathname.replace(/\/+$/,'')==='/arama'){var q=(new URLSearchParams(location.search).get('q')||'').trim();if(q){var u='/api/public/search?q='+encodeURIComponent(q);(window.__mlPrefetch=window.__mlPrefetch||{})[u]=mlPre(u);}}
}catch(e){}})();</script>

<script>
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// Türkçe büyük/küçük + aksan-bağımsız eşleştirme — src/lib/textMatch.js#foldTr ve sunucudaki diğer
// kopyalarla BİREBİR aynı. Burada yalnızca "Sayfalar" bölümünün (sabit, istemci tarafı liste)
// eşleştirmesi için gerekiyor; diğer tüm bölümler eşleştirmeyi zaten sunucuda yapıyor.
// NFC/birleşme-işareti adımı: bu sayfanın sorgusu bir metin kutusundan DEĞİL, ?q= ile URL'den
// geliyor — yani site-chrome.js'teki site geneli giriş normalizasyonu buraya hiç uğramıyor
// (paylaşılan bir bağlantı, yer imi ya da başka bir siteden gelen link ayrışık yazım taşıyabilir).
// Kök neden için bkz. src/lib/textMatch.js dosya başı.
function trLower(s){ return (s || '').normalize('NFC').replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ş/g,'ş').replace(/Ğ/g,'ğ').replace(/Ü/g,'ü').replace(/Ö/g,'ö').replace(/Ç/g,'ç').toLowerCase(); }
function foldTr(s){ return trLower(s).replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o'); }

const MAX_PER_GROUP = 20;

// ---------------------------------------------------------------------------
// Her tür için TEK bölüm (kullanıcı bildirimi, 2026-09-01 — eskiden ayrı bir AI panosu aynı
// başlıklarla ikinci bir tablo seti çiziyordu; 2026-09-19'da yapay zeka araması tamamen kaldırıldı).
//
// Bölüm sırası (kullanıcı isteği): Projeler, Mimarlar, Firmalar, Ürünler, Markalar, Sayfalar.
// ---------------------------------------------------------------------------

// FİRMA/MARKA ayrımı sitenin geri kalanıyla AYNI kuraldır (bkz. src/routes/office.js#passes ve
// office-kind.js): marka.html (?brands=1) marka olan HER ofisi gösterir (Autoban gibi hem firma hem
// marka olanlar dahil), firma.html ise yalnızca SAF markaları (hiç mimarlık hizmeti sunmayan
// üretici, ör. VitrA) dışlar. Bu yüzden iki bölüm ayrı ayrı /api/offices'tan çekilir — /api/public/
// search bu ayrımı hiç uygulamadığından (VitrA'yı "Firma" sayıyordu) ondan türetilemez.

// "Sayfalar" bölümü — sitenin kendi sayfaları. Tamamen istemci tarafı, sabit bir liste (bu sayfalar
// D1'de bir kayıt DEĞİL); eşleştirme aynı foldTr ile yapılır. keywords: sayfa adında geçmeyen ama
// kullanıcının arayabileceği eş anlamlılar.
const SITE_PAGES = [
  { title: 'Projeler', href: '/proje', meta: 'Proje listesi', keywords: 'yapi bina eser' },
  { title: 'Kişiler', href: '/kisi', meta: 'Kişi listesi', keywords: 'mimar tasarimci fotografci ogrenci' },
  { title: 'Firmalar', href: '/firma', meta: 'Firma listesi', keywords: 'ofis studyo buro' },
  { title: 'Ürünler', href: '/urun', meta: 'Ürün ve malzeme kataloğu', keywords: 'malzeme katalog mobilya' },
  { title: 'En İyi 100 Mimari Eser', href: '/en-iyi-100', meta: 'Sıralama', keywords: 'top 100 siralama puan' },
  { title: 'Neden MİMARLAB?', href: '/neden-mimarlab', meta: 'Kurumsal', keywords: 'tanitim sunum platform' },
  { title: 'Hakkında', href: '/hakkinda', meta: 'Kurumsal', keywords: 'biz kimiz' },

  { title: 'Gizlilik Politikası', href: '/gizlilik-politikasi', meta: 'Kurumsal', keywords: 'kvkk gdpr veri' },
  { title: 'Hizmet Şartları', href: '/hizmet-sartlari', meta: 'Kurumsal', keywords: 'kullanim kosullari sozlesme' },
  { title: 'Çerez Politikası', href: '/cerez-politikasi', meta: 'Kurumsal', keywords: 'cookie' },

  { title: 'İade Et', href: '/iade-et', meta: 'Üyelik', keywords: 'iade geri odeme' },

  { title: 'Ürün Ekle', href: '/urun-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder' },
  { title: 'Gündem İçeriği Ekle', href: '/gundem-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder haber etkinlik yarisma gundem' },
];

// badge: yalnızca Mimarlar/Firmalar gruplarında geçilir (bkz. kullanıcı isteği: mavi onay
// rozetinin arama sonuçlarında da görünmesi) — proje/ürün satırlarında rozet anlamsız
// olduğundan çağıranlar orada bu parametreyi hiç geçmez.
function rowHtml({href, avatarStyle, avatarContent, title, meta, badge}){
  return `<a class="result-row" href="${href}">
    <div class="result-avatar" style="${avatarStyle||''}">${avatarContent||''}</div>
    <div class="result-info">
      <div class="result-title">${escapeHtml(title)}${badge||''}</div>
      <div class="result-meta">${escapeHtml(meta||'')}</div>
    </div>
    <div class="result-go">→</div>
  </a>`;
}

// totalCount: her grup sunucu tarafından zaten kırpılmış (grup başına en fazla MAX_PER_GROUP)
// bir dizi döner ama GERÇEK toplam sayıyı ayrıca verir (mimar/firma/proje için /api/public/
// search#totals, ürün için /api/products#total) — "(N)" başlığı ve "+N sonuç daha var" notu bu
// gerçek sayıyı kullanmalı, `items.length`i DEĞİL, aksi halde hep MAX_PER_GROUP'ta tıkanır kalır.
function groupHtml(label, items, toRow, totalCount){
  if(!items.length) return '';
  const total = totalCount == null ? items.length : totalCount;
  const shown = items.slice(0, MAX_PER_GROUP);
  const rest = total - shown.length;
  return `<div class="result-group">
    <h2 class="result-group-title">${label} <span class="result-group-count">(${total})</span></h2>
    <div class="result-list">${shown.map(toRow).join('')}</div>
    ${rest > 0 ? `<div class="result-more-note">+${rest} sonuç daha var, aramanı daraltmayı dene</div>` : ''}
  </div>`;
}

// runSearch her çağrıldığında D1 fetch'leri (aşağıdaki /api/public/search + /api/products)
// tetiklediğinden, art arda hızlı iki çağrı arasında bir yarış durumu oluşabilir (ikinci çağrı
// DAHA ÖNCE dönerse, ilk çağrının GEÇ dönen yanıtı sonucu üzerine yazardı) — nav arama kutusundaki
// AYNI runToken/currentQuery karşılaştırma deseniyle en son başlatılan çağrı her zaman kazanır.
let searchRunToken = 0;

// <head>'deki shim'in ÖNCEDEN hazırladığı (gömülü ya da erken başlatılmış) yanıtı devralır; yoksa
// normal fetch. Kayıt TEK KULLANIMLIKTIR — kisi.html/js/pages/proje.js#listFetch ile aynı desen.
function listFetch(url){
  const store = window.__mlPrefetch;
  if(store && store[url]){ const p = store[url]; delete store[url]; return p; }
  return fetch(url);
}
// Son başarılı arama yanıtı. GERÇEK BULGU (performans turu, 2026-09-08): runSearch() aynı sorgu için
// birden fazla kez çalışıyor (ilk çizim, rozetler gelince) ve her seferinde /api/public/search'ü —
// Cache API'de TUTULMAYAN, tam bir D1 araması — yeniden çekiyordu. Sorgu aynıysa eldeki yanıtla
// yeniden çizilir.
let lastSearch = null;
async function runSearch(){
  const runToken = ++searchRunToken;
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  const wrap = document.getElementById('search-wrap');
  const titleEl = document.getElementById('search-title');
  const subtitleEl = document.getElementById('search-subtitle');

  document.querySelectorAll('.nav-search input, .nav-mobile-search input').forEach(inp=>{ inp.value = query; });

  if(!query){
    titleEl.textContent = 'Arama';
    subtitleEl.textContent = '';
    wrap.innerHTML = `<div class="search-empty">
      <p>Kişi, firma, proje veya ürün aramak için üstteki arama kutusunu kullan.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Ara...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  titleEl.textContent = `"${query}" için sonuçlar`;
  const queryHtml = escapeHtml(query);

  // Mimar/Firma/Proje canonical D1'den (bkz. src/routes/legacyContent.js#handlePublicSearchFull),
  // Ürün/Malzeme de artık AYNI şekilde canonical `products` tablosundan (bkz. src/routes/
  // product.js#handleProductListRoute'un `search` parametresi) — statik urunler-data.js/
  // malzemeler-data.js dizileri kaldırıldı (kullanıcı isteği). İkisi de zaten hidden_at IS NULL
  // filtresini D1 tarafında uyguladığından ayrı bir gizleme kontrolüne gerek yok. Paralel çalıştırılır,
  // aksi halde ürün sorgusu toplam gecikmeyi ikiye katlardı.
  // ARTIK TEK İSTEK (arama denetimi, 2026-09-07): /api/public/search dört varlık türünü de AYNI
  // getirme + AYNI sıralamayla döner (bkz. src/lib/classicSearch.js). Eskiden ürün için
  // /api/products?search, firma/marka için /api/offices?search (×2) ayrı ayrı çekiliyor ve her
  // uç kendi (farklı) alt-dize eşleştirmesini yapıyordu — üst nav'daki öneri penceresi ile bu
  // sayfa aynı sorguya farklı listeler gösteriyordu. Firma/Marka ayrımı sunucudan gelen `brand`/
  // `pureBrand` bayraklarıyla yapılır (bkz. office-kind.js: marka bölümü isBrandOffice, firma
  // bölümü !isPureBrandOffice — bir ofis her ikisinde de görünebilir, Autoban gibi).
  let full = { architects: [], offices: [], projects: [], products: [], totals: { architects: 0, offices: 0, projects: 0, products: 0 }, capped: {} };
  const searchUrl = '/api/public/search?q=' + encodeURIComponent(query);
  if(lastSearch && lastSearch.url === searchUrl){
    full = lastSearch.data;
  } else {
    let fetched = null;
    try {
      const res = await listFetch(searchUrl);
      if(res.ok) fetched = await res.json();
    } catch(e) { /* ağ hatası — boş durum aşağıda ele alınır */ }
    if(fetched){ full = fetched; lastSearch = { url: searchUrl, data: fetched }; }
  }
  if(runToken !== searchRunToken) return; // yarış durumu — daha yeni bir çağrı zaten başladı
  const urunResults = full.products || [];
  const urunTotal = full.totals.products || 0;
  const allOffices = full.offices || [];
  const firmaResults = allOffices.filter(o => !o.pureBrand);
  const markaResults = allOffices.filter(o => o.brand);
  // Firma/marka toplamı: sunucu toplamı tüm ofisleri sayar; gösterilen listedeki bölünme oranı
  // toplama uygulanır ki "+N sonuç daha var" notu abartmasın.
  const officeTotal = full.totals.offices || 0;
  const firmaTotal = allOffices.length ? Math.round(officeTotal * firmaResults.length / allOffices.length) : 0;
  const markaTotal = allOffices.length ? Math.round(officeTotal * markaResults.length / allOffices.length) : 0;

  const projeGroup  = { items: full.projects || [], total: full.totals.projects || 0 };
  const mimarGroup  = { items: full.architects || [], total: full.totals.architects || 0 };
  const firmaGroup  = { items: firmaResults, total: firmaTotal };
  const urunGroup   = { items: urunResults, total: urunTotal };
  const markaGroup  = { items: markaResults, total: markaTotal };

  // Sayfalar — sabit site sayfaları, aynı foldTr eşleştirmesiyle.
  const qFold = foldTr(query);
  const sayfaResults = SITE_PAGES.filter(p => foldTr(p.title).includes(qFold) || foldTr(p.keywords || '').includes(qFold));

  const total = projeGroup.total + mimarGroup.total + firmaGroup.total + urunGroup.total + markaGroup.total + sayfaResults.length;
  subtitleEl.textContent = total ? `${total} sonuç bulundu` : '';

  if(total === 0){
    wrap.innerHTML = `<div class="search-empty">
      <p>"${queryHtml}" için bir sonuç bulunamadı. Başka bir anahtar kelimeyle tekrar dene.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Tekrar arayın...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  // Ortak satır üreticileri — Firma/Marka aynı satır biçimini paylaştığı için tek noktada
  // tanımlanır.
  const projectRow = p => rowHtml({
    href: `/proje/${encodeURIComponent(p.slug)}`,
    avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
    title: p.title,
    meta: [p.location, p.date].filter(Boolean).join(' · '),
  });
  const architectRow = a => rowHtml({
    href: `/kisi/${encodeURIComponent(a.slug)}`,
    avatarStyle: `background:${officeColor(a.name)}`,
    avatarContent: `${initials(a.name)}${a.photo ? `<img src="${escapeAttr(cdnImg(a.photo, 200))}"${cdnSrcset(a.photo, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(a.photo, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: a.name,
    meta: a.office || 'Kişi',
    badge: verifiedBadgeHtml('architect', a.name, a.badges, 13),
  });
  // Firma ve marka satırları AYNI biçimi paylaşır, yalnızca URL öneki kayda göre değişir: saf
  // markalar /marka/:slug (bkz. src/lib/officeUrl.js, kullanıcı isteği 2026-09-06 madde 2).
  // `o.brand` bayrağı /api/offices'ten gelir; taşımayan kaynaklarda (arama uçları)
  // eski /firma/:slug üretilir ve sunucu 301 ile kanonik adrese yönlendirir.
  const officeRow = o => rowHtml({
    // Sunucu kanonik yolu (`href`) zaten veriyor (bkz. src/lib/officeUrl.js); vermeyen kaynaklar
    // için /firma/:slug üretilir, sunucu gerekirse 301 ile düzeltir.
    href: o.href || `/firma/${encodeURIComponent(o.slug)}`,
    avatarStyle: `background:${officeColor(o.name)}`,
    avatarContent: `${initials(o.name)}${logoUrl(o) ? `<img src="${escapeAttr(cdnImg(logoUrl(o), 200))}"${cdnSrcset(logoUrl(o), [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(logoUrl(o), [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: o.name,
    meta: o.loc || '',
    badge: verifiedBadgeHtml('office', o.name, o.badges, 13),
  });

  // Bölüm sırası kullanıcı isteğiyle sabit: Projeler → Mimarlar → Firmalar → Ürünler → Markalar →
  // Sayfalar. groupHtml boş listeler için '' döndürdüğünden sonuçsuz türler kendiliğinden gizlenir.
  wrap.innerHTML = [
    groupHtml('Projeler', projeGroup.items, projectRow, projeGroup.total),
    groupHtml('Kişiler', mimarGroup.items, architectRow, mimarGroup.total),
    groupHtml('Firmalar', firmaGroup.items, officeRow, firmaGroup.total),
    groupHtml('Ürünler', urunGroup.items, p => rowHtml({
      href: `/urun/${encodeURIComponent(p.slug)}`,
      avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
      title: p.title,
      meta: [p.category, p.brand].filter(Boolean).join(' · '),
    }), urunGroup.total),
    groupHtml('Markalar', markaGroup.items, officeRow, markaGroup.total),
    groupHtml('Sayfalar', sayfaResults, s => rowHtml({
      href: s.href,
      avatarStyle: `background:${officeColor(s.title)}`,
      avatarContent: initials(s.title),
      title: s.title,
      meta: s.meta || '',
    }), sayfaResults.length),
  ].join('');

  // Arama gösterimleri (kullanıcı isteği, 2026-09-04 — Profil İstatistikleri). YALNIZCA gerçekten
  // ekrana basılan kişi/firma/marka satırları sayılır; sayaç oturum başına tekilleştirilir ve tek
  // istekte toplu gönderilir (bkz. js/analytics-beacon.js). Proje/ürün burada BİLEREK sayılmaz —
  // "arama gösterimi" metriği istekte profil metrikleri altında tanımlı.
  if (window.MimarlabAnalytics) {
    MimarlabAnalytics.impressions([
      ...mimarGroup.items.map(a => ({ type: 'architect', key: a.slug })),
      ...firmaGroup.items.map(o => ({ type: 'office', key: o.slug })),
      ...markaGroup.items.map(o => ({ type: 'office', key: o.slug })),
    ].filter(x => x.key));
  }

  wireNavSearch();
}


// 2026-09-19: yapay zeka araması kaldırıldı (ücretli AI). Eskiden aynı sorgu burada ayrıca
// /api/ai/search'e gönderiliyor, dönen özet/filtre etiketleri/facet'ler #ai-search-result'ta
// gösteriliyor ve bulunan kayıtlar runSearch() bölümlerinin içine karıştırılıyordu. Artık tek yol
// klasik arama (runSearch -> /api/public/search).
runSearch();
// Rozetler /api/public/badges'ten asenkron gelir (bkz. badge-shared.js) — ilk arama sonucu bu fetch
// tamamlanmadan çizilmişse Mimarlar/Firmalar satırları rozetsiz kalmış olabilir, bu yüzden rozetler
// gelince runSearch() bir kez daha (ve yalnızca bir kez) çalıştırılır.
window.addEventListener('mimarlab-badges-ready', () => runSearch(), { once: true });
</script>
