<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;

  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}

  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}

  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}

  .ai-eyebrow{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px;}

  .ai-loading, .ai-error{padding:2px 2px 16px; font-size:13.5px; color:var(--ink-soft);}

  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}

<script>
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// Türkçe büyük/küçük + aksan-bağımsız eşleştirme — src/lib/textMatch.js#foldTr ve sunucudaki diğer
// kopyalarla BİREBİR aynı. Burada yalnızca "Sayfalar" bölümünün (sabit, istemci tarafı liste)
// eşleştirmesi için gerekiyor; diğer tüm bölümler eşleştirmeyi zaten sunucuda yapıyor.
function trLower(s){ return (s || '').replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ş/g,'ş').replace(/Ğ/g,'ğ').replace(/Ü/g,'ü').replace(/Ö/g,'ö').replace(/Ç/g,'ç').toLowerCase(); }
function foldTr(s){ return trLower(s).replace(/ı/g,'i').replace(/ş/g,'s').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o'); }

const MAX_PER_GROUP = 20;

// ---------------------------------------------------------------------------
// KÖK NEDEN (kullanıcı bildirimi, 2026-09-01): /arama sayfası "Mimarlar (12), Firmalar (2),
// Projeler (14), Mimarlar (24), Firmalar (2), Projeler (68)" gibi HER TÜRDEN İKİ tablo
// gösteriyordu. Sebep, sayfanın BİRBİRİNDEN BAĞIMSIZ iki sonuç bloğu render etmesiydi:
//   1) #ai-search-result — MİMARLAB AI panosu, KENDİ Mimarlar/Firmalar/Projeler bölümlerini çizerdi
//      (AI daralttığı için sayılar daha küçük: 12/2/14)
//   2) #search-wrap      — klasik anahtar-kelime araması, AYNI başlıklarla (24/2/68)
// İki blok görsel olarak neredeyse aynı olduğundan "tablo iki kere çıkıyor" olarak görünüyordu.
//
// ÇÖZÜM: her tür için TEK bölüm. AI'nın SONUÇ SATIRLARI artık klasik bölümlerin İÇİNE birleştirilir
// (slug'a göre tekilleştirilerek); AI panosu yalnızca kendine özgü katkısını (özet + facet'ler)
// gösterir, kendi tablolarını çizmez. Böylece "bursa'daki camiler" gibi yalnızca AI'nın
// yanıtlayabildiği doğal dil sorgularında sonuçlar KAYBOLMAZ (bkz. runAiSearch yorumu), sadece
// mükerrer tablolar ortadan kalkar.
//
// Bölüm sırası (kullanıcı isteği): Projeler, Mimarlar, Firmalar, Ürünler, Markalar, Sayfalar.
// ---------------------------------------------------------------------------

// FİRMA/MARKA ayrımı sitenin geri kalanıyla AYNI kuraldır (bkz. src/routes/office.js#passes ve
// office-kind.js): marka.html (?brands=1) marka olan HER ofisi gösterir (Autoban gibi hem firma hem
// marka olanlar dahil), firma.html ise yalnızca SAF markaları (hiç mimarlık hizmeti sunmayan
// üretici, ör. VitrA) dışlar. Bu yüzden iki bölüm ayrı ayrı /api/offices'tan çekilir — /api/public/
// search bu ayrımı hiç uygulamadığından (VitrA'yı "Firma" sayıyordu) ondan türetilemez.

// "Sayfalar" bölümü — sitenin kendi sayfaları. Tamamen istemci tarafı, sabit bir liste (bu sayfalar
// D1'de bir kayıt DEĞİL); eşleştirme aynı foldTr ile yapılır. keywords: sayfa adında geçmeyen ama
// kullanıcının arayabileceği eş anlamlılar.
const SITE_PAGES = [
  { title: 'Projeler', href: '/proje', meta: 'Proje listesi', keywords: 'yapi bina eser' },
  { title: 'Kişiler', href: '/kisi', meta: 'Kişi listesi', keywords: 'mimar tasarimci fotografci ogrenci' },
  { title: 'Firmalar', href: '/firma', meta: 'Firma listesi', keywords: 'ofis studyo buro' },
  { title: 'Ürünler', href: '/urun', meta: 'Ürün ve malzeme kataloğu', keywords: 'malzeme katalog mobilya' },
  { title: 'Markalar', href: '/marka', meta: 'Marka listesi', keywords: 'uretici' },
  { title: 'En İyi 100 Mimari Eser', href: '/en-iyi-100', meta: 'Sıralama', keywords: 'top 100 siralama puan' },
  { title: 'Neden MİMARLAB?', href: '/neden-mimarlab', meta: 'Kurumsal', keywords: 'tanitim sunum platform' },
  { title: 'Hakkında', href: '/hakkinda', meta: 'Kurumsal', keywords: 'biz kimiz' },
  { title: 'İletişim', href: '/iletisim', meta: 'Kurumsal', keywords: 'ulasim eposta mail destek' },
  { title: 'Gizlilik Politikası', href: '/gizlilik-politikasi', meta: 'Kurumsal', keywords: 'kvkk gdpr veri' },
  { title: 'Hizmet Şartları', href: '/hizmet-sartlari', meta: 'Kurumsal', keywords: 'kullanim kosullari sozlesme' },
  { title: 'Çerez Politikası', href: '/cerez-politikasi', meta: 'Kurumsal', keywords: 'cookie' },
  { title: 'Rozet Al', href: '/rozet-al', meta: 'Üyelik', keywords: 'satin al abonelik dogrulanmis altin elmas' },
  { title: 'İade Et', href: '/iade-et', meta: 'Üyelik', keywords: 'iade geri odeme' },
  { title: 'Proje Ekle', href: '/proje-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder yukle' },
  { title: 'Kişi Ekle', href: '/kisi-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder mimar' },
  { title: 'Firma Ekle', href: '/firma-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder' },
  { title: 'Ürün Ekle', href: '/urun-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder' },
  { title: 'Marka Ekle', href: '/marka-ekle', meta: 'İçerik Ekle', keywords: 'yeni gonder' },
];

// AI sonuçları burada saklanır ki runSearch() onları klasik bölümlerin içine karıştırabilsin.
// Sorgu değiştiğinde bayatlamasın diye sorgunun kendisi de tutulur.
let lastAiResults = { query: null, architects: [], offices: [], projects: [] };

// İki listeyi slug'a göre birleştirir: önce klasik sonuçlar (mevcut alaka sırası korunur), sonra
// yalnızca AI'nın bulduğu ekstralar. Dönen sayı, bölüm başlığındaki toplamın ne kadar artacağını
// bildirir — klasik toplam AI'nın bulduğu YENİ kayıtlarla toplanır, böylece başlıktaki sayı asla
// olduğundan büyük gösterilmez.
function mergeWithAi(classicItems, aiItems, classicTotal){
  const seen = new Set(classicItems.map(x => x.slug).filter(Boolean));
  const extras = (aiItems || []).filter(x => x && x.slug && !seen.has(x.slug));
  return { items: classicItems.concat(extras), total: (classicTotal || 0) + extras.length };
}

// badge: yalnızca Mimarlar/Firmalar gruplarında geçilir (bkz. kullanıcı isteği: mavi onay
// rozetinin arama sonuçlarında da görünmesi) — proje/ürün satırlarında rozet anlamsız
// olduğundan çağıranlar orada bu parametreyi hiç geçmez.
function rowHtml({href, avatarStyle, avatarContent, title, meta, badge}){
  return `<a class="result-row" href="${href}">
    <div class="result-avatar" style="${avatarStyle||''}">${avatarContent||''}</div>
    <div class="result-info">
      <div class="result-title">${escapeHtml(title)}${badge||''}</div>
      <div class="result-meta">${escapeHtml(meta||'')}</div>
    </div>
    <div class="result-go">→</div>
  </a>`;
}

// totalCount: her grup sunucu tarafından zaten kırpılmış (grup başına en fazla MAX_PER_GROUP)
// bir dizi döner ama GERÇEK toplam sayıyı ayrıca verir (mimar/firma/proje için /api/public/
// search#totals, ürün için /api/products#total) — "(N)" başlığı ve "+N sonuç daha var" notu bu
// gerçek sayıyı kullanmalı, `items.length`i DEĞİL, aksi halde hep MAX_PER_GROUP'ta tıkanır kalır.
function groupHtml(label, items, toRow, totalCount){
  if(!items.length) return '';
  const total = totalCount == null ? items.length : totalCount;
  const shown = items.slice(0, MAX_PER_GROUP);
  const rest = total - shown.length;
  return `<div class="result-group">
    <h2 class="result-group-title">${label} <span class="result-group-count">(${total})</span></h2>
    <div class="result-list">${shown.map(toRow).join('')}</div>
    ${rest > 0 ? `<div class="result-more-note">+${rest} sonuç daha var, aramanı daraltmayı dene</div>` : ''}
  </div>`;
}

// runSearch her çağrıldığında D1 fetch'leri (aşağıdaki /api/public/search + /api/products)
// tetiklediğinden, art arda hızlı iki çağrı arasında bir yarış durumu oluşabilir (ikinci çağrı
// DAHA ÖNCE dönerse, ilk çağrının GEÇ dönen yanıtı sonucu üzerine yazardı) — nav arama kutusundaki
// AYNI runToken/currentQuery karşılaştırma deseniyle en son başlatılan çağrı her zaman kazanır.
let searchRunToken = 0;

async function runSearch(){
  const runToken = ++searchRunToken;
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  const wrap = document.getElementById('search-wrap');
  const titleEl = document.getElementById('search-title');
  const subtitleEl = document.getElementById('search-subtitle');

  document.querySelectorAll('.nav-search input, .nav-mobile-search input').forEach(inp=>{ inp.value = query; });

  if(!query){
    titleEl.textContent = 'Arama';
    subtitleEl.textContent = '';
    wrap.innerHTML = `<div class="search-empty">
      <p>Kişi, firma, proje veya ürün aramak için üstteki arama kutusunu kullan.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Ara...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  titleEl.textContent = `"${query}" için sonuçlar`;
  const queryHtml = escapeHtml(query);

  // Mimar/Firma/Proje canonical D1'den (bkz. src/routes/legacyContent.js#handlePublicSearchFull),
  // Ürün/Malzeme de artık AYNI şekilde canonical `products` tablosundan (bkz. src/routes/
  // product.js#handleProductListRoute'un `search` parametresi) — statik urunler-data.js/
  // malzemeler-data.js dizileri kaldırıldı (kullanıcı isteği). İkisi de zaten hidden_at IS NULL
  // filtresini D1 tarafında uyguladığından ayrı bir gizleme kontrolüne gerek yok. Paralel çalıştırılır,
  // aksi halde ürün sorgusu toplam gecikmeyi ikiye katlardı.
  let full = { architects: [], offices: [], projects: [], totals: { architects: 0, offices: 0, projects: 0 } };
  let urunResults = [];
  let urunTotal = 0;
  // Firma ve Marka AYRI uçlardan çekilir (bkz. dosya başındaki FİRMA/MARKA ayrımı notu) — /api/
  // public/search bu ayrımı uygulamadığından tek başına doğru bir bölümleme üretemez.
  let firmaResults = []; let firmaTotal = 0;
  let markaResults = []; let markaTotal = 0;
  const [fullRes, productsRes, officesRes, brandsRes] = await Promise.allSettled([
    fetch('/api/public/search?q=' + encodeURIComponent(query)),
    fetch('/api/products?search=' + encodeURIComponent(query) + '&limit=' + MAX_PER_GROUP),
    fetch('/api/offices?search=' + encodeURIComponent(query) + '&limit=' + MAX_PER_GROUP),
    fetch('/api/offices?brands=1&search=' + encodeURIComponent(query) + '&limit=' + MAX_PER_GROUP),
  ]);
  if(fullRes.status === 'fulfilled' && fullRes.value.ok) full = await fullRes.value.json();
  if(productsRes.status === 'fulfilled' && productsRes.value.ok){
    const data = await productsRes.value.json();
    urunResults = data.items || [];
    urunTotal = data.total || 0;
  }
  if(officesRes.status === 'fulfilled' && officesRes.value.ok){
    const data = await officesRes.value.json();
    firmaResults = data.items || []; firmaTotal = data.total || 0;
  }
  if(brandsRes.status === 'fulfilled' && brandsRes.value.ok){
    const data = await brandsRes.value.json();
    markaResults = data.items || []; markaTotal = data.total || 0;
  }
  if(runToken !== searchRunToken) return; // yarış durumu — daha yeni bir çağrı zaten başladı

  // AI sonuçları (varsa, AYNI sorgu için) klasik bölümlerin içine karıştırılır — ayrı bir tablo
  // seti oluşturulmaz (bkz. dosya başındaki kök neden notu).
  const ai = (lastAiResults.query === query) ? lastAiResults : { architects: [], offices: [], projects: [] };
  const mimarMerged  = mergeWithAi(full.architects || [], ai.architects, full.totals.architects);
  const projeMerged  = mergeWithAi(full.projects || [], ai.projects, full.totals.projects);
  // AI'nın döndürdüğü ofisler firma/marka ayrımı taşımaz; saf marka olmayanlar Firmalar'a eklenir
  // (AI ekstraları zaten yalnızca klasik aramanın kaçırdıklarıdır, sayı olarak küçüktür).
  const markaSlugs = new Set(markaResults.map(o => o.slug));
  const firmaMerged = mergeWithAi(firmaResults, (ai.offices || []).filter(o => !markaSlugs.has(o.slug)), firmaTotal);

  // Sayfalar — sabit site sayfaları, aynı foldTr eşleştirmesiyle.
  const qFold = foldTr(query);
  const sayfaResults = SITE_PAGES.filter(p => foldTr(p.title).includes(qFold) || foldTr(p.keywords || '').includes(qFold));

  const total = projeMerged.total + mimarMerged.total + firmaMerged.total + urunTotal + markaTotal + sayfaResults.length;
  subtitleEl.textContent = total ? `${total} sonuç bulundu` : '';

  if(total === 0){
    // MİMARLAB AI aynı sorgu için gerçek bir sonuç/özet gösteriyorsa (bkz. aiHasResultsPromise
    // yorumu yukarısı) klasik "bulunamadı" kutusu AI panosunun hemen altında yanlış/çelişkili bir
    // izlenim verir — bu durumda kutu hiç render edilmez, yalnızca AI panosu gösterilir.
    const aiHasResults = await aiHasResultsPromise;
    if(aiHasResults){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `<div class="search-empty">
      <p>"${queryHtml}" için bir sonuç bulunamadı. Başka bir anahtar kelimeyle tekrar dene.</p>
      <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Tekrar arayın...">
      </div>
    </div>`;
    wireNavSearch();
    return;
  }

  // Ortak satır üreticileri — AYNI tür hem klasik hem AI kaynağından gelebildiği ve Firma/Marka
  // aynı satır biçimini paylaştığı için tek noktada tanımlanır.
  const projectRow = p => rowHtml({
    href: `/proje/${encodeURIComponent(p.slug)}`,
    avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
    title: p.title,
    meta: [p.location, p.date].filter(Boolean).join(' · '),
  });
  const architectRow = a => rowHtml({
    href: `/kisi/${encodeURIComponent(a.slug)}`,
    avatarStyle: `background:${officeColor(a.name)}`,
    avatarContent: `${initials(a.name)}${a.photo ? `<img src="${escapeAttr(cdnImg(a.photo, 200))}"${cdnSrcset(a.photo, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(a.photo, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: a.name,
    meta: a.office || 'Kişi',
    badge: verifiedBadgeHtml('architect', a.name, a.badges, 13),
  });
  // Marka satırları da /firma/:slug'a gider — markaların ayrı bir detay URL'si yok (bkz.
  // marka.html: detay URL'si /firma/:slug ve popup office-modal.js olarak kalır).
  const officeRow = o => rowHtml({
    href: `/firma/${encodeURIComponent(o.slug)}`,
    avatarStyle: `background:${officeColor(o.name)}`,
    avatarContent: `${initials(o.name)}${logoUrl(o) ? `<img src="${escapeAttr(cdnImg(logoUrl(o), 200))}"${cdnSrcset(logoUrl(o), [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(logoUrl(o), [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}`,
    title: o.name,
    meta: o.loc || '',
    badge: verifiedBadgeHtml('office', o.name, o.badges, 13),
  });

  // Bölüm sırası kullanıcı isteğiyle sabit: Projeler → Mimarlar → Firmalar → Ürünler → Markalar →
  // Sayfalar. groupHtml boş listeler için '' döndürdüğünden sonuçsuz türler kendiliğinden gizlenir.
  wrap.innerHTML = [
    groupHtml('Projeler', projeMerged.items, projectRow, projeMerged.total),
    groupHtml('Kişiler', mimarMerged.items, architectRow, mimarMerged.total),
    groupHtml('Firmalar', firmaMerged.items, officeRow, firmaMerged.total),
    groupHtml('Ürünler', urunResults, p => rowHtml({
      href: `/urun/${encodeURIComponent(p.slug)}`,
      avatarContent: p.image ? `<img src="${escapeAttr(cdnImg(p.image, 200))}"${cdnSrcset(p.image, [160, 240, 320]) ? ` srcset="${escapeAttr(cdnSrcset(p.image, [160, 240, 320]))}" sizes="48px"` : ''} alt="" loading="lazy" decoding="async">` : '',
      title: p.title,
      meta: [p.category, p.brand].filter(Boolean).join(' · '),
    }), urunTotal),
    groupHtml('Markalar', markaResults, officeRow, markaTotal),
    groupHtml('Sayfalar', sayfaResults, s => rowHtml({
      href: s.href,
      avatarStyle: `background:${officeColor(s.title)}`,
      avatarContent: initials(s.title),
      title: s.title,
      meta: s.meta || '',
    }), sayfaResults.length),
  ].join('');

  wireNavSearch();
}



// MİMARLAB AI (bkz. kullanıcı isteği, Faz 4: ayrı bir arama kutusu/buton OLMASIN) — üst nav'daki
// TEK arama kutusuna yazılan sorgu artık HEM normal (foldTr fuzzy, runSearch) HEM AI (/api/ai/search)
// ile otomatik aranır, aynı groupHtml/rowHtml render mantığını (yukarısı) paylaşır ki AI sonuçları
// normal arama sonuçlarıyla BİREBİR aynı görünsün (bkz. kullanıcı isteği: "generic chatbot görünümü
// oluşturma"). Faz 3'teki (Araştırma Modu) sunucu tarafı previousFilters/daraltma desteği
// (src/routes/ai.js) burada KULLANILMAZ — tek giriş noktası artık her zaman TAM sayfa yenileyen nav
// arama kutusu olduğundan (bkz. wireNavSearch, site-chrome.js) istemci tarafı bir "konuşma durumu"
// tutmanın anlamı kalmadı, her /arama?q= YENİ ve bağımsız bir sorgu olarak ele alınır.
let aiRunToken = 0;
const aiResultEl = document.getElementById('ai-search-result');
// runSearch()'ün "sonuç bulunamadı" boş-durumu (aşağıdaki total===0 dalı) bu promise'i bekler —
// MİMARLAB AI aynı sorgu için gerçek bir sonuç/özet gösteriyorsa (bkz. gerçek bulgu: klasik foldTr
// araması "bursa'daki camiler" gibi doğal dil sorgularında 0 sonuç dönse bile AI panosu doğru
// yanıtı buluyordu) klasik boş-durum metni AI panosunun HEMEN ALTINDA gereksiz bir çelişki olarak
// görünmesin diye (kullanıcı isteği).
let aiHasResultsPromise = Promise.resolve(false);

const FACET_LABELS = { cities: 'Şehir', categories: 'Tip', discipline: 'Tür' };
// facetsHtml — computeFacets()'in (bkz. src/routes/ai.js) döndürdüğü GERÇEK sayımları düz metin
// olarak listeler, hiçbir yüzde/skor göstermez (bkz. kullanıcı isteği: "anlamsız yüzde skorları
// üretme").
function facetsHtml(facets){
  if(!facets) return '';
  const parts = [];
  ['cities', 'categories', 'discipline'].forEach(key => {
    const items = facets[key];
    if(items && items.length) parts.push(`<div class="ai-facet-row"><strong>${FACET_LABELS[key]}:</strong> ${items.map(i => `${escapeHtml(i.value)} (${i.count})`).join(', ')}</div>`);
  });
  if(facets.yearRange) parts.push(`<div class="ai-facet-row"><strong>Yıl Aralığı:</strong> ${facets.yearRange.from < 0 ? `MÖ ${-facets.yearRange.from}` : facets.yearRange.from} – ${facets.yearRange.to < 0 ? `MÖ ${-facets.yearRange.to}` : facets.yearRange.to}</div>`);
  if(!parts.length) return '';
  return `<div class="ai-facets">${parts.join('')}</div>`;
}

async function runAiSearch(q){
  q = (q || '').trim();
  if(!q) return;
  const runToken = ++aiRunToken;
  aiResultEl.hidden = false;
  aiResultEl.innerHTML = '<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-loading">MİMARLAB AI aranıyor…</div>';

  let res, data;
  try{
    res = await fetch('/api/ai/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
  } catch(e){
    if(runToken !== aiRunToken) return false;
    aiResultEl.innerHTML = '<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-error">Bağlantı sorunu oluştu.</div>';
    return false;
  }
  if(runToken !== aiRunToken) return false;

  if(!res.ok){
    // 429 (hız sınırı) dahil — bkz. kullanıcı isteği: normal arama zaten aynı sonucu gösterdiğinden
    // AI tarafında bir hata olması TÜM sayfayı bozmamalı, yalnızca bu blok sessizce gizlenir.
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    return false;
  }
  data = await res.json();
  if(runToken !== aiRunToken) return false;

  const total = data.totals.architects + data.totals.offices + data.totals.projects;
  if(!total){
    // AI hiç sonuç bulamadıysa (yanıt veremediği İÇİN ya da gerçekten eşleşme yoksa fark etmez) bu
    // blok, klasik arama kutusunun (bkz. aşağıdaki aiHasResultsPromise/runSearch total===0 dalı,
    // "Tekrar arayın" girişi dahil) göstereceği tek bir "bulunamadı" mesajının üstünde gereksiz bir
    // tekrar olur — sessizce gizlenir, mesajlaşmayı klasik kutuya bırakır.
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    lastAiResults = { query: null, architects: [], offices: [], projects: [] };
    return false;
  }

  // kullanıcı bildirimi (2026-09-01): bu blok ESKİDEN kendi Mimarlar/Firmalar/Projeler tablolarını
  // da çiziyordu — klasik aramanınkilerle birlikte sayfada her türden İKİ tablo oluşuyordu (bkz.
  // dosya başındaki kök neden notu). Artık AI panosu yalnızca kendine ÖZGÜ katkısını gösterir
  // (doğal dil özeti + gerçek sayımlara dayalı facet'ler); bulduğu KAYITLAR aşağıdaki runSearch()
  // çağrısıyla klasik bölümlerin İÇİNE karıştırılır, böylece yalnızca AI'nın yanıtlayabildiği
  // sorgularda ("bursa'daki camiler" gibi) sonuçlar kaybolmaz ama tablo tekrarı da olmaz.
  aiResultEl.innerHTML = [
    `<div class="ai-eyebrow">✦ MİMARLAB AI</div><div class="ai-summary">${escapeHtml(data.summary)}</div>`,
    facetsHtml(data.facets),
  ].join('');

  lastAiResults = {
    query: q,
    architects: data.architects || [],
    offices: data.offices || [],
    projects: data.projects || [],
  };
  // Sonuçları klasik bölümlere karıştırmak için tek bir yeniden render. runSearch() AI'yı geri
  // ÇAĞIRMAZ (maybeRunAiSearch ayrı ve tek seferliktir), bu yüzden döngü oluşmaz.
  runSearch();
  return true;
}

// AI araması runSearch()'ten AYRI tetiklenir (aynı sorguyla, paralel) — runSearch() rozetler
// hazır olduğunda (bkz. aşağısı) bir kez daha çalıştığından, AI'yı runSearch() İÇİNE koymak her
// rozet güncellemesinde gereksiz ikinci bir LLM çağrısına (maliyet/rate-limit) yol açardı. Sorgu
// değişmediği sürece (aynı sekme, aynı /arama?q=) yalnızca BİR kez tetiklenir.
let lastAiQuery = null;
function maybeRunAiSearch(){
  const params = new URLSearchParams(window.location.search);
  const query = (params.get('q') || '').trim();
  if(!query){
    aiResultEl.hidden = true;
    aiResultEl.innerHTML = '';
    lastAiQuery = null;
    aiHasResultsPromise = Promise.resolve(false);
    return;
  }
  if(query === lastAiQuery) return;
  lastAiQuery = query;
  aiHasResultsPromise = runAiSearch(query);
}

runSearch();
maybeRunAiSearch();
// Rozetler /api/public/badges'ten asenkron gelir (bkz. badge-shared.js) — ilk arama sonucu bu fetch
// tamamlanmadan çizilmişse Mimarlar/Firmalar satırları rozetsiz kalmış olabilir, bu yüzden rozetler
// gelince runSearch() bir kez daha (ve yalnızca bir kez) çalıştırılır. AI bloğu ZATEN doğru
// render edildiğinden (rozetler yalnızca normal sonuç satırlarını etkiler) burada tekrar
// tetiklenmez (bkz. yukarıdaki maybeRunAiSearch yorumu).
window.addEventListener('mimarlab-badges-ready', () => runSearch(), { once: true });
</script>
