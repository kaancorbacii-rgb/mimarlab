<!-- Liste sayfası için jenerik yapısal veri (bkz. kullanıcı isteği: "tüm ana sayfa ve detay

</script>
<!-- Temiz URL'lerle bu sayfa /kisi dışında /kisi/:slug altında da (kişi modalını doğrudan açan
     bir iç içe yolda) servis edilir; <base> olmadan script/link/img gibi göreli kaynak yolları o iç
     içe yola göre yanlış çözümlenirdi (bkz. src/index.js#CLEAN_URL_ASSETS, proje.html'deki AYNI
     gerekçe). -->
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  /* Ürün açılır menü düğmesi (bkz. js/components/nav-product-menu.js) — bu reset burada, sayfanın
     KENDİ <style>'ında olmalı, yalnızca JS'in enjekte ettiği stilde değil: nav-product-menu.js
     defer'lı olduğundan ilk boyamadan SONRA çalışır, o ana kadar <button> tarayıcı varsayılan
     çerçeve/arkaplanıyla görünüp kaybolan bir gri dikdörtgen gibi çakıyordu (bkz. kullanıcı isteği). */
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{
    display:none;
    background:none; border:1px solid var(--line);
    border-radius:8px; padding:8px;
    color:var(--ink); align-items:center; justify-content:center;
  }
  .nav-mobile-menu{
    display:none;
    position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15);
    flex-direction:column; min-width:220px;
    /* bkz. index.html'deki AYNI gerçek bulgu/gerekçe — kullanıcı isteği: mobil hamburger menüde
       Ürün akordeonu açılınca panelin altına kaydırılamaması sorununun kökten çözümü. */
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{
    padding:11px 14px; border-radius:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
    text-transform:uppercase;
  }
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:100px; padding:9px 14px;
    margin-bottom:8px;
  }
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:16px; width:100%; color:var(--ink);
  }
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink);
    padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink);
    font-size:14px; font-weight:600; white-space:nowrap;
    text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:1260px; margin:0 auto; padding:28px 32px 0;}
  .page-head h1{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:28px; font-weight:700; margin:0 0 4px;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- SSR ENTITY BODY (bkz. src/index.js#injectMeta, src/lib/seo.js#bodyHtml) ---------- */
  /* /kisi/:slug altında serveDetailPage tarafından doldurulur; listeleme sayfasında (/kisi) boş
     kalır, :empty kuralı sayfaya gereksiz bir boşluk eklenmesini önler. */
  .ssr-entity:empty{display:none;}
  .ssr-entity{max-width:1260px; margin:0 auto; padding:0 32px 20px; display:flex; gap:20px; align-items:flex-start;}
  .ssr-entity img{width:160px; height:160px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .ssr-entity-text{flex:1; min-width:0;}
  .ssr-entity-text p{color:var(--ink-soft); font-size:14px; line-height:1.6; max-width:70ch; margin:0 0 10px;}
  .ssr-facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:0;}
  .ssr-facts dt{color:var(--ink-soft); font-weight:600;}
  .ssr-facts dd{margin:0;}
  .ssr-facts a{color:inherit;}
  @media (max-width:720px){
    .ssr-entity{flex-direction:column; padding:0 16px 16px;}
    .ssr-entity img{width:100%; max-width:280px; height:auto;}
  }

  /* bkz. proje.html'deki AYNI gerçek bulgu (kullanıcı isteği, 2026-08-24) — /kisi/:slug'a doğrudan
     girildiğinde çıplak SSR içeriği (.page-head/.ssr-entity) defer script'ler yüklenip ArchitectModal
     devreye girene kadar hiçbir overlay olmadan görünür kalıyordu. <head>'deki senkron script ilk
     boyamadan önce <html>'e pm-boot-loading ekler; kisi.html'in DOMContentLoaded handler'ı
     ArchitectModal.open()'ın Promise'i çözülünce kaldırır. */
  html.pm-boot-loading .page-head, html.pm-boot-loading #ssr-entity-body{visibility:hidden;}
  html.pm-boot-loading::before{
    content:''; position:fixed; inset:0; z-index:160;
    background:rgba(27,42,61,0.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  [data-theme="dark"].pm-boot-loading::before{background:rgba(255,255,255,0.16);}

  /* ---------- FILTER SELECT (shared) ---------- */
  .filter-select{position:relative;}
  .filter-select select{
    appearance:none; -webkit-appearance:none;
    width:100%;
    background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:10px 34px 10px 14px;
    font-size:13.5px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .filter-select select:hover{border-color:var(--walnut);}
  .select-arrow{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}

  /* ---------- ÇOK SEÇMELİ FİLTRE AKORDEONU ----------
     kullanıcı isteği (2026-09-01 madde 2): "Kişi sayfasındaki filtreleri de proje ve ürün
     sayfalarındaki gibi çok seçmeli seçilebilecek şekilde düzenle". Sınıf adları proje.html'deki
     AYNI blokla birebir aynı (.filter-group/.filter-opt/.filter-search-row) — orada da her sayfa
     kendi kopyasını taşır (bkz. o dosyadaki .detail-title yorumundaki sayfa-başına-kopyalama
     deseni). Tek fark: bu sayfanın .grid-sidebar'ı proje.html'in aksine 18px iç boşluklu, bu yüzden
     gruplar kenardan kenara değil, kendi çerçeveli kutusunun içine oturuyor. */
  #filter-groups{display:flex; flex-direction:column; border:1px solid var(--line-soft); border-radius:10px; overflow:hidden;}
  #filter-groups:empty{display:none;}
  .filter-group{border-bottom:1px solid var(--line-soft);}
  .filter-group:last-child{border-bottom:none;}
  .filter-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:11px 12px; background:none; border:none; text-align:left;
    font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .filter-group-head:hover{background:var(--paper-alt);}
  .filter-group-toggle{font-size:16px; color:var(--ink-soft); font-weight:400; line-height:1;}
  .filter-group-body{display:none; padding:0 12px 12px; max-height:240px; overflow-y:auto;}
  .filter-group.open .filter-group-body{display:block;}
  .filter-group.open .filter-group-toggle{transform:rotate(45deg);}
  .filter-opt{
    display:flex; align-items:center; gap:8px;
    padding:5px 0; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .filter-opt input{flex-shrink:0; accent-color:var(--ink); width:14px; height:14px;}
  .filter-opt:hover{color:var(--ink);}
  .filter-opt-count{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}
  .filter-search-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 8px;
    padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:100px;
    position:sticky; top:0; z-index:1;
  }
  .filter-search-row svg{flex-shrink:0; opacity:0.5;}
  .filter-search-row input{border:none; background:none; outline:none; font-family:inherit; font-size:12px; width:100%; color:var(--ink);}

  /* ---------- GRID LAYOUT ---------- */
  .grid-layout{
    max-width:1260px; margin:0 auto;
    padding:20px 32px 90px;
    display:grid; grid-template-columns:240px 1fr;
    gap:28px; align-items:start;
  }
  .grid-sidebar{
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    padding:18px; display:flex; flex-direction:column; gap:12px;
    position:sticky; top:90px;
    /* Akordeon filtre grupları (bkz. #filter-groups) sidebar'ı viewport'tan uzun hâle
       getirebiliyor — proje.html'in .grid-sidebar'ındaki AYNI çözüm: kutu kendi içinde kayar,
       "Kişi Ekle" butonu hiçbir zaman erişilemez hâle gelmez. */
    max-height:calc(100vh - 110px); overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .sidebar-filters-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; font-weight:700;}
  .sidebar-search{display:flex; align-items:center; gap:8px; padding:9px 14px; background:var(--paper); border:1px solid var(--line); border-radius:100px;}
  .sidebar-search svg{flex-shrink:0; opacity:0.5;}
  .sidebar-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; width:100%; color:var(--ink);}
  .grid-sidebar-head{display:flex; align-items:center; gap:8px; margin-bottom:2px;}
  .grid-icon-btn{
    width:32px; height:32px; border-radius:8px; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .grid-icon-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .grid-icon-btn.active{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .grid-icon-btn.reset{margin-left:auto;}
  .sidebar-add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--ink); color:var(--paper-card);
    padding:12px; border-radius:100px; font-weight:600; font-size:13.5px;
  }
  .sidebar-add-btn:hover{background:var(--walnut);}
  .sidebar-add-icon{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:rgba(237,240,243,0.2); font-size:14px; line-height:1;
  }

  .card-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;}
  .person-card{
    display:block; background:var(--paper-card);
    border:1px solid var(--line-soft); border-radius:14px; overflow:hidden;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .person-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(27,42,61,0.1); border-color:var(--line);}
  .person-card-photo{
    position:relative; aspect-ratio:1/1; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper-card); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:600; font-size:30px;
  }
  .person-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .person-card-body{padding:12px 14px;}
  .person-card-name{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:700; font-size:15px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .verified-badge-icon{display:inline-flex; align-items:center; color:var(--accent); vertical-align:middle; margin-left:4px; flex-shrink:0;}
  .person-card-office{
    font-size:11.5px; color:var(--ink-soft); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; display:none;}

  .pagination{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin-top:28px;
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  }
  .pagination::-webkit-scrollbar{display:none;}
  .page-btn{
    min-width:38px; height:38px; padding:0 10px; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .page-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .page-btn.active{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .page-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .page-btn-arrow{display:flex; align-items:center; justify-content:center; padding:0;}
  .page-ellipsis{
    min-width:22px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:13.5px; font-weight:600; user-select:none;
  }

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{
    max-width:1080px; margin:0 auto;
    padding:48px 32px 32px;
    display:grid; grid-template-columns:2fr 1fr 1fr 1fr;
    gap:32px;
  }
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .city-select{
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600;
    background:rgba(237,240,243,0.08); border:1px solid rgba(237,240,243,0.2);
    border-radius:100px; padding:8px 16px; color:var(--paper);
  }
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .grid-layout{grid-template-columns:1fr;}
    .grid-sidebar{position:static; flex-direction:row; flex-wrap:wrap; max-height:none; overflow:visible;}
    .grid-sidebar .filter-select{flex:1 1 160px;}
    /* Sidebar mobilde satır düzenine (flex-direction:row) geçtiğinden akordeon kutusu tam
       genişlikte kendi satırına alınır — aksi halde arama/sıralama kutularının yanında daralırdı. */

<script>
// Faz 3 sonrası: kisi.html artık data.js'in ağır architects[]/offices[] dizilerini indirmiyor —
// sayfalama, filtreleme ve sıralama backend'de (/api/architects) canonical D1 tablosu üzerinden
// yapılıyor (bkz. src/routes/architect.js#handleArchitectListRoute). Rozet sistemi + initials/
// officeColor/logoUrl yardımcı fonksiyonları data.js'ten kopyalanan küçük badge-shared.js'ten gelir
// (bkz. o dosyanın başındaki gerekçe notu).
const PAGE_SIZE = 24;
let currentPage = 1;
let searchQuery = '';

// kullanıcı isteği ("popup kapatınca bazen bilgiler ekranda kalıyor") — bkz. modal-shell.js#
// resetSsrEntity yorumu: bu sayfanın statik/jenerik <title>/#entity-h1/meta değerleri, /kisi/:slug
// ile doğrudan açılışta sunucunun HTML'e gömdüğü GERÇEK mimar içeriğinin üzerine ArchitectModal
// kapanınca geri yazılabilsin diye burada bir kez kaydedilir.
ModalShell.setSsrDefaults({
  title: 'Kişiler — MİMARLAB',
  h1: 'Kişiler',
  description: "Türkiye'deki mimarları keşfet — profilleri, ofisleri ve projeleriyle.",
  canonicalUrl: 'https://mimarlab.com/kisi',
  ogType: 'website',
  image: 'https://mimarlab.com/logos/site/mimarlab-og-image.png',
});

// Bilinen pozisyon kovaları için tercih edilen görüntüleme sırası — listede olmayan (gelecekte
// kisi-ekle.html#POZISYON_OPTIONS'a eklenebilecek) bir değer sona, alfabetik eklenir (bkz. aşağıdaki
// sortByPreferredOrder — artık HTML'de sabit <option> yok, TÜMÜ sunucudan gelen sayaçlardan üretilir).
const POSITION_ORDER = ['Kurucu', 'Ortak', 'Ekip Lideri', 'Ekip Üyesi', 'Akademisyen', 'Serbest Çalışan', 'Öğrenci', 'Emekli', 'İşsiz'];
// kisi-ekle.html#MESLEK_OPTIONS ile AYNI sıra (BİLİNÇLİ kopya — POSITION_ORDER'daki AYNI desen).
// kullanıcı isteği (2026-09-01 madde 1): "kisi-ekle sayfasında çıkan mesleklerin hepsi burada filtre
// olarak gözüksün. 0 kişi sayısında olan filtreler en az 1 kişi bu filtreye eklenene kadar
// gözükmesin" — bu dizi yalnızca SIRALAMA içindir, hangi seçeneklerin çizileceğini sunucudan gelen
// sayaçlar belirler (bkz. src/routes/architect.js#professionCounts), böylece sıfır kişili bir meslek
// hiç görünmez, ilk kişisini aldığı anda kendiliğinden belirir.
const PROFESSION_ORDER = ['Mimar', 'İç Mimar', 'Peyzaj Mimarı', 'Şehir Plancısı', 'Restoratör', 'Tasarımcı', 'Mühendis', 'Fotoğrafçı', 'Öğrenci', 'Diğer'];

// Çok seçmeli filtre durumu — proje.html#activeFilters ile AYNI şekil (grup anahtarı -> Set).
// Grup İÇİ mantık OR, gruplar ARASI AND (sunucu tarafı bkz. src/routes/architect.js#passes).
// Sıra kullanıcı isteğidir (2026-09-04): Pozisyon, Doğum Yılı, Üniversite, Meslek, Ödül —
// akordeonlar kenar çubuğunda bu dizideki sırayla çizilir (bkz. buildFilterGroups).
// "Üniversite" (architects.school) AYNI tarihte eklendi; sunucu tarafı bkz.
// src/routes/architect.js#schoolCounts/schoolParams. Diğer gruplardan hiçbir farkı yok —
// çoklu seçim, grup içi OR / gruplar arası AND, grup içi arama kutusu, sayaç.
const FILTER_GROUPS = [
  { key: 'position', label: 'Pozisyon' },
  { key: 'dob', label: 'Doğum Yılı' },
  { key: 'school', label: 'Üniversite' },
  { key: 'profession', label: 'Meslek' },
  { key: 'award', label: 'Ödül' },
];
const activeFilters = { position: new Set(), dob: new Set(), school: new Set(), profession: new Set(), award: new Set() };
// Grup içi arama kutularına yazılan metin — buildFilterGroups() DOM'u her render'da sıfırdan
// kurduğundan (bkz. proje.js#groupSearchQueries'teki AYNI gerekçe) burada saklanıp geri uygulanır.
const groupSearchQueries = {};
// Akordeonların açık/kapalı durumu da aynı sebeple burada tutulur.
const openGroups = new Set();

function trLower(s){
  return String(s || '').replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ş/g,'ş').replace(/Ğ/g,'ğ').replace(/Ü/g,'ü').replace(/Ö/g,'ö').replace(/Ç/g,'ç').toLowerCase();
}

// Sunucudan gelen sayaç yapısını [{value, count}] dizisine normalize eder. dob/award zaten bu
// biçimde gelir (sıralaması sunucuda belirlenmiş), position/profession ise {değer: sayı} nesnesi —
// onlar burada tercih edilen sıraya (POSITION_ORDER/PROFESSION_ORDER) göre dizilir, listede olmayan
// bir değer sona alfabetik eklenir.
function sortByPreferredOrder(counts, order){
  return Object.keys(counts || {})
    .sort((a, b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'tr');
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    })
    .map(value => ({ value, count: counts[value] }));
}
function groupOptions(filtersData, key){
  if(key === 'position') return sortByPreferredOrder(filtersData.position, POSITION_ORDER);
  if(key === 'profession') return sortByPreferredOrder(filtersData.profession, PROFESSION_ORDER);
  return filtersData[key] || [];
}

// Sunucudan (data.filters) gelen seçenekleri akordeon + checkbox olarak yeniden çizer —
// proje.js#buildSidebar ile AYNI desen, tek farkı seçeneklerin ayrı bir /filters ucundan değil,
// zaten çekilmiş olan liste yanıtının `filters` alanından gelmesi (bu sayfa hep böyle çalışıyordu,
// ek bir istek atmaya gerek yok). Seçenek üretmeyen (sayacı hiç oluşmamış) bir grup hiç çizilmez.
// Önceden seçili bir filtre (paylaşılan link/geri tuşu) varsa o grup açık gösterilir.
function openSelectedGroups(wrap){
  FILTER_GROUPS.forEach(g=>{
    if(activeFilters[g.key].size === 0) return;
    openGroups.add(g.key);
    const grp = wrap.querySelector(`.filter-group[data-key="${g.key}"]`);
    if(grp) grp.classList.add('open');
  });
}

// Seçenek listesinin son çizilen hâli. Bu sayfada sayaçlar aktif filtrelerden BAĞIMSIZ (tüm havuz
// üzerinden hesaplanır, bkz. src/routes/architect.js#dobCounts yorumu), yani bir kutucuk
// işaretlendiğinde seçenekler/sayaçlar hiç değişmez — o durumda innerHTML'i yeniden yazmak yalnızca
// odağı ve grup içi kaydırmayı sıfırlar. İmza aynıysa DOM korunur, yalnızca işaretli durumlar
// activeFilters'tan tazelenir (geri tuşu/sıfırlama gibi kutucuğa dokunmadan değişen yollar için).
let lastFilterSignature = null;
function buildFilterGroups(filtersData){
  const wrap = document.getElementById('filter-groups');
  const groups = FILTER_GROUPS.map(g => [g.key, groupOptions(filtersData, g.key)]);
  const signature = JSON.stringify(groups);
  if(signature === lastFilterSignature){
    wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.checked = activeFilters[cb.dataset.key].has(cb.value);
    });
    openSelectedGroups(wrap);
    return;
  }
  lastFilterSignature = signature;
  let html = '';
  FILTER_GROUPS.forEach(g=>{
    const options = groupOptions(filtersData, g.key);
    if(!options.length) return;
    html += `<div class="filter-group${openGroups.has(g.key) ? ' open' : ''}" data-key="${g.key}">
      <button class="filter-group-head" data-toggle="${g.key}">${escapeHtml(g.label)} <span class="filter-group-toggle">+</span></button>
      <div class="filter-group-body">
        <div class="filter-search-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="filter-search-input" placeholder="Ara..." autocomplete="off"></div>
        ${options.map(({value, count})=>`
        <label class="filter-opt">
          <input type="checkbox" data-key="${g.key}" value="${escapeAttr(value)}" ${activeFilters[g.key].has(value)?'checked':''}>
          <span>${escapeHtml(value)}</span>
          <span class="filter-opt-count">(${count})</span>
        </label>`).join('')}
      </div>
    </div>`;
  });
  wrap.innerHTML = html;

  openSelectedGroups(wrap);

  wrap.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggle;
      const opened = btn.parentElement.classList.toggle('open');
      if(opened) openGroups.add(key); else openGroups.delete(key);
    });
  });
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) activeFilters[cb.dataset.key].add(cb.value); else activeFilters[cb.dataset.key].delete(cb.value);
      currentPage = 1;
      syncBrowserUrl(true);
      render();
    });
  });
  // Grup içi arama YALNIZCA o grubun satırlarını gösterip gizler — seçim/sayaç mantığını etkilemez
  // (bkz. proje.js#applyGroupSearchFilter'daki AYNI davranış).
  function applyGroupSearchFilter(input){
    const body = input.closest('.filter-group-body');
    const q = trLower(input.value.trim());
    body.querySelectorAll('.filter-opt').forEach(opt=>{
      const label = trLower(opt.querySelector('span').textContent);
      opt.style.display = !q || label.includes(q) ? '' : 'none';
    });
  }
  wrap.querySelectorAll('.filter-search-input').forEach(input=>{
    const groupKey = input.closest('.filter-group').dataset.key;
    if(groupSearchQueries[groupKey]){
      input.value = groupSearchQueries[groupKey];
      applyGroupSearchFilter(input);
    }
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('input', ()=>{
      groupSearchQueries[groupKey] = input.value;
      applyGroupSearchFilter(input);
    });
  });
}

function getPageWindowSize(){
  const w = window.innerWidth;
  if(w <= 480) return 3;
  if(w <= 720) return 5;
  return 9;
}
// Mevcut sayfayı her zaman ortalayan kayan pencere; ilk ve son sayfa (bkz. kullanıcı isteği:
// "1. ve son sayfa her zaman görünür olsun") ayrıca her zaman ayrı buton olarak eklenir, pencereye
// dahil değillerse aralarına '...' konur. Pencere bir uca yaklaştığında diğer ucu genişletip N
// sayfa göstermeye devam eder (bkz. start===2/end===totalPages-1 dallari).
function getPageList(totalPages, currentPage){
  const N = getPageWindowSize();
  if(totalPages <= N + 2){ const pages=[]; for(let p=1;p<=totalPages;p++) pages.push(p); return pages; }
  const half = Math.floor(N / 2);
  let start = Math.max(2, currentPage - half);
  let end = Math.min(totalPages - 1, currentPage + half);
  if(start === 2) end = Math.min(totalPages - 1, start + N - 1);
  if(end === totalPages - 1) start = Math.max(2, end - N + 1);
  const pages = [1];
  if(start > 2) pages.push('...');
  for(let p=start; p<=end; p++) pages.push(p);
  if(end < totalPages - 1) pages.push('...');
  pages.push(totalPages);
  return pages;
}

function goToPage(p){
  currentPage = p;
  syncBrowserUrl(true);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML = ''; return; }
  let html = `<button class="page-btn page-btn-arrow" id="page-prev" aria-label="Önceki" ${currentPage===1?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;
  getPageList(totalPages, currentPage).forEach(p=>{
    if(p==='...') html += `<span class="page-ellipsis">…</span>`;
    else html += `<button class="page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`;
  });
  html += `<button class="page-btn page-btn-arrow" id="page-next" aria-label="Sonraki" ${currentPage===totalPages?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=> goToPage(parseInt(btn.dataset.page)));
  });
  const prevBtn = document.getElementById('page-prev');
  const nextBtn = document.getElementById('page-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(currentPage>1) goToPage(currentPage-1); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(currentPage<totalPages) goToPage(currentPage+1); });
}

// Aktif filtre/arama/sıralama/sayfa durumundan ?query string üretir — hem /api/architects isteği
// hem de tarayıcı URL senkronu (syncBrowserUrl) için TEK noktadan kullanılır.
function currentQueryParams(){
  const params = new URLSearchParams();
  // Çoklu seçim: her seçili değer AYRI bir parametre olarak eklenir (?position=Kurucu&position=Ortak)
  // — proje.js#currentQueryParams ile AYNI desen, sunucu tarafı getAll() ile okur.
  FILTER_GROUPS.forEach(g => { activeFilters[g.key].forEach(v => params.append(g.key, v)); });
  const sort = document.getElementById('g-sort').value;
  if(sort) params.set('sort', sort);
  if(searchQuery.trim()) params.set('search', searchQuery.trim());
  return params;
}
// push=true: gerçek geçmiş girdisi (bkz. proje.html#syncBrowserUrl'deki AYNI gerekçe).
function syncBrowserUrl(push){
  const params = currentQueryParams();
  if(currentPage > 1) params.set('page', String(currentPage));
  const qs = params.toString();
  const newUrl = location.pathname + (qs ? '?' + qs : '');
  if(newUrl === location.pathname + location.search) return;
  if(push) history.pushState({}, '', newUrl); else history.replaceState({}, '', newUrl);
  if(window.ModalShell && ModalShell.markRealPage) ModalShell.markRealPage();
}
function applyStateFromUrl(){
  const params = new URLSearchParams(location.search);
  // getAll — tek değerli eski linkler (mimar popup'ındaki filtre bağlantıları, paylaşılmış URL'ler)
  // tek elemanlı bir küme olarak AYNI şekilde çalışır.
  FILTER_GROUPS.forEach(g => {
    activeFilters[g.key].clear();
    params.getAll(g.key).filter(Boolean).forEach(v => activeFilters[g.key].add(v));
  });
  document.getElementById('g-sort').value = params.get('sort') || '';
  searchQuery = params.get('search') || '';
  document.getElementById('g-local-search').value = searchQuery;
  const pageParam = parseInt(params.get('page'), 10);
  currentPage = (pageParam > 1) ? pageParam : 1;
}

// render() artık yalnızca mevcut sayfanın kartlarını /api/architects'ten çeker (bkz. kullanıcı
// isteği: her sayfa geçişinde sadece o sayfadaki veriyi çek) — tüm mimar listesi hiçbir zaman
// tarayıcıya inmiyor.
let renderRequestId = 0;
async function render(){
  const myRequest = ++renderRequestId;
  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty-state');
  grid.style.opacity = '0.5';

  const params = currentQueryParams();
  params.set('page', String(currentPage));
  params.set('limit', String(PAGE_SIZE));

  let data = null;
  try{
    const res = await fetch(`/api/architects?${params.toString()}`);
    if(res.ok) data = await res.json();
  }catch(err){ console.error('Kişi listesi alınamadı:', err); }
  if(myRequest !== renderRequestId) return; // bu arada başka bir render() tetiklendi, bu yanıt bayat
  grid.style.opacity = '1';

  if(!data){
    grid.innerHTML = '';
    empty.textContent = 'Kişiler yüklenemedi, lütfen sayfayı yenile.';
    empty.style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('result-count').textContent = '';
    return;
  }

  currentPage = data.page;
  document.getElementById('result-count').textContent = `${data.total} kişi listeleniyor`;
  buildFilterGroups(data.filters || {});
  renderPagination(data.totalPages);

  if(data.items.length === 0){ grid.innerHTML = ''; empty.textContent = 'Bu kritere uyan kişi bulunamadı.'; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  // .card-grid sütun sayısı breakpoint'e göre değişiyor (4 -> ≤960px'de 3 -> ≤720px'de 2, bkz.
  // yukarıdaki <style>) — "ilk satır katlanma çizgisinin üstünde" varsayımı sabit 4 kullanırsa
  // mobilde (2 sütun) 3./4. kart aslında ikinci satırda olduğu halde gereksiz yere eager+
  // fetchpriority=high ile istenir (denetim bulgusu, 2026-08-14). Gerçek sütun sayısına göre hesapla.
  const eagerCardCount = window.innerWidth <= 720 ? 2 : window.innerWidth <= 960 ? 3 : 4;
  grid.innerHTML = data.items.map((a, i)=>{
    const sub = a.office || a.positionRaw || '';
    const photoSrcset = a.photo ? cdnSrcset(a.photo, [400, 600, 800]) : '';
    // İlk sıradaki (i<eagerCardCount) kartlar sayfa açılışında ZATEN katlanma çizgisinin üstünde
    // görünür — js/pages/proje.js#render'daki AYNI desen/gerekçe: bunlar eager + fetchpriority="high",
    // alttakiler lazy kalır.
    const imgAttrs = i < eagerCardCount ? `loading="eager" fetchpriority="high"` : `loading="lazy" fetchpriority="low"`;
    return `
    <a class="person-card" href="/kisi/${encodeURIComponent(a.slug || slugify(a.name))}">
      <div class="person-card-photo" style="background:${officeColor(a.name)}">${a.photo ? `<img src="${escapeAttr(cdnImg(a.photo, 600))}"${photoSrcset ? ` srcset="${escapeAttr(photoSrcset)}" sizes="(max-width: 720px) 50vw, (max-width: 960px) 33vw, 400px"` : ''} alt="" ${imgAttrs} decoding="async" onerror="this.remove()">` : escapeHtml(initials(a.name))}</div>
      <div class="person-card-body">
        <div class="person-card-name">${escapeHtml(a.name)}${verifiedBadgeHtml('architect', a.name, a.badges)}</div>
        ${sub ? `<div class="person-card-office">${escapeHtml(sub)}</div>` : ''}
      </div>
    </a>`;
  }).join('');
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// Kart tıklaması: mimar modalı (bkz. js/components/architect-modal.js) proje.html#card-grid'in AYNI
// deseniyle sayfa yenilenmeden açılsın diye düz sol tıklamalar burada yakalanır — orta tık/Ctrl/Cmd/
// Shift/Alt ile açma tarayıcının kendi doğal davranışına bırakılır. Tek bir delege dinleyici
// #card-grid üzerine BİR KEZ bağlanır, grid.innerHTML her render()'da değişse de konteyner sabit kalır.
document.getElementById('card-grid').addEventListener('click', (e)=>{
  if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a.person-card');
  if(!a) return;
  const m = (a.getAttribute('href') || '').match(/^\/kisi\/([^/?#]+)/);
  if(!m) return;
  e.preventDefault();
  ArchitectModal.open(decodeURIComponent(m[1]), { triggerEl: a });
});

let searchDebounce = null;
// Filtre kutucuklarının dinleyicileri buildFilterGroups() içinde (her yeniden çizimde) bağlanır —
// burada yalnızca sabit kalan sıralama <select>'i kalır.
document.getElementById('g-sort').addEventListener('change', ()=>{ currentPage = 1; syncBrowserUrl(true); render(); });
document.getElementById('g-local-search').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  currentPage = 1;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ syncBrowserUrl(false); render(); }, 300);
});
document.getElementById('g-reset').addEventListener('click', ()=>{
  document.getElementById('g-sort').value = '';
  FILTER_GROUPS.forEach(g => activeFilters[g.key].clear());
  Object.keys(groupSearchQueries).forEach(k => delete groupSearchQueries[k]);
  searchQuery = '';
  document.getElementById('g-local-search').value = '';
  document.getElementById('f-search-topnav').value = '';
  const mobileNavSearch = document.getElementById('f-search-nav');
  if(mobileNavSearch) mobileNavSearch.value = '';
  currentPage = 1;
  syncBrowserUrl(true);
  render();
});
// Tarayıcı geri/ileri tuşu: /kisi/:slug yoluna gidiliyorsa/dönülüyorsa yalnızca mimar modalını
// güncelle (bkz. proje.html'deki AYNI desen) — liste burada YENİDEN ÇİZİLMEZ, modal kapanana kadar
// arka plandaki liste durumu sabit kalır.
window.addEventListener('popstate', ()=>{
  const m = location.pathname.match(/^\/kisi\/([^/]+)\/?$/);
  if(m){ ArchitectModal.handlePopState(decodeURIComponent(m[1])); return; }
  if(ArchitectModal.isOpen()){ ArchitectModal.handlePopState(null); return; }
  applyStateFromUrl();
  render();
});



// İlk otomatik render() DOMContentLoaded'a ertelenir — render() içindeki cdnImg() (image-cdn.js,
// defer ile yüklenir) de tıpkı aşağıdaki ArchitectModal yorumunda anlatılan AYNI riskle karşı
// karşıya: /api/architects isteği bazen deferred script'ten daha hızlı dönebiliyor, bu da
// "cdnImg is not defined" hatasıyla mimar listesini sessizce boş bırakabiliyordu (bkz.
// urun.html'deki BİREBİR AYNI gerçek bulgu/düzeltme — orada catalogCardMediaHtml ile yaşandı).
// Deferred script'ler DOMContentLoaded'dan ÖNCE çalışmayı garanti eder.
document.addEventListener('DOMContentLoaded', () => {
  applyStateFromUrl();
  render();
});

// Doğrudan /kisi/:slug adresine girildiğinde ya da o adreste F5 yapıldığında mimar modalı
// otomatik açılsın (bkz. kullanıcı isteği). ESKİDEN render()'ın .then()'ine bağlıydı (bkz. gerçek
// bulgu — proje.html'de bulunup buraya da uygulandı) — /api/architects edge cache'ten render()'ın
// kendisinden DAHA HIZLI dönebildiğinden, bu callback bazen ArchitectModal (defer script) henüz
// tanımlanmadan tetikleniyor, "ArchitectModal is not defined" hatasıyla SESSİZCE (unhandled
// promise rejection, konsolda görünmüyor) modalı hiç açmıyordu. DOMContentLoaded'a bağlamak
// deferred script'lerin (ArchitectModal dahil) KESİN olarak tanımlanmış olmasını garantiler —
// render()/network zamanlamasından tamamen bağımsız.
document.addEventListener('DOMContentLoaded', () => {
  const m = location.pathname.match(/^\/kisi\/([^/]+)\/?$/);
  if (!m) return;
  // bkz. <head>'deki pm-boot-loading senkron script'i (AYNI gerçek bulgu, proje.html'e bkz.) — çıplak
  // SSR içeriğini bir "boot veil" ile örttü; ArchitectModal.open()'ın Promise'i renderItem()/
  // renderNotFound() tamamlanana kadar çözülmediğinden, GERÇEK modal tam opak açılana kadar veil
  // kaldırılmaz. try/catch + zaman aşımı: defer script hiç yüklenmezse (ağ hatası) veil'in sonsuza
  // dek takılı kalmaması için (bkz. proje.js'teki AYNI gerçek bulgu).
  const clearBootVeil = () => document.documentElement.classList.remove('pm-boot-loading');
  const bootVeilSafety = setTimeout(clearBootVeil, 8000);
  try {
    ArchitectModal.open(decodeURIComponent(m[1]), { pushHistory:false }).finally(() => {
      clearTimeout(bootVeilSafety);
      clearBootVeil();
    });
  } catch (e) {
    clearTimeout(bootVeilSafety);
    clearBootVeil();
  }
});
window.addEventListener('mimarlab-badges-ready', render);
</script>
