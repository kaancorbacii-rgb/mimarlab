<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- AUTH ---------- */
  .auth-wrap{max-width:420px; margin:0 auto; padding:64px 24px 90px;}
  .auth-eyebrow{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--sage); font-weight:600; margin-bottom:12px; text-align:center;
  }
  .auth-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:30px; font-weight:700; margin:0 0 8px; text-align:center;}
  .auth-sub{color:var(--ink-soft); font-size:14px; margin:0 0 32px; text-align:center; line-height:1.6;}
  .auth-card{
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:16px; padding:28px;
  }
  .auth-field{margin-bottom:16px;}
  .auth-field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px;}
  .auth-field input{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); font-family:inherit; font-size:14px; color:var(--ink);
  }
  .auth-field input:focus-visible{box-shadow:0 0 0 2px var(--brass);}
  .auth-submit{
    width:100%; background:var(--ink); color:var(--paper-card);
    border:none; padding:13px; border-radius:100px;
    font-weight:600; font-size:14.5px; margin-top:6px;
  }
  .auth-submit:hover{background:var(--walnut);}
  .auth-submit:disabled{opacity:0.6; cursor:not-allowed;}
  .auth-switch{text-align:center; font-size:13.5px; color:var(--ink-soft); margin-top:20px;}
  .auth-switch a{color:var(--walnut); font-weight:600;}
  .auth-switch a:hover{text-decoration:underline;}
  .auth-notice{
    display:none;
    margin-top:16px; padding:13px 16px; border-radius:10px;
    background:rgba(224,138,62,0.12); border:1px solid var(--accent);
    color:var(--ink); font-size:12.5px; line-height:1.6;
  }
  .auth-notice.show{display:block;}
  .auth-notice.success{background:rgba(62,122,85,0.12); border-color:#3E7A55;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }

  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .auth-wrap{padding:44px 18px 70px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }
</style>

<body>
<script src="js/overlay-manager.js" defer></script>
<script src="auth-nav.js" defer></script>
<script src="catalog-taxonomy.js" defer></script>
<script src="js/components/nav-product-menu.js" defer></script>
<script src="js/components/modal-shell.js" defer></script>
<script src="awards-shared.js"></script>
<script src="js/components/lazy-modals.js" defer></script>
<script src="js/components/profession-drawer.js" defer></script>
<script src="js/components/image-lightbox.js" defer></script>

  <div id="site-header-mount" data-nav-active=""></div>
  <script src="js/components/site-chrome.js"></script>

  <div class="breadcrumb-bar">
    <a href="/">Ana Sayfa</a>
    <span class="sep">›</span>
    <a href="/giris">Giriş Yap</a>
    <span class="sep">›</span>
    <span class="current">Şifre Sıfırla</span>
  </div>

  <div class="auth-wrap">
    <div class="auth-eyebrow">Hesap</div>
    <h1 class="auth-title">Yeni Şifre Belirle</h1>
    <p class="auth-sub" id="reset-sub">Hesabın için yeni bir şifre gir.</p>
    <div class="auth-card">
      <form id="reset-form">
        <div class="auth-field">
          <label for="reset-password">Yeni Şifre</label>
          <input type="password" id="reset-password" name="password" placeholder="••••••••" required minlength="8">
        </div>
        <div class="auth-field">
          <label for="reset-password-confirm">Yeni Şifre (Tekrar)</label>
          <input type="password" id="reset-password-confirm" name="password_confirm" placeholder="••••••••" required minlength="8">
        </div>
        <button class="auth-submit" type="submit" id="reset-submit-btn">Şifreyi Güncelle</button>
        <div class="auth-notice" id="reset-notice"></div>
      </form>
    </div>
    <p class="auth-switch"><a href="/giris">Giriş sayfasına dön</a></p>
  </div>

  <footer id="site-footer-mount"></footer>

<script>
const token = new URLSearchParams(window.location.search).get('token') || '';
if(!token){
  document.getElementById('reset-sub').textContent = 'Geçersiz ya da eksik bir bağlantı kullandın.';
  document.getElementById('reset-form').style.display = 'none';
}

document.getElementById('reset-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const notice = document.getElementById('reset-notice');
  const submitBtn = document.getElementById('reset-submit-btn');
  const password = document.getElementById('reset-password').value;
  const passwordConfirm = document.getElementById('reset-password-confirm').value;
  notice.classList.remove('success');

  if(password !== passwordConfirm){
    notice.textContent = 'Şifreler eşleşmiyor.';
    notice.classList.add('show');
    return;
  }

  submitBtn.disabled = true;
  try{
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, newPassword: password }),
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){
      notice.textContent = data.error || 'Bir şeyler ters gitti, tekrar dene.';
      notice.classList.add('show');
      submitBtn.disabled = false;
      return;
    }
    // Kullanıcı isteği (2026-09-02): sıfırlama sonrası kullanıcı ZATEN giriş yapmış olur — sunucu
    // yanıtla birlikte oturum çerezini de gönderir (bkz. src/routes/auth.js#resetPassword). Bu
    // yüzden artık giriş sayfasına değil ANA SAYFAYA yönlendirilir. Sunucu bir nedenle oturum
    // açamadıysa (data.user yoksa) eski davranışa düşülür — kullanıcı en azından giriş yapabilsin.
    const loggedIn = !!(data && data.user);
    notice.textContent = loggedIn
      ? 'Şifren güncellendi. Giriş yapıldı, ana sayfaya yönlendiriliyorsun...'
      : 'Şifren güncellendi. Giriş sayfasına yönlendiriliyorsun...';
    notice.classList.add('show', 'success');
    setTimeout(()=>{ window.location.href = loggedIn ? '/' : '/giris'; }, 1500);
  }catch(err){
    notice.textContent = 'Sunucuya ulaşılamadı, lütfen tekrar dene.';
    notice.classList.add('show');
    submitBtn.disabled = false;
  }
});


</script>
</body>
