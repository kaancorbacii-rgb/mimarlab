<base href="/">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  /* Ürün açılır menü düğmesi (bkz. js/components/nav-product-menu.js) — bu reset burada, sayfanın
     KENDİ <style>'ında olmalı, yalnızca JS'in enjekte ettiği stilde değil: nav-product-menu.js
     defer'lı olduğundan ilk boyamadan SONRA çalışır, o ana kadar <button> tarayıcı varsayılan
     çerçeve/arkaplanıyla görünüp kaybolan bir gri dikdörtgen gibi çakıyordu (bkz. kullanıcı isteği). */
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{
    display:none;
    background:none; border:1px solid var(--line);
    border-radius:8px; padding:8px;
    color:var(--ink); align-items:center; justify-content:center;
  }
  .nav-mobile-menu{
    display:none;
    position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15);
    flex-direction:column; min-width:220px;
    /* bkz. index.html'deki AYNI gerçek bulgu/gerekçe — kullanıcı isteği: mobil hamburger menüde
       Ürün akordeonu açılınca panelin altına kaydırılamaması sorununun kökten çözümü. */
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{
    padding:11px 14px; border-radius:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
    text-transform:uppercase;
  }
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:100px; padding:9px 14px;
    margin-bottom:8px;
  }
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:16px; width:100%; color:var(--ink);
  }
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink);
    padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink);
    font-size:14px; font-weight:600; white-space:nowrap;
    text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:1260px; margin:0 auto; padding:28px 32px 0;}
  .page-head h1{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:28px; font-weight:700; margin:0 0 4px;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- RESULT BAR (sonuç sayacı + sıralama) ----------
     kullanıcı isteği (2026-09-06): Sıralama filtreler kutusundan çıkarılıp gönderilerin sağ
     üstüne, sayaç da onun soluna alındı — proje.html/urun.html'deki .result-bar ile BİREBİR AYNI
     değerler (paylaşılan bir stylesheet olmadığından her sayfada ayrı tutulur, bkz. proje.html'deki
     AYNI not). flex-wrap:wrap dar ekranda sıralamayı kendi satırına indirir. */
  .result-bar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .result-count{font-size:13px; color:var(--ink-soft); flex:1;}
  .sort-select{position:relative;}
  .sort-select select{
    appearance:none; -webkit-appearance:none;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:100px; padding:9px 32px 9px 16px;
    font-size:13px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .sort-select select:hover{border-color:var(--walnut);}
  .sort-arrow{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}

  /* ---------- FILTER SELECT (shared) ---------- */
  .filter-select{position:relative;}
  .filter-select select{
    appearance:none; -webkit-appearance:none;
    width:100%;
    background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:10px 34px 10px 14px;
    font-size:13.5px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .filter-select select:hover{border-color:var(--walnut);}
  .select-arrow{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}

  /* ---------- ÇOK SEÇMELİ FİLTRE AKORDEONU ----------
     kullanıcı isteği (2026-09-01 madde 2): "Kişi sayfasındaki filtreleri de proje ve ürün
     sayfalarındaki gibi çok seçmeli seçilebilecek şekilde düzenle". Sınıf adları proje.html'deki
     AYNI blokla birebir aynı (.filter-group/.filter-opt/.filter-search-row) — orada da her sayfa
     kendi kopyasını taşır (bkz. o dosyadaki .detail-title yorumundaki sayfa-başına-kopyalama
     deseni). 2026-09-06 madde 9'dan sonra ölçüler de birebir aynı: gruplar kendi çerçeveli
     kutusunun içinde değil, proje.html'deki gibi kutunun kenarından kenarına oturur. */
  #filter-groups{display:flex; flex-direction:column;}
  #filter-groups:empty{display:none;}
  .filter-group{border-bottom:1px solid var(--line-soft);}
  .filter-group:last-child{border-bottom:none;}
  .filter-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; background:none; border:none; text-align:left;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .filter-group-head:hover{background:var(--paper-alt);}
  .filter-group-toggle{font-size:16px; color:var(--ink-soft); font-weight:400; line-height:1;}
  .filter-group-body{display:none; padding:0 16px 14px; max-height:260px; overflow-y:auto;}
  .filter-group.open .filter-group-body{display:block;}
  .filter-group.open .filter-group-toggle{transform:rotate(45deg);}
  .filter-opt{
    display:flex; align-items:center; gap:8px;
    padding:5px 0; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .filter-opt input{flex-shrink:0; accent-color:var(--ink); width:14px; height:14px;}
  .filter-opt:hover{color:var(--ink);}
  .filter-opt-count{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}
  .filter-search-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 8px;
    padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:100px;
    position:sticky; top:0; z-index:1;
  }
  .filter-search-row svg{flex-shrink:0; opacity:0.5;}
  .filter-search-row input{border:none; background:none; outline:none; font-family:inherit; font-size:12px; width:100%; color:var(--ink);}

  /* ---------- GRID LAYOUT ---------- */
  .grid-layout{
    max-width:1260px; margin:0 auto;
    padding:20px 32px 90px;
    display:grid; grid-template-columns:240px 1fr;
    gap:28px; align-items:start;
  }
  /* Filtreler kutusu — proje.html/urun.html'deki .grid-sidebar ile BİREBİR AYNI (kullanıcı
     isteği, 2026-09-06 madde 9: "tüm sayfalardaki filtreler kutuları tek bir tasarıma sahip
     olmalı ve o tasarım proje ile ürün sayfasındaki tasarım olmalı"). Kutunun KENDİ padding'i
     ve gap'i KALDIRILDI: başlık/arama/gruplar/Ekle butonu artık kenardan kenara oturur, aralarındaki
     ayrım kendi border/padding'lerinden gelir — orada olduğu gibi. */
  .grid-sidebar{
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    display:flex; flex-direction:column;
    position:sticky; top:90px;
    /* Akordeon filtre grupları (bkz. #filter-groups) sidebar'ı viewport'tan uzun hâle
       getirebiliyor — proje.html'in .grid-sidebar'ındaki AYNI çözüm: kutu kendi içinde kayar,
       "Kişi Ekle" butonu hiçbir zaman erişilemez hâle gelmez. */
    max-height:calc(100vh - 110px); overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  /* Filtreler başlığı + sıfırlama X butonu — proje.html/urun.html ile BİREBİR AYNI (kullanıcı
     isteği, 2026-09-06 madde 9). Padding/alt çizgi artık BURADA da var: .grid-sidebar'ın kendi
     padding'i kaldırıldığından (bkz. yukarısı) başlık satırı o iki sayfadaki gibi kutunun üst
     bandını oluşturur ve altındaki çizgi filtre gruplarından ayırır. */
  .sidebar-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line-soft);}
  .sidebar-head-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; font-weight:700;}
  .sidebar-close-btn{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    color:var(--ink-soft); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-close-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .sidebar-search{display:flex; align-items:center; gap:8px; margin:12px 16px; padding:9px 14px; background:var(--paper); border:1px solid var(--line); border-radius:100px;}
  .sidebar-search svg{flex-shrink:0; opacity:0.5;}
  .sidebar-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; width:100%; color:var(--ink);}
  .sidebar-add{padding:16px; border-top:1px solid var(--line-soft);}
  .sidebar-add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--ink); color:var(--paper-card);
    padding:12px; border-radius:100px; font-weight:600; font-size:13.5px;
  }
  .sidebar-add-btn:hover{background:var(--walnut);}
  .sidebar-add-icon{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:rgba(237,240,243,0.2); font-size:14px; line-height:1;
  }

  /* ---------- DANIŞMAN KARTI ----------
     Kişi sayfasının 4 sütunlu kare kart ızgarası BURADA KULLANILMAZ: danışman kartı bir portre
     değil bir TEKLİF taşıyor (tanıtım cümlesi, süre, uygun gün/saatler, ücret, "Danışmanlık Al"
     düğmesi) ve havuz tanımı gereği avuç içi kadar (bkz. src/routes/consultations.js#
     ALLOWED_HOST_SLUGS). auto-fill + minmax: tek danışmanda kart satırı doldurur, danışman
     çoğaldıkça ızgara kendiliğinden sütunlanır — sayfanın geri kalan tasarımı (kenar çubuğu,
     sonuç barı, sayfalama, breakpoint'ler) kisi.html ile BİREBİR aynıdır. */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:20px;}
  .consult-card{
    display:flex; gap:16px; background:var(--paper-card);
    border:1px solid var(--line-soft); border-radius:14px; padding:16px;
    transition:box-shadow .15s ease, border-color .15s ease;
  }
  .consult-card:hover{box-shadow:0 10px 24px rgba(27,42,61,0.1); border-color:var(--line);}
  .consult-card-photo{
    position:relative; width:104px; height:104px; flex-shrink:0;
    border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper-card); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:600; font-size:26px;
  }
  .consult-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .consult-card-body{flex:1; min-width:0;}
  .consult-card-name{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:700; font-size:16px; color:var(--ink);
    display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .consult-card-name:hover{color:var(--walnut);}
  .verified-badge-icon{display:inline-flex; align-items:center; color:var(--accent); vertical-align:middle; margin-left:4px; flex-shrink:0;}
  .consult-card-sub{
    font-size:12px; color:var(--ink-soft); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .consult-card-intro{font-size:13px; line-height:1.6; color:var(--ink-soft); margin:10px 0 0;}
  /* "hangi alanda danışmanlık verdiklerini vs. bilgi olarak yazsınlar" (kullanıcı isteği) —
     başvuruda yazılan serbest metin. Uzun olabileceğinden dört satırla kırpılır. */
  .consult-card-expertise{
    font-size:12.5px; line-height:1.6; color:var(--ink); margin:8px 0 0;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .consult-card-facts{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .consult-card-facts li{display:flex; align-items:flex-start; gap:7px; font-size:12.5px; color:var(--ink);}
  .consult-card-facts svg{flex-shrink:0; margin-top:1px; opacity:0.6;}
  .consult-card-foot{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px;}
  .consult-card-price{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:700; font-size:15px; color:var(--ink);}
  /* "Danışmanlık Al" — kişi pop-up'ındaki .consult-btn ile AYNI görsel dil (dolu koyu düğme);
     o kural js/components/architect-modal.js'in enjekte ettiği stilde yaşadığından (bu sayfa o
     modülü yüklemiyor) burada kendi adıyla tekrar tanımlanır. */
  .consult-card-btn{
    margin-left:auto; background:var(--ink); color:var(--paper-card);
    border:none; border-radius:100px; padding:10px 20px;
    font-family:inherit; font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .consult-card-btn:hover{background:var(--walnut);}
  /* İskelet kart (site-chrome.js#mlListSkeleton) 4/5 oranında dikey bir blok basar; bu sayfanın
     kartı YATAY olduğundan tek satırlık ızgarada ekran boyu bir dikdörtgen çıkıyordu. site-chrome
     kendi stilini <head>'e SONRADAN eklediğinden eşit özgüllükte kural kazanamaz — id ile
     özgüllük artırılır. */
  #card-grid .ml-skel{aspect-ratio:auto; height:152px;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; display:none;}

  .pagination{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin-top:28px;
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  }
  .pagination::-webkit-scrollbar{display:none;}
  .page-btn{
    min-width:38px; height:38px; padding:0 10px; flex-shrink:0;

<script>
// DANIŞMANLIK SAYFASI (kullanıcı isteği, 2026-09-15: "DANIŞMANLIK diye bir sayfa tasarla. Aynı kişi
// sayfası gibi olsun, sol tarafta filtreler ve filtrelerin en altında Danışman Ol butonu olsun.
// Sayfayı yayına al ama hiçbir menüye ekleme. Danışman olarak Kaan Çorbacı'yı koy ve Kaan
// Çorbacı'nın profilindeki Danışmanlık Al butonundaki bilgileri kullan.")
//
// HİÇBİR MENÜDE YOK: ne üst menüde, ne mobil çekmecede, ne altbilgide bir bağlantısı vardır (bunlar
// js/components/site-chrome.js'ten gelir ve O DOSYAYA DOKUNULMADI). Sayfa yalnızca doğrudan adresle
// ve /sitemap.xml üzerinden bulunur.
//
// KİŞİ SAYFASINDAN İKİ YAPISAL FARK — ikisi de havuzun küçüklüğünden geliyor (danışman listesi
// tanımı gereği küratörlüdür, bkz. src/routes/consultations.js#ALLOWED_HOST_SLUGS):
//   1. TEK İSTEK, İSTEMCİDE FİLTRE. /api/consultants tüm havuzu bir kerede döner; filtreleme,
//      sıralama ve sayfalama burada yapılır. kisi.html bunları sunucuya yaptırır çünkü orada havuz
//      ~900 kişi; burada her filtre değişiminde ağ turu atmak saf gecikme olurdu.
//   2. SAYAÇLAR DA BURADA. Filtre sayaçları aynı havuzdan hesaplanır ve kisi.html'deki kuralın
//      AYNISI geçerlidir: sayacı hiç oluşmayan (0 kişilik) bir seçenek çizilmez.
// Geri kalan her şey — akordeon filtre grupları, grup içi arama, sonuç barı, sıralama, sayfalama,
// URL senkronu — kisi.html'in davranışının birebir aynısıdır.
const PAGE_SIZE = 24;
let currentPage = 1;
let searchQuery = '';

// kisi.html#FILTER_GROUPS ile AYNI sıra/etiketler.
const POSITION_ORDER = ['Kurucu', 'Ortak', 'Ekip Lideri', 'Ekip Üyesi', 'Akademisyen', 'Serbest Çalışan', 'Öğrenci', 'Emekli', 'İşsiz'];
const PROFESSION_ORDER = ['Mimar', 'İç Mimar', 'Peyzaj Mimarı', 'Şehir Plancısı', 'Restoratör', 'Tasarımcı', 'Mühendis', 'Fotoğrafçı', 'Öğrenci', 'Diğer'];
const FILTER_GROUPS = [
  { key: 'position', label: 'Pozisyon' },
  { key: 'dob', label: 'Doğum Yılı' },
  { key: 'school', label: 'Üniversite' },
  { key: 'profession', label: 'Meslek' },
  { key: 'award', label: 'Ödül' },
];
const activeFilters = { position: new Set(), dob: new Set(), school: new Set(), profession: new Set(), award: new Set() };
const groupSearchQueries = {};
const openGroups = new Set();

// Bir danışmanın bir filtre grubundaki DEĞERLERİ. Tek kaynak: hem sayaçlar hem de eşleşme kontrolü
// buradan okur, böylece "sayaç 1 diyor ama filtre hiçbir şey bulmuyor" durumu doğamaz.
function valuesOf(item, key){
  if(key === 'position') return item.position ? [item.position] : [];
  if(key === 'dob') return item.dob ? [String(item.dob)] : [];
  if(key === 'school') return item.school ? [item.school] : [];
  if(key === 'profession') return item.professions || [];
  if(key === 'award') return item.awards || [];
  return [];
}

function trLower(s){
  return String(s || '').replace(/İ/g,'i').replace(/I/g,'ı').replace(/Ş/g,'ş').replace(/Ğ/g,'ğ').replace(/Ü/g,'ü').replace(/Ö/g,'ö').replace(/Ç/g,'ç').toLowerCase();
}
// Türkçe karakter KATLAMA (src/lib/textMatch.js#foldTr ile aynı amaç): kenar çubuğundaki arama
// "corbaci" yazana da "Çorbacı"yı bulsun.
function foldTr(s){
  return trLower(s).replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function badgeHtmlSafe(){ return (typeof verifiedBadgeHtml === 'function') ? verifiedBadgeHtml.apply(null, arguments) : ''; }

// ---------------------------------------------------------------------------------------------
// TEKLİF METİNLERİ — HİÇBİRİ BU DOSYADA SABİT DEĞİLDİR
// ---------------------------------------------------------------------------------------------
// Ücret, süre, saat dilimi ve uygun gün/saatler GET /api/consultants'ın `offer` alanından gelir; o
// alan da randevu talebini DOĞRULAYAN sabitlerin ta kendisini okur (src/routes/consultations.js#
// ALLOWED_WEEKDAYS/ALLOWED_TIMES/CONSULTATION_PRICE_TRY + src/lib/consultationMeet.js#
// CONSULTATION_DURATION_MIN/CONSULTATION_TIMEZONE). Burada bir kopya tutulsaydı, kural değiştiği
// gün sayfa eski bilgiyi göstermeye SESSİZCE devam ederdi. Aşağıdakiler yalnızca GÖSTERİM
// yardımcılarıdır (sayı -> gün adı, IANA kimliği -> okunur etiket).
const WEEKDAY_NAMES = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
const TZ_LABELS = { 'Europe/Istanbul': 'İstanbul (GMT+3)' };
function weekdayLabel(list){
  return (list || []).map(n => WEEKDAY_NAMES[n] || '').filter(Boolean).join(', ');
}
function tzLabel(tz){ return TZ_LABELS[tz] || tz || ''; }
// js/components/consultation-modal.js#formatTry ile AYNI biçim.
function formatTry(n){ return `${Number(n).toLocaleString('tr-TR')} ₺`; }

let allItems = [];

// ---------------------------------------------------------------------------------------------
// FİLTRE KENAR ÇUBUĞU — kisi.html#buildFilterGroups'un birebir aynısı, tek farkı seçeneklerin
// sunucu yanıtındaki `filters` alanından değil, havuzdan hesaplanıyor olması (bkz. countsFor).
// ---------------------------------------------------------------------------------------------
function sortByPreferredOrder(counts, order){
  return Object.keys(counts || {})
    .sort((a, b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b, 'tr');
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    })
    .map(value => ({ value, count: counts[value] }));
}
// Sayaçlar AKTİF FİLTRELERDEN BAĞIMSIZ, tüm havuz üzerinden — kisi.html'deki AYNI kural.
function countsFor(key){
  const counts = {};
  allItems.forEach(item => { valuesOf(item, key).forEach(v => { counts[v] = (counts[v] || 0) + 1; }); });
  return counts;
}
function groupOptions(key){
  const counts = countsFor(key);
  if(key === 'position') return sortByPreferredOrder(counts, POSITION_ORDER);
  if(key === 'profession') return sortByPreferredOrder(counts, PROFESSION_ORDER);
  if(key === 'dob') return Object.keys(counts).sort((x, y) => y - x).map(v => ({ value: v, count: counts[v] }));
  return Object.keys(counts).sort((x, y) => counts[y] - counts[x] || x.localeCompare(y, 'tr')).map(v => ({ value: v, count: counts[v] }));
}

function openSelectedGroups(wrap){
  FILTER_GROUPS.forEach(g=>{
    if(activeFilters[g.key].size === 0) return;
    openGroups.add(g.key);
    const grp = wrap.querySelector(`.filter-group[data-key="${g.key}"]`);
    if(grp) grp.classList.add('open');
  });
}

let lastFilterSignature = null;
function buildFilterGroups(){
  const wrap = document.getElementById('filter-groups');
  const groups = FILTER_GROUPS.map(g => [g.key, groupOptions(g.key)]);
  const signature = JSON.stringify(groups);
  if(signature === lastFilterSignature){
    wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.checked = activeFilters[cb.dataset.key].has(cb.value);
    });
    openSelectedGroups(wrap);
    return;
  }
  lastFilterSignature = signature;
  let html = '';
  groups.forEach(([key, options])=>{
    if(!options.length) return;
    const label = (FILTER_GROUPS.find(g => g.key === key) || {}).label || key;
    html += `<div class="filter-group${openGroups.has(key) ? ' open' : ''}" data-key="${key}">
      <button class="filter-group-head" data-toggle="${key}">${escapeHtml(label)} <span class="filter-group-toggle">+</span></button>
      <div class="filter-group-body">
        <div class="filter-search-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="filter-search-input" placeholder="Ara..." autocomplete="off"></div>
        ${options.map(({value, count})=>`
        <label class="filter-opt">
          <input type="checkbox" data-key="${key}" value="${escapeAttr(value)}" ${activeFilters[key].has(value)?'checked':''}>
          <span>${escapeHtml(value)}</span>
          <span class="filter-opt-count">(${count})</span>
        </label>`).join('')}
      </div>
    </div>`;
  });
  wrap.innerHTML = html;
  openSelectedGroups(wrap);

  wrap.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.toggle;
      const opened = btn.parentElement.classList.toggle('open');
      if(opened) openGroups.add(key); else openGroups.delete(key);
    });
  });
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) activeFilters[cb.dataset.key].add(cb.value); else activeFilters[cb.dataset.key].delete(cb.value);
      currentPage = 1;
      syncBrowserUrl(true);
      render();
    });
  });
  function applyGroupSearchFilter(input){
    const body = input.closest('.filter-group-body');
    const q = trLower(input.value.trim());
    body.querySelectorAll('.filter-opt').forEach(opt=>{
      const label = trLower(opt.querySelector('span').textContent);
      opt.style.display = !q || label.includes(q) ? '' : 'none';
    });
  }
  wrap.querySelectorAll('.filter-search-input').forEach(input=>{
    const groupKey = input.closest('.filter-group').dataset.key;
    if(groupSearchQueries[groupKey]){
      input.value = groupSearchQueries[groupKey];
      applyGroupSearchFilter(input);
    }
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('input', ()=>{
      groupSearchQueries[groupKey] = input.value;
      applyGroupSearchFilter(input);
    });
  });
}

// ---------------------------------------------------------------------------------------------
// SAYFALAMA — kisi.html ile BİREBİR aynı (kayan pencere, ilk/son sayfa her zaman görünür).
// ---------------------------------------------------------------------------------------------
function getPageWindowSize(){
  const w = window.innerWidth;
  if(w <= 480) return 3;
  if(w <= 720) return 5;
  return 9;
}
function getPageList(totalPages, currentPage){
  const N = getPageWindowSize();
  if(totalPages <= N + 2){ const pages=[]; for(let p=1;p<=totalPages;p++) pages.push(p); return pages; }
  const half = Math.floor(N / 2);
  let start = Math.max(2, currentPage - half);
  let end = Math.min(totalPages - 1, currentPage + half);
  if(start === 2) end = Math.min(totalPages - 1, start + N - 1);
  if(end === totalPages - 1) start = Math.max(2, end - N + 1);
  const pages = [1];
  if(start > 2) pages.push('...');
  for(let p=start; p<=end; p++) pages.push(p);
  if(end < totalPages - 1) pages.push('...');
  pages.push(totalPages);
  return pages;
}
function goToPage(p){
  currentPage = p;
  syncBrowserUrl(true);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML = ''; return; }
  let html = `<button class="page-btn page-btn-arrow" id="page-prev" aria-label="Önceki" ${currentPage===1?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;
  getPageList(totalPages, currentPage).forEach(p=>{
    if(p==='...') html += `<span class="page-ellipsis">…</span>`;
    else html += `<button class="page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`;
  });
  html += `<button class="page-btn page-btn-arrow" id="page-next" aria-label="Sonraki" ${currentPage===totalPages?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=> goToPage(parseInt(btn.dataset.page)));
  });
  const prevBtn = document.getElementById('page-prev');
  const nextBtn = document.getElementById('page-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(currentPage>1) goToPage(currentPage-1); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(currentPage<totalPages) goToPage(currentPage+1); });
}

// ---------------------------------------------------------------------------------------------
// URL SENKRONU — filtreler/sıralama/arama sorgu dizesinde, sayfa ?page=N ile.
// kisi.html'in TEMİZ sayfalama adresi (/kisi/sayfa-2) burada BİLEREK YOK: o biçim sunucu tarafında
// ayrıca tanınmayı gerektirir (src/index.js#PAGED_LIST_BASES) ve bu havuzda ikinci bir sayfa
// pratikte hiç oluşmaz — tanınmayan bir /danismanlik/sayfa-2 adresi 404 dönerdi.
// ---------------------------------------------------------------------------------------------
function currentQueryParams(){
  const params = new URLSearchParams();
  FILTER_GROUPS.forEach(g => { activeFilters[g.key].forEach(v => params.append(g.key, v)); });
  const sort = document.getElementById('g-sort').value;
  if(sort) params.set('sort', sort);
  if(searchQuery.trim()) params.set('search', searchQuery.trim());
  if(currentPage > 1) params.set('page', String(currentPage));
  return params;
}
function syncBrowserUrl(push){
  const qs = currentQueryParams().toString();
  const newUrl = location.pathname + (qs ? '?' + qs : '');
  if(newUrl === location.pathname + location.search) return;
  if(push) history.pushState({}, '', newUrl); else history.replaceState({}, '', newUrl);
}
function applyStateFromUrl(){
  const params = new URLSearchParams(location.search);
  FILTER_GROUPS.forEach(g => {
    activeFilters[g.key].clear();
    params.getAll(g.key).filter(Boolean).forEach(v => activeFilters[g.key].add(v));
  });
  document.getElementById('g-sort').value = params.get('sort') || '';
  searchQuery = params.get('search') || '';
  document.getElementById('g-local-search').value = searchQuery;
  const p = parseInt(params.get('page'), 10);
  currentPage = p > 1 ? p : 1;
}

// ---------------------------------------------------------------------------------------------
// VERİ + ÇİZİM
// ---------------------------------------------------------------------------------------------
function passes(item){
  for(const g of FILTER_GROUPS){
    const selected = activeFilters[g.key];
    if(!selected.size) continue;
    const values = valuesOf(item, g.key);
    // Grup İÇİ OR, gruplar ARASI AND — kisi.html/proje.html ile AYNI semantik.
    if(!values.some(v => selected.has(v))) return false;
  }
  if(searchQuery.trim() && !foldTr(item.name).includes(foldTr(searchQuery.trim()))) return false;
  return true;
}

function sortItems(list){
  const sort = document.getElementById('g-sort').value;
  return list.slice().sort((x, y) => {
    switch(sort){
      case 'name_asc': return x.name.localeCompare(y.name, 'tr');
      case 'year_desc': return (y.dob || 0) - (x.dob || 0);
      case 'year_asc': return (x.dob || 9999) - (y.dob || 9999);
      // Varsayılan: /api/consultants'ın döndürdüğü sıra (= ALLOWED_HOST_SLUGS sırası) korunur.
      default: return 0;
    }
  });
}

function factIcon(path){
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
const ICON_CLOCK = '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>';
const ICON_CALENDAR = '<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>';
const ICON_VIDEO = '<rect x="2" y="6" width="14" height="12" rx="2"/><polygon points="22 8 16 12 22 16 22 8"/>';

function cardHtml(item, eager){
  // TEKLİF ARTIK KART BAŞINA (kullanıcı isteği, 2026-09-15: her danışman kendi süresini/ücretini/
  // saatlerini seçer). Liste düzeyinde tek bir `offer` okumak, ikinci danışman eklendiği anda
  // herkese aynı süreyi/ücreti gösterirdi.
  const offer = item.offer || null;
  const href = `/kisi/${encodeURIComponent(item.slug)}`;
  const sub = item.office || item.positionRaw || '';
  const photoSrcset = item.photo && typeof cdnSrcset === 'function' ? cdnSrcset(item.photo, [200, 400]) : '';
  const photoSrc = item.photo && typeof cdnImg === 'function' ? cdnImg(item.photo, 400) : (item.photo || '');
  const imgAttrs = eager ? 'loading="eager" fetchpriority="high"' : 'loading="lazy" fetchpriority="low"';
  const bg = typeof officeColor === 'function' ? officeColor(item.name) : 'var(--brass)';
  const initialsText = typeof initials === 'function' ? initials(item.name) : '';
  const facts = [];
  if(offer && offer.durationMin) facts.push(`<li>${factIcon(ICON_VIDEO)}<span>${offer.durationMin} dakikalık birebir online görüşme</span></li>`);
  if(offer && (offer.weekdays || []).length && (offer.times || []).length){
    facts.push(`<li>${factIcon(ICON_CALENDAR)}<span>${escapeHtml(weekdayLabel(offer.weekdays))} &middot; ${escapeHtml(offer.times.join(' / '))}</span></li>`);
  }
  if(offer && offer.timezone) facts.push(`<li>${factIcon(ICON_CLOCK)}<span>Saatler ${escapeHtml(tzLabel(offer.timezone))} zaman dilimine göredir</span></li>`);
  return `
  <article class="consult-card">
    <a class="consult-card-photo" href="${escapeAttr(href)}" style="background:${escapeAttr(bg)}" aria-hidden="true" tabindex="-1">${photoSrc ? `<img src="${escapeAttr(photoSrc)}"${photoSrcset ? ` srcset="${escapeAttr(photoSrcset)}" sizes="104px"` : ''} alt="" ${imgAttrs} decoding="async" onerror="this.remove()">` : escapeHtml(initialsText)}</a>
    <div class="consult-card-body">
      <a class="consult-card-name" href="${escapeAttr(href)}">${escapeHtml(item.name)}${badgeHtmlSafe('architect', item.name, item.badges)}</a>
      ${sub ? `<div class="consult-card-sub">${escapeHtml(sub)}</div>` : ''}
      ${item.intro ? `<p class="consult-card-intro">${escapeHtml(item.intro)}</p>` : ''}
      ${item.expertise ? `<p class="consult-card-expertise">${escapeHtml(item.expertise)}</p>` : ''}
      ${facts.length ? `<ul class="consult-card-facts">${facts.join('')}</ul>` : ''}
      <div class="consult-card-foot">
        ${offer && offer.priceTry ? `<span class="consult-card-price">${escapeHtml(formatTry(offer.priceTry))}</span>` : ''}
        <button type="button" class="consult-card-btn" data-slug="${escapeAttr(item.slug)}">Danışmanlık Al</button>
      </div>
    </div>
  </article>`;
}

function render(){
  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty-state');
  const filtered = sortItems(allItems.filter(passes));
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('result-count').textContent = `${filtered.length} danışman listeleniyor`;
  buildFilterGroups();
  renderPagination(totalPages);

  if(!pageItems.length){
    grid.innerHTML = '';
    empty.textContent = 'Bu kritere uyan danışman bulunamadı.';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = pageItems.map((item, i) => cardHtml(item, i < 2)).join('');
}

async function load(){
  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty-state');
  if(window.mlListSkeleton) window.mlListSkeleton(grid, 1);
  let data = null;
  try{
    // site-chrome.js#mlFetch: zaman aşımı + bir kez yeniden deneme (mobil ağda askıda kalan tek bir
    // istek sayfayı sonsuza kadar boş bırakıyordu — bkz. kisi.html#listFetch'teki AYNI gerekçe).
    const res = window.mlFetch ? await window.mlFetch('/api/consultants', { timeoutMs: 12000, retries: 1 }) : await fetch('/api/consultants');
    if(res.ok) data = await res.json();
  }catch(err){ console.error('Danışman listesi alınamadı:', err); }
  if(!data){
    grid.innerHTML = '';
    document.getElementById('result-count').textContent = '';
    if(window.mlListError) window.mlListError(empty, 'Danışmanlar yüklenemedi.', () => load());
    else { empty.textContent = 'Danışmanlar yüklenemedi, lütfen sayfayı yenile.'; empty.style.display = 'block'; }
    return;
  }
  allItems = data.items || [];
  render();
}

// "Danışmanlık Al" — kişi pop-up'ındaki düğmeyle AYNI modal, AYNI argümanlar (bkz.
// js/components/architect-modal.js#consultBtn). Tek fark: tanıtım cümlesi de geçirilir, böylece
// metin modalin kendi geri-düşüş kopyasından değil sunucudan gelir (bkz. consultationIntro).
// Delege dinleyici: #card-grid'in innerHTML'i her render()'da değişir, konteyner sabit kalır.
document.getElementById('card-grid').addEventListener('click', (e)=>{
  const btn = e.target.closest('.consult-card-btn');
  if(!btn) return;
  const item = allItems.find(x => x.slug === btn.dataset.slug);
  if(!item) return;
  if(typeof ConsultationModal === 'undefined'){
    // Modül henüz inmediyse (defer + yavaş ağ) kullanıcı elleri boş kalmasın: kişi sayfasındaki
    // AYNI düğmeye düşülür.
    window.location.href = `/kisi/${encodeURIComponent(item.slug)}`;
    return;
  }
  ConsultationModal.open({ hostSlug: item.slug, hostName: item.name, intro: item.intro || '', offer: item.offer || null });
});

let searchDebounce = null;
document.getElementById('g-sort').addEventListener('change', ()=>{ currentPage = 1; syncBrowserUrl(true); render(); });
document.getElementById('g-local-search').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  currentPage = 1;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ syncBrowserUrl(false); render(); }, 300);
});
document.getElementById('g-reset').addEventListener('click', ()=>{
  document.getElementById('g-sort').value = '';
  FILTER_GROUPS.forEach(g => activeFilters[g.key].clear());
  Object.keys(groupSearchQueries).forEach(k => delete groupSearchQueries[k]);
  searchQuery = '';
  document.getElementById('g-local-search').value = '';
  currentPage = 1;
  syncBrowserUrl(true);
  render();
});
window.addEventListener('popstate', ()=>{
  applyStateFromUrl();
  render();
});
// Rozetler /api/public/badges'ten sonradan gelir (badge-shared.js) — veri elde olduğundan yeniden
// çizim ağa HİÇ çıkmaz (kisi.html'deki render({reuse:true}) ile aynı amaç, burada zaten yereldir).
window.addEventListener('mimarlab-badges-ready', () => { if(allItems.length) render(); });

applyStateFromUrl();
load();
</script>
