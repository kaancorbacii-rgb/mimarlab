<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}

  /* ---------- MEGA MENU (Architonic tarzı, bkz. kullanıcı isteği) ---------- */
  /* .nav-link-wrap yerine .nav'a göre ortalanır (bkz. kullanıcı isteği: nav sağa yaslı olduğundan
     tetikleyici butona göre ortalarsak panel viewport dışına taşardı) — bu yüzden panel markup'ı
     DOM'da .nav-link-wrap içinde değil, .nav'ın doğrudan çocuğu olarak durur. */
  .mega-menu{
    display:none; position:absolute; top:calc(100% + 14px); left:50%; transform:translateX(-50%);
    z-index:90; width:min(96vw, 1160px);
    background:var(--paper-card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 18px 40px rgba(27,42,61,0.18);
    padding:26px 30px;
  }
  .mega-menu.open{display:block;}
  .mega-menu-cols{display:grid; grid-template-columns:repeat(5, 1fr); gap:24px;}
  .mega-col{display:flex; flex-direction:column; gap:20px; min-width:0;}
  .mega-group-title{display:block; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:8px;}
  .mega-group-title:hover{color:var(--walnut);}
  .mega-cat-link{display:block; font-size:13.5px; color:var(--ink-soft); padding:4px 0;}
  .mega-cat-link:hover{color:var(--ink); text-decoration:underline;}
  .mega-menu-footer{margin-top:22px; padding-top:18px; border-top:1px solid var(--line);}
  .mega-viewall{display:inline-flex; align-items:center; gap:7px; font-family:'Fraunces', serif; font-size:21px; font-weight:600; color:var(--ink);}
  .mega-viewall:hover{color:var(--walnut);}
  @media (max-width:960px){ .mega-menu{display:none !important;} }
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px; max-height:calc(100vh - 90px); overflow-y:auto;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-accordion{display:flex; flex-direction:column;}
  .nav-mobile-accordion-trigger{display:flex; align-items:center; justify-content:space-between; width:100%; background:none; border:none;}
  .nav-mobile-accordion-trigger svg{transition:transform .15s ease;}
  .nav-mobile-accordion-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-mobile-accordion-panel{display:none; flex-direction:column; padding:2px 0 8px 12px;}
  .nav-mobile-accordion-panel.open{display:flex;}
  .nav-mobile-subgroup{display:flex; flex-direction:column;}
  .nav-mobile-subtrigger{display:flex; align-items:center; justify-content:space-between; width:100%; padding:9px 12px; border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink); background:none; border:none; font-family:inherit; cursor:pointer; text-transform:none;}
  .nav-mobile-subtrigger:hover{background:var(--paper-alt);}
  .nav-mobile-subtrigger svg{transition:transform .15s ease; flex-shrink:0;}
  .nav-mobile-subtrigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-mobile-subpanel{display:none; flex-direction:column; padding:0 0 4px 14px;}
  .nav-mobile-subpanel.open{display:flex;}
  .nav-mobile-subcat{display:block; padding:8px 12px; border-radius:8px; font-size:13px; color:var(--ink-soft); text-transform:none;}
  .nav-mobile-subcat:hover{background:var(--paper-alt); color:var(--ink);}
  .nav-mobile-viewall{display:block; padding:10px 12px; margin-top:2px; border-radius:8px; font-size:13.5px; font-weight:700; color:var(--walnut); text-transform:none;}
  .nav-mobile-viewall:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:1260px; margin:0 auto; padding:28px 32px 0;}
  .page-head h1{font-family:'Inter', sans-serif; font-size:28px; font-weight:700; margin:0 0 4px;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- GRID LAYOUT (sidebar + içerik) ---------- */
  .grid-layout{
    max-width:1260px; margin:0 auto;
    padding:20px 32px 90px;
    display:grid; grid-template-columns:250px 1fr;
    gap:28px; align-items:start;
  }
  .grid-sidebar{
    position:sticky; top:90px;
    display:flex; flex-direction:column;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    overflow:hidden;
  }
  .sidebar-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line-soft);}
  .sidebar-head-title{font-family:'Inter', sans-serif; font-size:15px; font-weight:700;}
  .sidebar-search{display:flex; align-items:center; gap:8px; margin:12px 16px; padding:9px 14px; background:var(--paper); border:1px solid var(--line); border-radius:100px;}
  .sidebar-search svg{flex-shrink:0; opacity:0.5;}
  .sidebar-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; width:100%; color:var(--ink);}
  .sidebar-close-btn{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    color:var(--ink-soft); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-close-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .filter-group{border-bottom:1px solid var(--line-soft);}
  .filter-group:last-of-type{border-bottom:none;}
  .filter-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; background:none; border:none; text-align:left;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .filter-group-head:hover{background:var(--paper-alt);}
  .filter-group-toggle{font-size:16px; color:var(--ink-soft); font-weight:400; line-height:1;}
  .filter-group-body{display:none; padding:0 16px 14px; max-height:260px; overflow-y:auto;}
  .filter-group.open .filter-group-body{display:block;}
  .filter-search-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 8px;
    padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:100px;
    position:sticky; top:0; z-index:1;
  }
  .filter-search-row svg{flex-shrink:0; opacity:0.5;}
  .filter-search-row input{border:none; background:none; outline:none; font-family:inherit; font-size:12px; width:100%; color:var(--ink);}
  .filter-group.open .filter-group-toggle{transform:rotate(45deg);}
  .filter-opt{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .filter-opt input{flex-shrink:0; accent-color:var(--ink); width:14px; height:14px;}
  .filter-opt:hover{color:var(--ink);}
  .filter-opt-count{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .sidebar-add{padding:16px; border-top:1px solid var(--line-soft);}
  .sidebar-add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--ink); color:var(--paper-card);
    padding:12px; border-radius:100px; font-weight:600; font-size:13.5px;
  }
  .sidebar-add-btn:hover{background:var(--walnut);}
  .sidebar-add-icon{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:rgba(237,240,243,0.2); font-size:14px; line-height:1;
  }

  .result-bar{display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .result-count{font-size:13px; color:var(--ink-soft); flex:1;}
  .sort-select{position:relative;}
  .sort-select select{
    appearance:none; -webkit-appearance:none;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:100px; padding:9px 32px 9px 16px;
    font-size:13px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .sort-select select:hover{border-color:var(--walnut);}
  .sort-arrow{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}
  .active-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .active-chip{display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:var(--paper-card); border-radius:100px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600;}
  .active-chip button{background:none; border:none; color:var(--paper-card); opacity:0.7; display:flex; padding:2px;}
  .active-chip button:hover{opacity:1;}

  /* ---------- CONTENT GRID ---------- */
  .content-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;}
  /* Kart başlığı artık görselin ÜZERİNDE değil ALTINDA (bkz. kullanıcı isteği); puan ve kategori
     görsel üzerinden tamamen kaldırıldı (bkz. aşağıdaki render() — .content-card-cat/.rating-widget
     artık kart şablonunda YOK). .content-card-photo görseli aspect-ratio'lu bir kutuya alır,
     .content-card-info normal akışta onun altına düz arkaplanla oturur. */
  .content-card{
    display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
    background:var(--paper-card); border:1px solid var(--line-soft);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .content-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(27,42,61,0.1); border-color:var(--line);}
  .content-card-photo{position:relative; aspect-ratio:1/1; overflow:hidden;}
  .content-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .catalog-placeholder{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:rgba(255,255,255,0.92);}
  .content-card .catalog-placeholder-favicon{position:static; width:28px; height:28px; border-radius:6px; background:#fff; padding:4px; object-fit:contain;}
  .catalog-placeholder-initials{font-family:'Inter', sans-serif; font-size:28px; font-weight:700; letter-spacing:0.02em;}
  .content-card-info{padding:12px 14px; color:var(--ink);}
  /* Kart altı başlık 2 satıra taşmasın diye tek satıra sıkıştırılıp "…" ile kesilir (bkz. kullanıcı
     isteği) — punto da hafifçe küçültülür (16.5px yerine 15px) ki uzun isimler daha az kesilsin. */
  .content-card-title{font-family:'Inter', sans-serif; font-size:15px; font-weight:700; line-height:1.25; margin-bottom:3px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .content-card-by{font-size:11.5px; color:var(--ink-soft);}

  .verified-badge-icon{display:inline-flex; align-items:center; vertical-align:middle; margin-left:4px; flex-shrink:0;}
  .card-save-btn{
    position:absolute; top:10px; right:10px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:rgba(27,42,61,0.55); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .card-save-btn:hover{background:rgba(27,42,61,0.75);}
  .card-save-btn.saved{background:var(--accent); color:var(--ink);}
  .card-edit-btn{display:inline-block; margin-top:4px; color:var(--ink-soft); font-size:11px; font-weight:600; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; cursor:pointer;}
  .edit-slot:not(:empty) + .admin-action-slot .card-edit-btn{margin-left:10px;}
  .card-edit-btn:hover{color:#F5CFA0;}
  .card-delete-btn{display:inline-block; margin-top:4px; margin-left:10px; color:#F5A3A3; font-size:11px; font-weight:600; text-decoration:underline; background:none; border:none; padding:0; font-family:inherit; cursor:pointer;}
  .card-delete-btn:hover{color:#fff;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; display:none;}

  .pagination{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:28px; flex-wrap:wrap;}
  .page-btn{min-width:38px; height:38px; padding:0 10px; border:1px solid var(--line); background:var(--paper-card); border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink-soft);}
  .page-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .page-btn.active{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .page-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .page-btn-arrow{display:flex; align-items:center; justify-content:center; padding:0;}
  .page-ellipsis{color:var(--ink-soft); padding:0 4px;}

  /* ---------- GRUP İNİŞ SAYFASI (Architonic "Furniture" sayfası tarzı, bkz. kullanıcı isteği) ---------- */
  .group-landing{max-width:1260px; margin:0 auto; padding:20px 32px 90px;}
  .landing-subcats{display:flex; gap:16px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;}
  .subcat-card{
    flex:0 0 168px; display:flex; flex-direction:column; align-items:center; gap:10px;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    padding:18px 14px; text-align:center;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .subcat-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(27,42,61,0.1); border-color:var(--line);}
  .subcat-card-icon{
    width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Inter', sans-serif; font-weight:700; font-size:17px;
  }
  .subcat-card-label{font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .landing-viewall{
    display:inline-flex; align-items:center; gap:6px; margin:4px 0 34px;

<script>
// Faz 3 sonrası: urun.html artık data.js/urunler-data.js/malzemeler-data.js'in ağır dizilerini hiç
// indirmiyor — bu sayfa zaten architects[]/offices[] dizilerini, verifiedBadgeHtml/badges'i ya da
// slugify'ı hiç kullanmıyordu (doğrulandı), yani bu üç dosyanın hiçbirine gerçek bir bağımlılığı
// yoktu. Sayfalama/filtreleme/sıralama artık backend'de (/api/products) canonical D1 `products`
// tablosu üzerinden yapılıyor — `kind` kolonu zaten 'product'/'material' ayrımını tuttuğundan
// (bkz. src/routes/product.js#handleProductListRoute) eski client-side `products.push(...materials)`
// birleştirmesi gerekmiyor.
const PAGE_SIZE = 24;
let currentPage = 1;
let localSearchQuery = '';

const FILTER_GROUPS = [
  { key: 'group', label: 'Grup' },
  { key: 'category', label: 'Kategori' },
  { key: 'brand', label: 'Firma' },
  { key: 'rating', label: 'Puan' },
];
const activeFilters = {};
FILTER_GROUPS.forEach(g => activeFilters[g.key] = new Set());

function getPageWindowSize(){
  const w = window.innerWidth;
  if(w <= 480) return 3;
  if(w <= 720) return 5;
  return 9;
}
// Mevcut sayfayı her zaman ortalayan kayan pencere; ilk ve son sayfa (bkz. kullanıcı isteği:
// "1. ve son sayfa her zaman görünür olsun") ayrıca her zaman ayrı buton olarak eklenir, pencereye
// dahil değillerse aralarına '...' konur. Pencere bir uca yaklaştığında diğer ucu genişletip N
// sayfa göstermeye devam eder (bkz. start===2/end===totalPages-1 dallari).
function getPageList(totalPages, currentPage){
  const N = getPageWindowSize();
  if(totalPages <= N + 2){ const pages=[]; for(let p=1;p<=totalPages;p++) pages.push(p); return pages; }
  const half = Math.floor(N / 2);
  let start = Math.max(2, currentPage - half);
  let end = Math.min(totalPages - 1, currentPage + half);
  if(start === 2) end = Math.min(totalPages - 1, start + N - 1);
  if(end === totalPages - 1) start = Math.max(2, end - N + 1);
  const pages = [1];
  if(start > 2) pages.push('...');
  for(let p=start; p<=end; p++) pages.push(p);
  if(end < totalPages - 1) pages.push('...');
  pages.push(totalPages);
  return pages;
}
function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML=''; return; }
  let html = `<button class="page-btn page-btn-arrow" id="page-prev" aria-label="Önceki" ${currentPage===1?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>`;
  getPageList(totalPages, currentPage).forEach(p=>{
    if(p==='...') html += `<span class="page-ellipsis">…</span>`;
    else html += `<button class="page-btn${p===currentPage?' active':''}" data-page="${p}">${p}</button>`;
  });
  html += `<button class="page-btn page-btn-arrow" id="page-next" aria-label="Sonraki" ${currentPage===totalPages?'disabled':''}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>`;
  el.innerHTML = html;
  el.querySelectorAll('[data-page]').forEach(btn=>{
    btn.addEventListener('click', ()=> goToPage(parseInt(btn.dataset.page)));
  });
  const prevBtn=document.getElementById('page-prev'), nextBtn=document.getElementById('page-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(currentPage>1) goToPage(currentPage-1); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(currentPage<totalPages) goToPage(currentPage+1); });
}

// Aktif filtre/arama/sıralama durumundan ?query string üretir (page/limit HARİÇ — bkz. çağıranlar)
// — hem /api/products isteği hem de tarayıcı URL senkronu için TEK noktadan kullanılır.
function currentQueryParams(){
  const params = new URLSearchParams();
  FILTER_GROUPS.forEach(g => { activeFilters[g.key].forEach(v => params.append(g.key, v)); });
  if(localSearchQuery.trim()) params.set('search', localSearchQuery.trim());
  const sort = document.getElementById('g-sort').value;
  if(sort) params.set('sort', sort);
  return params;
}

// Sidebar artık /api/products'ın döndürdüğü `filters` alanından çizilir (proje.html#buildSidebar
// ile AYNI desen) — kendi küçük isteğini atar (limit=1, yalnızca facet sayaçları için, kart
// listesini render()'ın kendi isteğiyle tekrar çekmemek amacıyla page verisi burada önemsiz).
async function buildSidebar(){
  const sidebar = document.getElementById('sidebar');
  let filtersData = {};
  try{
    const params = currentQueryParams();
    params.set('page', '1');
    params.set('limit', '1');
    const res = await fetch(`/api/products?${params.toString()}`);
    if(res.ok){ const data = await res.json(); filtersData = data.filters || {}; }
  }catch(err){ console.error('Filtre seçenekleri alınamadı:', err); }

  let html = `<div class="sidebar-head"><span class="sidebar-head-title">Filtreler</span><button class="sidebar-close-btn" id="g-reset" title="Filtreleri temizle" aria-label="Filtreleri temizle">✕</button></div>
    <div class="sidebar-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="g-local-search" placeholder="Ürün ara..." value="${escapeAttr(localSearchQuery)}">
    </div>`;
  FILTER_GROUPS.forEach(g => {
    const options = filtersData[g.key] || [];
    if(options.length === 0) return;
    html += `<div class="filter-group" data-key="${g.key}">
      <button class="filter-group-head" data-toggle="${g.key}">${g.label} <span class="filter-group-toggle">+</span></button>
      <div class="filter-group-body" id="fg-${g.key}">
        <div class="filter-search-row"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" class="filter-search-input" placeholder="Ara..." autocomplete="off"></div>
        ${options.map(({value, count}) => `
          <label class="filter-opt">
            <input type="checkbox" data-key="${g.key}" value="${escapeAttr(value)}" ${activeFilters[g.key].has(value)?'checked':''}>
            <span>${escapeHtml(value)}</span>
            <span class="filter-opt-count">(${count})</span>
          </label>`).join('')}
      </div>
    </div>`;
  });
  html += `<div class="sidebar-add"><a class="sidebar-add-btn" href="urun-ekle.html"><span class="sidebar-add-icon">+</span> Ürün Ekle</a></div>`;
  sidebar.innerHTML = html;

  FILTER_GROUPS.forEach(g => {
    if(activeFilters[g.key].size === 0) return;
    const grp = sidebar.querySelector(`.filter-group[data-key="${g.key}"]`);
    if(grp) grp.classList.add('open');
  });

  sidebar.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=> btn.parentElement.classList.toggle('open'));
  });
  const resetBtn = document.getElementById('g-reset');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    FILTER_GROUPS.forEach(g => activeFilters[g.key].clear());
    localSearchQuery = '';
    currentPage = 1;
    syncBrowserUrl(true);
    updateHeader('listing');
    buildSidebar(); render();
  });
  sidebar.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = cb.dataset.key, val = cb.value;
      if(cb.checked) activeFilters[key].add(val); else activeFilters[key].delete(val);
      currentPage = 1;
      syncBrowserUrl(true);
      updateHeader('listing');
      buildSidebar(); render();
      const grp = sidebar.querySelector(`.filter-group[data-key="${key}"]`);
      if(grp) grp.classList.add('open');
    });
  });
  const localSearchInput = document.getElementById('g-local-search');
  let searchDebounce = null;
  if(localSearchInput) localSearchInput.addEventListener('input', ()=>{
    localSearchQuery = localSearchInput.value;
    currentPage = 1;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{ syncBrowserUrl(false); render(); }, 300);
  });
  sidebar.querySelectorAll('.filter-search-input').forEach(input => {
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('input', () => {
      const body = input.closest('.filter-group-body');
      const q = input.value.trim().toLowerCase();
      body.querySelectorAll('.filter-opt').forEach(opt => {
        const label = opt.querySelector('span').textContent.toLowerCase();
        opt.style.display = !q || label.includes(q) ? '' : 'none';
      });
    });
  });
}

function syncBrowserUrl(push){
  const params = currentQueryParams();
  if(currentPage > 1) params.set('page', String(currentPage));
  const qs = params.toString();
  const newUrl = location.pathname + (qs ? '?' + qs : '');
  if(newUrl === location.pathname + location.search) return;
  if(push) history.pushState({}, '', newUrl); else history.replaceState({}, '', newUrl);
}
function applyStateFromUrl(){
  const params = new URLSearchParams(location.search);
  FILTER_GROUPS.forEach(g => { activeFilters[g.key].clear(); params.getAll(g.key).forEach(v => activeFilters[g.key].add(v)); });
  localSearchQuery = params.get('search') || '';
  document.getElementById('g-sort').value = params.get('sort') || '';
  const pageParam = parseInt(params.get('page'), 10);
  currentPage = (pageParam > 1) ? pageParam : 1;
}
function goToPage(p){
  currentPage = p;
  syncBrowserUrl(true);
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderActiveChips(){
  const wrap = document.getElementById('active-chips');
  let chips = [];
  FILTER_GROUPS.forEach(g => activeFilters[g.key].forEach(v => chips.push({key:g.key, val:v})));
  if(chips.length === 0){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = chips.map(c => `
    <span class="active-chip" data-key="${c.key}" data-val="${escapeAttr(c.val)}">
      ${escapeHtml(c.val)}
      <button aria-label="Kaldır"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </span>`).join('');
  wrap.querySelectorAll('.active-chip button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chip = btn.parentElement;
      activeFilters[chip.dataset.key].delete(chip.dataset.val);
      currentPage = 1;
      syncBrowserUrl(true);
      updateHeader('listing');
      buildSidebar(); render();
    });
  });
}

// ratingKindFor/submissionType: backend `kind` alanı 'product'|'material' (tekil, canonical şema) —
// save-widget.js#EDIT_PAGE_BY_SUBMISSION_TYPE ve applyEditButtons ise 'products'|'materials' (çoğul,
// eski submission tablosu adları) bekliyor; kart render'ı ikisini de bu tek noktadan üretir.
function ratingKindFor(p){ return p.kind === 'material' ? 'material' : 'product'; }
function submissionTypeFor(p){ return p.kind === 'material' ? 'materials' : 'products'; }

// render() artık yalnızca mevcut sayfanın kartlarını /api/products'ten çeker (bkz. kullanıcı
// isteği: her sayfa geçişinde sadece o sayfadaki veriyi çek) — tüm ürün/malzeme listesi hiçbir
// zaman tarayıcıya inmiyor.
let renderRequestId = 0;
async function render(){
  const myRequest = ++renderRequestId;
  const grid = document.getElementById('card-grid');
  const empty = document.getElementById('empty-state');
  grid.style.opacity = '0.5';

  const params = currentQueryParams();
  params.set('page', String(currentPage));
  params.set('limit', String(PAGE_SIZE));

  let data = null;
  try{
    const res = await fetch(`/api/products?${params.toString()}`);
    if(res.ok) data = await res.json();
  }catch(err){ console.error('Ürün listesi alınamadı:', err); }
  if(myRequest !== renderRequestId) return;
  grid.style.opacity = '1';

  if(!data){
    grid.innerHTML = '';
    empty.textContent = 'Ürünler yüklenemedi, lütfen sayfayı yenile.';
    empty.style.display = 'block';
    document.getElementById('pagination').innerHTML = '';
    document.getElementById('result-count').textContent = '';
    return;
  }

  currentPage = data.page;
  document.getElementById('result-count').textContent = `${data.total} ürün listeleniyor`;
  renderActiveChips();
  renderPagination(data.totalPages);

  if(data.items.length === 0){ grid.innerHTML = ''; empty.textContent = 'Bu kritere uyan ürün bulunamadı.'; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  const pageItems = data.items;
  grid.innerHTML = pageItems.map(p => `
    <div class="content-card">
      <div class="content-card-photo">
        ${catalogCardMediaHtml(p, escapeHtml, escapeAttr)}
        <button class="card-save-btn" type="button" data-type="${ratingKindFor(p)}" data-key="${escapeAttr(p.ratingKey)}" data-title="${escapeAttr(p.title)}" data-meta="${escapeAttr([p.category, p.brand].filter(Boolean).join(' · '))}" data-image="${escapeAttr(p.image||'')}" data-href="urun.html" aria-label="Kaydet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
        </button>
      </div>
      <div class="content-card-info">
        <div class="content-card-title">${escapeHtml(p.title)}</div>
        ${p.brand ? `<div class="content-card-by">${escapeHtml(p.brand)}</div>` : ''}
        <span class="edit-slot" data-type="${submissionTypeFor(p)}" data-id="${escapeAttr(p.submissionId || '')}"></span>
        ${p.kind !== 'material' ? `<span class="admin-action-slot" data-id="${escapeAttr(p.submissionId || '')}" data-key="${escapeAttr(`${p.brand || ''}|||${p.title}`)}"></span>` : ''}
      </div>
    </div>`).join('');
  wireSaveButtons('product');
  mountAllRatingWidgets();
  applyEditButtons('products');
  applyEditButtons('materials');
  applyAdminActions();
  grid.querySelectorAll('.content-card').forEach((card, i)=>{
    card.style.cursor = 'pointer';
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.card-save-btn') || e.target.closest('.edit-slot') || e.target.closest('.admin-action-slot') || e.target.closest('a')) return;
      if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      // Ürün modalı (bkz. js/components/product-modal.js) proje.html#card-grid'in AYNI deseniyle
      // sayfa yenilenmeden açılsın diye tam sayfa yönlendirme yerine modal açılır.
      ProductModal.open(pageItems[i].ratingKey, { triggerEl: card });
    });
  });
}

// Admin, ürün kartlarında "Gönderiyi Düzenle"nin yanına Arşivle/Sil butonları görür (bkz. kullanıcı
// isteği: "ürüne silme ve arşivleme yetkisi ver ... düzenle butonunun yanında") — üye gönderisi
// ürünlerde (submissionId dolu) id ile, statik ürünlerde "marka|||başlık" anahtarıyla işlem yapılır
// (bkz. src/routes/legacyContent.js#handleContentAction). Yalnızca gerçek ürünler için (malzemeler
// için değil, bkz. render() içindeki p.kind !== 'material' koşulu).
async function applyAdminActions(){
  await savedWidgetReady;
  if(!currentUser || currentUser.role !== 'admin') return;
  document.querySelectorAll('.admin-action-slot').forEach(slot=>{
    slot.innerHTML = `
      <button type="button" class="card-edit-btn admin-archive-btn">Arşivle</button>
      <button type="button" class="card-delete-btn admin-delete-btn">Sil</button>`;
    slot.querySelector('.admin-archive-btn').addEventListener('click', (e)=>{ e.stopPropagation(); runContentModeration(slot, 'archive'); });
    slot.querySelector('.admin-delete-btn').addEventListener('click', (e)=>{ e.stopPropagation(); runContentModeration(slot, 'delete'); });
  });
}

async function runContentModeration(slot, action){
  const confirmText = action === 'delete'
    ? 'Bu ürünü silmek istediğine emin misin? Ürün anında canlı siteden kaldırılır.'
    : 'Bu ürünü arşivlemek istediğine emin misin? Ürün canlıdan kaldırılıp admin panelindeki Arşiv sekmesine taşınır.';
  if(!confirm(confirmText)) return;
  const id = slot.dataset.id;
  const key = slot.dataset.key;
  slot.querySelectorAll('button').forEach(b => b.disabled = true);
  try{
    const res = await fetch('/api/admin/legacy/content-action', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(id ? { type: 'products', action, id } : { type: 'products', action, key }),
    });
    if(!res.ok){
      alert('Bir şeyler ters gitti, tekrar dene.');
      slot.querySelectorAll('button').forEach(b => b.disabled = false);
      return;
    }
    window.location.reload();
  }catch{
    alert('Bir şeyler ters gitti, tekrar dene.');
    slot.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// ---------- MEGA MENÜ (Architonic tarzı açılır menü, bkz. kullanıcı isteği) ----------
// Nav'daki "Ürün" linkine tıklayınca açılır; kalın grup başlıkları (CATALOG_MENU_COLUMNS'taki
// sütun dizilimi) ve altlarında kategori linkleri gösterir. Grup başlığı -> grup iniş sayfası
// (renderLanding), kategori linki -> doğrudan filtrelenmiş liste (mevcut sidebar+grid).
function groupHref(group){ return `urun.html?group=${encodeURIComponent(group)}`; }
function categoryHref(group, category){ return `urun.html?group=${encodeURIComponent(group)}&category=${encodeURIComponent(category)}`; }

let megaMenuBuilt = false;
function buildMegaMenu(){
  if(megaMenuBuilt) return;
  const panel = document.getElementById('urun-mega-menu');
  if(typeof CATALOG_MENU_COLUMNS === 'undefined' || typeof CATALOG_TAXONOMY === 'undefined') return;
  megaMenuBuilt = true;
  const html = CATALOG_MENU_COLUMNS.map(colGroups => `
    <div class="mega-col">
      ${colGroups.map(group => {
        const cats = CATALOG_TAXONOMY[group] || [];
        return `<div class="mega-group">
          <a class="mega-group-title" href="${escapeAttr(groupHref(group))}">${escapeHtml(group)}</a>
          ${cats.map(cat => `<a class="mega-cat-link" href="${escapeAttr(categoryHref(group, cat))}">${escapeHtml(cat)}</a>`).join('')}
        </div>`;
      }).join('')}
    </div>`).join('');
  panel.innerHTML = `<div class="mega-menu-cols">${html}</div>
    <div class="mega-menu-footer"><a class="mega-viewall" href="urun.html">Tümünü Gör →</a></div>`;
  wireInternalLinks(panel);
}
let mobileMenuBuilt = false;
function buildMobileProductMenu(){
  if(mobileMenuBuilt) return;
  const panel = document.getElementById('urun-mobile-panel');
  if(!panel || typeof CATALOG_MENU_COLUMNS === 'undefined' || typeof CATALOG_TAXONOMY === 'undefined') return;
  mobileMenuBuilt = true;
  const groups = CATALOG_MENU_COLUMNS.flat();
  const html = groups.map((group, i) => {
    const cats = CATALOG_TAXONOMY[group] || [];
    const gid = `urun-mobile-sub-${i}`;
    return `<div class="nav-mobile-subgroup">
      <button type="button" class="nav-mobile-subtrigger" data-target="${gid}" aria-expanded="false" aria-controls="${gid}">
        ${escapeHtml(group)}
        <svg width="9" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <div class="nav-mobile-subpanel" id="${gid}">
        <a class="nav-mobile-subcat" href="${escapeAttr(groupHref(group))}">Tümü — ${escapeHtml(group)}</a>
        ${cats.map(cat => `<a class="nav-mobile-subcat" href="${escapeAttr(categoryHref(group, cat))}">${escapeHtml(cat)}</a>`).join('')}
      </div>
    </div>`;
  }).join('');
  panel.innerHTML = html + `<a class="nav-mobile-viewall" href="urun.html">Tümünü Gör</a>`;
  wireInternalLinks(panel);
  panel.querySelectorAll('.nav-mobile-subtrigger').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sub = document.getElementById(btn.dataset.target);
      const willOpen = !sub.classList.contains('open');
      panel.querySelectorAll('.nav-mobile-subpanel.open').forEach(p=>{ if(p!==sub) p.classList.remove('open'); });
      panel.querySelectorAll('.nav-mobile-subtrigger[aria-expanded="true"]').forEach(b=>{ if(b!==btn) b.setAttribute('aria-expanded','false'); });
      sub.classList.toggle('open', willOpen);
      btn.setAttribute('aria-expanded', String(willOpen));
    });
  });
}
function closeMegaMenu(){
  document.getElementById('urun-mega-menu').classList.remove('open');
  document.getElementById('urun-menu-trigger').setAttribute('aria-expanded', 'false');
  const mobileMenu = document.getElementById('nav-mobile-menu');
  const mobilePanel = document.getElementById('urun-mobile-panel');
  const mobileTrigger = document.getElementById('urun-mobile-trigger');
  if(mobileMenu) mobileMenu.classList.remove('open');
  if(mobilePanel) mobilePanel.classList.remove('open');
  if(mobileTrigger) mobileTrigger.setAttribute('aria-expanded', 'false');
}
function toggleMegaMenu(){
  buildMegaMenu();
  const panel = document.getElementById('urun-mega-menu');
  const willOpen = !panel.classList.contains('open');
  panel.classList.toggle('open', willOpen);
  document.getElementById('urun-menu-trigger').setAttribute('aria-expanded', String(willOpen));
}
document.getElementById('urun-menu-trigger').addEventListener('click', (e)=>{ e.stopPropagation(); toggleMegaMenu(); });
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('urun-menu-wrap');
  const panel = document.getElementById('urun-mega-menu');
  const mobileMenu = document.getElementById('nav-mobile-menu');
  const hamburger = document.getElementById('nav-hamburger');
  if(mobileMenu && mobileMenu.contains(e.target)) return;
  // Gerçek bulgu: hamburger düğmesi wrap/panel'in (masaüstü mega menü) DIŞINDA olduğundan, bu kontrol
  // olmadan hamburger'a her tıklayışta closeMegaMenu() de tetiklenip nav-mobile-menu'yü AÇILDIĞI ANDA
  // geri kapatıyordu (bkz. kullanıcı isteği: "Ürünler sayfasında hamburger menü açılmıyor") — hamburger
  // kendi açma/kapama mantığını (aşağıdaki navHamburger listener'ı) zaten kendi başına yönetiyor.
  if(hamburger && hamburger.contains(e.target)) return;
  if(wrap && panel && !wrap.contains(e.target) && !panel.contains(e.target)) closeMegaMenu();
});
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeMegaMenu(); });

// urun.html?... linklerine (mega menü, grup iniş kartları, breadcrumb) tam sayfa yenileme yerine
// pushState + refreshView ile tepki verir — filtre değişikliklerinin zaten kullandığı AYNI SPA deseni.
function wireInternalLinks(container){
  container.querySelectorAll('a[href^="urun.html"]').forEach(a=>{
    if(a.dataset.internalWired) return;
    a.dataset.internalWired = '1';
    a.addEventListener('click', (e)=>{
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      closeMegaMenu();
      const url = new URL(a.getAttribute('href'), location.href);
      history.pushState({}, '', url.pathname + url.search);
      applyStateFromUrl();
      refreshView();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
}

// ---------- Grup iniş sayfası (Architonic "Furniture" sayfası tarzı, bkz. kullanıcı isteği) ----------
// ?group=X seçiliyken (category/diğer filtreler yokken) mevcut sidebar+grid listesi yerine bu
// görünüm çizilir: o grubun kategori kartları + en yüksek puanlı ürünlerinden bir seçki.
function currentViewMode(){
  const forceList = new URLSearchParams(location.search).get('view') === 'list';
  const hasOtherFilters = activeFilters.brand.size > 0 || activeFilters.rating.size > 0 || !!localSearchQuery.trim();
  if(activeFilters.group.size === 1 && activeFilters.category.size === 0 && !hasOtherFilters && !forceList) return 'landing';
  return 'listing';
}

function updateHeader(mode){
  const title = document.getElementById('page-title');
  const desc = document.getElementById('page-desc');
  const crumb = document.getElementById('breadcrumb-bar');
  const group = activeFilters.group.size === 1 ? [...activeFilters.group][0] : null;
  const category = activeFilters.category.size === 1 ? [...activeFilters.category][0] : null;

  if(mode === 'landing' && group){
    title.textContent = group;
    desc.textContent = `${group} kategorisindeki alt kategorileri ve öne çıkan ürünleri keşfet.`;
    crumb.innerHTML = `<a href="index.html">Ana Sayfa</a><span class="sep">›</span><a href="urun.html">Ürünler</a><span class="sep">›</span><span class="current">${escapeHtml(group)}</span>`;
  } else if(category){
    title.textContent = category;
    desc.textContent = `${category} kategorisindeki ürünleri filtrele ve keşfet.`;
    const groupOfCat = (typeof taxonomyGroupOf === 'function') ? taxonomyGroupOf(CATALOG_TAXONOMY, category) : null;
    crumb.innerHTML = `<a href="index.html">Ana Sayfa</a><span class="sep">›</span><a href="urun.html">Ürünler</a><span class="sep">›</span>` +
      (groupOfCat ? `<a href="${escapeAttr(groupHref(groupOfCat))}">${escapeHtml(groupOfCat)}</a><span class="sep">›</span>` : '') +
      `<span class="current">${escapeHtml(category)}</span>`;
  } else if(group){
    // "Tüm Ürünleri Gör" (?group=X&view=list) — kategori seçilmemiş ama grup filtresi hâlâ aktif.
    title.textContent = group;
    desc.textContent = `${group} kategorisindeki tüm ürünleri filtrele ve keşfet.`;
    crumb.innerHTML = `<a href="index.html">Ana Sayfa</a><span class="sep">›</span><a href="urun.html">Ürünler</a><span class="sep">›</span><span class="current">${escapeHtml(group)}</span>`;
  } else {
    title.textContent = 'Ürünler';
    desc.textContent = 'Projelerinde kullanabileceğin mobilya, aydınlatma, aksesuar, yapı malzemeleri ve firmaları keşfet.';
    crumb.innerHTML = `<a href="index.html">Ana Sayfa</a><span class="sep">›</span><span class="current">Ürünler</span>`;
  }
  wireInternalLinks(crumb);
}

const LANDING_ICON_PALETTE = ['#2B425F', '#3E5A78', '#5B7A9B', '#4F6478', '#7C4B4B', '#8A6D3B'];
function landingIconColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return LANDING_ICON_PALETTE[Math.abs(hash) % LANDING_ICON_PALETTE.length];
}
function landingInitials(name){
  return (name || '?').replace(/[&]/g, ' ').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
}

async function renderLanding(){
  const group = activeFilters.group.size === 1 ? [...activeFilters.group][0] : null;
  const landingEl = document.getElementById('group-landing');
  const subEl = document.getElementById('landing-subcats');
  const viewAllBtn = document.getElementById('landing-viewall');
  const topGrid = document.getElementById('landing-top-grid');
  if(!group){ subEl.innerHTML = ''; topGrid.innerHTML = ''; return; }

  viewAllBtn.setAttribute('href', `urun.html?group=${encodeURIComponent(group)}&view=list`);
  topGrid.innerHTML = '';

  let data = null;
  try{
    const params = new URLSearchParams();
    params.set('group', group);
    params.set('sort', 'rating_desc');
    params.set('limit', '8');
    const res = await fetch(`/api/products?${params.toString()}`);
    if(res.ok) data = await res.json();
  }catch(err){ console.error('Öne çıkan ürünler alınamadı:', err); }

  // CATALOG_TAXONOMY'ye burada, await fetch SONRASI dokunuyoruz — render()'daki catalogCardMediaHtml
  // kullanımıyla AYNI güvenlik deseni (bkz. dosya başındaki "Faz 3 sonrası" yorumu): deferred
  // catalog-taxonomy.js script'i bir network round-trip'ten çok daha hızlı yüklenip çalışır.
  const cats = (typeof CATALOG_TAXONOMY !== 'undefined') ? (CATALOG_TAXONOMY[group] || []) : [];
  subEl.innerHTML = cats.map(cat => `
    <a class="subcat-card" href="${escapeAttr(categoryHref(group, cat))}">
      <div class="subcat-card-icon" style="background:${landingIconColor(cat)}">${escapeHtml(landingInitials(cat))}</div>
      <div class="subcat-card-label">${escapeHtml(cat)}</div>
    </a>`).join('');
  wireInternalLinks(landingEl);

  if(!data || !data.items || data.items.length === 0){
    topGrid.innerHTML = '<div class="empty-state" style="display:block">Bu kategoride henüz ürün yok.</div>';
    return;
  }
  const items = data.items;
  topGrid.innerHTML = items.map(p => `
    <div class="content-card">
      <div class="content-card-photo">${catalogCardMediaHtml(p, escapeHtml, escapeAttr)}</div>
      <div class="content-card-info">
        <div class="content-card-title">${escapeHtml(p.title)}</div>
        ${p.brand ? `<div class="content-card-by">${escapeHtml(p.brand)}</div>` : ''}
      </div>
    </div>`).join('');
  topGrid.querySelectorAll('.content-card').forEach((card, i)=>{
    card.style.cursor = 'pointer';
    card.addEventListener('click', ()=>{ ProductModal.open(items[i].ratingKey, { triggerEl: card }); });
  });
}

// Mevcut sidebar+grid görünümü ile yeni grup iniş görünümü arasında geçiş yapan tek nokta —
// hem ilk yüklemede hem de popstate'te (geri/ileri) kullanılır.
function refreshView(){
  const mode = currentViewMode();
  updateHeader(mode);
  const gridLayout = document.querySelector('.grid-layout');
  const landing = document.getElementById('group-landing');
  if(mode === 'landing'){
    gridLayout.style.display = 'none';
    landing.style.display = '';
    renderLanding();
  } else {
    landing.style.display = 'none';
    gridLayout.style.display = '';
    buildSidebar();
    render();
  }
}

document.getElementById('g-sort').addEventListener('change', ()=>{ currentPage = 1; syncBrowserUrl(true); render(); });
// Tarayıcı geri/ileri tuşu: /urun/:slug yoluna gidiliyorsa/dönülüyorsa yalnızca ürün modalını
// güncelle (bkz. proje.html'deki AYNI desen) — liste burada YENİDEN ÇİZİLMEZ.
window.addEventListener('popstate', ()=>{
  const m = location.pathname.match(/^\/urun\/([^/]+)\/?$/);
  if(m){ ProductModal.handlePopState(decodeURIComponent(m[1])); return; }
  if(ProductModal.isOpen()){ ProductModal.handlePopState(null); return; }
  applyStateFromUrl();
  refreshView();
});

// İlk otomatik çizim DOMContentLoaded'a kadar ertelenir — catalog-taxonomy.js gibi deferred
// script'ler DOMContentLoaded'dan ÖNCE (parse sırasıyla) çalışmayı GARANTİ eder, ama bu inline
// script (defer OLMADAN, parse anında senkron çalışır) deferred script'lerden ÖNCE çalışabilir.
// gerçek bulgu: canlıda render()'ın ilk otomatik çağrısı bazen catalog-taxonomy.js henüz
// tanımlanmadan (`catalogCardMediaHtml is not defined`) çalışıyor, ürün grid'i sessizce boş
// kalıyordu — "network isteği deferred script'ten her zaman yavaştır" varsayımı (bkz. render()
// içindeki catalogCardMediaHtml kullanımının konumu) canlıda YANLIŞ çıktı, /api/products bazen
// deferred script'in yüklenmesinden daha hızlı dönüyor. Sonraki tüm render()/renderLanding()
// çağrıları (filtre/sıralama/mega menü tıklaması) kullanıcı etkileşimiyle tetiklendiğinden zaten
// DOMContentLoaded sonrası gerçekleşiyor, bu yüzden yalnızca İLK otomatik çağrı sarmalanır.
document.addEventListener('DOMContentLoaded', ()=>{
  applyStateFromUrl();
  if(currentViewMode() === 'landing'){
    updateHeader('landing');
    document.querySelector('.grid-layout').style.display = 'none';
    document.getElementById('group-landing').style.display = '';
    renderLanding();
  } else {
    updateHeader('listing');
    buildSidebar();
    render().then(()=>{
      // Doğrudan /urun/:slug adresine girildiğinde ya da o adreste F5 yapıldığında ürün modalı
      // otomatik açılsın (bkz. proje.html'deki AYNI desen).
      const m = location.pathname.match(/^\/urun\/([^/]+)\/?$/);
      if(m) ProductModal.open(decodeURIComponent(m[1]), { pushHistory:false });
    });
  }
});


const urunMobileTrigger = document.getElementById('urun-mobile-trigger');
const urunMobilePanel = document.getElementById('urun-mobile-panel');
if(urunMobileTrigger && urunMobilePanel){
  urunMobileTrigger.addEventListener('click', ()=>{
    buildMobileProductMenu();
    const willOpen = !urunMobilePanel.classList.contains('open');
    urunMobilePanel.classList.toggle('open', willOpen);
    urunMobileTrigger.setAttribute('aria-expanded', String(willOpen));
  });
}
</script>
