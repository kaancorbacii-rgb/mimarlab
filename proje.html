<!-- (a) DETAY yolu: pm-boot-loading "boot veil"i — mevcut davranış, değişmedi. Burada modül
     preload'ı YOK: proje popup'ının bağımlılık zinciri bu sayfada zaten <script defer> ile
     yükleniyor (lazy-modals.js#loadModule sayfa etiketini görüp ikinci kez enjekte etmez, bkz.
     oradaki waitForPageScript notu).
     (?!sayfa-N) ŞART (gerçek bulgu, 2026-09-11: "popup'tan çıkınca sayfa birkaç saniye blurlu
     kalıyor"): /proje/sayfa-2 bir LİSTE adresidir; veil'i kaldıran DOMContentLoaded handler'ı onu
     dışladığından veil 10 sn'lik emniyet süresine kadar takılı kalıyordu. AYNI dışlama kisi/firma/
     marka/urun.html'in bu satırında da var.
     (b) LİSTE yolu (/proje): proje listesi isteğini HTML ayrıştırmasının en başında başlatır —
     eskiden js/pages/proje.js (defer) çalışıp DOMContentLoaded tetiklenene kadar beklerdi
     (performans denetimi, 2026-09-06 madde 3). Yalnızca sorgu dizesi YOKKEN çalışır; o durumda
     render()'ın üreteceği URL kesindir (currentQueryParams her zaman buildStatus=built ile
     başlar, sıralama <select>'inin varsayılanı boş, görünüm Liste). URL birebir eşleşmezse
     listFetch() normal fetch'e düşer — kazanç kaybolur, ikinci istek DOĞMAZ. -->
<!-- mlPre (performans turu, 2026-09-08): Worker, sorgu dizesiz girişte bu shim'in ÜRETECEĞİ URL'lerin
     yanıtını <head>'in EN BAŞINA #ml-list-data olarak gömer (bkz. src/index.js#HUB_SSR). Gömülü
     yanıt varsa (ve 60sn'den yeniyse) ağa hiç çıkılmadan aynı __mlPrefetch sözlüğüne hazır bir
     Response yazılır; yoksa eskisi gibi erken fetch. listFetch() iki durumu ayırt etmez.
     Yaş alt sınırı −5dk: istemci saati sunucudan geride olabilir (canlıda görüldü: −61ms, veri
     bu yüzden reddedilip boşuna fetch'e düşüyordu) — negatif yaş "gelecekten" değil saat sapmasıdır. -->
<script>(function(){function mlPre(u){try{var el=document.getElementById('ml-list-data');if(el){var d=JSON.parse(el.textContent);var age=Date.now()-(d.t||0);if(d.v===1&&age>-300000&&age<60000&&d.entries&&d.entries[u]){return Promise.resolve(new Response(JSON.stringify(d.entries[u]),{status:200,headers:{'Content-Type':'application/json; charset=utf-8'}}));}}}catch(e){}var f=fetch(u,{cache:'no-store'});f.catch(function(){});return f;}try{var p=location.pathname;
var dm=p.match(/^\/proje\/(?!sayfa-\d+\/?$)([^/]+)\/?$/);if(dm){try{var ds=decodeURIComponent(dm[1]);var du='/api/project/'+encodeURIComponent(ds);(window.__mlPrefetch=window.__mlPrefetch||{})[du]=mlPre(du);}catch(e2){}}
if(/^\/proje\/(?!sayfa-\d+\/?$)[^/]+\/?$/.test(p)){document.documentElement.classList.add('pm-boot-loading');setTimeout(function(){document.documentElement.classList.remove('pm-boot-loading');},10000);return;}
if(p.replace(/\/+$/,'')==='/proje'&&!location.search){var u='/api/projects?buildStatus=built&page=1&limit=24';(window.__mlPrefetch=window.__mlPrefetch||{})[u]=mlPre(u);var u2='/api/projects/filters?buildStatus=built';window.__mlPrefetch[u2]=mlPre(u2);}
}catch(e){}})();</script>

<base href="/">

<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);

    /* Design Token katmanı (bkz. kullanıcı isteği: UI/UX revizyonu) — yalnızca bu pass'te dokunulan
       bileşenlerde (Yorum/Bildir butonu) kullanılır; mevcut --ink/--walnut/--brass paletinin ÜZERİNE
       kurulur, yeni bir RENK yok, sadece semantik isimlendirme. Sayfa başına :root kopyalama deseni
       zaten mevcut mimari olduğundan, ileride dokunulacak diğer sayfalar bu bloğu aynen kopyalayabilir. */
    --color-primary-900: var(--ink);
    --color-primary-700: var(--walnut);
    --color-primary-500: var(--brass);
    --color-primary-100: var(--brass-soft);
    --color-accent: var(--accent);
    --color-accent-hover: #C97530;

    --color-text-primary: var(--ink);
    --color-text-secondary: var(--ink-soft);
    --color-surface: var(--paper-card);
    --color-surface-hover: var(--paper-alt);
    --color-border: var(--line);
    --color-primary: var(--color-primary-900);
    --color-primary-hover: var(--color-primary-700);
    --color-primary-active: var(--color-primary-700);

    --font-h1: 28px;
    --font-h2: 22px;
    --font-h3: 18px;
    --font-body-1: 14px;
    --font-body-2: 12px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 999px;
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  /* Ürün açılır menü düğmesi (bkz. js/components/nav-product-menu.js) — bu reset burada, sayfanın
     KENDİ <style>'ında olmalı, yalnızca JS'in enjekte ettiği stilde değil: nav-product-menu.js
     defer'lı olduğundan ilk boyamadan SONRA çalışır, o ana kadar <button> tarayıcı varsayılan
     çerçeve/arkaplanıyla görünüp kaybolan bir gri dikdörtgen gibi çakıyordu (bkz. kullanıcı isteği). */
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;
    /* bkz. index.html'deki AYNI gerçek bulgu/gerekçe — kullanıcı isteği: mobil hamburger menüde
       Ürün akordeonu açılınca panelin altına kaydırılamaması sorununun kökten çözümü. */
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:1260px; margin:0 auto; padding:28px 32px 0;}
  .page-head h1{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:28px; font-weight:700; margin:0 0 4px;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- SSR ENTITY BODY (bkz. src/index.js#injectMeta, src/lib/seo.js#bodyHtml) ---------- */
  /* /proje/:slug altında serveDetailPage tarafından doldurulur; listeleme sayfasında (/proje) boş
     kalır, :empty kuralı sayfaya gereksiz bir boşluk eklenmesini önler. */
  .ssr-entity:empty{display:none;}
  .ssr-entity{max-width:1260px; margin:0 auto; padding:0 32px 20px; display:flex; gap:20px; align-items:flex-start;}
  .ssr-entity img{width:160px; height:160px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .ssr-entity-text{flex:1; min-width:0;}
  .ssr-entity-text p{color:var(--ink-soft); font-size:14px; line-height:1.6; max-width:70ch; margin:0 0 10px;}
  .ssr-facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:0;}
  .ssr-facts dt{color:var(--ink-soft); font-weight:600;}
  .ssr-facts dd{margin:0;}
  .ssr-facts a{color:inherit;}
  @media (max-width:720px){
    .ssr-entity{flex-direction:column; padding:0 16px 16px;}
    .ssr-entity img{width:100%; max-width:280px; height:auto;}
  }

  /* gerçek bulgu (kullanıcı isteği, 2026-08-24): /proje/:slug'a DOĞRUDAN girildiğinde (paylaşılan
     link, F5, Google) sunucunun SEO/no-JS için gömdüğü yukarıdaki .page-head/.ssr-entity, popup'ın
     KENDİSİ DEĞİL — sade/minimal bir metin görünümü. Bu sayfadaki ~20 defer script yüklenip
     ProjectModal devreye girene kadar (yavaş bağlantıda gözle görülür sürede) hiçbir overlay/blur
     olmadan TEK BAŞINA görünür kalıyordu — kullanıcının "popup açılırken kısa süreliğine bozuk hali
     gözüküyor" dediği tam olarak buydu (ekran kaydında görülen çıplak makale görünümü, önceki
     düzeltme yalnızca ProjectModal İÇİ geçişleri kapsadığından bunu YAKALAMAMIŞTI). <head>'deki
     senkron script (JS yüklenmesini/DOMContentLoaded'ı beklemeden, İLK BOYAMADAN ÖNCE) bu URL
     deseninde <html>'e pm-boot-loading sınıfını ekler; aşağıdaki kural gerçek popup'la (bkz.
     modal-shell.js#.modal-shell-overlay) AYNI blur/karartma efektini gösterip çıplak içeriği tamamen
     örter. js/pages/proje.js'teki DOMContentLoaded handler'ı, ProjectModal.open()'ın Promise'i
     (renderItem/renderNotFound tamamlanınca) çözülünce sınıfı kaldırır — o noktada GERÇEK modal
     zaten tam opak açılmış olduğundan hiçbir geçiş/flash görünmez. */
  html.pm-boot-loading .page-head, html.pm-boot-loading #ssr-entity-body{visibility:hidden;}
  html.pm-boot-loading::before{
    content:''; position:fixed; inset:0; z-index:160;
    background:rgba(27,42,61,0.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  [data-theme="dark"].pm-boot-loading::before{background:rgba(255,255,255,0.16);}

  /* ---------- GRID LAYOUT ---------- */
  .grid-layout{
    max-width:1260px; margin:0 auto;
    padding:20px 32px 90px;
    display:grid; grid-template-columns:250px 1fr;
    gap:28px; align-items:start;
  }
  /* gerçek bulgu (2026-08-30, kullanıcı isteği: "En İyi 100'e tıklayınca mobilde ekran taşıyor"):
     grid item'ların varsayılan min-width:auto'su İÇERİĞİN min-content genişliğini (küçülemeyen en
     geniş çocuk) esas alır — Liste/Harita'da bu her zaman 1fr'lik track'in İÇİNE sığıyordu, ama
     En İyi 100 sekmesi (3 sekmeli .view-toggle + .top100-row satırları) mobilde bu min-content'i
     track genişliğinin ÜZERİNE çıkarıyor, main (ve dolayısıyla .grid-layout/body) fiziksel viewport'tan
     GENİŞ render ediliyor, mobil tarayıcı da sayfayı buna göre "zoom out" ediyor (bkz. kullanıcı
     ekran görüntüsü: tüm sayfa kenarlardan kırpılmış görünüyor). min-width:0 grid item'ı track
     genişliğine sıkıştırmaya zorlar, iç öğeler (.result-bar/.top100-row zaten flex-wrap:wrap/
     min-width:0 taşıyor) kendi içinde normal şekilde sarar/küçülür. */
  .grid-layout main{min-width:0;}
  .grid-sidebar{
    position:sticky; top:90px;
    display:flex; flex-direction:column;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    max-height:calc(100vh - 110px); overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line-soft);
  }
  .sidebar-head-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; font-weight:700;}
  .sidebar-search{display:flex; align-items:center; gap:8px; margin:12px 16px; padding:9px 14px; background:var(--paper); border:1px solid var(--line); border-radius:100px;}
  .sidebar-search svg{flex-shrink:0; opacity:0.5;}
  .sidebar-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; width:100%; color:var(--ink);}
  .sidebar-close-btn{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    color:var(--ink-soft); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-close-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .filter-group{border-bottom:1px solid var(--line-soft);}
  .filter-group:last-of-type{border-bottom:none;}
  .sidebar-add{padding:16px; border-top:1px solid var(--line-soft);}
  .sidebar-add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--ink); color:var(--paper-card);
    padding:12px; border-radius:100px; font-weight:600; font-size:13.5px;
  }
  .sidebar-add-btn:hover{background:var(--walnut);}
  .sidebar-add-icon{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:rgba(237,240,243,0.2); font-size:14px; line-height:1;
  }
  .filter-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; background:none; border:none; text-align:left;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .filter-group-head:hover{background:var(--paper-alt);}
  .filter-group-toggle{font-size:16px; color:var(--ink-soft); font-weight:400; line-height:1;}
  .filter-group-body{display:none; padding:0 16px 14px; max-height:260px; overflow-y:auto;}
  .filter-group.open .filter-group-body{display:block;}
  .filter-group.open .filter-group-toggle{transform:rotate(45deg);}
  .filter-opt{
    display:flex; align-items:center; gap:8px;
    padding:5px 0; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .filter-opt input{flex-shrink:0; accent-color:var(--ink); width:14px; height:14px;}
  .filter-opt:hover{color:var(--ink);}
  .filter-opt-count{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}
  .filter-opt-nested{padding-left:20px;}
  .filter-opt-nested input{width:12px; height:12px;}
  .filter-search-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 8px;
    padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:100px;
    position:sticky; top:0; z-index:1;
  }
  .filter-search-row svg{flex-shrink:0; opacity:0.5;}
  .filter-search-row input{border:none; background:none; outline:none; font-family:inherit; font-size:12px; width:100%; color:var(--ink);}

  .result-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .result-count{font-size:13px; color:var(--ink-soft); flex:1;}
  .sort-select{position:relative;}
  .sort-select select{
    appearance:none; -webkit-appearance:none;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:100px; padding:9px 32px 9px 16px;
    font-size:13px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .sort-select select:hover{border-color:var(--walnut);}
  .sort-arrow{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}

  /* ---------- LİSTE / HARİTA GÖRÜNÜM TOGGLE'I ---------- */
  /* Sade metin sekmeleri (bkz. kullanıcı isteği: buton/pil değil, düz metin). Varsayılan (Liste)
     görünümde DOM sırası — ve dolayısıyla soldan sağa dizilim — Harita, Liste, Sıralama'dır (bkz.
     kullanıcı isteği: "sıralama'nın hemen solunda Liste, onun solunda Harita"). Harita'ya
     geçildiğinde Sıralama gizlenir; kalan iki sekmenin YERİ CSS order ile bilerek TERSİNE çevrilir
     (bkz. #view-toggle.is-map-view aşağıda) ki Harita en sağa (artık boşalan Sıralama'nın yerine),
     Liste onun hemen soluna otursun — bkz. kullanıcı isteği: "Harita yazısı en sağa, Liste hemen
     solunda" (bir önceki turda onaylanan Harita-görünümü dizilimi, DOM sırası tersine döndükten
     SONRA da korunur). */
  .view-toggle{display:flex; align-items:center; gap:16px;}
  .view-toggle-btn{
    background:none; border:none; padding:4px 0; margin:0;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);
    text-decoration:none;
  }
  .view-toggle-btn:hover{color:var(--ink);}
  .view-toggle-btn.active{color:var(--ink); text-decoration:underline; text-underline-offset:4px;}
  .view-toggle.is-map-view #view-toggle-list{order:1;}
  .view-toggle.is-map-view #view-toggle-map{order:2;}
  /* En İyi 100 sekmesi — kullanıcı isteği: Liste/Harita'nın SOLUNA eklensin (bkz. yukarıdaki
     DOM sırası: top100, map, list — varsayılan/Liste görünümünde hiçbir order override'a gerek
     yok, doğal DOM sırası zaten bunu verir). Aktifken (bkz. js/pages/proje.js#setView) Harita/Liste
     İLE AYNI kalıpla en sağa (Sıralama'nın hemen soluna) kayar — .is-map-view'daki listBtn/mapBtn
     yer değiştirmesiyle BİREBİR aynı mantık, üçüncü sekme eklenmiş hâli.
  */
  .view-toggle.is-top100-view #view-toggle-map{order:1;}
  .view-toggle.is-top100-view #view-toggle-list{order:2;}
  .view-toggle.is-top100-view #view-toggle-top100{order:3;}

  /* Harita görünümü — sol Filtreler kenar çubuğu yerinde kalır (bkz. kullanıcı isteği), yalnızca
     sağdaki proje ızgarasının/sayfalamanın yerini tam genişlikte, o anki filtrelenmiş listedeki
     koordinatlı projeler için pin'ler taşıyan gerçek bir Leaflet + Esri World Imagery uydu haritası
     alır (bkz. js/pages/proje.js#syncMapMarkers). Harita js/pages/proje.js tarafından bu div'in
     İÇİNE doğrudan L.map olarak kuruluyor (iframe değil), min-height container'ın kendi yüksekliğini
     vermeye yeter. */
  /* GERÇEK BULGU (kullanıcı isteği: haritadan açılan proje popup'ı haritanın ARKASINDA çıkıyordu):
     ProjectModal'ın kendi kaplayıcısı z-index:150 (bkz. modal-shell.js) — ama Leaflet'in iç pane'leri
     (marker/popup/kontrol) varsayılan olarak z-index 600-1000 kullanır ve .map-view-wrap kendi
     stacking context'ini KURMADIĞI sürece bu değerler dışarı sızıp modal'ın (150) ÜSTÜNE çıkabiliyordu.
     isolation:isolate, Leaflet'in tüm iç z-index'lerini bu kutunun İÇİNE hapseder. */
  .map-view-wrap{isolation:isolate; border-radius:14px; overflow:hidden; min-height:560px; background:var(--paper-alt);}
  @media (max-width:720px){
    .map-view-wrap{min-height:380px;}
  }

  /* Marker'a tıklayınca açılan küçük Leaflet popup kartı (bkz. kullanıcı isteği: harita üzerinde
     projenin kapak görseli + başlığı) — js/pages/proje.js#syncMapMarkers bindPopup ile bu HTML'i
     üretir. Leaflet'in varsayılan popup iç dolgusunu/köşe yuvarlaklığını sıfırlayıp kartın kendi
     görseli kenara kadar (edge-to-edge) otursun diye .pm-project-popup ile hedefleniyor. */
  .leaflet-popup.pm-project-popup .leaflet-popup-content-wrapper{padding:0; border-radius:10px; overflow:hidden;}
  .leaflet-popup.pm-project-popup .leaflet-popup-content{margin:0; width:auto !important;}
  .pm-map-marker-card{display:block; text-decoration:none; color:inherit; cursor:pointer;}
  .pm-map-marker-card-photo{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--paper-alt);}
  .pm-map-marker-card-placeholder{width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:#fff;}
  .pm-map-marker-card-title{padding:8px 10px; font-size:13px; font-weight:600; color:var(--ink); line-height:1.3;}

  .active-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .active-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink); color:var(--paper-card);
    border-radius:100px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600;
  }
  .active-chip button{background:none; border:none; color:var(--paper-card); opacity:0.7; display:flex; padding:2px;}
  .active-chip button:hover{opacity:1;}

  /* ---------- CONTENT GRID ---------- */
  .content-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; transition:opacity .15s ease;}
  /* Kart başlığı artık görselin ÜZERİNDE değil ALTINDA (bkz. kullanıcı isteği) — .content-card-photo
     görseli aspect-ratio'lu bir kutuya alır, .content-card-info normal akışta onun altına düz
     arkaplanla oturur (eski absolute-overlay + gradient yerine). */
  .content-card{
    display:flex; flex-direction:column; border-radius:14px; overflow:hidden;
    background:var(--paper-card); border:1px solid var(--line-soft);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .content-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(27,42,61,0.14);}
  .content-card-photo{position:relative; aspect-ratio:4/3; overflow:hidden;}
  .content-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .content-card-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.92); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:28px; font-weight:700; letter-spacing:0.02em;}
  .content-card-info{padding:12px 14px; color:var(--ink);}
  /* Kart altı başlık EN FAZLA 2 satır (bkz. kullanıcı isteği) — -webkit-line-clamp ile 2. satırın
     sonunda "…" ile kesilir, çok uzun proje isimleri (ör. "Batı Akdeniz Teknokenti Teknoloji
     Geliştirme Bölgesi İdare Binası ve Kuluçka Merkezi") kartı taşırmaz. line-height/max-height +
     !important (bkz. kullanıcı isteği, gerçek bulgu: "...Projesi" gibi bir son kelimenin
     -webkit-line-clamp'in kendi satır sayımına rağmen 3. satıra taşarak göründüğü durumlar
     bildirildi) — line-height em cinsinden SABİTLENİP max-height tam olarak 2 satır (2 × 1.25em)
     ile sınırlanarak, satır sayımı motoru tam kesmese bile üçüncü satır kesin olarak gizlenir. */
  .content-card-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15px; font-weight:700; margin-bottom:3px; color:var(--ink); display:-webkit-box !important; -webkit-line-clamp:2 !important; -webkit-box-orient:vertical !important; overflow:hidden !important; text-overflow:ellipsis !important; word-break:break-word !important; line-height:1.25em !important; max-height:2.5em !important;}
  .content-card-by{font-size:11.5px; color:var(--ink-soft);}
  .card-save-btn{
    position:absolute; top:10px; right:10px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:rgba(27,42,61,0.55); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .card-save-btn:hover{background:rgba(27,42,61,0.75);}
  .card-save-btn.saved{background:var(--accent); color:var(--ink);}

  /* ---------- EN İYİ 100 SEKMESİ — sıralama satırları, en-iyi-100.html#.top100-list İLE BİREBİR
     AYNI (bkz. kullanıcı isteği: "En İyi 100 sekmesi ekteki görseldekiyle bire bir aynı tasarımda
     olsun") — Tip/Grup/Yer/Yıl filtreleri/arama/sıralama bu sayfanın ZATEN var olan sol filtre
     çubuğu/#g-sort'undan geldiğinden (bkz. js/pages/proje.js#loadTop100/passesTop100ActiveFilters)
     yalnızca satır tasarımı + Hızlı Puanla popup'ı buraya taşındı, en-iyi-100.html'in kendi
     toolbar'ı (.top100-toolbar/.top100-filters/.top100-search-*) burada YOK. */
  .top100-list{list-style:none; margin:0; padding:0; border-top:1px solid var(--line);}
  .top100-row{display:flex; align-items:center; gap:16px; padding:14px 4px; border-bottom:1px solid var(--line-soft);}
  .top100-rank-wrap{flex-shrink:0; width:34px; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .top100-rank{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:700; font-size:16px; color:var(--ink-soft); line-height:1;}
  .top100-row.top3 .top100-rank{color:var(--accent); font-size:19px;}

  .top100-poster{flex-shrink:0; width:104px; aspect-ratio:4/3; border-radius:10px; overflow:hidden; position:relative; background:var(--paper-alt);}
  .top100-poster img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .top100-poster-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.92); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:17px; font-weight:700;}
  .top100-body{flex:1; min-width:0;}
  .top100-name{display:block; font-size:15.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  a.top100-name-link:hover{color:var(--walnut); text-decoration:underline;}
  .top100-submeta{margin-top:3px; font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .top100-desc{margin-top:4px; font-size:12.5px; line-height:1.4; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;}
  .top100-quick-actions{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .top100-action-btn{
    position:static; width:auto; height:28px; box-sizing:border-box;
    display:inline-flex; align-items:center; gap:5px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:100px;
    padding:0 12px; font-size:11.5px; font-weight:600; color:var(--ink-soft);
  }
  .top100-action-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .top100-action-btn.saved{background:var(--accent); color:var(--ink); border-color:var(--accent);}
  .top100-rate-icon-filled{color:var(--accent);}

  .top100-rating{flex-shrink:0; display:flex; flex-direction:column; align-items:flex-end; gap:2px; min-width:78px;}

  .top100-avg-star{color:var(--accent);}

  @media (max-width:560px){

  .rate-popup-overlay{

  .page-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .page-btn-arrow{display:flex; align-items:center; justify-content:center; padding:0;}
  .page-ellipsis{color:var(--ink-soft); padding:0 4px;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}

  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}
