<!-- Liste sayfası için jenerik yapısal veri (bkz. kullanıcı isteği: "tüm ana sayfa ve detay

     çakışmaz. -->

</script>
<!-- Temiz URL'lerle bu sayfa /proje/:slug altında (proje modalını doğrudan
     açan bir iç içe yolda) servis edilir; <base> olmadan script/link/img gibi göreli kaynak yolları
     o iç içe yola göre yanlış çözümlenirdi (bkz. src/index.js#CLEAN_URL_ASSETS, eski
     proje-detay.html'deki AYNI gerekçe). -->
<base href="/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);

    /* Design Token katmanı (bkz. kullanıcı isteği: UI/UX revizyonu) — yalnızca bu pass'te dokunulan
       bileşenlerde (Yorum/Bildir butonu) kullanılır; mevcut --ink/--walnut/--brass paletinin ÜZERİNE
       kurulur, yeni bir RENK yok, sadece semantik isimlendirme. Sayfa başına :root kopyalama deseni
       zaten mevcut mimari olduğundan, ileride dokunulacak diğer sayfalar bu bloğu aynen kopyalayabilir. */
    --color-primary-900: var(--ink);
    --color-primary-700: var(--walnut);
    --color-primary-500: var(--brass);
    --color-primary-100: var(--brass-soft);
    --color-accent: var(--accent);
    --color-accent-hover: #C97530;

    --color-text-primary: var(--ink);
    --color-text-secondary: var(--ink-soft);
    --color-surface: var(--paper-card);
    --color-surface-hover: var(--paper-alt);
    --color-border: var(--line);
    --color-primary: var(--color-primary-900);
    --color-primary-hover: var(--color-primary-700);
    --color-primary-active: var(--color-primary-700);

    --font-h1: 28px;
    --font-h2: 22px;
    --font-h3: 18px;
    --font-body-1: 14px;
    --font-body-2: 12px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 999px;
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  /* Ürün açılır menü düğmesi (bkz. js/components/nav-product-menu.js) — bu reset burada, sayfanın
     KENDİ <style>'ında olmalı, yalnızca JS'in enjekte ettiği stilde değil: nav-product-menu.js
     defer'lı olduğundan ilk boyamadan SONRA çalışır, o ana kadar <button> tarayıcı varsayılan
     çerçeve/arkaplanıyla görünüp kaybolan bir gri dikdörtgen gibi çakıyordu (bkz. kullanıcı isteği). */
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;
    /* bkz. index.html'deki AYNI gerçek bulgu/gerekçe — kullanıcı isteği: mobil hamburger menüde
       Ürün akordeonu açılınca panelin altına kaydırılamaması sorununun kökten çözümü. */
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{max-width:1260px; margin:0 auto; padding:28px 32px 0;}
  .page-head h1{font-family:'Inter', sans-serif; font-size:28px; font-weight:700; margin:0 0 4px;}
  .page-head p{color:var(--ink-soft); font-size:14px; margin:0;}

  /* ---------- SSR ENTITY BODY (bkz. src/index.js#injectMeta, src/lib/seo.js#bodyHtml) ---------- */
  /* /proje/:slug altında serveDetailPage tarafından doldurulur; listeleme sayfasında (/proje) boş
     kalır, :empty kuralı sayfaya gereksiz bir boşluk eklenmesini önler. */
  .ssr-entity:empty{display:none;}
  .ssr-entity{max-width:1260px; margin:0 auto; padding:0 32px 20px; display:flex; gap:20px; align-items:flex-start;}
  .ssr-entity img{width:160px; height:160px; object-fit:cover; border-radius:8px; flex-shrink:0;}
  .ssr-entity-text{flex:1; min-width:0;}
  .ssr-entity-text p{color:var(--ink-soft); font-size:14px; line-height:1.6; max-width:70ch; margin:0 0 10px;}
  .ssr-facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; margin:0;}
  .ssr-facts dt{color:var(--ink-soft); font-weight:600;}
  .ssr-facts dd{margin:0;}
  .ssr-facts a{color:inherit;}
  @media (max-width:720px){
    .ssr-entity{flex-direction:column; padding:0 16px 16px;}
    .ssr-entity img{width:100%; max-width:280px; height:auto;}
  }

  /* gerçek bulgu (kullanıcı isteği, 2026-08-24): /proje/:slug'a DOĞRUDAN girildiğinde (paylaşılan
     link, F5, Google) sunucunun SEO/no-JS için gömdüğü yukarıdaki .page-head/.ssr-entity, popup'ın
     KENDİSİ DEĞİL — sade/minimal bir metin görünümü. Bu sayfadaki ~20 defer script yüklenip
     ProjectModal devreye girene kadar (yavaş bağlantıda gözle görülür sürede) hiçbir overlay/blur
     olmadan TEK BAŞINA görünür kalıyordu — kullanıcının "popup açılırken kısa süreliğine bozuk hali
     gözüküyor" dediği tam olarak buydu (ekran kaydında görülen çıplak makale görünümü, önceki
     düzeltme yalnızca ProjectModal İÇİ geçişleri kapsadığından bunu YAKALAMAMIŞTI). <head>'deki
     senkron script (JS yüklenmesini/DOMContentLoaded'ı beklemeden, İLK BOYAMADAN ÖNCE) bu URL
     deseninde <html>'e pm-boot-loading sınıfını ekler; aşağıdaki kural gerçek popup'la (bkz.
     modal-shell.js#.modal-shell-overlay) AYNI blur/karartma efektini gösterip çıplak içeriği tamamen
     örter. js/pages/proje.js'teki DOMContentLoaded handler'ı, ProjectModal.open()'ın Promise'i
     (renderItem/renderNotFound tamamlanınca) çözülünce sınıfı kaldırır — o noktada GERÇEK modal
     zaten tam opak açılmış olduğundan hiçbir geçiş/flash görünmez. */
  html.pm-boot-loading .page-head, html.pm-boot-loading #ssr-entity-body{visibility:hidden;}
  html.pm-boot-loading::before{
    content:''; position:fixed; inset:0; z-index:160;
    background:rgba(27,42,61,0.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  [data-theme="dark"].pm-boot-loading::before{background:rgba(255,255,255,0.16);}

  /* ---------- GRID LAYOUT ---------- */
  .grid-layout{
    max-width:1260px; margin:0 auto;
    padding:20px 32px 90px;
    display:grid; grid-template-columns:250px 1fr;
    gap:28px; align-items:start;
  }
  .grid-sidebar{
    position:sticky; top:90px;
    display:flex; flex-direction:column;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:14px;
    max-height:calc(100vh - 110px); overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .sidebar-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; border-bottom:1px solid var(--line-soft);
  }
  .sidebar-head-title{font-family:'Inter', sans-serif; font-size:15px; font-weight:700;}
  .sidebar-search{display:flex; align-items:center; gap:8px; margin:12px 16px; padding:9px 14px; background:var(--paper); border:1px solid var(--line); border-radius:100px;}
  .sidebar-search svg{flex-shrink:0; opacity:0.5;}
  .sidebar-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13px; width:100%; color:var(--ink);}
  .sidebar-close-btn{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    color:var(--ink-soft); font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-close-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .filter-group{border-bottom:1px solid var(--line-soft);}
  .filter-group:last-of-type{border-bottom:none;}
  .sidebar-add{padding:16px; border-top:1px solid var(--line-soft);}
  .sidebar-add-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; background:var(--ink); color:var(--paper-card);
    padding:12px; border-radius:100px; font-weight:600; font-size:13.5px;
  }
  .sidebar-add-btn:hover{background:var(--walnut);}
  .sidebar-add-icon{
    display:flex; align-items:center; justify-content:center;
    width:18px; height:18px; border-radius:50%;
    background:rgba(237,240,243,0.2); font-size:14px; line-height:1;
  }
  .filter-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:13px 16px; background:none; border:none; text-align:left;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  .filter-group-head:hover{background:var(--paper-alt);}
  .filter-group-toggle{font-size:16px; color:var(--ink-soft); font-weight:400; line-height:1;}
  .filter-group-body{display:none; padding:0 16px 14px; max-height:260px; overflow-y:auto;}
  .filter-group.open .filter-group-body{display:block;}
  .filter-group.open .filter-group-toggle{transform:rotate(45deg);}
  .filter-opt{
    display:flex; align-items:center; gap:8px;
    padding:5px 0; font-size:13px; color:var(--ink-soft); cursor:pointer;
  }
  .filter-opt input{flex-shrink:0; accent-color:var(--ink); width:14px; height:14px;}
  .filter-opt:hover{color:var(--ink);}
  .filter-opt-count{margin-left:auto; font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .filter-opt-nested{padding-left:20px;}
  .filter-opt-nested input{width:12px; height:12px;}
  .filter-search-row{
    display:flex; align-items:center; gap:6px; margin:2px 0 8px;
    padding:6px 10px; background:var(--paper); border:1px solid var(--line); border-radius:100px;
    position:sticky; top:0; z-index:1;
  }
  .filter-search-row svg{flex-shrink:0; opacity:0.5;}
  .filter-search-row input{border:none; background:none; outline:none; font-family:inherit; font-size:12px; width:100%; color:var(--ink);}

  .result-bar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .result-count{font-size:13px; color:var(--ink-soft); flex:1;}
  .sort-select{position:relative;}
  .sort-select select{
    appearance:none; -webkit-appearance:none;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:100px; padding:9px 32px 9px 16px;
    font-size:13px; font-weight:500; color:var(--ink); font-family:inherit;
  }
  .sort-select select:hover{border-color:var(--walnut);}
  .sort-arrow{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft);}

  .active-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .active-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ink); color:var(--paper-card);
    border-radius:100px; padding:6px 8px 6px 14px; font-size:12.5px; font-weight:600;
  }
  .active-chip button{background:none; border:none; color:var(--paper-card); opacity:0.7; display:flex; padding:2px;}
  .active-chip button:hover{opacity:1;}

  /* ---------- CONTENT GRID ---------- */
  .content-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; transition:opacity .15s ease;}
  /* Kart başlığı artık görselin ÜZERİNDE değil ALTINDA (bkz. kullanıcı isteği) — .content-card-photo
     görseli aspect-ratio'lu bir kutuya alır, .content-card-info normal akışta onun altına düz
     arkaplanla oturur (eski absolute-overlay + gradient yerine). */
  .content-card{
    display:flex; flex-direction:column; border-radius:14px; overflow:hidden;
    background:var(--paper-card); border:1px solid var(--line-soft);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .content-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(27,42,61,0.14);}
  .content-card-photo{position:relative; aspect-ratio:4/3; overflow:hidden;}
  .content-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .content-card-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.92); font-family:'Inter', sans-serif; font-size:28px; font-weight:700; letter-spacing:0.02em;}
  .content-card-info{padding:12px 14px; color:var(--ink);}
  /* Kart altı başlık EN FAZLA 2 satır (bkz. kullanıcı isteği) — -webkit-line-clamp ile 2. satırın
     sonunda "…" ile kesilir, çok uzun proje isimleri (ör. "Batı Akdeniz Teknokenti Teknoloji
     Geliştirme Bölgesi İdare Binası ve Kuluçka Merkezi") kartı taşırmaz. line-height/max-height +
     !important (bkz. kullanıcı isteği, gerçek bulgu: "...Projesi" gibi bir son kelimenin
     -webkit-line-clamp'in kendi satır sayımına rağmen 3. satıra taşarak göründüğü durumlar
     bildirildi) — line-height em cinsinden SABİTLENİP max-height tam olarak 2 satır (2 × 1.25em)
     ile sınırlanarak, satır sayımı motoru tam kesmese bile üçüncü satır kesin olarak gizlenir. */
  .content-card-title{font-family:'Inter', sans-serif; font-size:15px; font-weight:700; margin-bottom:3px; color:var(--ink); display:-webkit-box !important; -webkit-line-clamp:2 !important; -webkit-box-orient:vertical !important; overflow:hidden !important; text-overflow:ellipsis !important; word-break:break-word !important; line-height:1.25em !important; max-height:2.5em !important;}
  .content-card-by{font-size:11.5px; color:var(--ink-soft);}
  .card-save-btn{
    position:absolute; top:10px; right:10px; z-index:2;
    width:32px; height:32px; border-radius:50%;
    background:rgba(27,42,61,0.55); border:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .card-save-btn:hover{background:rgba(27,42,61,0.75);}
  .card-save-btn.saved{background:var(--accent); color:var(--ink);}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; display:none;}

  .pagination{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin-top:28px;
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
  }
  .pagination::-webkit-scrollbar{display:none;}
  .page-btn{
    min-width:38px; height:38px; padding:0 10px; flex-shrink:0;
    border:1px solid var(--line); background:var(--paper-card);
    border-radius:8px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .page-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .page-btn.active{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .page-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .page-btn-arrow{display:flex; align-items:center; justify-content:center; padding:0;}
  .page-ellipsis{color:var(--ink-soft); padding:0 4px;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .grid-layout{grid-template-columns:1fr;}
    .grid-sidebar{position:static; max-height:none; overflow:visible;}
    .content-grid{grid-template-columns:repeat(3, 1fr);}
  }
  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }

  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .page-head{padding:20px 16px 0;}
    .grid-layout{padding:16px 16px 70px; gap:16px;}
    .content-grid{grid-template-columns:1fr 1fr; gap:12px;}
    .content-card-title{font-size:13.5px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }

  @media (max-width:768px){
    .content-card-by{display:none;}
  }

  /* ---------- PROJE MODALI — sol panel (bilgi) ----------
     Eski proje-detay.html'in .detail-header/.detail-byline grid'i buraya taşınmadı: modal sol
     paneli tek bir dikey akış (DOM sırası zaten Başlık → Puan → Aksiyon → Künye → Açıklama →
     Yorumlar, bkz. kullanıcı isteği), grid-template-areas'a gerek yok. Kalan sınıf adları
     (.rating-widget, .designer-chip, .comment-row vb.) proje-detay.html ile BİREBİR aynı — aynı
     paylaşılan JS (rating-widget.js, js/components/project-*.js) bu isimlere yazıyor. */
  .detail-title{font-family:'Inter', sans-serif; font-size:26px; font-weight:700; margin:0 0 12px; line-height:1.25;}
  /* En İyi 100 rozeti (bkz. js/components/project-modal.js#renderTopRankBadge, kullanıcı isteği:
     "her iki sayfadan da aynı proje popup'ı açınca tüm bilgilerin ve tasarımın bire bir aynı olması
     gerekiyor") — gerçek bulgu: bu blok ÖNCEDEN yalnızca en-iyi-100.html'de vardı, bu yüzden
     proje.html'den açılan bir Top100 projesinin popup'ında rozet HİÇ görünmüyordu (topRank verisi
     JS'te sonradan otomatik aranır oldu, ama CSS'i olmayınca stilsiz kalırdı) — en-iyi-100.html'deki
     AYNI blok, sayfa başına kopyalama deseniyle (bkz. o dosyadaki .detail-title yorumu) burada da
     tutulur. */
  .pm-top-rank{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 14px;}
  .pm-top-rank-badge{display:inline-flex; align-items:center; background:var(--ink); color:var(--paper-card); border-radius:100px; padding:5px 14px; font-size:12.5px; font-weight:700; transition:background .15s ease;}
  .pm-top-rank-badge:hover{background:var(--walnut);}
  /* "X tarafından" satırı — js/components/product-modal.js/haber-detay.html'deki AYNI .detail-byline
     kuralları (kullanıcı isteği: Puanla/Kaydet/Paylaş satırının hemen altına yeniden eklendi). Yalnızca
     üye gönderisi kökenli projelerde dolu (bkz. src/routes/project.js#fetchOwnerByline), diğerlerinde
     gizli kalır. */
  /* margin-bottom 18px (14px değil) — Düzenle/Arşivle/Sil satırı buradan kaldırılıp X'in yanına
     taşındığından (bkz. kullanıcı isteği) bu artık künye bloğuna en yakın komşu; sayfadaki diğer
     blok aralarıyla (.detail-meta/.detail-desc margin-top:18px) AYNI dikey ritme oturur. */
  .detail-byline{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); margin:0 0 18px;}
  .detail-byline strong{color:var(--ink); font-weight:600;}
  .detail-byline a{color:inherit; text-decoration:none;}
  .detail-byline a:hover strong{text-decoration:underline;}
  .detail-byline-avatar{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:9.5px;
  }
  .detail-byline-avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  /* Puanlama + Kaydet: kullanıcı isteği üzerine aynı satırda, ikisi de "pill" görünümlü (bkz.
     .rating-widget kuralı aşağıda — save-btn ile AYNI çerçeve/dolgu dilini paylaşır). */
  /* flex-wrap:nowrap !important — kullanıcı isteği: Puanla/Kaydet/Paylaş HİÇBİR genişlikte 2. satıra
     düşmesin; dar ekranlarda satırın sığması Paylaş'ın ikon-only sabit boyutu (bkz. share-button.js)
     ve Puanla/Kaydet'in flex-shrink+ellipsis ile daralması (metinleri HER ZAMAN görünür kalır, kullanıcı
     isteği) ile sağlanır, taşma yerine ölçeklenme tercih edilir. Tüm bayraklar !important — kullanıcı
     isteği: bu satır başka hiçbir kuralın ele geçiremeyeceği kadar katı olsun. */
  /* gap 6px — #pm-save-slot'un (Kaydet-Paylaş arası) gap'iyle BİREBİR aynı (bkz. kullanıcı isteği:
     Puanla-Kaydet ile Kaydet-Paylaş aralıkları eşitlensin). */
  .pm-rating-save-row{
    display:flex !important; flex-direction:row !important; flex-wrap:nowrap !important;
    align-items:center !important; justify-content:flex-start !important; width:100% !important;
    gap:6px !important; margin:0 0 14px;
  }
  /* gerçek bulgu (kullanıcı isteği, 2026-08-24): project-modal.js#renderNotFound/renderLoading bu
     satırı (ve HIDE_ON_NOT_FOUND_IDS'teki diğer bölümleri) style.display='none' ile gizlemeye
     çalışıyordu ama yukarıdaki display:flex !important her zaman kazanıyordu — yükleniyor/bulunamadı
     durumunda "Puanla/Kaydet" satırı içerik henüz yokken görünür kalıyordu. Daha yüksek özgüllüklü
     BU kural (0,2,0 > 0,1,0), kaynak sırasından bağımsız olarak her zaman kazanır.
  */
  .pm-force-hidden{display:none;}
  .pm-rating-save-row.pm-force-hidden{display:none !important;}
  /* gerçek bulgu: #pm-save-slot (Kaydet+Paylaş'ı BİRLİKTE tutan div, proje-actions.js#mount)
     kendisi flex konteyner DEĞİLDİ — içindeki .save-btn/.share-widget salt inline-flex kutular
     olduğundan sıradan satır-içi akışla dizilip konteynerin genişliğini aştıklarında (bkz. büyütülmüş
     48px'lik pil boyutları, kullanıcı isteği) normal metin gibi ALT SATIRA kayıyorlardı — dıştaki
     .pm-rating-save-row'un flex-wrap:nowrap'ı yalnızca KENDİ doğrudan çocuklarını (rating-widget +
     bu slot) etkiliyor, slot'un İÇİNDEKİLERİ değil. Slot'u da flex/nowrap yapmak, .save-btn/
     .share-btn'deki mevcut flex-shrink:1/min-width:0 kurallarının (yalnızca bir flex öğesindeyken
     anlamlı) burada da devreye girmesini sağlar. */
  #pm-save-slot{display:flex; flex-wrap:nowrap; align-items:center; gap:6px; min-width:0;}
  /* Düzenle/Arşivle/Sil artık bu sütunda DEĞİL — modal-shell.js'in paylaşılan header'ında, X
     butonunun yanında render edilir (bkz. kullanıcı isteği, js/components/project-actions.js). O
     yüzden .detail-title-actions/.card-edit-btn/.card-delete-btn kuralları buradan kaldırıldı;
     görsel stilleri artık TEK kaynaktan (modal-shell.js#injectStyles) geliyor. */
  /* Yükseklik/dolgu/satır-yüksekliği .rating-widget ile BİREBİR aynı (bkz. kullanıcı isteği: "yan
     yana geldiklerinde tam simetrik dursunlar") — height+box-sizing:border-box, içerik farklı olsa
     bile (ikon vs yıldız satırı) dış kutuyu piksel piksel eşitler; yazı tipi/punto/kalınlık da sol
     paneldeki künye etiketleriyle (.detail-meta strong: 14px/600) birebir aynı. */
  .save-btn{
    display:inline-flex; align-items:center; gap:5px;
    flex-shrink:1 !important; min-width:0 !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis;
    height:32px !important; box-sizing:border-box;
    background:var(--paper-card); border:1px solid var(--line); border-radius:100px;
    padding:0 8px !important; font-size:12px !important; font-weight:600; line-height:1; color:var(--ink-soft);
  }
  .save-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .save-btn.saved{background:var(--ink); color:var(--paper-card); border-color:var(--ink);}
  .save-btn svg{flex-shrink:0;}
  .save-btn-label-saved{display:none;}
  .save-btn.saved .save-btn-label-default{display:none;}
  .save-btn.saved .save-btn-label-saved{display:inline;}
  .save-btn-count{font-weight:600;}
  /* gerçek bulgu: proje modalının Kaydet butonu save-widget.js'in .card-save-btn seçicisiyle
     bulunabilmesi için hem .save-btn hem .card-save-btn sınıflarını birlikte taşıyor (bkz.
     ProjectActions.render) — ama .card-save-btn KART bağlamında (üstteki kural, position:absolute;
     top/right) mutlak konumlandırılmış dairesel bir simge olacak şekilde tanımlı; bu, modaldeki
     butonu normal akıştan koparıp panelin sağ üst köşesine yapıştırıyordu. Aşağıdaki daha spesifik
     seçici yalnızca modalin Puanlama+Kaydet satırı İÇİNDEKİ kopyayı normal akışa geri döndürür,
     kart bağlamındaki (.content-card .card-save-btn) davranışı etkilemez. İKİNCİ gerçek bulgu: bu
     seçici Kaydet'in DOM konumu proje-actions.js'te #pm-actions'tan #pm-save-slot'a taşındığında
     (bkz. kullanıcı isteği: "Puanlama ile Kaydet aynı satırda") eski ".detail-title-actions
     .card-save-btn" hedefini kaçırmıştı — buton yeniden köşeye yapıştı; seçici doğru kapsayıcıya
     (.pm-rating-save-row) güncellendi.
  */
  /* height:auto DEĞİL — bare .card-save-btn kart bağlamı kuralı (height:32px) bu seçiciden DAHA
     DÜŞÜK özgüllükte olsa da, height:auto burada .save-btn{height:36px}'i EZİYORDU (bkz. gerçek
     bulgu: iki sınıfı birden taşıyan bu buton .pm-rating-save-row .card-save-btn'in (0,2,0) daha
     yüksek özgüllüğüne sahip olduğundan .save-btn'in (0,1,0) height'ını görmezden geliyordu) —
     .rating-widget ile piksel piksel eşit dursun diye height burada da AÇIKÇA 36px olarak yazılır. */
  .pm-rating-save-row .card-save-btn{
    position:static; width:auto; height:32px !important; z-index:auto;
    background:var(--paper-card); border-radius:100px; color:var(--ink-soft);
  }
  .pm-rating-save-row .card-save-btn:hover{background:var(--paper-card);}
  .pm-rating-save-row .card-save-btn.saved{background:var(--ink); color:var(--paper-card);}
  /* Paylaş artık ikon-only (bkz. js/components/share-button.js) — boyutu tamamen o dosyadaki
     paylaşılan .share-btn kuralından gelir, burada ayrı bir override gerekmiyor. */

  /* Kaydet butonuyla (.save-btn) AYNI pill çerçeve dili — kullanıcı isteği: "Kaydet butonundaki gibi
     dış çerçeve, border-radius/pill, hafif arka plan ve padding". Yıldız butonlarının kendi
     padding'i zaten var, bu yüzden kapsayıcının solundan hafif negatif margin ile hizalanır ki
     pill kenarına gereğinden fazla boşluk binmesin. */
  .rating-widget{
    display:flex; align-items:center; gap:4px; flex-wrap:nowrap;
    flex-shrink:1 !important; min-width:0 !important;
    height:32px !important; box-sizing:border-box;
    background:var(--paper-card); border:1px solid var(--line); border-radius:100px;
    padding:0 8px !important; margin:0;
    transition:border-color .15s ease;
  }
  .rating-widget:hover{border-color:var(--walnut);}
  .rating-star-row{display:flex; gap:2px; flex-shrink:0;}
  .rating-star-btn{background:none; border:none; padding:0; color:var(--line); display:flex; transition:transform .1s ease;}
  .rating-star-btn.filled{color:var(--accent);}
  .rating-star-btn:hover:not(:disabled){color:var(--accent); transform:scale(1.15);}
  .rating-star-btn:disabled{opacity:0.6; cursor:not-allowed;}
  .rating-summary{font-size:12px !important; font-weight:600; line-height:1; color:var(--ink-soft); white-space:nowrap !important;}

  .detail-info{margin-top:8px;}
  .designer-section{margin-top:0;}
  .designer-section + .designer-section{margin-top:16px;}
  .designer-label{font-size:14px; color:var(--ink); font-weight:600; margin-bottom:10px;}
  .designer-chips{display:flex; flex-wrap:wrap; gap:10px;}
  .designer-chip{
    display:flex; align-items:center; gap:9px;
    background:var(--paper); border:1px solid var(--line-soft);
    border-radius:100px; padding:6px 16px 6px 6px;
    transition:border-color .15s ease, transform .15s ease;
  }
  a.designer-chip:hover{border-color:var(--brass); transform:translateY(-1px);}
  .designer-chip-no-avatar{padding:6px 16px; min-height:46px;}
  .designer-chip-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    color:var(--paper-card); font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:11.5px;
  }
  .designer-chip-avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .designer-chip-avatar.office-avatar img{object-fit:contain; background:var(--paper-card);}
  .designer-chip-name{font-size:13px; font-weight:600; color:var(--ink);}
  .designer-name-plain{font-size:14px; color:var(--walnut); text-decoration:underline; text-decoration-color:var(--line); padding:6px 4px; align-self:center;}
  .designer-name-plain:hover{color:var(--ink);}

  .detail-meta{font-size:14px; line-height:1.9; margin-top:18px;}
  .detail-meta strong{font-weight:600; color:var(--ink);}
  .detail-meta a{color:var(--walnut); text-decoration:underline; text-decoration-color:var(--line);}
  .detail-meta a:hover{color:var(--ink);}
  .detail-desc{font-size:15px; line-height:1.7; color:var(--ink); margin-top:18px;}
  /* bkz. kullanıcı isteği: açıklama TAM olarak 3 satırda kırpılıp "…" ile bitsin, 4. satıra
     geçmesin — js/components/project-meta.js#renderDescription bu class'ı DOM'a yazar, gerçek
     taşma varsa "Devamını gör" ile kaldırılır. */
  .detail-desc-text.clamped{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;}
  .detail-desc-more{display:block; margin-top:6px; background:none; border:none; padding:0; color:var(--walnut); font-weight:600; font-size:14px; text-decoration:underline; text-decoration-color:var(--line); cursor:pointer;}
  .detail-desc-more:hover{color:var(--ink);}

  /* ---------- PROJE MODALI — yorumlar ---------- */
  /* Yorumlar kutusu artık .pm-feedback-card (Geri Bildirim) İLE BİREBİR AYNI kart görünümünde —
     aynı margin/padding/border/radius/arkaplan, aynı summary punto/hiza (bkz. kullanıcı isteği:
     "iki kutucuğun da + sembolü aynı hizada ve aynı büyüklükte olsun"). .pm-info-divider (<hr>)
     artık Yorumlar'ın ÜSTÜNDE, açıklamayla arasında (bkz. kullanıcı isteği: "geri bildirim ile
     yorumlar arasındaki line'ı sil, yorumların üstüne line koy"). */
  .comments-section{margin-top:20px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--paper);}
  /* Yorumlar da ilk açılışta kapalı (bkz. kullanıcı isteği, .pm-feedback-card İLE AYNI <details>/
     <summary> deseni) — comments-title artık <h2> değil doğrudan clickable <summary>. */
  .comments-title{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; font-family:'Inter', sans-serif; font-size:14px; font-weight:700; color:var(--ink); margin:0;}
  .comments-title::-webkit-details-marker{display:none;}
  .comments-section[open] .comments-title{margin-bottom:6px;}
  .comments-section[open] .feedback-card-plus::after{transform:translate(-50%,-50%) rotate(90deg); opacity:0;}
  .comment-form-wrap{margin-bottom:20px;}
  /* Gönder butonu textarea'nın İÇİNE, sağ alt köşeye bindirilir (bkz. kullanıcı isteği) — yazının
     butonun altına/arkasına denk gelmemesi için textarea'nın sağ ve alt iç boşluğu büyütülür, buton
     o boşluğun içinde mutlak konumlanır. */
  .comment-input-wrap{position:relative;}
  .comment-form textarea{width:100%; min-height:80px; padding:12px 108px 50px 14px; border:1px solid var(--line); border-radius:12px; background:var(--paper); font-family:inherit; font-size:14px; color:var(--ink); resize:vertical;}
  .comment-input-wrap .comment-submit-btn{position:absolute; right:8px; bottom:8px;}
  /* Gönder ve Bildir (bkz. .feedback-input-wrap altında) AYNI boyut/tipografi Design Token'larını
     kullanır (bkz. kullanıcı isteği) — sarmalayıcılar (bkz. yukarısı/aşağısı) yalnızca konum farkını
     taşır, boyutla ilgili hiçbir override yoktur. */
  .comment-submit-btn{background:var(--color-primary); color:var(--paper-card); padding:var(--space-2) var(--space-4); border-radius:var(--radius-full); font-weight:600; font-size:var(--font-body-2); line-height:1.2;}
  .comment-submit-btn:hover{background:var(--color-primary-hover);}
  .comment-submit-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .comment-login-note{padding:16px 18px; border:1px dashed var(--line); border-radius:12px; font-size:13.5px; color:var(--ink-soft);}
  .comment-login-note a{color:var(--walnut); font-weight:600; text-decoration:underline;}
  .comment-submit-notice{margin:10px 0 0; font-size:12.5px; color:var(--sage);}
  .comment-row{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .comment-row:last-child{border-bottom:none;}
  .comment-avatar{width:34px; height:34px; border-radius:50%; background:var(--walnut); color:var(--paper-card); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600; flex-shrink:0; position:relative; overflow:hidden;}
  /* Hem sıradan üyenin kendi profil fotoğrafı (<div>, bkz. js/components/project-comments.js#user_photo)
     hem de bir mimar/firma profiline bağlı yorumcunun profil fotoğrafı (<a>, #commenterProfile) aynı
     mutlak konumlanan <img> desenini kullanır (bkz. .designer-chip-avatar img ile AYNI desen) — bu
     yüzden position:relative/overflow:hidden yukarıdaki ORTAK .comment-avatar kuralında tanımlı.
     a.comment-avatar için ayrıca text-decoration sıfırlanır ki bir bağlantı gibi altı çizili görünmesin. */
  a.comment-avatar{text-decoration:none;}
  .comment-avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .comment-meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .comment-meta strong{color:var(--ink); font-weight:600;}
  .comment-author-link{color:inherit; text-decoration:none;}
  .comment-author-link:hover{text-decoration:underline;}
  .comment-delete-btn{background:none; border:none; color:var(--ink-soft); font-size:12px; font-family:inherit; cursor:pointer; margin-left:4px; text-decoration:underline; padding:0;}
  .comment-delete-btn:hover{color:#c0392b;}
  .comment-body-text{margin:0; font-size:13.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap;}

  /* ---------- PROJE MODALI — Bilgi Kaynağı & Geri Bildirim ---------- */
  .pm-info-divider{margin:28px 0 0; border:none; border-top:1px solid var(--line);}
  .pm-feedback-card{margin-top:20px; padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--paper);}
  .pm-feedback-card h5{margin:0 0 6px; font-family:'Inter', sans-serif; font-size:14px; font-weight:700;}
  .pm-feedback-card p{margin:0 0 10px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  /* Kart ilk açılışta kapalı (bkz. kullanıcı isteği: "Geri Bildirim +" ön başlığı) — native
     <details>/<summary>, JS state yönetimi gerekmez (bkz. js/components/claim-correction-box.js#
     injectStyles'daki AYNI desen, mimar/firma modallarındaki .feedback-card için). */
  .pm-feedback-card > summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; font-family:'Inter', sans-serif; font-size:14px; font-weight:700; color:var(--ink);}
  .pm-feedback-card > summary::-webkit-details-marker{display:none;}
  .pm-feedback-card[open] > summary{margin-bottom:6px;}
  .feedback-card-plus{flex-shrink:0; width:18px; height:18px; position:relative; margin-left:10px;}
  .feedback-card-plus::before, .feedback-card-plus::after{content:''; position:absolute; top:50%; left:50%; background:var(--ink-soft); transform:translate(-50%,-50%); transition:transform 0.15s ease;}
  .feedback-card-plus::before{width:12px; height:2px;}
  .feedback-card-plus::after{width:2px; height:12px;}
  .pm-feedback-card[open] .feedback-card-plus::after{transform:translate(-50%,-50%) rotate(90deg); opacity:0;}
  /* Bildir butonu da yorum kutusuyla AYNI desende textarea'nın içine, sağ alt köşeye bindirilir. */
  .feedback-input-wrap{position:relative;}
  .pm-feedback-card textarea{width:100%; min-height:64px; padding:9px 92px 40px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper-card); font-family:inherit; font-size:12.5px; color:var(--ink); resize:vertical;}
  .feedback-input-wrap .comment-submit-btn{position:absolute; right:6px; bottom:6px;}
  #pm-feedback-result{margin:8px 0 0; font-size:12px; color:var(--sage);}

  /* ---------- PROJE MODALI — sağ panel (medya + doğal akış) ---------- */
  .gallery-wrap{position:relative; min-width:0;}
  .gallery-media{position:relative;}
  .detail-gallery{display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; padding-bottom:4px;}
  .detail-gallery::-webkit-scrollbar{display:none;}
  /* 2:1 (landscape) medya oranı — kutunun boyutu ANKORDA (.detail-gallery a) sabitlenir, img/placeholder
     onu object-fit:cover ile doldurur. Genişliği doğrudan img üzerinde yüzde ile vermek yerine
     ankorda flex-basis olarak tanımlamak dairesel bir boyutlandırma sorununu önler (bkz. gerçek bulgu:
     img'nin kendi genişliği hem içeriğinden hem yüzdesinden gelemeyeceğinden 4:3'ten 2:1'e geçişte
     img'ye doğrudan width:% verilseydi ankor da auto olduğundan boyut belirsiz kalırdı). */
  .detail-gallery a{
    flex:0 0 min(88%, 760px); aspect-ratio:2/1; border-radius:14px; overflow:hidden;
    display:block; background:var(--paper-card);
  }
  .detail-gallery img{width:100%; height:100%; object-fit:cover; display:block;}
  .gallery-placeholder{
    flex:0 0 min(88%, 760px); aspect-ratio:2/1; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.92); font-family:'Inter', sans-serif; font-size:40px; font-weight:700;
  }
  .gallery-nav{
    position:absolute; top:50%; transform:translateY(-50%); z-index:3;
    width:38px; height:38px; border-radius:50%; border:none;
    display:flex; align-items:center; justify-content:center;
    background:rgba(27,42,61,0.45); color:#fff;
  }
  .gallery-nav:hover{background:rgba(27,42,61,0.72);}
  .gallery-prev{left:14px;}
  .gallery-next{right:14px;}
  .gallery-counter{text-align:center; margin-top:8px; font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);}

  .lightbox{display:none; position:fixed; inset:0; background:rgba(27,42,61,0.92); z-index:200; align-items:center; justify-content:center; padding:32px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:8px; user-select:none;}
  .lightbox-close{position:absolute; top:24px; right:32px; background:none; border:none; color:var(--paper); opacity:0.8; z-index:2;}
  .lightbox-close:hover{opacity:1;}
  .lightbox-nav{position:absolute; top:0; bottom:0; width:15%; min-width:56px; display:flex; align-items:center; background:none; border:none; color:var(--paper); opacity:0.6;}
  .lightbox-nav:hover{opacity:1;}
  .lightbox-prev{left:0; justify-content:flex-start; padding-left:18px;}
  .lightbox-next{right:0; justify-content:flex-end; padding-right:18px;}
  .lightbox-counter{
    position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:2;
    color:#fff; font-size:13px; font-weight:600; font-family:'IBM Plex Mono', monospace;
    background:rgba(27,42,61,0.6); padding:6px 14px; border-radius:100px; backdrop-filter:blur(3px);
  }
  /* "Tümünü Gör" ızgara görünümü — bkz. js/components/gallery.js#initDetailGallery, buton/ızgara
     elemanları buradaki markup'ta değil, .lightbox'ın İÇİNE JS tarafından dinamik eklenir; burada
     yalnızca CSS tanımlanır (bkz. AYNI blok js/components/product-modal.js#injectStyles, paylaşılan
     stylesheet olmadığından iki yerde de tutulur). Buton .lightbox-close İLE BİREBİR AYNI çerçevesiz/
     metinsiz/ikon-only stile sahip (bkz. kullanıcı isteği: minimalist, X ile aynı boyut/renk). */
  .lightbox-grid-toggle{
    position:absolute; top:24px; right:78px; background:none; border:none;
    color:var(--paper); opacity:0.8; z-index:2;
  }
  .lightbox-grid-toggle:hover{opacity:1;}
  .lightbox-grid{display:none; position:absolute; inset:0; z-index:1; background:rgba(27,42,61,0.97); overflow-y:auto; padding:76px 24px 32px;}
  .lightbox.grid-mode .lightbox-grid{display:block;}
  /* ÖNEMLİ gerçek bulgu: `.lightbox.grid-mode img` (doğrudan çocuk kısıtlaması OLMADAN) ızgara
     kutucuklarının İÇİNDEKİ <img>'leri de eşleştiriyordu — .lightbox-grid-item img'nin kendi
     display:block kuralından (aşağıda) daha yüksek özgüllüğe sahip olduğundan onu eziyordu, thumbnail'lar
     boş/beyaz kutu olarak render oluyordu. `>` (doğrudan çocuk) sınırlaması yalnızca tekli lightbox
     görselini (lightbox'ın DOĞRUDAN çocuğu) hedefler, ızgaradaki (birkaç seviye iç içe) img'lere hiç
     dokunmaz — artık özgüllük çakışması bile yok, seçici yapısal olarak eşleşmiyor.
   */
  .lightbox.grid-mode > img,
  .lightbox.grid-mode .lightbox-nav,
  .lightbox.grid-mode .lightbox-counter{display:none;}
  .lightbox-grid-list{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; max-width:1080px; margin:0 auto;}
  .lightbox-grid-item{aspect-ratio:1/1; border-radius:10px; overflow:hidden; display:block; background:var(--paper-card);}
  .lightbox-grid-item img{width:100%; height:100%; object-fit:cover; display:block;}
  @media (max-width:768px){
    .lightbox-grid{padding:60px 14px 24px;}
    .lightbox-grid-list{grid-template-columns:repeat(2, 1fr); gap:10px;}
  }

  .related-section{margin-top:32px; padding-top:28px; border-top:1px solid var(--line);}
  .related-title{font-family:'Inter', sans-serif; font-size:17px; font-weight:700; margin:0 0 16px;}
  /* Kart başlığı artık görselin ÜZERİNDE değil ALTINDA (bkz. kullanıcı isteği: tüm sayfa/görünümlerde
     gönderi başlıkları görselin altında olsun) — .related-card-photo görseli aspect-ratio'lu bir
     kutuya alır, .related-card-title normal akışta onun altına düz arkaplanla oturur. */
  .related-card{display:block; border-radius:12px; overflow:hidden; background:var(--paper-card); border:1px solid var(--line-soft);}
  /* background: yükleme sırasında (yavaş bağlantı) veya görsel 404/hata verirse kutu şeffaf/beyaz
     kalmasın diye nötr gri (bkz. kullanıcı isteği: pop-up görsellerinin bazen beyaz kalması sorunu). */
  .related-card-photo{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--paper-alt);}
  .related-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .related-card-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.92); font-family:'Inter', sans-serif; font-size:22px; font-weight:700;}
  .related-card-title{
    padding:10px 14px 12px;
    color:var(--ink); font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700;
  }
  /* -webkit-line-clamp KESİNLİKLE padding taşıyan elemanın ÜZERİNDE değil, padding'siz bir İÇ
     elemanda uygulanmalı (bkz. kullanıcı isteği: "üç noktadan sonra kelime gelmemeli") — WebKit'in
     bilinen bir kusuru: line-clamp + padding-bottom AYNI kutuda olduğunda, kırpılan 4. satırın bir
     kısmı padding alanının içinden sızıp görünür kalıyordu (gerçek bulgu: "İzmir Musevi Cemaati
     Merkez Binası — Şaar…" satırının hemen altında "Aşamavim" kelimesi görünüyordu). Padding'i
     .related-card-title'da (dış kutu), kırpmayı padding'siz .related-card-title-clamp'te (iç metin)
     ayırmak bu sızıntıyı ortadan kaldırır.
  */
  .related-card-title-clamp{
    line-height:1.3; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;
  }
  /* MİMARLAB AI, Faz 2 (bkz. kullanıcı isteği: "Bu projeler neden ilişkili?" sorusuna cevap
     verilebilsin) — js/components/office-modal.js#.related-card-subtitle İLE BİREBİR AYNI stil,
     RelatedProjects/CityProjects kartlarının altında hangi kritere göre önerildiğini (Aynı Mimar,
     Aynı Şehir, Yakın Yıl vb.) gösteren küçük, deterministik bir etiket için. Sayısal bir "eşleşme
     yüzdesi" DEĞİL, yalnızca gerçek ortak alanı adlandıran düz metin (bkz. kullanıcı isteği:
     "anlamsız yüzde skorları üretme").
  */
  .related-card-subtitle{font-size:11px; font-weight:500; color:var(--ink-soft); margin-top:2px;}
  .related-grid-scroll{display:flex; gap:16px; overflow-x:auto; scroll-behavior:smooth; scrollbar-width:none; padding-bottom:4px;}
  .related-grid-scroll::-webkit-scrollbar{display:none;}
  .related-grid-scroll .related-card{flex:0 0 200px;}

  .prevnext{margin-top:32px; padding-top:24px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:16px;}
  .prevnext a{display:flex; align-items:center; gap:10px; flex:1; max-width:48%; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--paper-card); font-size:13.5px; color:var(--ink-soft);}
  .prevnext a:hover{border-color:var(--walnut);}
  .prevnext a.next{text-align:right; margin-left:auto; flex-direction:row-reverse;}
  .prevnext-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--paper-alt);}
  .prevnext-thumb-placeholder{display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Inter', sans-serif; font-weight:700; font-size:14px;}
  .prevnext-text{min-width:0; flex:1;}
  .prevnext-label{display:block; font-size:11px; letter-spacing:0.06em; color:var(--sage); margin-bottom:4px;}
  /* display:block ZORUNLU — bkz. proje.html#.prevnext-title'daki AYNI gerekçe: span varsayılan
     inline olduğundan overflow:hidden/ellipsis genişlik kısıtlamaz, mobilde metin kutunun dışına
     taşıyordu (bkz. kullanıcı isteği). */
  /* Tek satır+nowrap yerine 3 satıra kadar sarılan clamp (bkz. kullanıcı isteği: "Önceki/Sonraki
     butonlarından başlık aşağı doğru 3 satır devam edebilsin, 3 satırı geçiyorsa üç nokta ile
     sonlandır") — .related-card-title-clamp İLE AYNI desen, bkz. o dosyadaki AYNI gerekçe. */
  .prevnext-title{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis; word-break:break-word; font-family:'Inter', sans-serif; font-size:14px; font-weight:700; color:var(--ink); line-height:1.3;}

  /* Skeleton — ertelenmiş bölümler (yorumlar/diğer projeler/ilgili projeler/ürünler) veri gelene
     kadar (bkz. kullanıcı isteği: lazy/deferred). display:none DEĞİL, gerçek bir layout kutusu
     olması gerekiyor ki IntersectionObserver tetiklenebilsin (bkz. project-modal.js#observeOnce). */
  .skeleton-card{background:linear-gradient(90deg, var(--paper-alt) 25%, var(--paper) 37%, var(--paper-alt) 63%); background-size:400% 100%; animation:skeleton-pulse 1.4s ease infinite; border:none;}
  .skeleton-line{background:linear-gradient(90deg, var(--paper-alt) 25%, var(--paper) 37%, var(--paper-alt) 63%); background-size:400% 100%; animation:skeleton-pulse 1.4s ease infinite;}
  @keyframes skeleton-pulse{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  @media (max-width:860px){
    .related-grid-scroll .related-card{flex:0 0 140px;}
    .related-grid-scroll{gap:10px;}
    .detail-gallery a, .gallery-placeholder{flex-basis:92%;}

    /* Mobil/tablet proje modalı sıra: Galeri → Başlık → En İyi 100 rozeti → Puan+Aksiyon → Künye →
       Açıklama → Diğer Projeler → İlgili Projeler → Şehirdeki Diğer Projeler → Yorumlar → Bilgi
       Kaynağı/Geri Bildirim (bkz. kullanıcı isteği: Yorumlar aşağı taşınıp Geri Bildirim kutusunun
       hemen üstüne alındı; ardından Şehirdeki Diğer Projeler İlgili Projeler'den SONRA gelecek şekilde
       eklendi; ardından #pm-top-rank buraya eklendi — bu satır eklenene kadar bu blokta hiç order
       tanımlı değildi, dolayısıyla varsayılan order:0'a düşüp galeriden bile önce, modalın en üstünde
       çıkıyordu; oysa masaüstünde DOM sırası zaten başlığın hemen altı) — modal-shell.js bu kırılma
       noktasında sol/sağ paneli display:contents yaptığından (bkz. o dosyadaki yorum) tüm bu bölümler
       artık AYNI dikey flex akışının parçası; sıra burada, sırayla artan order değerleriyle verilir.
       .detail-info künye VE açıklamayı TEK blok olarak taşır (zaten aralarında ayrı bir sıra
       gerekmiyor, ikisi de kendi içinde doğru DOM sırasında). #pm-gallery-wrap'ın kendi margin-top'u
       KALDIRILDI — kapatma butonuna karşı üst boşluk artık modal-shell.js#.modal-shell-body'nin
       paylaşılan padding-top'undan (bkz. kullanıcı isteği: X butonu/içerik çakışması, TÜM modallerde)
       geliyor; ikisi birlikte kalsaydı boşluk iki katına çıkardı (gerçek bulgu).
    */
    /* order KESİNLİKLE tam sayı olmalı (CSS <integer> — bkz. gerçek bulgu: bu blokta önceden
       kullanılan 6.5/6.6 gibi ondalıklı değerler geçersiz sayılıp sessizce order:0'a düşüyordu,
       böylece #pm-info-divider/#pm-feedback-card modalın EN ÜSTÜNE, galeriden bile önce zıplıyordu
       — yalnızca hiçbir görsel QA bunu yakalamadığından fark edilmemişti). Aşağıdaki tüm değerler
       bu yüzden ARALIKSIZ tam sayı dizisi olarak yeniden numaralandırıldı. */
    #pm-gallery-wrap{order:1;}
    #pm-title{order:2; margin-top:20px;}
    #pm-top-rank{order:3;}
    #pm-rating-save-row{order:4;}
    #pm-byline{order:5;}
    .detail-info{order:6;}
    #pm-same-designer-section{order:7;}
    #pm-related-section{order:8;}
    #pm-city-section{order:9;}
    #pm-prevnext{order:10;}
    /* Yorumlar — Bilgi Kaynağı & Geri Bildirim ile AYNI gerekçeyle (bkz. kullanıcı isteği) mobil/
       tablette aşağı, Geri Bildirim kutusunun hemen üstüne taşındı; masaüstünde DOM sırası (künye/
       açıklamadan hemen sonra) DEĞİŞMEDİ, yalnızca bu breakpoint'in order değerleri etkilenir.
       #pm-info-divider Yorumlar'ın ÜSTÜNDE kalır (bkz. kullanıcı isteği). */
    #pm-info-divider{order:11;}
    #pm-comments-section{order:12;}
    #pm-feedback-card{order:13;}

    /* Puanla/Kaydet — Apple/Google dokunma hedefi standartları (bkz. kullanıcı isteği): pil
       yüksekliği en az 48px, tıklanabilir alan en az 44x44px. Masaüstü boyutları değişmez, bu kural
       yalnızca bu kırılma noktasının altında geçerli. Satırın tek satırda kalma zorunluluğu (üstteki
       .pm-rating-save-row flex-wrap:nowrap + her pildeki flex-shrink:1/min-width:0/overflow:hidden/
       ellipsis) korunur — büyüyen pil genişliği dar ekranlarda ellipsis ile kendi içinde daralır.
       Paylaş artık ikon-only olduğundan (bkz. share-button.js) buradaki listeden çıkarıldı, kendi
       boyutunu paylaşılan .share-btn 860px kuralından alır. */
    .pm-rating-save-row{gap:8px !important;}
    #pm-save-slot{gap:8px !important;}
    .rating-widget, .save-btn, .pm-rating-save-row .card-save-btn{
      height:48px !important; min-height:48px !important; padding:0 14px !important; font-size:13.5px !important;
    }
    /* .rating-summary'nin ("Puanla" metni) KENDİ font-size:12px !important kuralı var (bkz. yukarıdaki
       taban kural) — bu, yalnızca kapsayıcıya (.rating-widget) uygulanan font-size değişikliğini miras
       almasını ENGELLİYORDU, "Puanla" metni bu kırılma noktasının altında Kaydet'ten (13.5px) daha
       küçük (12px) kalıyordu (gerçek bulgu). İki pilin punto/hiyerarşisi birebir eşit olsun diye
       burada da açıkça 13.5px'e yükseltilir. */
    .rating-summary{font-size:13.5px !important;}
    .rating-star-row{gap:4px;}
    .rating-star-btn svg{width:15px; height:15px;}
  }

  /* Mobil galeri oranı — kullanıcı isteği: masaüstünde 2:1 korunur, yalnızca ≤768px'te dikey alanı
     daha iyi kullanan 4:3'e geçilir. 860px bloğundan SONRA tanımlanır ki aynı özgüllükteki
     aspect-ratio kuralı ≤768px genişliklerde (768px de 860px sorgusunu karşıladığından) kaynak
     sırasına göre onu ezsin. */
  @media (max-width:768px){
    .detail-gallery a, .gallery-placeholder{aspect-ratio:4/3;}
  }
