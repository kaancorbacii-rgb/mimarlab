<base href="/">

<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --accent:#E8A968;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV (her sayfada kopyalı — bkz. js/components/site-chrome.js dosya başı notu) ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{
    display:none;
    background:none; border:1px solid var(--line);
    border-radius:8px; padding:8px;
    color:var(--ink); align-items:center; justify-content:center;
  }
  .nav-mobile-menu{
    display:none;
    position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15);
    flex-direction:column; min-width:220px;
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{
    padding:11px 14px; border-radius:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
    text-transform:uppercase;
  }
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:100px; padding:9px 14px;
    margin-bottom:8px;
  }
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:16px; width:100%; color:var(--ink);
  }
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink);
    padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink);
    font-size:14px; font-weight:600; white-space:nowrap;
    text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- HERO (kullanıcı isteği: co-architecture.com/photos referansı — tam genişlik arka
     plan görseli üzerine başlık + mekan arama kutusu) ---------- */
  .ph-hero{
    position:relative; min-height:340px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:48px 20px 64px; overflow:hidden;
    background:linear-gradient(180deg, rgba(27,42,61,0.55), rgba(27,42,61,0.72)), var(--ink);
    background-size:cover; background-position:center;
  }
  .ph-hero-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; opacity:0.55;}
  .ph-hero > *{position:relative; z-index:1;}
  .ph-hero h1{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:38px; font-weight:700; color:#fff; margin:0 0 10px;
  }
  .ph-hero p{color:rgba(255,255,255,0.82); font-size:14.5px; margin:0 0 26px; max-width:520px;}
  .ph-search{
    display:flex; align-items:center; gap:12px; width:100%; max-width:640px;
  }
  .ph-search-field{
    position:relative; flex:1; display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:100px; padding:12px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .ph-search-field svg{flex-shrink:0; color:#1B2A3D; opacity:0.55;}
  .ph-search-field input{
    flex:1; border:none; outline:none; background:none;
    font-family:inherit; font-size:14px; color:#1B2A3D;
  }
  .ph-search-field input::placeholder{color:#7A8798;}
  .ph-reset-btn{
    flex-shrink:0; background:#12171F; color:#fff; border:none; border-radius:100px;
    padding:12px 22px; font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .ph-reset-btn:hover{background:#232C38;}
  .ph-dropdown{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:20;
    background:#fff; border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,0.18);
    max-height:280px; overflow-y:auto; text-align:left; padding:6px;
  }
  .ph-dropdown[hidden]{display:none;}
  .ph-dropdown-option{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 14px; border-radius:8px; font-size:13.5px; color:#1B2A3D;
  }
  .ph-dropdown-option:hover, .ph-dropdown-option.active{background:#EDF0F3; color:#12171F;}

  /* ---------- IZGARA (Pinterest tarzı masonry — CSS columns, JS layout hesabı gerektirmez) ---------- */
  .ph-grid-wrap{max-width:1400px; margin:0 auto; padding:28px 24px 12px;}
  .ph-grid{columns:4 260px; column-gap:16px;}
  .ph-card{
    display:block; break-inside:avoid; margin-bottom:16px; position:relative;
    border-radius:14px; overflow:hidden; background:var(--paper-alt); cursor:pointer;
  }
  .ph-card img{display:block; width:100%; height:auto;}
  .ph-card-overlay{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; background:linear-gradient(0deg, rgba(0,0,0,0.55), transparent);
  }
  .ph-card-owner{display:flex; align-items:center; gap:7px; min-width:0;}
  .ph-card-owner-avatar{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--walnut); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:700;
  }
  .ph-card-owner-avatar img{width:100%; height:100%; object-fit:cover;}
  .ph-card-owner-name{color:#fff; font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ph-card-save{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.35); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .ph-card-save:hover{background:rgba(0,0,0,0.55);}
  .ph-card-save.saved{color:#E08A3E;}
  .ph-card-save.saved svg{fill:currentColor;}
  .ph-empty{padding:48px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}
  .ph-loadmore-wrap{display:flex; justify-content:center; padding:8px 20px 64px;}
  .ph-loadmore-btn{
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink);
    padding:12px 28px; border-radius:100px; font-size:13.5px; font-weight:600;
  }
  .ph-loadmore-btn:hover{border-color:var(--walnut);}
  .ph-loadmore-btn[disabled]{opacity:0.55; cursor:default;}

  /* ---------- LIGHTBOX (kullanıcı isteği: görsele tıklayınca proje künyesiyle açılsın, ekteki
     2. görseldeki gibi — başlık/konum + "Projeyi paylaşan" + kaydet + kapat/önceki/sonraki) ---------- */
  .ph-lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(10,14,20,0.92);
    display:none; align-items:stretch; justify-content:center;
  }
  .ph-lightbox.open{display:flex;}
  .ph-lightbox-media{
    flex:1; display:flex; align-items:center; justify-content:center; padding:32px; min-width:0;
  }
  .ph-lightbox-media img{max-width:100%; max-height:100%; object-fit:contain; border-radius:4px;}
  .ph-lightbox-info{
    width:340px; flex-shrink:0; background:#12171F; color:#EDF0F3;
    padding:28px 26px; display:flex; flex-direction:column; gap:18px; overflow-y:auto;
  }
  /* display:block ŞART: <a> varsayılan olarak satır içidir ve altındaki .ph-lightbox-location
     ile ÜST ÜSTE biniyordu (ölçüldü, Chromium — konum satırı başlığın üzerine taşıyordu).
     Boşluk negatif margin ile DEĞİL, başlığın kendi margin'iyle verilir. */
  .ph-lightbox-title{display:block; font-size:19px; font-weight:700; color:#fff; line-height:1.3; margin-bottom:5px;}
  .ph-lightbox-title:hover{text-decoration:underline;}
  .ph-lightbox-location{font-size:13px; color:rgba(237,240,243,0.65);}
  .ph-lightbox-spaces{display:flex; flex-wrap:wrap; gap:6px;}
  .ph-lightbox-space-chip{
    font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:100px;
    background:rgba(237,240,243,0.1); color:rgba(237,240,243,0.85);
  }
  .ph-lightbox-owner-label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:rgba(237,240,243,0.5); margin-bottom:8px;}
  .ph-lightbox-owner-row{display:flex; align-items:center; gap:10px;}
  .ph-lightbox-owner-avatar{
    width:34px; height:34px; border-radius:50%; overflow:hidden; flex-shrink:0;
    background:var(--walnut); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .ph-lightbox-owner-avatar img{width:100%; height:100%; object-fit:cover;}
  .ph-lightbox-owner-name{font-size:14px; font-weight:600;}
  .ph-lightbox-save{
    margin-top:auto; align-self:flex-start; display:flex; align-items:center; gap:8px;
    background:none; border:1px solid rgba(237,240,243,0.3); color:#EDF0F3;
    padding:10px 18px; border-radius:100px; font-size:13px; font-weight:600;
  }
  .ph-lightbox-save:hover{border-color:#EDF0F3;}
  .ph-lightbox-save.saved{background:#fff; color:#12171F; border-color:#fff;}
  .ph-lightbox-save.saved svg{fill:currentColor;}
  .ph-lightbox-close, .ph-lightbox-prev, .ph-lightbox-next{
    position:absolute; background:none; border:none; color:#fff; opacity:0.8;
    display:flex; align-items:center; justify-content:center; z-index:2;
  }
  .ph-lightbox-close:hover, .ph-lightbox-prev:hover, .ph-lightbox-next:hover{opacity:1;}
  .ph-lightbox-close{top:20px; right:20px; width:38px; height:38px;}
  .ph-lightbox-prev{top:50%; left:16px; transform:translateY(-50%); width:44px; height:44px;}
  .ph-lightbox-next{top:50%; right:356px; transform:translateY(-50%); width:44px; height:44px;}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
    .ph-grid{columns:3 200px;}
  }
  @media (max-width:720px){
    .ph-hero{min-height:280px; padding:36px 16px 48px;}
    .ph-hero h1{font-size:28px;}
    .ph-search{flex-direction:column; align-items:stretch;}
    .ph-reset-btn{width:100%;}
    .ph-grid{columns:2 150px; column-gap:10px;}
    .ph-card{margin-bottom:10px; border-radius:10px;}
    .ph-grid-wrap{padding:20px 12px 8px;}
    .ph-lightbox{flex-direction:column;}
    .ph-lightbox-media{padding:16px; padding-bottom:0;}
    .ph-lightbox-info{width:100%; padding:18px 20px 28px;}
    .ph-lightbox-next{right:20px; top:auto; bottom:calc(38% + 12px); transform:none;}
    .ph-lightbox-prev{top:auto; bottom:calc(38% + 12px); transform:none;}
  }
</style>
</head>

<script>
// FOTOĞRAF SAYFASI (kullanıcı isteği, 2026-09-17): "Ekteki görseldeki ve
// https://co-architecture.com/photos bu linkteki şekilde siteye yüklenen projelerin
// görsellerinin yükleme sırasına göre en son yüklenenden ilk yüklenene doğru sıralanacağı bir
// sayfa yapacağız ... Mekan filtremesini yapay zeka yapsın. Görsele tıklayınca da lightbox
// şeklinde açılacak ve projenin künyesi ... sergilenecek."
//
// HİÇBİR MENÜDE YOK: ne üst menüde, ne mobil çekmecede, ne altbilgide bir bağlantısı vardır
// (js/components/site-chrome.js'e DOKUNULMADI). Sayfa yalnızca doğrudan adresle ve
// /sitemap.xml üzerinden bulunur (bkz. src/index.js#SITEMAP_STATIC_PAGES).
//
// Veri kaynağı: GET /api/photos (bkz. src/routes/photos.js) — src/lib/photoPool.js'in KV-önbellekli
// havuzunu mekan filtresine göre süzüp sayfalar. Sıralama SUNUCUDA yapılır (proje created_at DESC,
// proje İÇİNDE images[] dizisinin kendi sırası) — istemci yalnızca gelen sırayı render eder.
(function(){
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function initialsOf(name){ return (name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase(); }

  const grid = document.getElementById('ph-grid');
  const emptyEl = document.getElementById('ph-empty');
  const loadMoreBtn = document.getElementById('ph-loadmore-btn');
  const searchInput = document.getElementById('ph-search-input');
  const dropdown = document.getElementById('ph-dropdown');
  const resetBtn = document.getElementById('ph-reset-btn');

  const PAGE_SIZE = 60;
  let currentSpace = '';
  let offset = 0;
  let items = []; // o ana kadar yüklenmiş TÜM kartlar — lightbox önceki/sonraki için
  let loading = false;
  let exhausted = false;

  // ---------- Mekan arama dropdown'ı (photo-space-taxonomy.js#PHOTO_SPACE_OPTIONS) ----------
  function renderDropdown(query){
    const q = (query || '').toLocaleLowerCase('tr').trim();
    const list = (typeof PHOTO_SPACE_OPTIONS !== 'undefined' ? PHOTO_SPACE_OPTIONS : [])
      .filter(s => !q || s.toLocaleLowerCase('tr').includes(q));
    if(!list.length){ dropdown.innerHTML = '<div class="ph-dropdown-option" style="opacity:0.6;">Sonuç bulunamadı.</div>'; return; }
    dropdown.innerHTML = list.map(s =>
      `<button type="button" class="ph-dropdown-option${s === currentSpace ? ' active' : ''}" data-space="${escapeAttr(s)}">${escapeHtml(s)}</button>`
    ).join('');
    dropdown.querySelectorAll('[data-space]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentSpace = btn.dataset.space;
        searchInput.value = currentSpace;
        dropdown.hidden = true;
        reload();
      });
    });
  }
  searchInput.addEventListener('focus', () => { renderDropdown(searchInput.value); dropdown.hidden = false; });
  searchInput.addEventListener('input', () => { renderDropdown(searchInput.value); dropdown.hidden = false; });
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.ph-search-field')) dropdown.hidden = true;
  });
  resetBtn.addEventListener('click', () => {
    currentSpace = '';
    searchInput.value = '';
    dropdown.hidden = true;
    reload();
  });

  // ---------- Izgara ----------
  function cardHtml(item, idx){
    const src = (typeof cdnImg === 'function') ? cdnImg(item.url, 600) : item.url;
    const srcset = (typeof cdnSrcset === 'function') ? cdnSrcset(item.url, [400, 600, 800]) : '';
    return `
    <a class="ph-card" role="button" tabindex="0" data-idx="${idx}" aria-label="${escapeAttr(item.projectTitle || '')}">
      <img src="${escapeAttr(src)}"${srcset ? ` srcset="${escapeAttr(srcset)}" sizes="(max-width:720px) 50vw, 260px"` : ''} alt="${escapeAttr(item.projectTitle || '')}" loading="lazy" decoding="async">
      <div class="ph-card-overlay">
        <div class="ph-card-owner">
          <div class="ph-card-owner-avatar">${item.ownerPhoto ? `<img src="${escapeAttr(item.ownerPhoto)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : escapeHtml(initialsOf(item.ownerName))}</div>
          <div class="ph-card-owner-name">${escapeHtml(item.ownerName)}</div>
        </div>
        <button type="button" class="ph-card-save" data-idx="${idx}" aria-label="Kaydet">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
        </button>
      </div>
    </a>`;
  }

  function appendCards(newItems, startIdx){
    grid.insertAdjacentHTML('beforeend', newItems.map((it, i) => cardHtml(it, startIdx + i)).join(''));
    grid.querySelectorAll(`.ph-card`).forEach(card => {
      if(card.dataset.wired) return;
      card.dataset.wired = '1';
      card.addEventListener('click', (e) => {
        if(e.target.closest('.ph-card-save')) return;
        openLightbox(Number(card.dataset.idx));
      });
      card.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLightbox(Number(card.dataset.idx)); }
      });
    });
    grid.querySelectorAll('.ph-card-save').forEach(btn => {
      if(btn.dataset.wired) return;
      btn.dataset.wired = '1';
      const idx = Number(btn.dataset.idx);
      wirePhotoSaveBtn(btn, () => items[idx]);
    });
  }

  async function loadPage(reset){
    if(loading || (exhausted && !reset)) return;
    loading = true;
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Yükleniyor…';
    try{
      const params = new URLSearchParams({ limit: String(PAGE_SIZE), offset: String(reset ? 0 : offset) });
      if(currentSpace) params.set('space', currentSpace);
      const res = await fetch(`/api/photos?${params.toString()}`);
      const data = res.ok ? await res.json() : { items: [], hasMore: false };
      const newItems = data.items || [];
      if(reset){ items = newItems; offset = newItems.length; grid.innerHTML = ''; appendCards(newItems, 0); }
      else { const start = items.length; items = items.concat(newItems); offset += newItems.length; appendCards(newItems, start); }
      exhausted = !data.hasMore;
      loadMoreBtn.style.display = exhausted ? 'none' : '';
      emptyEl.style.display = items.length ? 'none' : '';
    } catch { /* ağ hatası — mevcut ızgara olduğu gibi kalır, kullanıcı "Daha Fazla Göster"i tekrar deneyebilir */ }
    loading = false;
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Daha Fazla Göster';
  }
  function reload(){ exhausted = false; loadPage(true); }
  loadMoreBtn.addEventListener('click', () => loadPage(false));

  // ---------- Kaydet (image tipi — bkz. save-widget.js, Koleksiyonum > Görsel filtresi) ----------
  // save-widget.js sayfa yüklenişinde YALNIZCA .card-save-btn sınıfını otomatik tarar; bu sayfanın
  // hem ızgara hem lightbox düğmeleri KENDİ sınıflarını taşıyor (çakışma riskini sıfırlamak için,
  // bkz. gallery.js#lightboxSaveBtn'deki AYNI gerekçe) — bu yüzden her biri wireSaveButton() ile
  // TEK TEK, elle bağlanır.
  // wireSaveButton HER çağrıda düğmeyi YENİDEN BOYAR ama dinleyiciyi yalnızca BİR kez takar
  // (dataset.saveWired bayrağı, bkz. save-widget.js) — lightbox düğmesinin data-key'i her görselde
  // değiştiğinden bu şart. save-widget.js yüklenmemişse (defer sırası) düğme işlevsiz kalmasın
  // diye gizlenir: gallery.js#paintSaveBtnForImage'daki AYNI kontrol/gerekçe.
  function wirePhotoSaveBtn(btn, getItem){
    const item = getItem();
    if(!item) return;
    if(typeof wireSaveButton !== 'function'){ btn.style.display = 'none'; return; }
    btn.style.display = '';
    btn.dataset.type = 'image';
    btn.dataset.key = item.url;
    btn.dataset.image = item.url;
    btn.dataset.title = item.projectTitle || '';
    btn.dataset.meta = item.projectLocation || '';
    btn.dataset.href = item.url;
    wireSaveButton(btn, 'image');
  }

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('ph-lightbox');
  const lbImg = document.getElementById('ph-lightbox-img');
  const lbTitle = document.getElementById('ph-lightbox-title');
  const lbLocation = document.getElementById('ph-lightbox-location');
  const lbSpaces = document.getElementById('ph-lightbox-spaces');
  const lbOwnerAvatar = document.getElementById('ph-lightbox-owner-avatar');
  const lbOwnerName = document.getElementById('ph-lightbox-owner-name');
  const lbSaveBtn = document.getElementById('ph-lightbox-save');
  let lightboxIdx = -1;

  function renderLightbox(){
    const item = items[lightboxIdx];
    if(!item) return;
    const src = (typeof cdnImg === 'function') ? cdnImg(item.url, 1600) : item.url;
    lbImg.src = src;
    lbImg.alt = item.projectTitle || '';
    lbTitle.textContent = item.projectTitle || '';
    lbTitle.href = item.projectSlug ? `/proje/${encodeURIComponent(item.projectSlug)}` : '#';
    lbLocation.textContent = item.projectLocation || '';
    lbLocation.style.display = item.projectLocation ? '' : 'none';
    lbSpaces.innerHTML = (item.spaces || []).map(s => `<span class="ph-lightbox-space-chip">${escapeHtml(s)}</span>`).join('');
    lbOwnerName.textContent = item.ownerName || 'MİMARLAB';
    lbOwnerAvatar.innerHTML = item.ownerPhoto
      ? `<img src="${escapeAttr(item.ownerPhoto)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`
      : escapeHtml(initialsOf(item.ownerName));
    wirePhotoSaveBtn(lbSaveBtn, () => items[lightboxIdx]);
  }
  async function openLightbox(idx){
    lightboxIdx = idx;
    renderLightbox();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    // Sona yakınsa (kaydırma) sonraki sayfayı sessizce ısıt — kullanıcı "sonraki"ye bastığında
    // beklemesin.
    if(!exhausted && lightboxIdx >= items.length - 5) loadPage(false);
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  function stepLightbox(delta){
    const next = lightboxIdx + delta;
    if(next < 0 || next >= items.length) return;
    lightboxIdx = next;
    renderLightbox();
    if(!exhausted && lightboxIdx >= items.length - 5) loadPage(false);
  }
  document.getElementById('ph-lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('ph-lightbox-prev').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('ph-lightbox-next').addEventListener('click', () => stepLightbox(1));
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') stepLightbox(-1);
    else if(e.key === 'ArrowRight') stepLightbox(1);
  });

  // DOMContentLoaded'ı BEKLEMEK ŞART: bu satır içi betik ayrıştırma sırasında, TÜM `defer`'lı
  // betiklerden ÖNCE çalışır (defer sözleşmesi) — yani save-widget.js#wireSaveButton ve
  // photo-space-taxonomy.js#PHOTO_SPACE_OPTIONS o anda henüz TANIMSIZDIR. İlk çizim beklemeden
  // yapılırsa ızgaradaki Kaydet düğmeleri kalıcı olarak gizlenir (wirePhotoSaveBtn'in güvenli
  // dalı) ve mekan dropdown'ı boş kalırdı.
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reload);
  else reload();
})();
</script>
</body>
</html>
