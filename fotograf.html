<base href="/">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --accent:#E8A968;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV (her sayfada kopyalı — bkz. js/components/site-chrome.js dosya başı notu) ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{
    display:none;
    background:none; border:1px solid var(--line);
    border-radius:8px; padding:8px;
    color:var(--ink); align-items:center; justify-content:center;
  }
  .nav-mobile-menu{
    display:none;
    position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15);
    flex-direction:column; min-width:220px;
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{
    padding:11px 14px; border-radius:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
    text-transform:uppercase;
  }
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:100px; padding:9px 14px;
    margin-bottom:8px;
  }
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:16px; width:100%; color:var(--ink);
  }
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink);
    padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink);
    font-size:14px; font-weight:600; white-space:nowrap;
    text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- HERO ---------- */
  .ph-hero{
    position:relative; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:56px 20px 74px;
    background:linear-gradient(180deg, rgba(27,42,61,0.55), rgba(27,42,61,0.72)), var(--ink);
  }
  .ph-hero > *{position:relative; z-index:1;}
  /* ARAMA ÇUBUĞU YAPIŞKAN (kullanıcı isteği, 2026-09-18 madde 1 — referans: co-architecture.com/
     photos, kaydırdıkça pil üstte kalır). Hero'nun İÇİNDE DEĞİL, hemen ALTINDA kendi sticky
     kapsayıcısında: sticky, kapsayıcısının sınırları içinde çalışır — hero içinde olsaydı hero
     ekrandan çıkınca çubuk da giderdi. Üst kenar nav'ın altına (nav ~62px). Negatif margin pili
     hero'nun alt kenarına bindirir (referanstaki gibi).
     KÖK NEDEN (madde 2, "arama kısmı içeriğin arkasına geliyor"): eski hero `overflow:hidden`
     taşıyordu ve dropdown hero'nun alt kenarında KIRPILIYOR, kalan kısmı da DOM'da daha sonra gelen
     ızgara kartlarının (kendi stacking context'i yok ama sırayla üstte boyanıyor) ARKASINDA
     kalıyordu. overflow:hidden kaldırıldı; sticky kapsayıcı z-index:30 ile ızgaranın (z-index yok)
     üstünde, nav'ın (40) altında durur; dropdown onun içinde. */
  .ph-search-sticky{
    position:sticky; top:66px; z-index:30;
    display:flex; justify-content:center; padding:0 20px; margin-top:-32px; pointer-events:none;
  }
  .ph-search-sticky > *{pointer-events:auto;}
  .ph-hero h1{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:38px; font-weight:700; color:#fff; margin:0 0 10px;
  }
  .ph-hero p{color:rgba(255,255,255,0.82); font-size:14.5px; margin:0 0 26px; max-width:520px;}
  .ph-search{
    display:flex; align-items:center; gap:10px; width:100%; max-width:720px;
    background:#fff; border-radius:100px; padding:8px 8px 8px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
  }
  .ph-search-field{position:relative; flex:1; display:flex; align-items:center; gap:10px; min-width:0;}
  .ph-search-field svg{flex-shrink:0; color:#1B2A3D; opacity:0.55;}
  .ph-search-field input{
    flex:1; border:none; outline:none; background:none;
    font-family:inherit; font-size:14px; color:#1B2A3D;
  }
  /* Sayfa genelindeki :focus-visible kuralı (yukarıda) her odaklanan öğeye iç mavi çerçeve
     çizer; arama kutusunda bu bir "mavi dikdörtgen" olarak görünüyordu (kullanıcı isteği,
     2026-09-17 ikinci tur madde 3). Odak durumu zaten dropdown'ın açılmasıyla belli. */
  .ph-search-field input:focus-visible, .ph-search-field input:focus{box-shadow:none; outline:none;}
  .ph-search-field input::placeholder{color:#7A8798;}
  .ph-reset-btn{
    flex-shrink:0; background:#12171F; color:#fff; border:none; border-radius:100px;
    padding:11px 22px; font-size:13.5px; font-weight:600; white-space:nowrap;
  }
  .ph-reset-btn:hover{background:#232C38;}
  .ph-dropdown{
    position:absolute; top:calc(100% + 16px); left:-18px; right:0; z-index:20;
    background:#fff; border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,0.18);
    max-height:300px; overflow-y:auto; text-align:left; padding:6px;
  }
  .ph-dropdown[hidden]{display:none;}
  .ph-dropdown-option{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:10px 14px; border-radius:8px; font-size:13.5px; color:#1B2A3D;
  }
  .ph-dropdown-option:hover, .ph-dropdown-option.active{background:#EDF0F3; color:#12171F;}
  .ph-dropdown-note{padding:10px 14px; font-size:12.5px; color:#7A8798;}

  /* ---------- IZGARA (masonry — CSS columns) ---------- */
  .ph-grid-wrap{max-width:1400px; margin:0 auto; padding:40px 24px 12px;}
  .ph-grid{columns:4 260px; column-gap:16px;}
  .ph-card{
    display:block; break-inside:avoid; margin-bottom:16px; position:relative;
    border-radius:14px; overflow:hidden; background:var(--paper-alt); cursor:pointer;
  }
  .ph-card img{display:block; width:100%; height:auto;}
  .ph-card-overlay{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px; background:linear-gradient(0deg, rgba(0,0,0,0.55), transparent);
  }
  /* Kartın altında MİMARLIK FİRMASI (yoksa mimar) adı (kullanıcı isteği, madde 4) — avatar yok. */
  .ph-card-credit{color:#fff; font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .ph-card-save{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; border:none;
    background:rgba(0,0,0,0.35); color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .ph-card-save:hover{background:rgba(0,0,0,0.55);}
  .ph-card-save.saved{color:#E08A3E;}
  .ph-card-save.saved svg{fill:currentColor;}
  .ph-empty{padding:48px 20px; text-align:center; color:var(--ink-soft); font-size:14px;}
  .ph-loadmore-wrap{display:flex; justify-content:center; padding:8px 20px 64px;}
  .ph-loadmore-btn{
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink);
    padding:12px 28px; border-radius:100px; font-size:13.5px; font-weight:600;
  }
  .ph-loadmore-btn:hover{border-color:var(--walnut);}
  .ph-loadmore-btn[disabled]{opacity:0.55; cursor:default;}

  /* ---------- LIGHTBOX ----------
     Sağ panel BEYAZ (madde 8); üst satırda Kaydet · Paylaş · X (madde 7), başlık bu satırdan
     SONRA başlar; fotoğrafçı adı görselin HEMEN altında (madde 6, proje lightbox'ındaki "© Ad"
     ile aynı); görselin DIŞINA tıklamak kapatır (madde 9). Panel renkleri temaya bağlanmaz —
     lightbox bir overlay'dir, gece modunda da beyaz kalır. */
  .ph-lightbox{
    position:fixed; inset:0; z-index:200; background:rgba(10,14,20,0.92);
    display:none; align-items:stretch; justify-content:center;
  }
  .ph-lightbox.open{display:flex;}
  .ph-lightbox-media{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; min-width:0; cursor:zoom-out;
  }
  .ph-lightbox-media img{max-width:100%; max-height:calc(100% - 34px); object-fit:contain; border-radius:4px; cursor:default;}
  .ph-lightbox-credit{
    margin-top:10px; font-size:12.5px; color:rgba(237,240,243,0.92); background:rgba(27,42,61,0.55);
    padding:5px 10px; border-radius:6px; max-width:80%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:default;
  }
  .ph-lightbox-credit[hidden]{display:none;}
  .ph-lightbox-info{
    width:340px; flex-shrink:0; background:#fff; color:#1B2A3D;
    padding:18px 22px 26px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;
  }
  .ph-lightbox-bar{display:flex; align-items:center; justify-content:flex-end; gap:8px;}
  .ph-lightbox-save, .ph-lightbox-close{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:32px; height:32px; box-sizing:border-box; padding:0;
    background:#F8FAFB; border:1px solid rgba(27,42,61,0.14); border-radius:100px; color:#4E6478;
  }
  .ph-lightbox-save:hover, .ph-lightbox-close:hover{border-color:#2B425F; color:#1B2A3D;}
  .ph-lightbox-save.saved{background:#1B2A3D; color:#fff; border-color:#1B2A3D;}
  .ph-lightbox-save.saved svg{fill:currentColor;}
  /* share-button.js'in enjekte ettiği .share-btn temaya (var(--paper-card)) bağlı; beyaz panelde
     açık tema değerlerine sabitlenir. */
  .ph-lightbox-info .share-btn{background:#F8FAFB; border-color:rgba(27,42,61,0.14); color:#4E6478;}
  .ph-lightbox-info .share-btn:hover{border-color:#2B425F; color:#1B2A3D;}
  .ph-lightbox-title{display:block; font-size:19px; font-weight:700; color:#1B2A3D; line-height:1.3; margin-bottom:5px;}
  .ph-lightbox-title:hover{text-decoration:underline;}
  .ph-lightbox-location{font-size:13px; color:#4E6478;}
  /* Künye — proje pop-up'ındaki SIRAYLA (Mimar, Mimarlık Firması, Tür, Tip, Grup, Yer, Yıl, Ödül;
     Fotoğraf satırı HARİÇ — o görselin altında). Düz metin satırları (kullanıcı isteği, 2026-09-18
     madde 3: "sırayla direkt yazsın"). */
  .ph-lightbox-meta{display:flex; flex-direction:column; gap:7px; font-size:13px; color:#1B2A3D; line-height:1.45;}
  .ph-lightbox-meta strong{font-weight:600;}
  .ph-lightbox-meta a{color:#2B425F; text-decoration:underline; text-decoration-color:rgba(43,66,95,0.35);}
  .ph-lightbox-via{font-size:11.5px; color:#7A8798;}
  .ph-lightbox-spaces{display:flex; flex-wrap:wrap; gap:6px;}
  .ph-lightbox-space-chip{
    font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:100px;
    background:#EDF0F3; color:#1B2A3D;
  }
  .ph-lightbox-prev, .ph-lightbox-next{
    position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px;
    background:none; border:none; color:#fff; opacity:0.8; z-index:2;
    display:flex; align-items:center; justify-content:center;
  }
  .ph-lightbox-prev:hover, .ph-lightbox-next:hover{opacity:1;}
  .ph-lightbox-prev{left:16px;}
  .ph-lightbox-next{right:356px;}

  /* ---------- FOOTER (her sayfada kopyalı; site-chrome.js yalnızca markup'ı üretir) ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{
    max-width:1080px; margin:0 auto;
    padding:48px 32px 32px;
    display:grid; grid-template-columns:2fr 1fr 1fr 1fr;
    gap:32px;
  }
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
    .ph-grid{columns:3 200px;}
  }
  @media (max-width:720px){
    .ph-hero{min-height:280px; padding:36px 16px 48px;}
    .ph-hero h1{font-size:28px;}
    .ph-search-sticky{top:58px; padding:0 12px; margin-top:-26px;}
    .ph-search{padding:6px 6px 6px 14px; gap:6px;}
    .ph-reset-btn{padding:10px 14px; font-size:12.5px;}
    .ph-dropdown{left:-14px;}
    .ph-grid{columns:2 150px; column-gap:10px;}
    .ph-card{margin-bottom:10px; border-radius:10px;}
    .ph-grid-wrap{padding:20px 12px 8px;}
    .ph-lightbox{flex-direction:column;}
    .ph-lightbox-media{padding:16px; padding-bottom:8px; flex:1 1 60%;}
    .ph-lightbox-info{width:100%; padding:14px 18px 24px; flex:0 0 auto; max-height:44%;}
    .ph-lightbox-prev, .ph-lightbox-next{top:30%;}
    .ph-lightbox-next{right:16px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }
</style>
</head>
<body>
<script src="js/overlay-manager.js" defer></script>
<!-- image-cdn.js SENKRON (kisi.html'deki AYNI gerekçe): ilk kart çizimi cdnImg/cdnSrcset'e bağlı. -->

<script src="auth-nav.js" defer></script>
<script src="save-widget.js" defer></script>
<script src="js/components/share-button.js" defer></script>
<script src="photo-space-taxonomy.js" defer></script>
<!-- lazy-modals.js — lightbox'taki proje başlığı bağlantısı (bkz. #ph-lightbox-title) gerçek bir
     <a href="/proje/:slug">'dır; bu script sitenin her yerinde olduğu gibi o tıklamayı yakalayıp
     tam proje popup'ını AYNI belgede açar. -->
<script src="js/components/lazy-modals.js" defer></script>
<script src="js/components/broken-image-fallback.js" defer></script>

  <div id="site-header-mount" data-nav-active="fotograf"></div>
  <script src="js/components/site-chrome.js"></script>

  <div class="ph-hero">
    <h1>Fotoğraflar</h1>
    <p>Projeler arasından sana ilham verecek mekanları ara ve bul.</p>
  </div>
  <div class="ph-search-sticky">
    <div class="ph-search">
      <div class="ph-search-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="ph-search-input" placeholder="Mekana göre ara (Oturma Odası, Mutfak ve daha fazlası)" autocomplete="off" aria-label="Mekana göre ara">
        <div class="ph-dropdown" id="ph-dropdown" hidden></div>
      </div>
      <button type="button" class="ph-reset-btn" id="ph-reset-btn">Sıfırla</button>
    </div>
  </div>

  <div class="ph-grid-wrap">
    <div class="ph-grid" id="ph-grid"></div>
    <div class="ph-empty" id="ph-empty" style="display:none;">Bu mekana ait fotoğraf bulunamadı.</div>
  </div>
  <div class="ph-loadmore-wrap">
    <div id="ph-loadmore-sentinel" aria-hidden="true"></div>
    <button type="button" class="ph-loadmore-btn" id="ph-loadmore-btn" style="display:none;">Daha Fazla Göster</button>
  </div>

  <div class="ph-lightbox" id="ph-lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button type="button" class="ph-lightbox-prev" id="ph-lightbox-prev" aria-label="Önceki görsel">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button type="button" class="ph-lightbox-next" id="ph-lightbox-next" aria-label="Sonraki görsel">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="ph-lightbox-media" id="ph-lightbox-media">
      <img id="ph-lightbox-img" src="" alt="">
      <div class="ph-lightbox-credit" id="ph-lightbox-credit" hidden></div>
    </div>
    <div class="ph-lightbox-info">
      <div class="ph-lightbox-bar" id="ph-lightbox-bar">
        <button type="button" class="ph-lightbox-save" id="ph-lightbox-save" aria-label="Kaydet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
        </button>
        <span id="ph-lightbox-share-slot"></span>
        <button type="button" class="ph-lightbox-close" id="ph-lightbox-close" aria-label="Kapat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div>
        <a class="ph-lightbox-title" id="ph-lightbox-title" href="#"></a>
      </div>
      <div class="ph-lightbox-meta" id="ph-lightbox-meta"></div>
      <div class="ph-lightbox-spaces" id="ph-lightbox-spaces"></div>
    </div>
  </div>

  <footer id="site-footer-mount"></footer>

<script src="badge-shared.js"></script>
<script src="js/analytics-beacon.js" defer></script>
<script>
// FOTOĞRAF SAYFASI (kullanıcı isteği, 2026-09-17; ikinci tur aynı gün: footer, metin, sabit mekan
// sırası, firma/mimar etiketi, yükleyen bilgisi yok, fotoğrafçı, Kaydet·Paylaş·X satırı, beyaz panel,
// dışarı tıkla-kapat, blurlu görsel yok, AI destekli arama, ana menüye ekleme).
//
// Veri kaynağı: GET /api/photos (bkz. src/routes/photos.js) — src/lib/photoPool.js'in KV-önbellekli
// havuzunu mekan filtresine göre süzüp sayfalar. Sıralama SUNUCUDA yapılır (proje created_at DESC,
// proje İÇİNDE images[] dizisinin kendi sırası) — istemci yalnızca gelen sırayı render eder.
(function(){
  function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
  function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function foldTr(s){ return String(s || '').toLocaleLowerCase('tr').trim(); }

  const grid = document.getElementById('ph-grid');
  const emptyEl = document.getElementById('ph-empty');
  const loadMoreBtn = document.getElementById('ph-loadmore-btn');
  const searchInput = document.getElementById('ph-search-input');
  const dropdown = document.getElementById('ph-dropdown');
  const resetBtn = document.getElementById('ph-reset-btn');

  const PAGE_SIZE = 60;
  let currentSpace = '';
  let offset = 0;
  let items = []; // o ana kadar yüklenmiş TÜM kartlar — lightbox önceki/sonraki için
  let loading = false;
  let exhausted = false;

  // ---------- Mekan arama (photo-space-taxonomy.js#PHOTO_SPACE_OPTIONS — verilen SIRAYLA) ----------
  function spaceOptions(){ return (typeof PHOTO_SPACE_OPTIONS !== 'undefined') ? PHOTO_SPACE_OPTIONS : []; }
  // Etiket adı YA DA anahtar kelimesi (photo-space-taxonomy.js#keywords: "wc", "salon", "hamam"...)
  // eşleşir — böylece yaygın eş anlamlılar AI'a hiç gitmeden yakalanır (2026-09-18).
  function matchingOptions(query){
    const q = foldTr(query);
    if(!q) return spaceOptions();
    const tax = (typeof PHOTO_SPACE_TAXONOMY !== 'undefined') ? PHOTO_SPACE_TAXONOMY : spaceOptions().map(l => ({ label: l, keywords: [] }));
    return tax.filter(t => foldTr(t.label).includes(q) || (t.keywords || []).some(k => foldTr(k).includes(q) || q.includes(foldTr(k)))).map(t => t.label);
  }
  function selectSpace(space){
    currentSpace = space || '';
    searchInput.value = currentSpace;
    dropdown.hidden = true;
    reload();
  }
  function renderDropdown(query, note){
    const list = matchingOptions(query);
    let html = list.map(s =>
      `<button type="button" class="ph-dropdown-option${s === currentSpace ? ' active' : ''}" data-space="${escapeAttr(s)}">${escapeHtml(s)}</button>`
    ).join('');
    if(!list.length) html = `<div class="ph-dropdown-note">${escapeHtml(note || 'Listede yok — Enter\'a basarsan yapay zeka en yakın mekanı bulur.')}</div>`;
    dropdown.innerHTML = html;
    dropdown.querySelectorAll('[data-space]').forEach(btn => btn.addEventListener('click', () => selectSpace(btn.dataset.space)));
  }
  // AI DESTEKLİ ARAMA (kullanıcı isteği madde 11): listede birebir/alt dize eşleşmesi yoksa
  // ("salon", "wc", "çocuk odası") sunucu metin modeliyle en yakın etiketi bulur (bkz.
  // src/routes/photos.js#spaceForQuery). Enter'a bağlı — tuş vuruşu başına AI çağrısı YOK.
  let aiQuerySeq = 0;
  async function resolveQuery(){
    const q = searchInput.value.trim();
    if(!q){ selectSpace(''); return; }
    const local = matchingOptions(q);
    if(local.length){ selectSpace(local[0]); return; }
    const mySeq = ++aiQuerySeq;
    renderDropdown(q, 'Aranıyor…'); dropdown.hidden = false;
    try{
      const res = await fetch(`/api/photos/space-for-query?q=${encodeURIComponent(q)}`);
      const data = res.ok ? await res.json() : { space: null };
      if(mySeq !== aiQuerySeq) return;
      if(data.space) selectSpace(data.space);
      else renderDropdown(q, 'Eşleşen bir mekan bulunamadı.');
    }catch{ if(mySeq === aiQuerySeq) renderDropdown(q, 'Eşleşen bir mekan bulunamadı.'); }
  }
  searchInput.addEventListener('focus', () => { renderDropdown(searchInput.value); dropdown.hidden = false; });
  searchInput.addEventListener('input', () => { renderDropdown(searchInput.value); dropdown.hidden = false; });
  searchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); resolveQuery(); } });
  document.addEventListener('click', (e) => { if(!e.target.closest('.ph-search-field')) dropdown.hidden = true; });
  resetBtn.addEventListener('click', () => selectSpace(''));

  // ---------- Izgara ----------
  function cardHtml(item, idx){
    const src = (typeof cdnImg === 'function') ? cdnImg(item.url, 600) : item.url;
    const srcset = (typeof cdnSrcset === 'function') ? cdnSrcset(item.url, [400, 600, 800]) : '';
    return `
    <a class="ph-card" role="button" tabindex="0" data-idx="${idx}" aria-label="${escapeAttr(item.projectTitle || '')}">
      <img src="${escapeAttr(src)}"${srcset ? ` srcset="${escapeAttr(srcset)}" sizes="(max-width:720px) 50vw, 260px"` : ''} alt="${escapeAttr(item.projectTitle || '')}" loading="lazy" decoding="async">
      <div class="ph-card-overlay">
        <div class="ph-card-credit">${escapeHtml(item.credit || item.projectTitle || '')}</div>
        <button type="button" class="ph-card-save" data-idx="${idx}" aria-label="Kaydet">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
        </button>
      </div>
    </a>`;
  }

  function appendCards(newItems, startIdx){
    grid.insertAdjacentHTML('beforeend', newItems.map((it, i) => cardHtml(it, startIdx + i)).join(''));
    grid.querySelectorAll('.ph-card').forEach(card => {
      if(card.dataset.wired) return;
      card.dataset.wired = '1';
      card.addEventListener('click', (e) => {
        if(e.target.closest('.ph-card-save')) return;
        openLightbox(Number(card.dataset.idx));
      });
      card.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLightbox(Number(card.dataset.idx)); }
      });
    });
    grid.querySelectorAll('.ph-card-save').forEach(btn => {
      if(btn.dataset.wired) return;
      btn.dataset.wired = '1';
      const idx = Number(btn.dataset.idx);
      wirePhotoSaveBtn(btn, () => items[idx]);
    });
  }

  async function loadPage(reset){
    if(loading || (exhausted && !reset)) return;
    loading = true;
    loadMoreBtn.disabled = true;
    loadMoreBtn.textContent = 'Yükleniyor…';
    try{
      const params = new URLSearchParams({ limit: String(PAGE_SIZE), offset: String(reset ? 0 : offset) });
      if(currentSpace) params.set('space', currentSpace);
      const res = await fetch(`/api/photos?${params.toString()}`);
      const data = res.ok ? await res.json() : { items: [], hasMore: false };
      const newItems = data.items || [];
      if(reset){ items = newItems; offset = newItems.length; grid.innerHTML = ''; appendCards(newItems, 0); }
      else { const start = items.length; items = items.concat(newItems); offset += newItems.length; appendCards(newItems, start); }
      exhausted = !data.hasMore;
      loadMoreBtn.style.display = exhausted ? 'none' : '';
      emptyEl.style.display = items.length ? 'none' : '';
    } catch { /* ağ hatası — mevcut ızgara kalır, "Daha Fazla Göster" tekrar denenebilir */ }
    loading = false;
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Daha Fazla Göster';
  }
  function reload(){ exhausted = false; loadPage(true); }
  loadMoreBtn.addEventListener('click', () => loadPage(false));
  // Sayfanın altına inince sonraki sayfa kendiliğinden yüklenir (kullanıcı isteği, 2026-09-18
  // madde 5) — düğme yine durur (JS'siz/IO'suz ortam ve erişilebilirlik için).
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver((entries) => {
      if(entries.some(e => e.isIntersecting) && !exhausted && !loading && items.length) loadPage(false);
    }, { rootMargin: '600px 0px' });
    io.observe(document.getElementById('ph-loadmore-sentinel'));
  }

  // ---------- Kaydet (image tipi — bkz. save-widget.js, Koleksiyonum > Görsel filtresi) ----------
  // wireSaveButton HER çağrıda yeniden BOYAR ama dinleyiciyi bir kez takar (dataset.saveWired) —
  // lightbox düğmesinin data-key'i her görselde değiştiğinden bu şart. Düğmeler kendi sınıflarını
  // taşır (bkz. gallery.js#lightboxSaveBtn'deki gerekçe), bu yüzden tek tek elle bağlanır.
  function wirePhotoSaveBtn(btn, getItem){
    const item = getItem();
    if(!item) return;
    if(typeof wireSaveButton !== 'function'){ btn.style.display = 'none'; return; }
    btn.style.display = '';
    btn.dataset.type = 'image';
    btn.dataset.key = item.url;
    btn.dataset.image = item.url;
    btn.dataset.title = item.projectTitle || '';
    btn.dataset.meta = item.projectLocation || '';
    btn.dataset.href = item.url;
    wireSaveButton(btn, 'image');
  }

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('ph-lightbox');
  const lbMedia = document.getElementById('ph-lightbox-media');
  const lbImg = document.getElementById('ph-lightbox-img');
  const lbCredit = document.getElementById('ph-lightbox-credit');
  const lbTitle = document.getElementById('ph-lightbox-title');
  const lbMeta = document.getElementById('ph-lightbox-meta');
  const lbSpaces = document.getElementById('ph-lightbox-spaces');
  const lbSaveBtn = document.getElementById('ph-lightbox-save');
  let lightboxIdx = -1;
  let shareWired = false;

  function projectHref(item){ return item.projectSlug ? `/proje/${encodeURIComponent(item.projectSlug)}` : '#'; }
  function wireShare(){
    if(shareWired || typeof ShareWidget === 'undefined') return;
    const slot = document.getElementById('ph-lightbox-share-slot');
    slot.innerHTML = ShareWidget.html('ph-share-btn');
    // getData her tıklamada O ANKİ görseli okur — düğme bir kez bağlanır, hedef görselle değişir.
    ShareWidget.wire('ph-share-btn', () => {
      const item = items[lightboxIdx] || {};
      return {
        title: item.projectTitle || 'MİMARLAB',
        url: `${window.location.origin}${projectHref(item)}`,
        type: 'project', key: item.projectSlug || '',
        image: item.url || '', meta: item.projectLocation || '',
      };
    });
    shareWired = true;
  }
  function renderLightbox(){
    const item = items[lightboxIdx];
    if(!item) return;
    lbImg.src = (typeof cdnImg === 'function') ? cdnImg(item.url, 1600) : item.url;
    lbImg.alt = item.projectTitle || '';
    // Fotoğrafçı — görselin hemen altında, proje lightbox'ındaki "© Ad" ile aynı biçim (madde 6).
    lbCredit.textContent = item.photographer ? `© ${item.photographer}` : '';
    lbCredit.hidden = !item.photographer;
    lbTitle.textContent = item.projectTitle || '';
    lbTitle.href = projectHref(item);
    // KÜNYE — proje pop-up'ındaki sırayla (js/components/project-meta.js#renderDesigners +
    // renderMeta): Mimar, Mimarlık Firması, Tür, Tip, Grup, Yer, Yıl, Ödül. Fotoğraf HARİÇ (görselin
    // altında). Yükleyen hesabın kimliği gösterilmez (2026-09-17 madde 5).
    const rows = [];
    const list = (arr) => (arr || []).map(escapeHtml).join(', ');
    if((item.architects || []).length) rows.push(['Mimar', list(item.architects)]);
    if((item.offices || []).length) rows.push(['Mimarlık Firması', list(item.offices)]);
    if((item.discipline || []).length) rows.push(['Tür', list(item.discipline)]);
    if((item.category || []).length) rows.push(['Tip', list(item.category)]);
    if((item.type || []).length) rows.push(['Grup', list(item.type)]);
    if(item.projectLocation) rows.push(['Yer', escapeHtml(item.projectLocation)]);
    if(item.projectDate) rows.push(['Yıl', escapeHtml(item.projectDate)]);
    if((item.awards || []).length) rows.push(['Ödül', list(item.awards)]);
    lbMeta.innerHTML = rows.map(([k, v]) => `<div><strong>${k}:</strong> ${v}</div>`).join('')
      + (item.via === 'kunye' ? `<div class="ph-lightbox-via">Bu görsel projenin künyesindeki bilgiye göre listelendi.</div>` : '');
    lbSpaces.innerHTML = (item.spaces || []).map(s => `<span class="ph-lightbox-space-chip">${escapeHtml(s)}</span>`).join('');
    wirePhotoSaveBtn(lbSaveBtn, () => items[lightboxIdx]);
    wireShare();
  }
  function openLightbox(idx){
    lightboxIdx = idx;
    renderLightbox();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if(!exhausted && lightboxIdx >= items.length - 5) loadPage(false);
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  function stepLightbox(delta){
    const next = lightboxIdx + delta;
    if(next < 0 || next >= items.length) return;
    lightboxIdx = next;
    renderLightbox();
    if(!exhausted && lightboxIdx >= items.length - 5) loadPage(false);
  }
  document.getElementById('ph-lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('ph-lightbox-prev').addEventListener('click', () => stepLightbox(-1));
  document.getElementById('ph-lightbox-next').addEventListener('click', () => stepLightbox(1));
  // Görselin DIŞINA tıklamak kapatır (madde 9): karartma da, görselin etrafındaki boşluk da.
  // Görselin/fotoğrafçı etiketinin/panelin/okların üzeri kapatmaz.
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox || e.target === lbMedia) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') stepLightbox(-1);
    else if(e.key === 'ArrowRight') stepLightbox(1);
  });

  // DOMContentLoaded'ı BEKLEMEK ŞART: bu satır içi betik TÜM `defer`'lı betiklerden ÖNCE çalışır —
  // save-widget/share-button/taksonomi o anda henüz tanımsızdır.
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reload);
  else reload();
})();
</script>
</body>
</html>
