name: diStudio kişilerini ekle (Didem Özdel, İlker Özdel, Yenal Akgün)

# Kullanıcı isteği (2026-09-19): distudio.com.tr/ofis'teki üç kişiyi kişi sayfasına ekle.
# Bu makinede wrangler oturumu olmadığından D1 yazımı runner'da yapılır (archive-ofist.yml ile aynı
# gerekçe). Betik canlı POST /api/architects yolunu admin olarak çağırır — bkz.
# scripts/add-distudio-people.mjs. AI YOK, ücretli kaynak YOK (yalnızca birkaç yüz D1 sorgusu).
# Varsayılan dry-run; yazmak için apply=evet. Aynı adla kişi varsa atlanır (tekrar çalıştırılabilir).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "D1'e YAZ (evet / hayir)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']

concurrency:
  group: mimarlab-add-distudio-people
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ekle
        env:
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          argv=()
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          node scripts/add-distudio-people.mjs "${argv[@]}" 2>&1 | tee add-distudio-log.txt
      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: add-distudio-log
          path: add-distudio-log.txt
          if-no-files-found: warn
