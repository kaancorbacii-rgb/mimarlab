name: Markaları firmaya dönüştür (Üretim ve Satış) — BİRİM Design hariç arşivde

# KULLANICI İSTEĞİ, 2026-09-14 madde 4: "Marka ve marka ekle sayfasını canlıdan kaldır. Hali
# hazırdaki markalar artık firma olacak ama BİRİM Design markası hariç hepsi arşivde kalsın. Tüm
# markalar firmalar arasında Üretim ve Satış hizmet alanı içerisinde olacak. BİRİM Design markasını
# bir firma yap ve hizmet alanını Üretim ve Satış olarak seç."
#
# KOD TARAFI (/marka + /marka-ekle 301, isPureBrandOffice sabit false, firma-ekle'ye Ürün Kategorisi
# kutusu) ./deploy.sh ile canlıya gider. BU WORKFLOW, D1'deki satırları o hâle getirir: üretici
# kayıtların cats'ine 'Üretim ve Satış' ekler, BİRİM Design dışındakileri arşivde tutar, BİRİM
# Design'ı yayına alır.
#
# NEDEN WORKFLOW: uzak (web/telefon) Claude oturumundan api.cloudflare.com çıkışı ağ politikasıyla
# kapalı — D1'e oradan hiç yazılamaz. gundem-purge-sources.yml / archive-brands-and-products.yml
# ile AYNI desen.
#
# VARSAYILAN DRY-RUN: apply=evet denmedikçe D1'e HİÇBİR ŞEY yazılmaz — önce planı okuyun.
# Betik ayrıca kendi kararını vermez: "üretici mi" sorusunu office-kind.js#isBrandOffice'e,
# arşivlemeyi canlı koddaki runContentAction'a sorar.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "D1'e YAZ (evet = gerçekten değiştir, hayir = yalnızca plan)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']

concurrency:
  group: mimarlab-brands-to-offices
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    # Kayıt başına birkaç D1 sorgusu + arşiv cascade'i; ~100 üretici kayıt için fazlasıyla yeter.
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izin: D1:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # cone mode KÖK dosyaları her zaman içerir — betik ../office-kind.js'i kökten okuyor.
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dönüştür
        env:
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ (script-injection savunması).
          argv=()
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          echo "Çalıştırılıyor: node scripts/brands-to-offices.mjs ${argv[*]}"
          node scripts/brands-to-offices.mjs "${argv[@]}" 2>&1 | tee brands-to-offices-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brands-to-offices-log
          path: brands-to-offices-log.txt
          if-no-files-found: warn

      - name: Özet
        if: always()
        run: |
          if [ "${{ inputs.apply }}" = "evet" ]; then
            echo "UYGULANDI (log'a bakın): markalar 'Üretim ve Satış' firmasına dönüştü, BİRİM Design yayında."
          else
            echo "ÖNİZLEME (D1'e yazılmadı). Gerçekten uygulamak için apply=evet ile tekrar çalıştırın."
          fi
