name: İçeriği hiç olmayan blurlu profilleri arşive al (firma / kişi)

# BLURLU (ÖNİZLEME) FİRMA ve KİŞİ profillerinden pop-up'ında gösterilecek HİÇBİR ŞEYİ olmayanları
# arşive alır (kullanıcı isteği, 2026-09-15 on ikinci tur: firmalar; on üçüncü tur: kişiler).
#
# SAHİPLİ profiller ASLA arşivlenmez (üye kaydı / admin ataması / danışman başvurusu) — boş görünen
# bir kayıt bir üyenin Hesabım kutusunu ya da /danismanlik kartını besliyor olabilir.
#
# NEDEN WORKFLOW: uzak (web/telefon) Claude oturumundan api.cloudflare.com çıkışı ağ politikasıyla
# kapalı — D1'e oradan hiç yazılamaz. archive-brands-and-products.yml'in kardeşi, AYNI desen.
#
# NE YAPMAZ: hiçbir şeyi SİLMEZ (hard delete yok, blacklist yok), slug DEĞİŞMEZ, R2 görselleri DURUR.
# Her kayıt canlı kod yolundan (runContentAction) geçtiği için "Arşivim > Yayına Al" ile geri alınabilir.
#
# VARSAYILAN DRY-RUN: apply=evet denmedikçe D1'e HİÇBİR ŞEY yazılmaz — önce listeyi okuyun.
# Sayım kapısı: expect verilirse ve bulunan sayı farklıysa hiçbir şey yazılmadan durur.

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Hangi profil tipi'
        required: true
        default: 'architects'
        type: choice
        options: ['architects', 'offices']
      apply:
        description: "D1'e YAZ (evet = gerçekten arşivle, hayir = yalnızca liste)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      audit_archived:
        description: 'DENETİM: arşivdeki SAHİPLİ kayıtları listele (hiçbir şey yazmaz)'
        required: false
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      expect:
        description: 'Beklenen firma sayısı (kapı; boş = kontrol yok)'
        required: false
        default: ''

concurrency:
  group: mimarlab-archive-empty-profiles
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # Her blurlu profil için pop-up'ın TAMAMI (buildOfficePayload / buildArchitectPayload) + firma
    # tarafında arşiv cascade toplayıcısı çalışır, yani profil başına onlarca D1 turu düşer.
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izin: D1:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true

      # office-kind.js ve il-ilce-data.js DEPO KÖKÜNDE durur ve src/routes/office.js onları
      # doğrudan import eder — sparse-checkout kökü zaten alır, ama bağımlılık burada yazılı olsun.
      - name: Kök modüller yerinde mi
        run: |
          for f in office-kind.js il-ilce-data.js; do
            if [ ! -f "$f" ]; then echo "EKSİK: $f (src/routes/office.js bunu import ediyor)" >&2; exit 1; fi
          done
          echo "Kök modüller yerinde."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Arşivle
        env:
          IN_TYPE: ${{ inputs.type }}
          IN_APPLY: ${{ inputs.apply }}
          IN_AUDIT: ${{ inputs.audit_archived }}
          IN_EXPECT: ${{ inputs.expect }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ (script-injection savunması); `bash -e`
          # altında `[ x ] && cmd` adımı düşürebildiği için her yerde açık `if`.
          case "${IN_TYPE}" in architects|offices) ;; *) echo "type 'architects' ya da 'offices' olmalı" >&2; exit 1 ;; esac
          argv=("--type=${IN_TYPE}")
          if [ "${IN_AUDIT}" = "evet" ]; then
            argv+=("--audit-archived")
          elif [ "${IN_APPLY}" = "evet" ]; then
            argv+=("--apply")
          fi
          if [ -n "${IN_EXPECT}" ]; then
            case "${IN_EXPECT}" in *[!0-9]*) echo "expect sayı olmalı" >&2; exit 1 ;; esac
            argv+=("--expect=${IN_EXPECT}")
          fi
          echo "Çalıştırılıyor: node scripts/archive-empty-preview-profiles.mjs ${argv[*]}"
          node scripts/archive-empty-preview-profiles.mjs "${argv[@]}" 2>&1 | tee archive-empty-profiles-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-empty-profiles-log-${{ inputs.type }}
          path: archive-empty-profiles-log.txt
          if-no-files-found: warn

      - name: Özet
        if: always()
        run: |
          if [ "${{ inputs.audit_archived }}" = "evet" ]; then
            echo "DENETİM (D1'e yazılmadı): arşivdeki sahipli kayıtlar log'da listelendi."
          elif [ "${{ inputs.apply }}" = "evet" ]; then
            echo "UYGULANDI (log'a bakın): içeriği hiç olmayan blurlu profiller arşive alındı."
          else
            echo "ÖNİZLEME (D1'e yazılmadı). Gerçekten arşivlemek için apply=evet ile tekrar çalıştırın."
          fi
