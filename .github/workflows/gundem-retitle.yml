name: Gündem içeriklerini yeniden üret (başlık + özet)

# GÜNDEM'DEKİ MEVCUT İÇERİKLERİN BAŞLIK VE ÖZETLERİNİ KAYNAKTAN YENİDEN ÜRETİR
# (kullanıcı isteği, 2026-09-13: "Gündem sayfasındaki içeriklerin başlıklarını ve metinlerini
# daha doğru bir Türkçe ve özetleme sistemiyle yeniden kaynaklardan çek".)
#
# NEDEN WORKFLOW — UZAK OTURUMDAN ÇALIŞTIRILAMIYOR: Claude Code'un uzak (web/telefon) oturumu
# izole bir konteynerde çalışır; ağ politikası `api.cloudflare.com` ÇIKIŞINI DE, yayıncı
# sitelerine (dezeen.com, archdaily.com, arkitera.com...) çıkışı DA reddeder — ölçüldü,
# 2026-09-13: CONNECT'e 403. Bu betiğin ihtiyacı olan HER İKİ şey de orada yok: D1'e erişim ve
# kaynak makalelere erişim. Runner'da ikisi de var. Aynı gerekçe deploy.yml dosya başında da
# yazılı; bu workflow onun kardeşidir.
#
# NE YAPAR / NE YAPMAZ (betiğin kendi sözleşmesi, bkz. scripts/gundem-retitle-backfill.mjs):
#   YAPAR   : her satır için kaynağa geri gider, makalenin og:description'ını ve GÖVDESİNDEN ilk
#             paragrafları alır, güncel üretim zinciriyle (src/lib/gundemAi.js) Türkçe başlık ve
#             özeti yeniden üretir, kalite + fact-consistency kapılarından geçirir ve YALNIZCA
#             `title`, `summary`, `embedding`, `ai_generated_at`, `updated_at` alanlarını yazar.
#   YAPMAZ  : slug DEĞİŞMEZ (canlı /gundem/<slug> adresleri ve bültendeki bağlantılar kırılmaz),
#             published_at, source URL, kaynak, görsel, kategori, mükerrer kayıtları ve admin
#             durumu DEĞİŞMEZ. Yeni satır AÇILMAZ, satır SİLİNMEZ.
#   KAPI    : kalite kapısından geçmeyen bir çıktı yazılmaz — o satır ESKİ hâliyle kalır.
#
# VARSAYILAN DRY-RUN: `apply` girdisi açıkça `evet` yapılmadıkça hiçbir şey yazılmaz, yalnızca
# önce/sonra raporu üretilir. Rapor artifact olarak indirilebilir.

on:
  workflow_dispatch:
    inputs:
      maliyet_onayi:
        description: 'ÜCRETLİ (Workers AI). Tahmini maliyeti kullanıcıya sorup onay aldıysan buraya ONAYLIYORUM yaz; aksi halde iş hiçbir şey yapmadan durur.'
        required: true
        default: ''
      apply:
        description: "D1'e YAZ (evet = gerçekten güncelle, hayır = yalnızca rapor)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      scope:
        description: 'Kapsam: tumu = yayındaki tüm kayıtlar, ornek = --limit kadar örneklem'
        required: true
        default: 'ornek'
        type: choice
        options: ['ornek', 'tumu']
      limit:
        description: "Örneklem boyutu (scope=ornek iken geçerli)"
        required: false
        default: '20'
      source:
        description: 'Yalnızca bu kaynak id(ler)i (virgülle; boş = hepsi)'
        required: false
        default: ''
      offset:
        description: 'scope=tumu iken: en yeniden geriye ilk N kaydı atla (yarıda kalan turu sürdürmek için)'
        required: false
        default: '0'
      attempts:
        description: 'Kayıt başına AI denemesi (varsayılan 3)'
        required: false
        default: '3'

# İki turun aynı satırları aynı anda yazmasını önler. Gündem cron'u ayrı bir yol (yeni satır
# ekler, mevcut satırları güncellemez), yani onunla yarışmaz.
concurrency:
  group: mimarlab-gundem-retitle
  cancel-in-progress: false

jobs:
  retitle:
    runs-on: ubuntu-latest
    # Kayıt başına 1-2 AI çağrısı (~4sn) + 1 sayfa indirmesi. Birkaç yüz kayıtlık tam tarama
    # saatler sürebilir; sınır buna göre. Yarıda kalırsa `offset` ile kaldığı yerden sürdürülür.
    timeout-minutes: 330
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Maliyet onayı (Workers AI ücretli — CLAUDE.md "ÜCRETLİ KAYNAK KURALI")
        env:
          ONAY: ${{ inputs.maliyet_onayi }}
        run: |
          if [ "${ONAY}" != "ONAYLIYORUM" ]; then
            echo "::error::Bu iş Workers AI çağırır ve ücret doğurabilir (kuru çalıştırma dahil). 'maliyet_onayi' alanına ONAYLIYORUM yazılmadan çalışmaz."
            exit 1
          fi
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izinler: D1:Edit ve Workers AI:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      # Betik yalnızca src/lib/*.js modüllerini ve D1'i kullanıyor; 3,3 GB'lık görsel ağacına
      # ihtiyacı yok, ama sparse checkout kurmak yerine sığ checkout yeterince hızlı.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yeniden üretim
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SOURCE: ${{ inputs.source }}
          IN_OFFSET: ${{ inputs.offset }}
          IN_ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ, ortam değişkeni olarak okunur
          # (deploy.yml'deki aynı script-injection savunması).
          # NOT: GitHub'ın varsayılan kabuğu `bash -e` — `[ x ] && cmd` kalıbı koşul YANLIŞ
          # olduğunda 1 döndürüp ADIMI DÜŞÜRÜR. Bu yüzden her yerde açık `if` kullanılıyor.
          argv=()
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          if [ "${IN_SCOPE}" = "tumu" ]; then
            argv+=("--all")
            case "${IN_OFFSET}" in ''|0) ;; *[!0-9]*) echo "offset sayı olmalı" >&2; exit 1 ;; *) argv+=("--offset=${IN_OFFSET}") ;; esac
          else
            case "${IN_LIMIT}" in ''|*[!0-9]*) echo "limit sayı olmalı" >&2; exit 1 ;; *) argv+=("--limit=${IN_LIMIT}") ;; esac
          fi
          if [ -n "${IN_SOURCE}" ]; then
            case "${IN_SOURCE}" in *[!a-zA-Z0-9,_-]*) echo "kaynak id'si geçersiz karakter içeriyor" >&2; exit 1 ;; esac
            argv+=("--source=${IN_SOURCE}")
          fi
          if [ -n "${IN_ATTEMPTS}" ]; then
            case "${IN_ATTEMPTS}" in *[!0-9]*) echo "attempts sayı olmalı" >&2; exit 1 ;; esac
            argv+=("--attempts=${IN_ATTEMPTS}")
          fi
          argv+=("--json=gundem-retitle-rapor.json")
          echo "Çalıştırılıyor: node scripts/gundem-retitle-backfill.mjs ${argv[*]}"
          node scripts/gundem-retitle-backfill.mjs "${argv[@]}" 2>&1 | tee gundem-retitle-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gundem-retitle-rapor
          path: |
            gundem-retitle-rapor.json
            gundem-retitle-log.txt
          if-no-files-found: warn
