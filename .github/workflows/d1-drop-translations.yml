name: D1 bakım — translations tablosunu düşür (TEK SEFERLİK)

# TEK SEFERLİK BAKIM WORKFLOW'U (kullanıcı isteği, 2026-09-13: "translations tablosunu sil").
#
# NEDEN VAR: `translations` tablosu, üst çubuktaki EN/TR dil değiştiricisinin çeviri önbelleğiydi
# (bkz. commit f3d9c395). Düğme ve tüm çeviri katmanı bir sonraki turda kullanıcı isteğiyle geri
# alındı (bkz. commit f0687138) ama tablo canlı D1'de kaldı — hiçbir kod artık ona dokunmuyor.
#
# NEDEN AYRI BİR WORKFLOW: bu depoda migration'lar elle `wrangler d1 execute --remote` ile atılıyor
# ve Claude'un uzak (web/telefon) oturumunun Cloudflare'e ağ erişimi YOK (CONNECT'e 403), yani o
# oturumdan çalıştırılamıyor. Alternatifler daha kötüydü:
#   * deploy.yml'e adım eklemek -> DROP her deploy'da yeniden çalışırdı (kalıcı bir yük ve tuzak),
#   * kalıcı bir "D1 bakım" workflow'u -> kullanıcının istemediği, elinde silahlı duran bir araç.
# Bu dosya çalıştırıldıktan HEMEN SONRA depodan silinir; git geçmişinde kalır.
#
# SİTEYİ YENİDEN YAYINLAMAZ: deploy.sh'e hiç dokunmaz, yalnızca D1'e iki SQL cümlesi gönderir.

on:
  workflow_dispatch:
    inputs:
      onay:
        description: 'Silmeyi onaylamak için TAM OLARAK "SIL" yazın'
        required: true
        default: ''

concurrency:
  group: mimarlab-d1-maintenance
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'
    steps:
      - name: Yalnızca main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "DURDURULDU: bu workflow yalnızca 'main' dalından çalıştırılabilir." >&2
          exit 1

      # Yıkıcı bir işlem: yanlışlıkla "Run workflow"a basılması tek başına tabloyu düşürmesin.
      - name: Onay metni doğru mu
        env:
          ONAY: ${{ inputs.onay }}
        run: |
          if [ "${ONAY}" != "SIL" ]; then
            echo "DURDURULDU: onay kutusuna TAM OLARAK 'SIL' yazılmalı (girilen: '${ONAY}')." >&2
            exit 1
          fi
          echo "Onay alındı."

      # fetch-depth: 1 ve sparse: bu iş için depo İÇERİĞİ gerekmiyor (3,3 GB görsel indirmenin
      # anlamı yok), yalnızca wrangler.jsonc'daki d1_databases tanımı lazım.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Silmeden ÖNCE — tablo var mı, kaç satır taşıyor
        run: |
          npx wrangler d1 execute mimarlab-db --remote --yes \
            --command "SELECT COUNT(*) AS satir_sayisi FROM translations;" || \
            echo "(tablo zaten yok — DROP no-op olacak)"

      - name: DROP TABLE translations
        run: |
          npx wrangler d1 execute mimarlab-db --remote --yes \
            --command "DROP TABLE IF EXISTS translations;"

      # Doğrulama tablonun KENDİSİNE sorgu atarak yapılamaz (düşürülmüş tabloya SELECT hata verir);
      # sqlite_master üzerinden bakılır. Sonuçta hiç satır dönmemeli.
      - name: Doğrulama — tablo gerçekten gitti mi
        run: |
          npx wrangler d1 execute mimarlab-db --remote --yes \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='translations';"
          echo "Yukarıdaki sorgu BOŞ sonuç döndürdüyse tablo düşürülmüştür."
