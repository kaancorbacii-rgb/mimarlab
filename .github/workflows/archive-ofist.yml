name: Ofist'i arşive al (firma + projeler + kurucu ortaklar)

# OFİST FİRMASINI, KÜNYELİ PROJELERİNİ VE KURUCU ORTAKLARINI TAM ARŞİVE ALIR
# (kullanıcı isteği, 2026-09-14: "Ofist firmasını, 10 adet projesini ve 2 adet kurucu ortağını
# arşive al".)
#
# NEDEN WORKFLOW — UZAK OTURUMDAN ÇALIŞTIRILAMIYOR: Claude Code'un uzak (web/telefon) oturumu
# izole bir konteynerde çalışır ve ağ politikası `api.cloudflare.com` çıkışını reddeder (ölçüldü,
# 2026-09-14: CONNECT'e 403), yani o oturumdan D1'e HİÇ yazılamaz. Runner'da hem ağ hem kimlik
# bilgisi var. Aynı gerekçe deploy.yml, migrate.yml ve gundem-retitle.yml dosya başlarında da
# yazılı; bu workflow onların kardeşidir.
#
# NE YAPAR / NE YAPMAZ (betiğin kendi sözleşmesi, bkz. scripts/archive-ofist.mjs):
#   YAPAR   : firmanın künyeli projelerini (project_designers bağı), kurucu ortaklarını
#             (office_founders bağı) ve firmanın kendisini CANLI KOD YOLUNDAN
#             (runProjectAction / runContentAction) arşivler — böylece her kayıt için geri
#             alınabilirliği sağlayan *_submissions taslağı da oluşur ("Arşivim > Yayına Al").
#   YAPMAZ  : hiçbir şeyi SİLMEZ (hard delete yok, blacklist yok), slug DEĞİŞMEZ, R2 görselleri
#             DURUR. Firmaya bağlı ama kurucu ortak OLMAYAN kişilere DOKUNMAZ. Arşiv "blurlu
#             önizleme" DEĞİL TAM arşivdir — preview_at damgalanmaz (istek düz "arşive al").
#   KAPI    : beklenen sayılar (10 proje, 2 kurucu ortak) tutmazsa HİÇBİR ŞEY yazılmadan durur ve
#             bulduğu listeyi basar. Sayı gerçekten değiştiyse expect_* girdileriyle bilinçli geçilir.
#
# VARSAYILAN DRY-RUN: `apply` açıkça `evet` yapılmadıkça D1'e HİÇBİR ŞEY yazılmaz; yalnızca
# arşivlenecek kayıtların listesi raporlanır. Önce dry-run ile listeyi okuyun.
#
# GERİ ALMA: her kayıt admin panelinden ya da "Arşivim > Yayına Al" ile tek tek geri yayına
# alınabilir; firma yayına alındığında yayın grafı (bkz. src/routes/admin.js#activateProfilesOnPublish)
# yalnızca ÖNİZLEMEDEKİ kayıtları açar — bu betik önizleme bırakmadığı için projeler ve kişiler
# ayrıca yayına alınmalıdır.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "D1'e YAZ (evet = gerçekten arşivle, hayir = yalnızca liste)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      expect_projects:
        description: 'Beklenen künyeli proje sayısı (kapı; boş = 10)'
        required: false
        default: '10'
      expect_founders:
        description: 'Beklenen kurucu ortak sayısı (kapı; boş = 2)'
        required: false
        default: '2'

# İki turun aynı satırları aynı anda yazmasını önler. cancel-in-progress: false — yarıda kesilen
# bir tur, yarısı arşivlenmiş bir firma demektir.
concurrency:
  group: mimarlab-archive-ofist
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izin: D1:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      # Betik yalnızca src/ altındaki modülleri ve D1'i kullanıyor; depo git içinde ~3,3 GB görsel
      # taşıyor (projects/ + miras/) ve bu iş için tamamen gereksiz. Sparse checkout: src/ +
      # scripts/ + kök yapılandırma dosyaları (cone modunda kök dosyalar her zaman dahildir).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Arşivle
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_EXPECT_PROJECTS: ${{ inputs.expect_projects }}
          IN_EXPECT_FOUNDERS: ${{ inputs.expect_founders }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ, ortam değişkeni olarak okunur
          # (deploy.yml/gundem-retitle.yml'deki aynı script-injection savunması).
          # NOT: GitHub'ın varsayılan kabuğu `bash -e` — `[ x ] && cmd` kalıbı koşul YANLIŞ
          # olduğunda 1 döndürüp ADIMI DÜŞÜRÜR. Bu yüzden her yerde açık `if` kullanılıyor.
          argv=()
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          if [ -n "${IN_EXPECT_PROJECTS}" ]; then
            case "${IN_EXPECT_PROJECTS}" in *[!0-9]*) echo "expect_projects sayı olmalı" >&2; exit 1 ;; esac
            argv+=("--expect-projects=${IN_EXPECT_PROJECTS}")
          fi
          if [ -n "${IN_EXPECT_FOUNDERS}" ]; then
            case "${IN_EXPECT_FOUNDERS}" in *[!0-9]*) echo "expect_founders sayı olmalı" >&2; exit 1 ;; esac
            argv+=("--expect-founders=${IN_EXPECT_FOUNDERS}")
          fi
          echo "Çalıştırılıyor: node scripts/archive-ofist.mjs ${argv[*]}"
          node scripts/archive-ofist.mjs "${argv[@]}" 2>&1 | tee archive-ofist-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-ofist-log
          path: archive-ofist-log.txt
          if-no-files-found: warn

      - name: Özet
        if: always()
        run: |
          if [ "${{ inputs.apply }}" = "evet" ]; then
            echo "UYGULANDI (log'a bakın): Ofist + projeleri + kurucu ortakları arşive alındı."
          else
            echo "ÖNİZLEME (D1'e yazılmadı). Gerçekten arşivlemek için apply=evet ile tekrar çalıştırın."
          fi
