name: diStudio projelerini içe aktar (10 proje, 1. sayfa dışı)

# Kullanıcı isteği (2026-09-19): distudio.com.tr'deki 10 projeyi yüksek çözünürlüklü galeri + künye
# ile MİMARLAB'a ekle/zenginleştir; hiçbiri /proje'nin 1. sayfasında görünmesin (2..11. sayfalara
# karışık dağılım). Bu makinede wrangler oturumu olmadığından R2/D1 yazımı runner'da yapılır
# (add-distudio-people.yml ile aynı gerekçe).
#   1) scripts/import-distudio-projects-images.py — indir -> WebP -> R2 (+ w400/800/1600 türevleri)
#   2) scripts/import-distudio-projects.mjs      — canlı POST /api/projects (admin, telif beyanlı)
# AI YOK. Maliyet: ~470 R2 yazımı + ~100 MB depolama + birkaç yüz D1 sorgusu (ücretsiz kota içinde).
# Varsayılan dry-run; yazmak için apply=evet. Mevcut proje varsa yeni kayıt açılmaz, zenginleştirilir.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "R2 + D1'e YAZ (evet / hayir)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']

concurrency:
  group: mimarlab-import-distudio-projects
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pillow
        run: pip install --quiet 'Pillow>=10'
      - name: Görseller (indir -> WebP -> R2)
        env:
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          argv=(--manifest import-distudio-manifest.json)
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          python3 scripts/import-distudio-projects-images.py "${argv[@]}" 2>&1 | tee import-distudio-images-log.txt
      - name: Projeler (canlı POST /api/projects)
        env:
          IN_APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          argv=(--manifest=import-distudio-manifest.json)
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          node scripts/import-distudio-projects.mjs "${argv[@]}" 2>&1 | tee import-distudio-projects-log.txt
      - name: Canlı görsel kontrolü
        if: ${{ inputs.apply == 'evet' }}
        run: |
          set -o pipefail
          fail=0
          for u in $(python3 -c "import json;[print(x) for v in json.load(open('import-distudio-manifest.json')).values() for x in v]"); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://mimarlab.com$u")
            [ "$code" = "200" ] || { echo "KIRIK: $u -> $code"; fail=1; }
          done
          [ "$fail" = "0" ] && echo "Tüm görseller 200." | tee -a import-distudio-projects-log.txt
          exit $fail
      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-distudio-projects
          path: |
            import-distudio-images-log.txt
            import-distudio-projects-log.txt
            import-distudio-manifest.json
          if-no-files-found: warn
