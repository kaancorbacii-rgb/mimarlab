name: Projeler — agregatör kaynak bağlantılarını temizle (arkitera, archello, archdaily, divisare)

# KULLANICI İSTEĞİ, 2026-09-14: "Hiçbir projenin kaynak kısmında arkitera, archello, archdaily,
# divisare gibi linkler olmasın. Bu linkler varsa bunları sil ve mimarlık firmalarının
# websitelerinin linklerini koy. Websiteleri yoksa da boş bırak. Zaten kişi veya firma kaydı olan
# bir fotoğrafçı varsa link girme."
#
# KURALIN KAPILARI (böyle bir adresin bir daha yazılmaması ve yazılı olsa bile künyede bağlantıya
# dönüşmemesi) KODDA: src/lib/aggregatorSources.js — onlar ./deploy.sh ile canlıya gider.
# BU WORKFLOW, D1'de HÂLİHAZIRDA duran satırları temizler.
#
# NEDEN WORKFLOW: uzak (web/telefon) Claude oturumundan api.cloudflare.com çıkışı ağ politikasıyla
# kapalı — D1'e oradan hiç yazılamaz. gundem-purge-sources.yml / archive-brands-and-products.yml
# ile AYNI desen.
#
# VARSAYILAN DRY-RUN: apply=evet denmedikçe D1'e HİÇBİR ŞEY yazılmaz — önce planı okuyun.
# Sayım kapısı: expect verilirse ve bulunan proje sayısı farklıysa hiçbir şey yazılmadan durur.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "D1'e YAZ (evet = gerçekten değiştir, hayir = yalnızca plan)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      expect:
        description: 'Beklenen proje sayısı (kapı; boş = kontrol yok)'
        required: false
        default: ''

concurrency:
  group: mimarlab-project-source-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    # Proje başına birkaç D1 sorgusu + önbellek purge'ü; birkaç bin proje için fazlasıyla yeter.
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izin: D1:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Temizle
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_EXPECT: ${{ inputs.expect }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ (script-injection savunması).
          argv=()
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          if [ -n "${IN_EXPECT}" ]; then
            case "${IN_EXPECT}" in *[!0-9]*) echo "expect sayı olmalı" >&2; exit 1 ;; esac
            argv+=("--expect=${IN_EXPECT}")
          fi
          echo "Çalıştırılıyor: node scripts/purge-aggregator-project-sources.mjs ${argv[*]}"
          node scripts/purge-aggregator-project-sources.mjs "${argv[@]}" 2>&1 | tee project-source-purge-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-source-purge-log
          path: project-source-purge-log.txt
          if-no-files-found: warn

      - name: Özet
        if: always()
        run: |
          if [ "${{ inputs.apply }}" = "evet" ]; then
            echo "UYGULANDI (log'a bakın): agregatör kaynak bağlantıları silindi, yerine firma siteleri yazıldı."
          else
            echo "ÖNİZLEME (D1'e yazılmadı). Gerçekten uygulamak için apply=evet ile tekrar çalıştırın."
          fi
