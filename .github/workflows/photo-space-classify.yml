name: Fotoğraf sayfası — mekan sınıflandırması (AI)

# PROJE GÖRSELLERİNİ MEKANA GÖRE ETİKETLER (kullanıcı isteği, 2026-09-17: "Mekan filtremesini
# yapay zeka yapsın.") — /fotograf sayfasındaki "Mekana Göre Ara" filtresinin veri kaynağı olan
# `projects.image_spaces` kolonunu doldurur (bkz. scripts/photo-space-classify-backfill.mjs,
# src/lib/photoSpaceClassify.js, migrations/0124_project_image_spaces.sql).
#
# NEDEN WORKFLOW — UZAK OTURUMDAN ÇALIŞTIRILAMIYOR: gundem-retitle.yml'deki AYNI gerekçe. Claude
# Code'un uzak (web/telefon) oturumunda `api.cloudflare.com` ve `mimarlab.com` çıkışı ağ
# politikasıyla kapalıdır; bu betiğin ihtiyacı olan İKİ şey de oradadır (D1 + Workers AI REST ve
# görselleri indirmek için canlı site). Runner'da ikisi de var.
#
# NE YAPAR / NE YAPMAZ:
#   YAPAR   : canlı projelerin görsellerini indirir, her birini bir vision modeline sorar ve
#             dönen mekan etiketini (photo-space-taxonomy.js'teki SABİT listeden) YALNIZCA
#             `projects.image_spaces` kolonuna yazar.
#   YAPMAZ  : başka HİÇBİR kolona dokunmaz (başlık/künye/görsel listesi/sıralama/yayın durumu
#             DEĞİŞMEZ). Yeni satır AÇILMAZ, satır SİLİNMEZ. Görsel dosyalarına dokunulmaz.
#   KAPI    : model listede OLMAYAN bir etiket üretirse süzülür (whitelist), net bir mekan
#             göremezse o görsel boş dizi ile etiketlenir ve filtrede hiç görünmez.
#
# TEKRAR ÇALIŞTIRILABİLİR: varsayılan olarak yalnızca ETİKETSİZ görseller işlenir (zaten etiketli
# olanlar atlanır), yani yeni proje eklendikçe betik tekrar koşturulup yalnızca eksikler tamamlanır.
#
# VARSAYILAN DRY-RUN: `apply` açıkça `evet` yapılmadıkça hiçbir şey yazılmaz.
#
# 2026-09-18 BEŞİNCİ TUR ("en doğru ve en çok sonuç için gereken en iyi sistemi kur"):
#   * PARALEL: betik artık `concurrency` kadar görseli aynı anda işler. Sıralı sürüm canlıda saatte
#     ~280 görsel işliyordu (11 bin görsel ~40 saat, iş sınırı 6 saat) — filtrelerin boş kalmasının
#     asıl nedeni buydu.
#   * ZAMANLANMIŞ: yeni yüklenen projelerin görselleri kimse düğmeye basmadan etiketlensin diye iş
#     ayrıca `schedule` ile koşar (yalnızca EKSİKLERİ işler; eksik yoksa tek bir D1 sorgusuyla biter).
#     Zamanlanmış koşu her zaman `apply=evet, scope=tumu`dur. O ana kadar geçen sürede filtreleri
#     CLIP ipucu doldurur (src/lib/photoSpaceClip.js) — yani yeni görsel hiçbir an "aranamaz" kalmaz.
#   * `mode=olc`: scripts/photo-space-gold.json'daki gözle etiketli kümede isabet/kapsama ölçer,
#     HİÇBİR ŞEY yazmaz. Prompt değişikliği canlıya çıkmadan önce bununla ölçülür.
#
# 2026-09-18 YEDİNCİ TUR ("bundan sonra yüklenecek tüm projeler ... aynı kurallara göre işlesin"):
#   * CLIP EMBEDDING ADIMI (etiketlemeden ÖNCE): scripts/build-image-embeddings.py --only-changed —
#     görsel arama dizininde (KV) embedding'i olmayan YENİ projelerin görsellerini runner'da embed
#     edip dizine ekler. Tarayıcı bunu kayıt anında yapıyor ama sayfa 1,2 sn sonra yönlendiği için
#     güvenilmezdi (dizin raporu: en yeni 14 projenin hiç embedding'i yoktu) — CLIP ipucu olmayan
#     görsel filtrede ancak LLM etiketiyle ve alt kademede yer alır. Bu adım eksikleri kapatır;
#     hata verirse etiketleme yine koşar (continue-on-error).
#   * Yeni yüklemelerin LLM etiketi artık Worker'ın kendi cron'unda 15 dakikada bir tamamlanır
#     (src/lib/photoSpaceCron.js); bu iş toplu geri dolum, ölçüm ve CLIP embedding için kalır.

on:
  # Günde dört kez, Gündem/görsel-dizin cron'larıyla çakışmayan bir dakikada. Yalnızca eksikler
  # işlendiği için boş geçen koşu saniyeler sürer.
  # ZAMANLAMA KAPATILDI (kullanıcı isteği, 2026-09-19): görsel model (Workers AI) ücretli nöron
  # harcıyor — 17-18 Eylül'de ~15,5 $ fatura çıktı. Yalnızca elle (workflow_dispatch) çalışır.
  # schedule:
  #   - cron: '41 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      maliyet_onayi:
        description: 'ÜCRETLİ (Workers AI). Tahmini maliyeti kullanıcıya sorup onay aldıysan buraya ONAYLIYORUM yaz; aksi halde iş hiçbir şey yapmadan durur.'
        required: true
        default: ''
      mode:
        description: 'etiketle = görselleri sınıflandır; olc = gözle etiketli kümede isabet ölç (yazmaz); dizin = CLIP dizin kapsamını raporla (yazmaz, AI çağırmaz)'
        required: true
        default: 'etiketle'
        type: choice
        options: ['etiketle', 'olc', 'dizin']
      apply:
        description: "D1'e YAZ (evet = gerçekten güncelle, hayır = yalnızca rapor)"
        required: true
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      scope:
        description: 'Kapsam: tumu = tüm canlı projeler, ornek = --limit kadar proje'
        required: true
        default: 'ornek'
        type: choice
        options: ['ornek', 'tumu']
      limit:
        description: 'Proje sayısı (scope=ornek iken geçerli)'
        required: false
        default: '10'
      offset:
        description: 'scope=tumu iken: en yeniden geriye ilk N projeyi atla (yarıda kalan turu sürdürmek için)'
        required: false
        default: '0'
      max_images:
        description: 'Proje başına en fazla N görsel (0 = sınırsız)'
        required: false
        default: '0'
      slug:
        description: 'Yalnızca bu proje slug(lar)ı (virgülle; boş = hepsi)'
        required: false
        default: ''
      force:
        description: 'v2 etiketli görselleri de YENİDEN sınıflandır (v1 girdileri zaten yeniden işlenir)'
        required: false
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']
      concurrency:
        description: 'Aynı anda işlenen görsel sayısı (1-32)'
        required: false
        default: '10'
      embed:
        description: "Etiketlemeden önce CLIP görsel dizinindeki eksik embedding'leri tamamla (yeni projeler)"
        required: false
        default: 'evet'
        type: choice
        options: ['evet', 'hayir']
      eval_file:
        description: 'mode=olc iken: değerlendirme kümesi (boş = scripts/photo-space-gold.json)'
        required: false
        default: ''
      model:
        description: 'DENEY: yalnızca bu Workers AI vision modeli (boş = üretim kademesi)'
        required: false
        default: ''
      context:
        description: 'DENEY: proje künyesi prompta bağlam olarak eklensin mi (ölçüm: eklemek isabeti artırmıyor)'
        required: false
        default: 'hayir'
        type: choice
        options: ['hayir', 'evet']

# İki turun aynı satırları aynı anda yazmasını önler.
concurrency:
  group: mimarlab-photo-space-classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    # Görsel başına 1 indirme + 1 vision çağrısı (ölçüldü: ~13 sn). Betik 320. dakikada yeni görsel
    # almayı KENDİSİ bırakır, bitenleri yazar ve temiz çıkar; kalanlar bir sonraki koşuda işlenir
    # (zaten etiketli görseller atlandığı için aynı komut tekrar çalıştırılarak tamamlanır).
    timeout-minutes: 345
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NPM_CONFIG_YES: 'true'

    steps:
      - name: Maliyet onayı (Workers AI ücretli — CLAUDE.md "ÜCRETLİ KAYNAK KURALI")
        if: ${{ inputs.mode != 'dizin' }}
        env:
          ONAY: ${{ inputs.maliyet_onayi }}
        run: |
          if [ "${ONAY}" != "ONAYLIYORUM" ]; then
            echo "::error::Bu iş Workers AI çağırır ve ücret doğurabilir (kuru çalıştırma dahil). 'maliyet_onayi' alanına ONAYLIYORUM yazılmadan çalışmaz."
            exit 1
          fi
      - name: Cloudflare sırları tanımlı mı
        run: |
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then echo "EKSİK SIR: CLOUDFLARE_API_TOKEN" >&2; missing=1; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then echo "EKSİK SIR: CLOUDFLARE_ACCOUNT_ID" >&2; missing=1; fi
          if [ "$missing" -eq 1 ]; then
            echo "Kurulum adımları deploy.yml'in aynı adımında listeli." >&2
            echo "Bu iş için gereken izinler: D1:Edit ve Workers AI:Edit (Account kapsamlı)." >&2
            exit 1
          fi
          echo "Cloudflare sırları yerinde."

      # Betik yalnızca src/lib/*.js modüllerini, D1'i ve CANLI SİTEDEN indirilen görselleri
      # kullanıyor — depodaki görsel ağacına ihtiyacı yok, sığ checkout yeterli.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # CLIP EMBEDDING — yalnızca etiketleme modunda (zamanlanmış koşu dahil). Python + onnxruntime
      # (build-image-embeddings.py'nin kendi venv tarifi); model HF'den indirilir (~89 MB, bir kez
      # per runner). --only-changed: images listesi dizindekiyle aynı olan projelere DOKUNMAZ, yeni/
      # değişmiş projelerin görsellerini indirip embed eder, değişiklik yoksa KV'ye YAZMAZ.
      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'schedule' || (inputs.mode == 'etiketle' && inputs.embed != 'hayir') }}
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/photo-space-embed-requirements.txt
      - name: CLIP embedding — dizindeki eksikleri tamamla
        if: ${{ github.event_name == 'schedule' || (inputs.mode == 'etiketle' && inputs.embed != 'hayir') }}
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m pip install --quiet -r scripts/photo-space-embed-requirements.txt
          python3 scripts/build-image-embeddings.py --type project --only-changed --max-images 0 --derivative 400 --workers 8 2>&1 | tee photo-space-embed-log.txt

      - name: Sınıflandırma
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_EVAL_FILE: ${{ inputs.eval_file }}
          IN_MODEL: ${{ inputs.model }}
          IN_CONTEXT: ${{ inputs.context }}
          IN_CONCURRENCY: ${{ inputs.concurrency }}
          IN_APPLY: ${{ inputs.apply }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_OFFSET: ${{ inputs.offset }}
          IN_MAX_IMAGES: ${{ inputs.max_images }}
          IN_SLUG: ${{ inputs.slug }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -o pipefail
          # Kullanıcı girdileri kabuk satırına GÖMÜLMEZ, ortam değişkeni olarak okunur
          # (deploy.yml/gundem-retitle.yml'deki AYNI script-injection savunması).
          argv=()
          case "${IN_CONCURRENCY}" in '') ;; *[!0-9]*) echo "concurrency sayı olmalı" >&2; exit 1 ;; *) argv+=("--concurrency=${IN_CONCURRENCY}") ;; esac
          if [ -n "${IN_MODEL}" ]; then
            case "${IN_MODEL}" in *[!a-zA-Z0-9@._/-]*) echo "model geçersiz karakter içeriyor" >&2; exit 1 ;; esac
            argv+=("--model=${IN_MODEL}")
          fi
          if [ "${IN_CONTEXT}" = "evet" ]; then argv+=("--with-context"); fi
          if [ "${IN_MODE}" = "dizin" ]; then
            node scripts/photo-space-classify-backfill.mjs --index-report 2>&1 | tee photo-space-classify-log.txt
            exit 0
          fi
          if [ "${IN_MODE}" = "olc" ]; then
            evalarg="--eval"
            if [ -n "${IN_EVAL_FILE}" ]; then
              case "${IN_EVAL_FILE}" in *[!a-zA-Z0-9._/-]*|*..*|/*) echo "eval_file geçersiz" >&2; exit 1 ;; esac
              evalarg="--eval=${IN_EVAL_FILE}"
            fi
            echo "Çalıştırılıyor (ÖLÇÜM, yazma yok): node scripts/photo-space-classify-backfill.mjs ${evalarg} ${argv[*]}"
            node scripts/photo-space-classify-backfill.mjs "${evalarg}" "${argv[@]}" 2>&1 | tee photo-space-classify-log.txt
            exit 0
          fi
          # ZAMANLANMIŞ koşuda girdi YOKTUR: her zaman "tüm canlı projeler, yalnızca eksikler, YAZ".
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then IN_APPLY=evet; IN_SCOPE=tumu; IN_OFFSET=0; IN_MAX_IMAGES=0; IN_SLUG=''; IN_FORCE=hayir; fi
          if [ "${IN_APPLY}" = "evet" ]; then argv+=("--apply"); fi
          if [ "${IN_FORCE}" = "evet" ]; then argv+=("--force"); fi
          if [ "${IN_SCOPE}" = "tumu" ]; then
            argv+=("--all")
            case "${IN_OFFSET}" in ''|0) ;; *[!0-9]*) echo "offset sayı olmalı" >&2; exit 1 ;; *) argv+=("--offset=${IN_OFFSET}") ;; esac
          else
            case "${IN_LIMIT}" in ''|*[!0-9]*) echo "limit sayı olmalı" >&2; exit 1 ;; *) argv+=("--limit=${IN_LIMIT}") ;; esac
          fi
          case "${IN_MAX_IMAGES}" in ''|0) ;; *[!0-9]*) echo "max_images sayı olmalı" >&2; exit 1 ;; *) argv+=("--max-images=${IN_MAX_IMAGES}") ;; esac
          if [ -n "${IN_SLUG}" ]; then
            case "${IN_SLUG}" in *[!a-zA-Z0-9,_-]*) echo "slug geçersiz karakter içeriyor" >&2; exit 1 ;; esac
            argv+=("--slug=${IN_SLUG}")
          fi
          echo "Çalıştırılıyor: node scripts/photo-space-classify-backfill.mjs ${argv[*]}"
          node scripts/photo-space-classify-backfill.mjs "${argv[@]}" 2>&1 | tee photo-space-classify-log.txt

      - name: Rapor (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-space-classify-log
          path: |
            photo-space-classify-log.txt
            photo-space-eval-result.json
            photo-space-embed-log.txt
          if-no-files-found: warn
