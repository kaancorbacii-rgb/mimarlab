<!DOCTYPE html>
<html lang="tr">
<head>
<script>(function(){try{var t=localStorage.getItem('mimarlab-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.documentElement.style.colorScheme='dark';}}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/logos/site/favicon-32.png">
<link rel="apple-touch-icon" href="/logos/site/favicon-180.png">
<title>Paylaşılan Pano — MİMARLAB</title>
<meta name="description" content="MİMARLAB'da paylaşılan bir pano.">
<!-- noindex: panolar KİŞİSEL içeriktir; sahibi bağlantıyı kiminle paylaşacağına kendisi karar
     verir, arama motorlarına girmemeli (bkz. src/routes/collections.js#getSharedCollection —
     bağlantı tahmin edilemez bir token taşır ve sahibi paylaşımı geri alabilir). -->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D; --ink-soft:#4E6478; --paper:#EDF0F3; --paper-card:#F8FAFB; --paper-alt:#E0E6EC;
    --walnut:#2B425F; --brass:#5B7A9B; --brass-soft:#AFC5D8; --sage:#4F6478; --accent:#E08A3E;
    --line: rgba(27,42,61,0.14); --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:24px; padding:10px 32px; background:rgba(237,240,243,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{display:none; position:absolute; top:100%; right:18px; z-index:95; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;}
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{background:none; color:var(--ink); padding:8px 17px; border-radius:100px; border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;}
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{background:var(--ink); color:rgba(237,240,243,0.7); padding:14px 32px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- CONTENT ---------- */
  .content-wrap{max-width:760px; margin:0 auto; padding:56px 32px 90px;}
  .content-eyebrow{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--sage); font-weight:600; margin-bottom:12px;}
  .content-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:clamp(28px, 4vw, 38px); font-weight:700; margin:0 0 18px; letter-spacing:-0.01em;}
  .content-lead{font-size:16px; line-height:1.7; color:var(--ink-soft); margin:0 0 36px;}
  .content-section{margin-bottom:32px;}
  .content-section h2{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:20px; font-weight:700; margin:0 0 12px;}
  .content-section p{font-size:14.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 12px;}
  .content-section a{color:var(--walnut); font-weight:600;}
  .content-section a:hover{text-decoration:underline;}
  .content-section ul{margin:0; padding-left:20px; font-size:14.5px; line-height:1.8; color:var(--ink-soft);}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }

  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .content-wrap{padding:36px 18px 70px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }
</style>

<style>
  /* Paylaşılan pano (kullanıcı isteği, 2026-09-02) — Koleksiyonum'daki .col-item-grid ile AYNI
     kart ölçüsü/oranı (bkz. js/components/auth-modal.js#injectStyles), böylece sahibinin gördüğü
     düzenle paylaşılan görünüm birebir aynı hissettirir. */
  .pano-wrap{max-width:1260px; margin:0 auto; padding:28px 32px 60px;}
  .pano-head{margin:0 0 6px; font-size:26px; font-weight:700; letter-spacing:-0.01em;}
  .pano-sub{color:var(--ink-soft); font-size:13.5px; margin:0 0 24px;}
  .pano-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;}
  .pano-item{position:relative; border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; background:var(--paper-card);}
  .pano-media{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--paper-alt); cursor:zoom-in;}
  .pano-note{padding:16px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
  .pano-body{padding:10px 12px;}
  .pano-title{font-weight:600; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pano-title a{color:inherit; text-decoration:none;}
  .pano-title a:hover{text-decoration:underline;}
  .pano-meta{font-size:11px; color:var(--ink-soft); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pano-state{padding:60px 0; text-align:center; color:var(--ink-soft);}
  @media (max-width: 720px){ .pano-wrap{padding:20px 16px 44px;} .pano-head{font-size:21px;} }
</style>

</head>
<body>
<script src="js/overlay-manager.js" defer></script>
<script src="image-cdn.js" defer></script>
<script src="auth-nav.js" defer></script>
<script src="catalog-taxonomy.js" defer></script>
<script src="js/components/nav-product-menu.js" defer></script>
<script src="js/components/modal-shell.js" defer></script>
<script src="awards-shared.js"></script>
<script src="js/components/lazy-modals.js" defer></script>
<script src="js/components/profession-drawer.js" defer></script>
<script src="js/components/image-lightbox.js" defer></script>

  <div id="site-header-mount" data-nav-active=""></div>
  <script src="js/components/site-chrome.js"></script>

  <div class="pano-wrap">
    <h1 class="pano-head" id="pano-title">Pano</h1>
    <p class="pano-sub" id="pano-sub"></p>
    <div id="pano-content"><div class="pano-state">Yükleniyor…</div></div>
  </div>

  <footer id="site-footer-mount"></footer>

<script>
// Paylaşılan pano görüntüleyici — TEK veri kaynağı GET /api/collections/shared/:token (oturum
// GEREKTİRMEZ, yalnızca sahibi paylaşımı açtıysa 200 döner, bkz. src/routes/collections.js).
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// auth-modal.js#safeUrl ile AYNI gerekçe: yalnızca http/https'e izin ver (javascript: engellensin).
function safeUrl(u){
  try { const p = new URL(u, document.baseURI); if (p.protocol==='http:'||p.protocol==='https:') return p.href; } catch(e) {}
  return '';
}
const cdn = (u,w) => (typeof cdnImg==='function' ? cdnImg(u,w) : u);

document.addEventListener('DOMContentLoaded', async () => {
  const m = location.pathname.match(/^\/pano\/([^/]+)\/?$/);
  const content = document.getElementById('pano-content');
  if (!m) { content.innerHTML = '<div class="pano-state">Pano bulunamadı.</div>'; return; }
  let data = null;
  try {
    const res = await fetch('/api/collections/shared/' + encodeURIComponent(m[1]));
    if (res.ok) data = await res.json();
  } catch(e) {}
  if (!data || !data.item) {
    content.innerHTML = '<div class="pano-state">Bu pano bulunamadı ya da paylaşımı kaldırılmış.</div>';
    return;
  }
  document.getElementById('pano-title').textContent = data.item.title || 'Pano';
  document.title = (data.item.title || 'Pano') + ' — MİMARLAB';
  const items = data.items || [];
  document.getElementById('pano-sub').textContent = items.length + ' öğe · MİMARLAB\'da paylaşılan pano';
  if (!items.length) { content.innerHTML = '<div class="pano-state">Bu pano henüz boş.</div>'; return; }
  content.innerHTML = '<div class="pano-grid">' + items.map(it => {
    const image = safeUrl(it.image);
    const href = safeUrl(it.href);
    // Koleksiyonum'daki kart şablonuyla AYNI yapı; görsele tıklayınca büyür (image-lightbox.js).
    const media = image
      ? '<img class="pano-media img-zoomable" src="' + escapeAttr(cdn(image,400)) + '" data-lightbox-src="' + escapeAttr(image) + '" data-lightbox-alt="' + escapeAttr(it.title||'') + '" alt="" loading="lazy" decoding="async">'
      : (it.kind === 'note' ? '<div class="pano-note">' + escapeHtml(it.note) + '</div>' : '');
    const titleText = it.title || (it.kind === 'note' ? '' : '—');
    const titleHtml = titleText
      ? '<div class="pano-title">' + (href ? '<a href="' + escapeAttr(href) + '">' + escapeHtml(titleText) + '</a>' : escapeHtml(titleText)) + '</div>'
      : '';
    const metaHtml = it.meta ? '<div class="pano-meta">' + escapeHtml(it.meta) + '</div>' : '';
    const body = (titleHtml || metaHtml) ? '<div class="pano-body">' + titleHtml + metaHtml + '</div>' : '';
    return '<div class="pano-item">' + media + body + '</div>';
  }).join('') + '</div>';
});
</script>
</body>
</html>
