<!-- Erken liste fetch'i (performans denetimi deseni, 2026-09-06 madde 3 — kisi/firma/marka/proje ile

     DEĞİLKEN çalışır — o durumda render()'ın üreteceği URL kesindir. limit=12 değeri
     js/pages/gundem.js#PAGE_SIZE ile birebir aynı olmalı; ayrışırsa istek boşa gider (kırılmaz,

if(p==='/gundem'&&!location.search){var u='/api/gundem?page=1&limit=12';var f=fetch(u);f.catch(function(){});(window.__mlPrefetch=window.__mlPrefetch||{})[u]=f;}
}catch(e){}})();</script>

<!-- Bu sayfa /gundem/:slug altında da servis edilir (bkz. src/index.js#CLEAN_URL_ASSETS); <base>

     AYNI gerekçe. -->
<base href="/">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D; --ink-soft:#4E6478; --paper:#EDF0F3; --paper-card:#F8FAFB; --paper-alt:#E0E6EC;
    --walnut:#2B425F; --brass:#5B7A9B; --brass-soft:#AFC5D8; --sage:#4F6478; --accent:#E08A3E;
    --line: rgba(27,42,61,0.14); --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1; --ink-soft:#93A4B8; --paper:#12171F; --paper-card:#1A212B; --paper-alt:#212A35;
    --walnut:#8FB0DA; --brass:#7FA0C4; --brass-soft:#2E3F52; --sage:#8CA3BA;
    --rust:#D08F8F; --accent:#E8A968; --accent-soft:#4A3624; --good:#5FB37D; --bad:#DD7676;
    --line: rgba(232,236,241,0.14); --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}
  img{max-width:100%;}

  /* ---------- NAV (site-chrome.js ile ortak, hakkinda.html'den birebir) ---------- */
  .nav{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:24px; padding:10px 32px; background:rgba(237,240,243,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{display:none; position:absolute; top:100%; right:18px; z-index:95; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;}
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{background:none; color:var(--ink); padding:8px 17px; border-radius:100px; border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;}
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{background:var(--ink); color:rgba(237,240,243,0.7); padding:14px 32px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* =============================================================================================
     GÜNDEM — EDİTORYAL KART DÜZENİ
     ---------------------------------------------------------------------------------------------
     Referans görselin BENİMSENEN yanları: çok açık nötr sayfa zemini (--paper zaten öyle),
     ortalanmış geniş container, beyaz büyük kartlar, geniş yuvarlatılmış köşeler, solda büyük
     fotoğraf, sağda güçlü editoryal başlık, kartlar arasında belirgin ama zarif boşluk, minimum
     çizgi/çerçeve.
     BENİMSENMEYEN yanı: referanstaki serif başlık yazıtipi. Bu depoda TEK yazıtipi ailesi Inter'dir
     ve kendi sunucumuzdan servis edilir (bkz. fonts/inter.css + src/index.js#CSP font-src 'self');
     yeni bir yazıtipi yüklemek hem tasarım sistemini hem CSP'yi hem de performans bütçesini bozardı.
     Aynı editoryal hiyerarşi Inter ile kuruluyor: büyük punto + 700 ağırlık + negatif harf aralığı
     (letter-spacing:-0.02em) + sıkı satır yüksekliği (1.15) başlıkta; küçük punto + geniş harf
     aralığı + büyük harf meta satırında.
     ============================================================================================= */
  .gundem-wrap{max-width:1080px; margin:0 auto; padding:48px 32px 90px;}

  .gundem-head{margin-bottom:30px;}
  .gundem-eyebrow{font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--sage); font-weight:600; margin-bottom:10px;}
  .gundem-title{font-size:clamp(32px, 5vw, 46px); font-weight:700; margin:0 0 12px; letter-spacing:-0.025em; line-height:1.05;}
  .gundem-lead{font-size:16px; line-height:1.65; color:var(--ink-soft); margin:0 0 26px; max-width:620px;}

  /* Kategori çipleri — js/components/project-group-filter.js#.pgf-chip ile BİREBİR aynı pil dili
     (seçili = dolu var(--ink)); yeni bir çip tasarımı icat edilmedi. */
  .gundem-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .gundem-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:100px;
    padding:7px 15px; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  }
  .gundem-chip:hover{border-color:var(--brass); color:var(--ink);}
  .gundem-chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper-card);}

  /* ---------- KART LİSTESİ ---------- */
  .gundem-list{display:flex; flex-direction:column; gap:22px;}

  .gundem-card{
    position:relative;
    display:grid; grid-template-columns:minmax(0, 420px) minmax(0, 1fr); gap:0;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px;
    overflow:hidden; transition:box-shadow .18s, border-color .18s, transform .18s;
  }
  .gundem-card:hover{box-shadow:0 14px 34px rgba(27,42,61,0.10); border-color:var(--line);}

  /* Görsel: referanstaki ~16:10 oran. aspect-ratio + width/height öznitelikleri BİRLİKTE kullanılır
     — kaynak görselinin gerçek boyutunu bilmiyoruz, ikisi olmadan görsel yüklenirken CLS oluşurdu
     (madde 19). Görsel KAYNAĞIN KENDİ CDN'inden gelir (R2'ye kopyalanmaz, bkz.
     migrations/0099_gundem.sql) — bu yüzden bu depodaki w400/w800 türev sistemi burada
     UYGULANAMAZ; onun yerine loading="lazy" + decoding="async" + sabit oran kullanılır. */
  .gundem-photo{position:relative; background:var(--paper-alt);}
  .gundem-photo img{
    display:block; width:100%; height:100%; aspect-ratio:16/10;
    object-fit:cover; object-position:center;
  }
  .gundem-photo-link{display:block; height:100%;}

  .gundem-body{padding:26px 28px 24px; display:flex; flex-direction:column; min-width:0;}
  /* Kaydet/Paylaş kontrollerine yer bırakır — başlıkla ÇAKIŞMAMALI (madde 23). */
  .gundem-meta{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600;
    color:var(--sage); margin:0 96px 12px 0; min-height:20px;
  }
  .gundem-meta .sep{opacity:0.45;}
  .gundem-meta .gundem-cat{color:var(--accent);}

  .gundem-card-title{
    font-size:clamp(20px, 2.2vw, 26px); font-weight:700; line-height:1.18;
    letter-spacing:-0.02em; margin:0 0 12px;
  }
  .gundem-card-title a:hover{color:var(--walnut);}

  .gundem-summary{
    font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 18px;
  }

  .gundem-foot{margin-top:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .gundem-source-link{
    font-size:13px; font-weight:600; color:var(--walnut);
    display:inline-flex; align-items:center; gap:5px;
  }
  .gundem-source-link:hover{text-decoration:underline;}

  /* Bilgi grafiği rozetleri — yalnızca GERÇEK bir MİMARLAB kaydına eşleşen adlar için basılır
     (bkz. src/lib/gundemEntities.js). Eşleşme yoksa satır hiç render edilmez. */
  .gundem-entities{display:flex; flex-wrap:wrap; gap:6px;}
  .gundem-entity{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:100px;
    background:var(--paper-alt); border:1px solid var(--line-soft);
    font-size:11.5px; font-weight:600; color:var(--ink-soft);
  }
  .gundem-entity:hover{border-color:var(--brass); color:var(--ink);}

  /* Kaydet + Paylaş — kartın sağ üstü (madde 2). ShareWidget kendi .share-btn stilini enjekte eder
     (bkz. js/components/share-button.js), .card-save-btn ise proje.html'dekiyle AYNI dairesel
     ikon düğmesidir; burada yalnızca konumlandırılır, yeniden tasarlanmaz. */
  .gundem-actions{
    position:absolute; top:16px; right:16px; z-index:3;
    display:flex; align-items:center; gap:8px;
  }
  .card-save-btn{
    width:32px; height:32px; border-radius:100px;
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-save-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .card-save-btn.saved{background:var(--accent); border-color:var(--accent); color:var(--ink);}

  /* ---------- DURUMLAR ---------- */
  .gundem-status{
    padding:44px 20px; text-align:center; color:var(--ink-soft); font-size:14.5px;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px;
  }
  .gundem-more-wrap{display:flex; justify-content:center; margin-top:30px;}
  .gundem-more{
    background:none; border:1.5px solid var(--ink); color:var(--ink);
    padding:11px 30px; border-radius:100px; font-size:14px; font-weight:600;
  }
  .gundem-more:hover{background:var(--ink); color:var(--paper-card);}
  .gundem-more[disabled]{opacity:.5; cursor:default;}

  /* İskelet — ilk yüklemede boş beyaz alan yerine kartların yerini tutar (CLS önlemi). */
  .gundem-skeleton{
    display:grid; grid-template-columns:minmax(0, 420px) minmax(0, 1fr);
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px; overflow:hidden;
  }
  .gundem-skeleton > div:first-child{aspect-ratio:16/10; background:var(--paper-alt);}
  .gundem-skeleton > div:last-child{padding:26px 28px;}
  .gundem-skeleton .sk-line{height:12px; border-radius:6px; background:var(--paper-alt); margin-bottom:12px;}
  .gundem-skeleton .sk-line.t{height:22px; width:80%;}
  .gundem-skeleton .sk-line.s{width:100%;}
  .gundem-skeleton .sk-line.s2{width:92%;}
  .gundem-skeleton .sk-line.s3{width:64%;}

  /* ---------- SSR FALLBACK ----------
     src/index.js#serveGundemListPage (liste) ve #injectMeta (detay) bu konteynere gerçek kartları
     basar — JS kapalıyken/yüklenmeden ÖNCE görünen içerik budur (madde 14). İstemci render'ı
     tamamlanınca body.gundem-ready ile gizlenir (proje.html#body.grid-ready ile AYNI desen), böylece
     aynı içerik iki kez görünmez. */
  .gundem-ssr-list{display:flex; flex-direction:column; gap:22px;}
  .gundem-ssr-card{
    display:grid; grid-template-columns:minmax(0, 420px) minmax(0, 1fr);
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px; overflow:hidden;
  }
  .gundem-ssr-img{display:block; width:100%; height:100%; aspect-ratio:16/10; object-fit:cover;}
  .gundem-ssr-body{padding:26px 28px 24px;}
  .gundem-ssr-meta{font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; color:var(--sage); margin:0 0 12px;}
  .gundem-ssr-title{font-size:clamp(20px, 2.2vw, 26px); font-weight:700; line-height:1.18; letter-spacing:-0.02em; margin:0 0 12px;}
  .gundem-ssr-summary{font-size:14.5px; line-height:1.7; color:var(--ink-soft); margin:0 0 16px;}
  .gundem-ssr-source a{font-size:13px; font-weight:600; color:var(--walnut);}
  body.gundem-ready #ssr-entity-body{display:none;}
  /* injectMeta detay yolunda gövdeyi .ssr-entity-text sarmalayıcısına koyar (bkz. src/index.js#
     injectMeta) — o sarmalayıcının kendi stili bu sayfada yok, düz bir blok olarak akması yeterli. */
  #ssr-entity-body .ssr-entity-text{display:block;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  /* =============================================================================================
     RESPONSIVE (madde 3 + 23)
     ============================================================================================= */
  /* TABLET — aynı editoryal yapı korunur, oranlar küçülür. */
  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
    .gundem-wrap{padding:36px 22px 70px;}
    .gundem-card,
    .gundem-skeleton,
    .gundem-ssr-card{grid-template-columns:minmax(0, 300px) minmax(0, 1fr);}
    .gundem-body,
    .gundem-ssr-body{padding:20px 22px 20px;}
    .gundem-card-title,
    .gundem-ssr-title{font-size:20px;}
    .gundem-summary,
    .gundem-ssr-summary{font-size:14px;}
  }

  /* MOBİL — tek kolon: görsel üstte, metin altta (madde 3/23). */
  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .gundem-wrap{padding:28px 16px 64px;}
    .gundem-list{gap:18px;}
    .gundem-card,
    .gundem-skeleton,
    .gundem-ssr-card{grid-template-columns:1fr;}
    .gundem-photo img,
    .gundem-ssr-img{aspect-ratio:16/10; height:auto;}
    .gundem-skeleton > div:first-child{aspect-ratio:16/10;}
    /* Kaydet/Paylaş mobilde görselin ÜSTÜNDE durur — metin sütununa taşarsa başlıkla çakışırdı.
       Buton boyutları share-button.js'in kendi @media(max-width:860px) kuralıyla 48px'e çıkar
       (Apple/Google dokunma hedefi standardı, bkz. o dosyadaki not); .card-save-btn de aynı
       boyuta getirilir ki ikisi hizalı kalsın. */
    .gundem-actions{top:12px; right:12px;}
    /* 48px — share-button.js'in kendi mobil kuralı .share-btn'i 48x48'e çıkarır; aynı değeri burada
