<base href="/">

<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D; --ink-soft:#4E6478; --paper:#EDF0F3; --paper-card:#F8FAFB; --paper-alt:#E0E6EC;
    --walnut:#2B425F; --brass:#5B7A9B; --brass-soft:#AFC5D8; --sage:#4F6478; --accent:#E08A3E;
    --line: rgba(27,42,61,0.14); --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1; --ink-soft:#93A4B8; --paper:#12171F; --paper-card:#1A212B; --paper-alt:#212A35;
    --walnut:#8FB0DA; --brass:#7FA0C4; --brass-soft:#2E3F52; --sage:#8CA3BA;
    --rust:#D08F8F; --accent:#E8A968; --accent-soft:#4A3624; --good:#5FB37D; --bad:#DD7676;
    --line: rgba(232,236,241,0.14); --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}
  img{max-width:100%;}

  /* ---------- NAV (site-chrome.js ile ortak, hakkinda.html'den birebir) ---------- */
  .nav{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:24px; padding:10px 32px; background:rgba(237,240,243,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{display:none; position:absolute; top:100%; right:18px; z-index:95; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;}
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{background:none; color:var(--ink); padding:8px 17px; border-radius:100px; border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;}
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{background:var(--ink); color:rgba(237,240,243,0.7); padding:14px 32px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}
  /* Detay görünümünde açılan orta basamak — [hidden] flex çocuklarında güvenilir olsun diye açıkça. */
  .breadcrumb-bar [hidden]{display:none;}

  /* =============================================================================================
     GÜNDEM — EDİTORYAL KART DÜZENİ
     ---------------------------------------------------------------------------------------------
     Referans görselin BENİMSENEN yanları: çok açık nötr sayfa zemini (--paper zaten öyle),
     ortalanmış geniş container, beyaz büyük kartlar, geniş yuvarlatılmış köşeler, solda büyük
     fotoğraf, sağda güçlü editoryal başlık, kartlar arasında belirgin ama zarif boşluk, minimum
     çizgi/çerçeve.
     BENİMSENMEYEN yanı: referanstaki serif başlık yazıtipi. Bu depoda TEK yazıtipi ailesi Inter'dir
     ve kendi sunucumuzdan servis edilir (bkz. fonts/inter.css + src/index.js#CSP font-src 'self');
     yeni bir yazıtipi yüklemek hem tasarım sistemini hem CSP'yi hem de performans bütçesini bozardı.
     Aynı editoryal hiyerarşi Inter ile kuruluyor: büyük punto + 700 ağırlık + negatif harf aralığı
     (letter-spacing:-0.02em) + sıkı satır yüksekliği (1.15) başlıkta; küçük punto + geniş harf
     aralığı + büyük harf meta satırında.
     ============================================================================================= */
  /* Kart geometrisinin TEK KAYNAĞI (referans görsel ölçümlerinden türetildi, 2026-09-06).
     Yatay padding YÜZDE'dir: yüzdesel padding kartın KENDİ genişliğine göre çözülür, bu yüzden
     container genişliği değişse de görsel/metin/boşluk oranları referanstaki gibi sabit kalır
     (vw tabanlı bir değer, container max-width'e dayandığı anda bozulurdu).
     Referans: kart 1440 px iken sol 150 / sağ 140 px => %10,4. */
  :root{
    --gcard-pad-x: 10.4%;
    --gcard-pad-top: 54px;
    --gcard-pad-bottom: 38px;
    --gcard-gap: 28px;
    --gcard-radius: 26px;
  }

  /* Referansta kart, viewport'un ~%83'ünü kaplıyor — mevcut 1080 px'lik container o editoryal
     genişliği veremiyordu. 1400 px, siteyle tutarlı kalırken referansın geniş kart hissini verir. */
  .gundem-wrap{max-width:1400px; margin:0 auto; padding:40px 32px 90px;}

  /* BAŞLIK SATIRI — referansta başlık+alt başlık SOLDA, kategori çipleri AYNI SATIRDA sağda.
     Önceki sürümde çipler başlığın ALTINDAydı ve üst blok gereksiz yer kaplıyordu. */
  /* Üç kolonlu grid (1fr auto 1fr): başlık solda kalırken çipler CONTAINER'A GÖRE ortalanır.
     flex + space-between denendi ve referanstan saptı — başlık kısa olduğu için çipler sağ kenara
     yapışıyordu; referansta çipler kartların orta ekseninde duruyor (ölçüm: çip bloğunun merkezi
     881 px, container merkezi 870 px). Üçüncü kolon bilerek boştur, yalnızca simetriyi kurar. */
  .gundem-head{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px 32px;
    margin-bottom:26px;
  }
  .gundem-head-text{min-width:0; grid-column:1;}
  /* Referansta sayfa başlığı (~31 px) kart başlıklarıyla neredeyse AYNI boyutta — editoryal
     hiyerarşi sayfayı değil KARTLARI öne çıkarır. Önceki 46 px bunu tersine çeviriyordu. */
  .gundem-title{font-size:clamp(26px, 2.6vw, 32px); font-weight:700; margin:0 0 5px; letter-spacing:-0.025em; line-height:1.1;}
  .gundem-lead{font-size:13.5px; line-height:1.5; color:var(--ink-soft); margin:0; max-width:520px;}

  /* Kategori çipleri — js/components/project-group-filter.js#.pgf-chip ile BİREBİR aynı pil dili
     (seçili = dolu var(--ink)); yeni bir çip tasarımı icat edilmedi. Referansla da örtüşüyor. */
  .gundem-chips{display:flex; flex-wrap:wrap; gap:8px; flex-shrink:0; grid-column:2; justify-content:center;}
  .gundem-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:100px;
    padding:7px 15px; font-family:inherit; font-size:13px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; transition:background .15s, color .15s, border-color .15s;
  }
  .gundem-chip:hover{border-color:var(--brass); color:var(--ink);}
  .gundem-chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper-card);}

  /* ---------- KART LİSTESİ ---------- */
  /* Referansta kartlar arası boşluk kart genişliğinin ~%2,4'ü (1440 px kartta ~34 px). */
  .gundem-list{display:flex; flex-direction:column; gap:32px;}

  /* Referansta kartın ÇERÇEVESİ YOK — açık gri zemin üzerinde yalnızca beyaz yüzey ve çok hafif
     bir gölge var. Önceki 1px'lik çizgi kartları "kutu" gibi gösteriyor, editoryal hissi kırıyordu. */
  .gundem-card{
    position:relative;
    display:grid;
    /* Referans: görsel 657 px : metin 465 px = 1,41 : 1. */
    grid-template-columns:minmax(0, 1.41fr) minmax(0, 1fr);
    gap:var(--gcard-gap);
    padding:var(--gcard-pad-top) var(--gcard-pad-x) var(--gcard-pad-bottom);
    background:var(--paper-card); border:none; border-radius:var(--gcard-radius);
    box-shadow:0 1px 2px rgba(27,42,61,0.04);
    transition:box-shadow .18s;
  }
  .gundem-card:hover{box-shadow:0 14px 34px rgba(27,42,61,0.10);}

  /* Görsel referansta kartın KENARINA YAPIŞMAZ — kart padding'inin içinde, kendi küçük köşe
     yarıçapıyla durur. Oran 3:2 (657x430). aspect-ratio + width/height öznitelikleri BİRLİKTE
     kullanılır: kaynak görselinin gerçek boyutunu bilmiyoruz, ikisi olmadan görsel yüklenirken
     CLS oluşurdu (madde 19). Görsel KAYNAĞIN KENDİ CDN'inden gelir (R2'ye kopyalanmaz, bkz.
     migrations/0099_gundem.sql) — bu yüzden bu depodaki w400/w800 türev sistemi burada
     UYGULANAMAZ; onun yerine loading="lazy" + decoding="async" + sabit oran kullanılır. */
  /* align-self:start ŞART — grid varsayılanı stretch olduğundan, metin kolonu uzun olan kartlarda
     (3 satırlık başlık) görsel satır yüksekliğine kadar UZAYIP 3:2 oranını bozuyordu. Referansta
     görsel oranı HER kartta sabittir; kart yüksekliği görselin değil, iki kolondan uzun olanın
     yüksekliğidir ve metin kısaysa altta beyaz alan kalır. */
  .gundem-photo{position:relative; align-self:start; background:var(--paper-alt); border-radius:8px; overflow:hidden;}
  .gundem-photo img{
    display:block; width:100%; height:auto; aspect-ratio:3/2;
    object-fit:cover; object-position:center;
  }
  .gundem-photo-link{display:block;}

  .gundem-body{display:flex; flex-direction:column; min-width:0; padding:0;}

  /* Referans metadata: "12 May 2026 News" — BÜYÜK HARF DEĞİL, harf aralığı YOK, kategori turuncu
     değil KOYU ve KALIN. Önceki uppercase+turuncu kurgu referanstan belirgin şekilde sapıyordu. */
  .gundem-meta{
    display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
    font-size:12.5px; font-weight:500; color:var(--ink-soft);
    margin:0 0 10px; letter-spacing:0; text-transform:none;
  }
  .gundem-meta .gundem-cat{color:var(--ink); font-weight:700;}
  .gundem-meta .gundem-src{color:var(--ink-soft);}
  .gundem-meta .gundem-src::before{content:'·'; margin-right:6px; opacity:0.5;}

  /* Referansta kart başlığı SAYFA başlığından büyük — hiyerarşinin ağırlık merkezi kartta.
     Inter, referanstaki serif'ten daha geniş olduğu için aynı optik boyut biraz daha küçük
     px değeriyle elde edilir (serif ~36 px ≈ Inter ~30 px). */
  .gundem-card-title{
    font-size:clamp(21px, 2.15vw, 30px); font-weight:700; line-height:1.14;
    letter-spacing:-0.025em; margin:0 0 11px;
  }
  .gundem-card-title a:hover{color:var(--walnut);}

  /* Referansta özet 4 satırda kırpılıyor ve kartın sağ alt köşesinde belirgin bir beyaz alan
     bırakıyor — editoryal ferahlığın asıl kaynağı bu. -webkit-line-clamp SALT GÖRSEL bir kırpmadır:
     metnin tamamı DOM'da kalır, yani SSR/SEO çıktısı ve ekran okuyucular etkilenmez.
     DETAY görünümünde (/gundem/:slug) kırpma KALDIRILIR — orada sayfanın kendisi o içeriktir. */
  .gundem-summary{
    font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 16px;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden;
  }
  .gundem-card--detail .gundem-summary{display:block; -webkit-line-clamp:none; overflow:visible;}
  /* Detay görünümünde başlık ZATEN sayfanın H1'idir (injectMeta onu kayda göre doldurur) — kart
     kendi başlığını da basarsa aynı metin ekranda iki kez görünür. */
  .gundem-card--detail .gundem-card-title{display:none;}

  /* margin-top:auto KALDIRILDI: kaynak bağlantısını kartın DİBİNE itiyordu ve özetle arasında
     büyük bir boşluk açıyordu. Referansta metin bloğu kendi içinde sıkı akar, artan yer kartın
     ALTINDA beyaz alan olarak kalır — bağlantı da bu yüzden doğrudan özetin ardından gelir. */
  .gundem-foot{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .gundem-source-link{
    font-size:13px; font-weight:600; color:var(--walnut);
    display:inline-flex; align-items:center; gap:5px;
  }
  .gundem-source-link:hover{text-decoration:underline;}

  /* Bilgi grafiği rozetleri — yalnızca GERÇEK bir MİMARLAB kaydına eşleşen adlar için basılır
     (bkz. src/lib/gundemEntities.js). Eşleşme yoksa satır hiç render edilmez. */
  .gundem-entities{display:flex; flex-wrap:wrap; gap:6px;}
  .gundem-entity{
    display:inline-flex; align-items:center; padding:4px 10px; border-radius:100px;
    background:var(--paper-alt); border:1px solid var(--line-soft);
    font-size:11.5px; font-weight:600; color:var(--ink-soft);
  }
  .gundem-entity:hover{border-color:var(--brass); color:var(--ink);}

  /* Kaydet + Paylaş — kartın sağ üstü (madde 2). ShareWidget kendi .share-btn stilini enjekte eder
     (bkz. js/components/share-button.js), .card-save-btn ise proje.html'dekiyle AYNI dairesel
     ikon düğmesidir; burada yalnızca konumlandırılır, yeniden tasarlanmaz.
     Konum: kartın sağ üst köşesindeki BOŞ padding alanı (referansta o alan tamamen beyaz), ama
     `right` değeri kartın yatay padding'iyle AYNI değişkene bağlanır — böylece butonlar metin
     kolonunun sağ kenarına hizalanır, kenarda yalnız başına asılı kalmazlar. */
  .gundem-actions{
    position:absolute; top:14px; right:var(--gcard-pad-x); z-index:3;
    display:flex; align-items:center; gap:8px;
  }
  .card-save-btn{
    width:32px; height:32px; border-radius:100px;
    background:var(--paper-card); border:1px solid var(--line); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-save-btn:hover{border-color:var(--walnut); color:var(--ink);}
  .card-save-btn.saved{background:var(--accent); border-color:var(--accent); color:var(--ink);}

  /* ---------- DURUMLAR ---------- */
  .gundem-status{
    padding:44px 20px; text-align:center; color:var(--ink-soft); font-size:14.5px;
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px;
  }
  .gundem-more-wrap{display:flex; justify-content:center; margin-top:30px;}
  /* GERÇEK BULGU: `display:flex`, [hidden] özniteliğinin UA varsayılanı olan display:none'ı EZİYOR —
     buton hem detay görünümünde hem de hasMore:false olan liste görünümlerinde (ör. tek sayfalık
     bir kategori) yanlışlıkla görünüyordu. Öznitelik doğru set ediliyordu, yalnızca CSS onu
     geçersiz kılıyordu. */
  .gundem-more-wrap[hidden]{display:none;}
  .gundem-more{
    background:none; border:1.5px solid var(--ink); color:var(--ink);
    padding:11px 30px; border-radius:100px; font-size:14px; font-weight:600;
  }
  .gundem-more:hover{background:var(--ink); color:var(--paper-card);}
  .gundem-more[disabled]{opacity:.5; cursor:default;}

  /* İskelet — ilk yüklemede boş beyaz alan yerine kartların yerini tutar (CLS önlemi). */
  .gundem-skeleton{
    display:grid; grid-template-columns:minmax(0, 420px) minmax(0, 1fr);
    background:var(--paper-card); border:1px solid var(--line-soft); border-radius:20px; overflow:hidden;
  }
  .gundem-skeleton > div:first-child{aspect-ratio:16/10; background:var(--paper-alt);}
  .gundem-skeleton > div:last-child{padding:26px 28px;}
  .gundem-skeleton .sk-line{height:12px; border-radius:6px; background:var(--paper-alt); margin-bottom:12px;}
  .gundem-skeleton .sk-line.t{height:22px; width:80%;}
  .gundem-skeleton .sk-line.s{width:100%;}
  .gundem-skeleton .sk-line.s2{width:92%;}
  .gundem-skeleton .sk-line.s3{width:64%;}

  /* ---------- SSR FALLBACK ----------
     src/index.js#serveGundemListPage (liste) ve #injectMeta (detay) bu konteynere gerçek kartları
     basar — JS kapalıyken/yüklenmeden ÖNCE görünen içerik budur (madde 14). İstemci render'ı
     tamamlanınca body.gundem-ready ile gizlenir (proje.html#body.grid-ready ile AYNI desen), böylece
     aynı içerik iki kez görünmez. */
  /* Geometri istemci kartıyla BİREBİR aynı değişkenlerden gelir — ayrışırlarsa JS yüklenirken
     görünür bir sıçrama (layout shift) olurdu. */
  .gundem-ssr-list{display:flex; flex-direction:column; gap:32px;}
  .gundem-ssr-card{
    display:grid; grid-template-columns:minmax(0, 1.41fr) minmax(0, 1fr); gap:var(--gcard-gap);
    padding:var(--gcard-pad-top) var(--gcard-pad-x) var(--gcard-pad-bottom);
    background:var(--paper-card); border:none; border-radius:var(--gcard-radius);
    box-shadow:0 1px 2px rgba(27,42,61,0.04);
  }
  /* align-self:start + height:auto — istemci kartındaki AYNI gerekçe (görsel satır yüksekliğine
     uzayıp 3:2'yi bozmasın). */
  .gundem-ssr-img{display:block; align-self:start; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover; border-radius:8px;}
  .gundem-ssr-body{padding:0; min-width:0;}
  .gundem-ssr-meta{
    display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
    font-size:12.5px; font-weight:500; letter-spacing:0; text-transform:none; color:var(--ink-soft); margin:0 0 10px;
  }
  /* Meta parçalarının rengi/ağırlığı iki kart türünde de TEK kuraldan gelir (istemci .gundem-meta,
     sunucu .gundem-ssr-meta) — ayrışırlarsa hydration anında görünür bir renk sıçraması olurdu. */
  .gundem-meta .gundem-date, .gundem-ssr-meta .gundem-date{color:var(--ink-soft);}
  .gundem-ssr-meta .gundem-cat{color:var(--ink); font-weight:700;}
  .gundem-ssr-meta .gundem-src{color:var(--ink-soft);}
  .gundem-ssr-meta .gundem-src::before{content:'·'; margin-right:6px; opacity:0.5;}
  .gundem-ssr-title{font-size:clamp(21px, 2.15vw, 30px); font-weight:700; line-height:1.14; letter-spacing:-0.025em; margin:0 0 11px;}
  .gundem-ssr-summary{font-size:15px; line-height:1.55; color:var(--ink-soft); margin:0 0 16px;}
  .gundem-ssr-source a{font-size:13px; font-weight:600; color:var(--walnut);}
  body.gundem-ready #ssr-entity-body{display:none;}
  /* injectMeta detay yolunda gövdeyi .ssr-entity-text sarmalayıcısına koyar (bkz. src/index.js#
     injectMeta) — o sarmalayıcının kendi stili bu sayfada yok, düz bir blok olarak akması yeterli. */
  #ssr-entity-body .ssr-entity-text{display:block;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  /* =============================================================================================
     RESPONSIVE (madde 3 + 23)
     ============================================================================================= */
  /* TABLET — aynı editoryal yapı (görsel solda, metin sağda) KORUNUR, yalnızca oranlar küçülür:
     kartın kendi yüzdesel padding'i daralır, kolon oranı referanstakine yakın kalır. */
  @media (max-width:1100px){
    :root{
      --gcard-pad-x: 6%;
      --gcard-pad-top: 34px;
      --gcard-pad-bottom: 28px;
      --gcard-gap: 22px;
      --gcard-radius: 22px;
    }
    .gundem-wrap{padding:34px 22px 70px;}
    .gundem-list, .gundem-ssr-list{gap:24px;}
    .gundem-summary{-webkit-line-clamp:4;}
  }

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
    /* Dar ekranda üç kolonlu ortalama anlamını yitirir (çipler başlığı sıkıştırır) — başlık ve
       çipler alt alta, ikisi de sola hizalı akar. */
    .gundem-head{grid-template-columns:1fr; align-items:start; gap:16px;}
    .gundem-head-text, .gundem-chips{grid-column:1;}
    .gundem-chips{justify-content:flex-start;}
  }

  /* MOBİL — tek kolon: görsel üstte, metin altta (madde 3/23). */
  @media (max-width:720px){
    :root{
      --gcard-pad-x: 16px;
      --gcard-pad-top: 16px;
      --gcard-pad-bottom: 20px;
      --gcard-gap: 14px;
      --gcard-radius: 18px;
    }
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .gundem-wrap{padding:24px 14px 60px;}
    .gundem-list, .gundem-ssr-list{gap:16px;}
    /* Tek kolon: görsel üstte, metin altta (madde 3/23). Görsel kart padding'inin İÇİNDE kalır —
       referanstaki "yüzen fotoğraf" dili mobilde de korunur. */
    .gundem-card,
    .gundem-skeleton,
    .gundem-ssr-card{grid-template-columns:1fr;}
    .gundem-photo img,
    .gundem-ssr-img{aspect-ratio:3/2; height:auto;}
    .gundem-skeleton > div:first-child{aspect-ratio:3/2;}
    /* Mobilde kolon tam genişlik olduğundan aynı kelime sayısı daha az satıra sığar; kırpma
       sınırı gevşetilir ki özetin anlamlı bir bölümü görünsün. */
    .gundem-summary{-webkit-line-clamp:6;}
    /* Kaydet/Paylaş mobilde GÖRSELİN ÜSTÜNE biner — metin sütununa taşarsa başlıkla çakışırdı.
       top/right, kart padding'inden (16px) 10px içeride: butonlar görselin sağ üst köşesinde durur.
       Buton boyutları share-button.js'in kendi @media(max-width:860px) kuralıyla 48px'e çıkar
       (Apple/Google dokunma hedefi standardı, bkz. o dosyadaki not); .card-save-btn de aynı
       boyuta getirilir ki ikisi hizalı kalsın. */
    .gundem-actions{top:26px; right:26px;}
    /* 48px — share-button.js'in kendi mobil kuralı .share-btn'i 48x48'e çıkarır; aynı değeri burada
       da kullanmak İKİ ŞEY için gerekli: (a) Apple/Google dokunma hedefi standardı (bu depodaki
       mevcut kural), (b) iki buton yan yana duruyor, farklı boyutta olurlarsa hizasız görünürler
       (canlıda 44 vs 48 ölçüldü, bu yüzden eşitlendi). */
    .card-save-btn{
      width:48px; height:48px;
      background:rgba(248,250,251,0.92); border-color:rgba(27,42,61,0.18);
    }
    /* Meta satırının sağ boşluğu kalkar — butonlar artık görselin üstünde, metnin değil.
       Harf aralığı/büyük harf yok (referans metadata dili, masaüstüyle aynı). */
    .gundem-meta,
    .gundem-ssr-meta{margin-right:0; font-size:12px; letter-spacing:0;}
    .gundem-card-title,
    .gundem-ssr-title{font-size:21px;}
    .gundem-summary,
    .gundem-ssr-summary{font-size:14.5px;}
    /* .gundem-title/.gundem-lead için override YOK: yeni clamp() değerleri (26-32px / 13,5px)
       mobilde zaten doğru alt sınıra oturuyor, ayrıca bir kural onları masaüstünden BÜYÜK
       gösterirdi (önceki sürümdeki hata buydu). */
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }

  /* 375px — kullanıcı isteği madde 23'ün açık test genişliği. Yatay taşma olmamalı: uzun kaynak
     adları/URL'leri kırılabilir yapılır, çip satırı sarar. */
  @media (max-width:400px){
    .gundem-wrap{padding:24px 14px 56px;}
    .gundem-body,
    .gundem-ssr-body{padding:18px 16px 18px;}
    .gundem-meta,
    .gundem-source-link,
    .gundem-card-title,
    .gundem-summary{overflow-wrap:anywhere;}
    .gundem-chip{font-size:12.5px; padding:7px 13px;}
  }
