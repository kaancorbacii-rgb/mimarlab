  <script>
    // js/pages/proje.js#parseLocation ile AYNI takma ad — project-meta.js/project-related.js bu
    // global adı bekliyor, proje.js burada yüklü olmadığından kendimiz tanımlıyoruz.
    var parseLocation = parseLocationFull;

    function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    // Kart görselsiz kaldığında baş harf + sabit renk (bkz. js/pages/proje.js#initials/officeColor
    // İLE AYNI desen — bu sayfa proje.js'i yüklemediğinden burada küçük bir kopyası tutulur).
    function initials(name){
      var parts = (name || '').trim().split(/\s+/).filter(Boolean);
      if(!parts.length) return '?';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }
    var PLACEHOLDER_COLORS = ['#2B425F', '#5B7A9B', '#4F6478', '#8A6D4E', '#6B5B95', '#3F6656'];
    function placeholderColor(name){
      var s = name || ''; var hash = 0;
      for(var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
      return PLACEHOLDER_COLORS[hash % PLACEHOLDER_COLORS.length];
    }

    var DELTA_ICONS = {
      up: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l9 14H3z"/></svg>',
      down: '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20 3 6h18z"/></svg>',
      flat: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>'
    };

    // Açıklamadan tek cümle (bkz. kullanıcı isteği) — ilk nokta/ünlem/soru işaretine kadar olan
    // kısmı alır; makul bir üst sınırın (220 karakter) içinde işaret bulunamazsa metni orada kesip
    // "…" ekler (noktalama işareti hiç kullanılmayan uzun bir açıklama gövdeyi taşırmasın diye).
    // gerçek bulgu: naif "ilk .!? işaretinde kes" yaklaşımı Türkçe padişah/hükümdar sıra
    // numaralarında ("İmparator I. Justinianus", "II. Bayezid" vb.) YANLIŞ yerde kesiyordu — "I."
    // kısaltma noktası cümle sonu değil. Roma rakamı (I/V/X/L/C/D/M, 1-4 harf) hemen öncesindeki
    // noktalama işareti cümle sonu SAYILMAZ, bir sonraki işarete geçilir.
    var ROMAN_BEFORE_RE = /(^|\s)[IVXLCDM]{1,4}$/;
    function firstSentence(text){
      if(!text) return '';
      var t = text.trim();
      var end = -1;
      for(var i = 0; i < t.length && i < 260; i++){
        var ch = t[i];
        if(ch === '.' || ch === '!' || ch === '?'){
          var before = t.slice(0, i);
          if(ROMAN_BEFORE_RE.test(before) || /\d$/.test(before)) continue;
          end = i + 1;
          break;
        }
      }
      if(end === -1) return t.length > 160 ? t.slice(0, 160).trim() + '…' : t;
      return t.slice(0, end);
    }

    var ICON_SAVE = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>';
    var ICON_STAR = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5l3.09 6.26 6.91 1-5 4.87 1.18 6.87L12 17.98l-6.18 3.52L7 14.63l-5-4.87 6.91-1L12 2.5Z"/></svg>';
    // kullanıcı isteği: daha önce puanladığın projede Puanla düğmesindeki yıldız TAMAMEN turuncu
    // (dolu) görünsün — bkz. aşağıdaki paintRatedStars, ICON_STAR yerine bunu takar.
    var ICON_STAR_FILLED = '<svg class="top100-rate-icon-filled" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l3.09 6.26 6.91 1-5 4.87 1.18 6.87L12 17.98l-6.18 3.52L7 14.63l-5-4.87 6.91-1L12 2.5Z"/></svg>';

    var TOP100_ITEMS = [];
    var TOP100_SORT = 'rank';

    // Tip/Grup/Yer/Yıl filtreleri — js/pages/proje.js#FILTER_GROUPS İLE AYNI anahtar/etiket
    // eşleşmesi (bkz. kullanıcı isteği: "proje sayfasındaki filtreler gibi Tip, Grup, Yer, Yıl
    // filtre butonları koy... birine eklenen yeni bir kategori diğerine de otomatik eklensin") —
    // seçenekler /api/public/top100'ün ZATEN döndürdüğü canlı proje alanlarından (category/type/
    // location/dateBucket, bkz. src/routes/top100.js#computeTop100) istemci tarafında hesaplanır,
    // proje.html'in kullandığı AYNI canonical projects sütunlarına dayandığından iki sayfa hep
    // aynı kaynaktan beslenir — burada ayrıca sabit bir liste tutulmaz. Top100 sabit (~100 satır)
    // ve TAMAMI tek istekte zaten indiği için proje.html'deki gibi sunucudan faceted sayım çekmeye
    // gerek yok, tüm hesap TOP100_ITEMS üzerinde yerel yapılır.
    var TOP100_FILTER_GROUPS = [
      { key: 'category', label: 'Tip', getValues: function(it){ return it.category || []; } },
      { key: 'type', label: 'Grup', getValues: function(it){ return it.type || []; } },
      { key: 'location', label: 'Yer', getValues: function(it){ var loc = it.location ? parseLocation(it.location) : null; return (loc && loc.city) ? [loc.city] : []; } },
      { key: 'dateBucket', label: 'Yıl', getValues: function(it){ return it.dateBucket ? [it.dateBucket] : []; } },
    ];
    var activeTop100Filters = {};
    TOP100_FILTER_GROUPS.forEach(function(g){ activeTop100Filters[g.key] = new Set(); });

    function passesTop100Filters(it){
      return TOP100_FILTER_GROUPS.every(function(g){
        var active = activeTop100Filters[g.key];
        if(active.size === 0) return true;
        return g.getValues(it).some(function(v){ return active.has(v); });
      });
    }

    // Proje adına göre arama (bkz. kullanıcı isteği: "filtreler kısmına arama butonu koy") —
    // js/components/project-related.js#foldTr İLE AYNI TR-duyarlı katlama (İ/I/Ş/Ğ/Ü/Ö/Ç), "İstanbul"
    // ararken "istanbul" yazmanın da eşleşmesi için (bkz. proje/mimar/firma/ürün aramasındaki AYNI
    // desen, kullanıcı isteği: Türkçe büyük/küçük harf duyarlılığı sorunu daha önce burada da
    // çözülmüştü).
    function foldTr(s){
      return (s || '').replace(/İ/g, 'i').replace(/I/g, 'ı').replace(/Ş/g, 'ş').replace(/Ğ/g, 'ğ').replace(/Ü/g, 'ü').replace(/Ö/g, 'ö').replace(/Ç/g, 'ç').toLowerCase()
        .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o');
    }
    var TOP100_SEARCH_QUERY = '';
    function passesTop100Search(it){
      if(!TOP100_SEARCH_QUERY) return true;
      return foldTr(it.name).indexOf(TOP100_SEARCH_QUERY) !== -1;
    }

    // "En Yeni"/"En Eski" sıralaması için projectDate'ten (ör. "532-537", "1228-1229", "2024",
    // "MÖ 9600", "MÖ 17. Yüzyıl", "MÖ 410 / 1725", "MÖ 10. Yüzyıl - MS 15. Yüzyıl") gerçek yılı
    // çıkarır. src/routes/project.js#parseProjectDateYear İLE AYNI mantığın istemci-taraf portu
    // (js/components/project-related.js#parseProjectDateYear'daki AYNI kopyayla birebir) — proje.html
    // ve mimar/firma popup'larındaki "Diğer Projeleri" sıralamasıyla TUTARLI kalması için burada
    // üçüncü bir farklı kopya açılmadı. Kök sebep düzeltmesi (kullanıcı bulgusu): eski yearOf() ilk
    // \d{1,4} rakamını alıp string'de "MÖ" geçiyorsa negatif yapıyordu — "MÖ 17. Yüzyıl" bu yüzden
    // -17 sanılıyor, oysa 17. yüzyıl MÖ'nün gerçek başlangıcı -1650; -17 > -410 olduğundan Hattuşa
    // (aslında -1650, Kız Kulesi'nin -410'undan ÇOK daha eski) "En Eski" sıralamasında Kız Kulesi'nin
    // GERİSİNE düşüyordu. parseProjectDateYear "yüzyıl"/"yy" ibaresini yakalayıp yüzyıl→yıl çevrimi
    // yapar (MÖ N. yüzyıl → -(N*100), MS N. yüzyıl → (N-1)*100+1), "/" ile ayrılmış çoklu tarih
    // segmentlerini (ör. "MÖ 410 / 1725") ayrı ayrı değerlendirip EN ESKİSİNİ seçer, ve MÖ/MS karışık
    // aralıklarda ("MÖ 10. Yüzyıl - MS 15. Yüzyıl") her segmentin kendi MÖ/MS etiketini ayrı ayrı okur.
    // İnşa tarihi ayrıştırılamayan kayıtlar null döner ve sıralamanın yönünden bağımsız olarak HER
    // ZAMAN listenin sonuna düşer (aksi halde 0 kabul edilirlerse MÖ tarihlerin GERİSİNE ya da MS
    // tarihlerin arasına yanlışlıkla karışırlardı).
    function parseProjectDateYear(dateStr){
      if(!dateStr) return null;
      var hasCenturyWordAnywhere = /yuzyil|\byy\b/.test(foldTr(dateStr));
      var best = null;
      String(dateStr).split('/').forEach(function(rawSegment){
        var folded = foldTr(rawSegment);
        var isBC = /\bmo\b/.test(folded);
        var isCenturyFragment = hasCenturyWordAnywhere && /^\s*(ms\s*)?\d{1,2}\.\s*$/.test(folded);
        var isCentury = isCenturyFragment || /yuzyil|\byy\b/.test(folded);
        var nums = (rawSegment.match(/\d+/g) || []).map(function(n){ return parseInt(n, 10); });
        if(!nums.length) return;
        var year;
        if(isCentury){
          var century = isBC ? Math.max.apply(Math, nums) : Math.min.apply(Math, nums);
          year = isBC ? -(century * 100) : (century - 1) * 100 + 1;
        } else {
          var magnitude = isBC ? Math.max.apply(Math, nums) : Math.min.apply(Math, nums);
          year = isBC ? -magnitude : magnitude;
        }
        if(best === null || year < best) best = year;
      });
      return best;
    }

    function sortedFilteredItems(){
      var items = TOP100_ITEMS.filter(function(it){ return passesTop100Filters(it) && passesTop100Search(it); });
      if(TOP100_SORT === 'votes') items.sort(function(a, b){ return b.count - a.count; });
      else if(TOP100_SORT === 'alpha') items.sort(function(a, b){ return a.name.localeCompare(b.name, 'tr'); });
      else if(TOP100_SORT === 'date_desc' || TOP100_SORT === 'date_asc') items.sort(function(a, b){
        var ya = parseProjectDateYear(a.projectDate), yb = parseProjectDateYear(b.projectDate);
        if(ya === null && yb === null) return 0;
        if(ya === null) return 1;
        if(yb === null) return -1;
        return TOP100_SORT === 'date_desc' ? yb - ya : ya - yb;
      });
      else items.sort(function(a, b){ return a.rank - b.rank; });
      return items;
    }

    // Her grup için mevcut TOP100_ITEMS üzerinden (aktif diğer filtrelerden bağımsız, sade sayım —
    // proje.html'deki gibi faceted çapraz sayım burada gereksiz, liste zaten ~100 satır) seçenek+
    // sayaç hesaplar.
    function computeTop100Facets(){
      var facets = {};
      TOP100_FILTER_GROUPS.forEach(function(g){
        var counts = {};
        TOP100_ITEMS.forEach(function(it){
          g.getValues(it).forEach(function(v){ if(v) counts[v] = (counts[v] || 0) + 1; });
        });
        facets[g.key] = counts;
      });
      return facets;
    }

    function renderTop100ActiveChips(){
      var wrap = document.getElementById('top100-active-chips');
      var chips = [];
      TOP100_FILTER_GROUPS.forEach(function(g){
        activeTop100Filters[g.key].forEach(function(v){ chips.push({ key: g.key, val: v }); });
      });
      if(!chips.length){ wrap.innerHTML = ''; return; }
      wrap.innerHTML = chips.map(function(c){
        return '<span class="active-chip" data-key="' + c.key + '" data-val="' + escapeAttr(c.val) + '">' +
          escapeHtml(c.val) +
          '<button aria-label="Kaldır"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</span>';
      }).join('');
      wrap.querySelectorAll('.active-chip button').forEach(function(btn){
        btn.addEventListener('click', function(){
          var chip = btn.parentElement;
          activeTop100Filters[chip.dataset.key].delete(chip.dataset.val);
          renderTop100Filters();
          renderTop100ActiveChips();
          renderTop100(sortedFilteredItems());
        });
      });
    }

    // Filtre butonları + açılır panel — proje.html'in sidebar akordeonlarıyla AYNI seçenek/sayaç
    // görünümü (.filter-opt/.filter-opt-count, sayfa başı paylaşılan CSS), ama kullanıcı isteği
    // gereği tek satırlık kompakt bir buton+popover olarak (sidebar değil).
    var openTop100FilterKey = null;
    function renderTop100Filters(){
      var wrap = document.getElementById('top100-filters');
      var facets = computeTop100Facets();
      wrap.innerHTML = TOP100_FILTER_GROUPS.map(function(g){
        var counts = facets[g.key];
        var options = Object.keys(counts).sort(function(a, b){ return a.localeCompare(b, 'tr'); });
        if(!options.length) return '';
        var activeCount = activeTop100Filters[g.key].size;
        var isOpen = openTop100FilterKey === g.key;
        return '<div class="top100-filter-group" data-key="' + g.key + '">' +
          '<button type="button" class="top100-filter-btn" data-toggle="' + g.key + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
            escapeHtml(g.label) +
            (activeCount ? '<span class="top100-filter-count">' + activeCount + '</span>' : '') +
            '<svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 1l4 4 4-4"/></svg>' +
          '</button>' +
          '<div class="top100-filter-panel' + (isOpen ? ' open' : '') + '" data-panel="' + g.key + '">' +
            options.map(function(opt){
              return '<label class="filter-opt">' +
                '<input type="checkbox" data-key="' + g.key + '" value="' + escapeAttr(opt) + '"' + (activeTop100Filters[g.key].has(opt) ? ' checked' : '') + '>' +
                '<span>' + escapeHtml(opt) + '</span>' +
                '<span class="filter-opt-count">(' + counts[opt] + ')</span>' +
              '</label>';
            }).join('') +
          '</div>' +
        '</div>';
      }).join('');

      wrap.querySelectorAll('[data-toggle]').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          var key = btn.dataset.toggle;
          openTop100FilterKey = openTop100FilterKey === key ? null : key;
          renderTop100Filters();
        });
      });
      wrap.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('click', function(e){ e.stopPropagation(); });
        cb.addEventListener('change', function(){
          var key = cb.dataset.key, val = cb.value;
          if(cb.checked) activeTop100Filters[key].add(val); else activeTop100Filters[key].delete(val);
          renderTop100Filters();
          renderTop100ActiveChips();
          renderTop100(sortedFilteredItems());
        });
      });
    }
    document.addEventListener('click', function(e){
      if(openTop100FilterKey && !e.target.closest('.top100-filter-group')){
        openTop100FilterKey = null;
        renderTop100Filters();
      }
    });

    function renderTop100(items){
      var list = document.getElementById('top100-list');
      // .top100-list tek sütun (bkz. .top100-row{display:flex}) — proje.js/kisi.html/firma.html'deki
      // gibi bir sütun-sayısı hesabına gerek yok, ilk birkaç satır her ekran genişliğinde katlanma
      // çizgisinin üstünde. Sabit 4: aynı sayfadaki person-card grid'inin mobil (2 sütun) eager
      // davranışıyla aynı ölçekte, gereğinden fazla eager istek göndermeden ilk görünür satırları kapsar.
      var TOP100_EAGER_ROW_COUNT = 4;
      var rows = items.map(function(item, i){
        var rankClass = item.rank <= 3 ? ' top3' : '';
        var posterImgAttrs = i < TOP100_EAGER_ROW_COUNT ? 'loading="eager" fetchpriority="high" decoding="sync"' : 'loading="lazy" fetchpriority="low" decoding="async"';
        var posterInner = item.image
          ? '<img src="' + escapeAttr(cdnImg(item.image, 220)) + '" alt="" ' + posterImgAttrs + '>'
          : '<div class="top100-poster-placeholder" style="background:' + placeholderColor(item.name) + '">' + escapeHtml(initials(item.name)) + '</div>';
        var posterHtml = item.slug
          ? '<a class="top100-poster-link top100-poster" href="/proje/' + encodeURIComponent(item.slug) + '">' + posterInner + '</a>'
          : '<span class="top100-poster">' + posterInner + '</span>';
        var loc = item.location ? parseLocation(item.location) : null;
        var submetaParts = [];
        if(loc && loc.city) submetaParts.push(loc.city);
        if(item.projectDate) submetaParts.push(item.projectDate);
        var submeta = submetaParts.join(' · ');
        var desc = firstSentence(item.description);
        var nameHtml = item.slug
          ? '<a class="top100-name-link" href="/proje/' + encodeURIComponent(item.slug) + '">' + escapeHtml(item.name) + '</a>'
          : escapeHtml(item.name);
        // gerçek bulgu: ShareWidget.html() burada DOĞRUDAN çağrılıyordu — rating-widget.js/
        // save-widget.js/share-button.js `defer` ile yüklendiğinden (bkz. sayfa başı <script> etiketleri),
        // /api/public/top100 isteği edge önbellekten HIZLI dönüp bu fetch().then() defer betiklerinden
        // ÖNCE çalışırsa ShareWidget tanımsız kalıp "ShareWidget is not defined" fırlatıyordu — bu da
        // renderTop100'ü BÜTÜNÜYLE çökertip listenin hiç görünmemesine yol açtı (canlıda yakalandı).
        // Çözüm: burada yalnızca BOŞ bir slot basılır, gerçek paylaş düğmesi wireQuickActions()#
        // whenReady() içinde (DOMContentLoaded'dan SONRA, defer betikleri garanti çalışmış olduğunda)
        // doldurulur.
        var quickActions = item.slug
          ? '<span class="top100-quick-actions">' +
              '<button class="top100-action-btn top100-rate-btn" type="button" data-slug="' + escapeAttr(item.slug) + '" data-name="' + escapeAttr(item.name) + '" aria-label="Puanla">' + ICON_STAR + '<span>Puanla</span></button>' +
              '<button class="card-save-btn top100-action-btn" type="button" data-key="' + escapeAttr(item.slug) + '" data-title="' + escapeAttr(item.name) + '" data-meta="' + escapeAttr(submeta) + '" data-image="' + escapeAttr(item.image || '') + '" data-href="/proje/' + encodeURIComponent(item.slug) + '" aria-label="Kaydet">' + ICON_SAVE + '<span class="top100-save-label">Kaydet</span></button>' +
              '<span class="top100-share-slot" id="top100-share-slot-' + item.rank + '"></span>' +
            '</span>'
          : '';
        return '<li class="top100-row' + rankClass + '" data-slug="' + escapeAttr(item.slug || '') + '" data-rank="' + item.rank + '" data-avg="' + item.avg + '" data-count="' + item.count + '">' +
          '<span class="top100-rank-wrap">' +
            '<span class="top100-rank">' + item.rank + '</span>' +
            '<span class="top100-delta ' + item.delta + '" title="' + (item.delta === 'up' ? 'Sıralamada yükseldi' : item.delta === 'down' ? 'Sıralamada düştü' : 'Sıralaması sabit') + '">' + DELTA_ICONS[item.delta] + '</span>' +
          '</span>' +
          posterHtml +
          '<span class="top100-body">' +
            '<span class="top100-name">' + nameHtml + '</span>' +
            (submeta ? '<span class="top100-submeta">' + escapeHtml(submeta) + '</span>' : '') +
            (desc ? '<span class="top100-desc">' + escapeHtml(desc) + '</span>' : '') +
            quickActions +
          '</span>' +
          '<span class="top100-rating">' +
            '<span class="top100-avg"><span class="top100-avg-star">&#9733;</span> ' + item.avg.toFixed(2) + '</span>' +
            '<span class="top100-votes">' + item.count + ' oy</span>' +
          '</span>' +
        '</li>';
      }).join('');
      list.innerHTML = rows;
      whenReady(function(){ wireQuickActions(items); });
    }

    // defer'lı betikler (rating-widget.js/save-widget.js/share-button.js) DOMContentLoaded'dan ÖNCE
    // çalışmayı GARANTİ ETMEZ, ama DOMContentLoaded'dan SONRA çalışmış olmaları tarayıcı sözleşmesi
    // gereği KESİNDİR — bkz. gerçek bulgu (dosya başı yorumu, renderTop100#quickActions): bu yüzden
    // widget'lara bağımlı kurulum DOMContentLoaded'ı bekler; sayfa zaten yüklenmişse (ör. sıralama/
    // filtre değişikliğiyle YENİDEN render) hemen çalışır.
    // gerçek bulgu (canlıda yakalandı): document.readyState "interactive"ye, defer betikleri HALA
    // sırayla çalışırken geçiyor (spec: parser bitince readyState "interactive" olur, DEFER
    // BETİKLERİ ONDAN SONRA teker teker yürütülür, en son DOMContentLoaded ateşlenir) — yani
    // `readyState === 'loading'` kontrolü burada YANLIŞ sinyal veriyordu: fetch().then() çalıştığında
    // readyState çoktan "interactive" olabiliyor ama share-button.js (defer sırasında save-widget.js/
    // rating-widget.js'ten SONRA gelir, bkz. <head>'teki sıra) henüz çalışmamış olabiliyordu — sonuç:
    // ShareWidget hâlâ tanımsızken "else fn()" dalı hemen çalışıp paylaş butonları sessizce hiç
    // dolmuyordu. Kendi DOMContentLoaded bayrağımızı (bu betik parse edilirken, olay ateşlenmeden
    // ÖNCE kaydedilir) kullanmak, readyState'in belirsiz ara durumuna güvenmekten daha kesin.
    var domReady = false;
    document.addEventListener('DOMContentLoaded', function(){ domReady = true; });
    function whenReady(fn){
      if(domReady) fn();
      else document.addEventListener('DOMContentLoaded', fn, { once: true });
    }

    // Hızlı Puanla/Kaydet/Paylaş (bkz. kullanıcı isteği, IMDB referansı). Puanla artık inline
    // .rating-widget YERİNE bir buton + popup (bkz. aşağıdaki openRatePopup) — mountAllRatingWidgets()
    // burada ARTIK çağrılmıyor, çünkü satırlarda .rating-widget hiç yok (yalnızca .top100-rate-btn).
    function wireQuickActions(items){
      if(typeof wireSaveButtons === 'function') wireSaveButtons('project');
      paintRatedStars();
      if(typeof ShareWidget !== 'undefined'){
        items.forEach(function(item){
          if(!item.slug) return;
          var slot = document.getElementById('top100-share-slot-' + item.rank);
          if(!slot) return;
          slot.outerHTML = ShareWidget.html('top100-share-' + item.rank);
          ShareWidget.wire('top100-share-' + item.rank, function(){
            return { title: item.name, url: 'https://mimarlab.com/proje/' + item.slug };
          });
        });
      }
    }

    // Proje isimlerine tıklandığında tam sayfa geçişi yerine ProjectModal popup'ı açılsın (bkz.
    // kullanıcı isteği) — js/pages/proje.js'deki AYNI tıklama-yakalama deseni, tek fark basePath'in
    // '/proje/' değil bu sayfa olması: ProjectModal.close() X/Escape/backdrop'ta currentBasePath'e
    // (bkz. project-modal.js#close, listPath = currentBasePath.replace(/\/$/, '')) döndüğünden
    // popup kapatılınca kullanıcı proje listesine değil, doğrudan bu sıralama sayfasına geri döner.
    // Sıra/puan da (item 4, kullanıcı isteği: "puanları proje popuplarına da ekle") ProjectModal'a
    // taşınır — bkz. js/components/project-modal.js#topRank, yalnızca bu sayfadan açılan popup'larda
    // gösterilir (site genelindeki proje popup'larına EKLENMEZ, çünkü bu puan yalnızca En İyi 100
    // bağlamında anlamlı bir metrik).
    var TOP100_BASE_PATH = '/en-iyi-100/';
    document.getElementById('top100-list').addEventListener('click', function(e){
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      // Hızlı Puanla düğmesi (bkz. openRatePopup) — aynı delege dinleyicide, aşağıdaki
      // isim/görsel tıklama bloğundan ÖNCE ele alınır.
      var rateBtn = e.target.closest('.top100-rate-btn');
      if (rateBtn){
        e.preventDefault();
        openRatePopup(rateBtn.dataset.slug, rateBtn.dataset.name);
        return;
      }
      var row = e.target.closest('.top100-row');
      // Hem isme hem de görsele tıklayınca popup açılsın (bkz. kullanıcı isteği) — ikisi de AYNI
      // slug'a giden ayrı <a> etiketleri (bkz. renderTop100#posterHtml/nameHtml).
      var a = e.target.closest('a.top100-name-link, a.top100-poster-link');
      if (!a || !row) return;
      var slug = row.getAttribute('data-slug');
      if (!slug) return;
      e.preventDefault();
      ProjectModal.open(slug, {
        triggerEl: a,
        basePath: TOP100_BASE_PATH,
        topRank: { rank: parseInt(row.getAttribute('data-rank'), 10), avg: parseFloat(row.getAttribute('data-avg')), count: parseInt(row.getAttribute('data-count'), 10) }
      });
    });

    // Geri tuşu modalı kapatsın (bkz. project-modal.js#close, X/Escape ile AYNI davranış) —
    // /en-iyi-100/:slug sunucuda ayrı bir route DEĞİL (bilinçli: bu URL yalnızca modal açıkken
    // history'de görünen geçici bir istemci-taraflı durum, F5/derin bağlantı desteklemiyor).
    window.addEventListener('popstate', function(){
      if (ProjectModal.isOpen()) ProjectModal.handlePopState(null);
    });

    function injectListLd(items){
      var itemListElements = items.map(function(item){
        var el = { '@type': 'ListItem', position: item.rank, name: item.name };
        if (item.slug) el.url = 'https://mimarlab.com/proje/' + item.slug;
        return el;
      });
      var ld = {
        '@context': 'https://schema.org',
        '@type': 'ItemList',
        name: 'En İyi 100 Mimari Eser',
        url: 'https://mimarlab.com/en-iyi-100',
        itemListOrder: 'https://schema.org/ItemListOrderDescending',
        numberOfItems: items.length,
        itemListElement: itemListElements
      };
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify(ld);
      document.head.appendChild(script);
    }

    // Toolbar (bkz. kullanıcı isteği: "üstte tek satır filtreleme ve sıralama") — TAM listeyi
    // yeniden fetch ETMEDEN, önbellekteki TOP100_ITEMS'ten istemci tarafında yeniden sıralar/filtreler.
    // Görüntülenen rank NUMARASI her zaman gerçek (editöryal+puan tabanlı) sırayı gösterir, yalnızca
    // satırların DİZİLİŞ SIRASI değişir — ör. alfabetik görünümde bile "#47" etiketi kalır.
    document.getElementById('top100-sort').addEventListener('change', function(e){
      TOP100_SORT = e.target.value;
      renderTop100(sortedFilteredItems());
    });

    // Arama butonu (bkz. kullanıcı isteği) — Tip/Grup/Yer/Yıl butonlarındaki AYNI aç/kapa panel
    // deseni, TAM listeyi yeniden fetch ETMEDEN her tuş vuruşunda yerel olarak filtreler.
    (function wireTop100Search(){
      var toggle = document.getElementById('top100-search-toggle');
      var wrap = document.getElementById('top100-search-input-wrap');
      var input = document.getElementById('top100-search-input');
      var clearBtn = document.getElementById('top100-search-clear');
      toggle.addEventListener('click', function(e){
        e.stopPropagation();
        var open = wrap.classList.toggle('open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.classList.toggle('active', open);
        if(open) input.focus();
      });
      input.addEventListener('click', function(e){ e.stopPropagation(); });
      input.addEventListener('input', function(){
        TOP100_SEARCH_QUERY = foldTr(input.value.trim());
        clearBtn.style.display = input.value ? '' : 'none';
        renderTop100(sortedFilteredItems());
      });
      clearBtn.addEventListener('click', function(e){
        e.stopPropagation();
        input.value = '';
        TOP100_SEARCH_QUERY = '';
        clearBtn.style.display = 'none';
        renderTop100(sortedFilteredItems());
        input.focus();
      });
      document.addEventListener('click', function(e){
        if(wrap.classList.contains('open') && !input.value && !e.target.closest('.top100-search-wrap')){
          wrap.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          toggle.classList.remove('active');
        }
      });
    })();

    // Hızlı oy verince hem puan/oy sayısı HEM DE listedeki SIRA ANINDA güncellensin (bkz. kullanıcı
    // isteği: "verilen puanlara göre anlık ve eş zamanlı bir şekilde puanların hesaplanıp değişmesi
    // ve En İyi 100 sayfasında proje yerlerinin değişmesi gerekiyor") — rating-widget.js#submit
    // başarılı bir POST sonrası bu 'ratingchange' olayını dispatch ediyor, buraya kadar bubble edip
    // TEK bir delege dinleyiciyle yakalanır.
    // gerçek bulgu (kökten çözüm): burada ÖNCEDEN yalnızca tıklanan satırın avg/count SAYILARI
    // yerinde güncelleniyor, item.rank ise sayfa ilk yüklendiğinde sunucudan gelen SABİT değerde
    // kalıyordu — oysa gerçek sıra tüm projelerin blendedAvg'sine göre hesaplanan GLOBAL bir
    // karşılaştırma (bkz. src/routes/top100.js#computeTop100#resolved.sort), tek bir satırın
    // istemci tarafında elle yeniden hesaplanması diğer 99 satırın güncel puanını bilmediğinden
    // güvenilir değil. Bu yüzden asıl kaynağı (yani /api/public/top100'ü, önbelleksiz — bkz. o
    // route) YENİDEN çekip TÜM listeyi tazelemek, sıralamanın her zaman doğru/eş zamanlı olmasının
    // TEK sağlam yolu — aktif filtre/sıralama seçimleri (activeTop100Filters/TOP100_SORT) korunur,
    // yalnızca veri ve render tazelenir.
    document.getElementById('top100-list').addEventListener('ratingchange', function(){
      fetch('/api/public/top100')
        .then(function(res){ return res.ok ? res.json() : null; })
        .then(function(data){
          if(!data) return;
          TOP100_ITEMS = data.items || [];
          renderTop100Filters();
          renderTop100ActiveChips();
          renderTop100(sortedFilteredItems());
        });
    });

    document.getElementById('top100-back-to-top').addEventListener('click', function(){
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ---------------------------------------------------------------------------------------------
    // Hızlı Puanla popup'ı (bkz. kullanıcı isteği, IMDB referansı: "Puanla" düğmesi yıldız TAŞIMAZ,
    // tıklanınca 5 yıldızlık bir seçici popup açılır; seçim yapılınca Gönder aktifleşir). Sunucu
    // tarafı yıldız icon'u ve /api/ratings/mine önbelleğini rating-widget.js'in ZATEN dışa açtığı
    // starSvg()/loadMyRatings() global fonksiyonlarından (bkz. o dosyanın en üstü) ödünç alır —
    // yalnızca satırdaki widget'ın işaretlemesi/mount akışı burada YENİDEN yazılıyor, alttaki /api/
    // ratings sözleşmesi (targetType/targetId/stars, 401=giriş gerekli) DEĞİŞMEDİ.
    //
    // Oturum açık DEĞİLKEN Gönder'e basılırsa (kullanıcı isteği: "puan seçip gönder butonuna
    // tıklayabilsin ama puan gönderilmeden giriş yap ekranına yönlendirilsin") seçilen puan
    // sessionStorage'a kuyruklanır ve site genelindeki tek popup olan AuthModal'ın giriş görünümü
    // açılır (bkz. js/components/lazy-modals.js#MODULES.auth — AYNI lazy-load deseni burada
    // tekrarlanır, çünkü lazy-modals.js'in kendi loadModule()'ü IIFE kapanışında dışa açık değil).
    // auth-nav.js#window.refreshAuthNav artık login/signup başarılı olduğunda 'mimarlab:authchange'
    // yayınlıyor (bkz. o dosyadaki AYNI hook) — bu sayfa dinleyip kuyruktaki puanı OTOMATİK gönderir,
    // kullanıcı modal içinde kalırken (sayfa yeniden yüklenmeden) sonucu görür.
    var PENDING_RATING_KEY = 'mimarlab-pending-top100-rating';
    var ratePopupOverlay = document.getElementById('rate-popup-overlay');
    var ratePopupTitle = document.getElementById('rate-popup-title');
    var ratePopupStars = document.getElementById('rate-popup-stars');
    var ratePopupSubmit = document.getElementById('rate-popup-submit');
    var ratePopupNotice = document.getElementById('rate-popup-notice');
    var ratePopupSlug = null;
    var ratePopupSelected = 0;
    var ratePopupHover = 0;

    // gerçek bulgu (kullanıcı bulgusu, canlıda doğrulandı — İKİ AYRI turda): 5 yıldız düğmesi
    // önce her hover/click'te ratePopupStars.innerHTML = ... ile BAŞTAN yeniden yaratılıyordu; bu
    // düğmelerin KENDİSİNİ tekilleştirerek (bkz. eski buildRatePopupStars) düzeltildi SANILDI, ama
    // paintRatePopupStars İÇİNDEKİ btn.innerHTML = starSvg(...) satırı düğmenin İÇİNDEKİ <svg>/<path>
    // çocuğunu HÂLÂ her hover'da yok edip yeniden yaratıyordu — ve gerçek bir fare tıklamasının
    // mousedown HEDEFİ genelde düğmenin kendisi değil, görsel olarak üstte duran o <svg>/<path>
    // çocuğudur. Komşu bir yıldıza değen en ufak bir fare titreşimi bile mousedown ile mouseup
    // arasında bu çocuğu değiştirip tarayıcının click'i hiç sentezlememesine yol açabiliyordu (hover
    // önizlemesi turuncu görünüyor ama seçim/Gönder'e HİÇ etki etmiyordu — kullanıcının ikinci
    // ekran görüntüsündeki AYNI bozuk davranış). Kökten çözüm: her düğmenin İÇİNDEKİ <svg> de popup
    // ömrü boyunca TEK SEFER yaratılır (her zaman DOLU/solid yıldız çizilir, bkz. starSvg(true, ..)),
    // hover/seçim güncellemesi (paintRatePopupStars) SADECE düğmenin .filled class'ını toggle eder —
    // renk (gri↔turuncu) tamamen CSS'in .rate-popup-star.filled{color:var(--accent)} kuralından gelir
    // (svg fill="currentColor" miras alır). Etkileşim sırasında ARTIK hiçbir DOM düğümü (ne düğme ne
    // svg) yok edilip yeniden yaratılmıyor — yalnızca classList.toggle, bu yüzden mousedown hedefi
    // mouseup'a kadar HER ZAMAN aynı nesne kalır.
    function buildRatePopupStars(){
      var html = '';
      for(var i = 1; i <= 5; i++){
        html += '<button type="button" class="rate-popup-star" data-value="' + i + '" aria-label="' + i + ' yıldız">' + starSvg(true, 30) + '</button>';
      }
      ratePopupStars.innerHTML = html;
    }
    // whenReady — bkz. dosya başındaki AYNI domReady deseni: starSvg (rating-widget.js'ten, defer
    // ile yüklü) bu satır ilk parse edildiğinde HENÜZ TANIMLI OLMAYABİLİR (gerçek bulgu, yerel
    // testte yakalandı: "Uncaught ReferenceError: starSvg is not defined" — eager çağrı defer
    // script'ten ÖNCE çalışabiliyordu). DOMContentLoaded'a kadar ertelenir, tıpkı wireQuickActions
    // gibi.
    whenReady(buildRatePopupStars);
    function paintRatePopupStars(){
      var eff = ratePopupHover || ratePopupSelected;
      ratePopupStars.querySelectorAll('.rate-popup-star').forEach(function(btn){
        var v = parseInt(btn.dataset.value, 10);
        btn.classList.toggle('filled', v <= eff);
      });
    }
    ratePopupStars.addEventListener('mouseover', function(e){
      var btn = e.target.closest('.rate-popup-star');
      if(!btn) return;
      ratePopupHover = parseInt(btn.dataset.value, 10);
      paintRatePopupStars();
    });
    ratePopupStars.addEventListener('mouseleave', function(){
      ratePopupHover = 0;
      paintRatePopupStars();
    });
    ratePopupStars.addEventListener('click', function(e){
      var btn = e.target.closest('.rate-popup-star');
      if(!btn) return;
      ratePopupSelected = parseInt(btn.dataset.value, 10);
      ratePopupSubmit.disabled = false;
      paintRatePopupStars();
    });

    function closeRatePopup(){
      ratePopupOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('rate-popup-close').addEventListener('click', closeRatePopup);
    ratePopupOverlay.addEventListener('click', function(e){ if(e.target === ratePopupOverlay) closeRatePopup(); });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && ratePopupOverlay.classList.contains('open')) closeRatePopup();
    });

    async function openRatePopup(slug, name){
      ratePopupSlug = slug;
      ratePopupSelected = 0;
      ratePopupHover = 0;
      ratePopupTitle.textContent = name;
      ratePopupNotice.textContent = '';
      ratePopupNotice.classList.remove('show');
      ratePopupSubmit.disabled = true;
      ratePopupSubmit.textContent = 'Gönder';
      paintRatePopupStars();
      ratePopupOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      // Daha önce puanladıysa popup açılışında kendi puanını görsün (IMDB'deki AYNI davranış) —
      // sessiz geçer, oturum kapalıyken loadMyRatings() zaten boş Map döner (bkz. rating-widget.js).
      try{
        var mine = await loadMyRatings();
        if(ratePopupSlug !== slug) return; // bu arada başka bir satır açılmışsa bayat sonucu ATLA
        var val = mine.get('project:' + slug);
        if(val){ ratePopupSelected = val; ratePopupSubmit.disabled = false; paintRatePopupStars(); }
      }catch(e){}
    }

    async function submitTop100Rating(slug, stars){
      return fetch('/api/ratings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetType: 'project', targetId: slug, stars: stars }),
      });
    }

    function refreshTop100AfterRating(){
      // myRatingsPromise — rating-widget.js'in ÜST SEVİYE 'let' değişkeni, bkz. o dosyanın en üstü:
      // klasik (module OLMAYAN) <script>'lerin top-level let/const/function bildirimleri AYNI Realm'in
      // global sözcük ortamını paylaşır, bu yüzden bu sayfanın kendi script'inden de isimle erişilip
      // sıfırlanabilir. Puan az önce değiştiğinden loadMyRatings()'in ÖNBELLEKLENMİŞ (bayat) Promise'i
      // burada geçersiz kılınmazsa, paintRatedStars() bir sonraki render'da hâlâ ESKİ "mine" haritasını
      // görür ve yeni puanlanan satırın Puanla yıldızı turuncuya DÖNMEZ.
      myRatingsPromise = null;
      document.getElementById('top100-list').dispatchEvent(new CustomEvent('ratingchange', { bubbles: true }));
    }

    // kullanıcı isteği: hesap açıkken daha önce puanlanmış bir projede Puanla düğmesindeki yıldız
    // TAMAMEN turuncu (dolu) görünsün — IMDB'nin zaten puanladığın öğeleri dolu yıldızla işaretlemesiyle
    // AYNI davranış. loadMyRatings() (rating-widget.js) oturum kapalıyken sessizce boş bir Map döner,
    // bu yüzden burada AYRICA bir currentUser kontrolüne gerek yok.
    function paintRatedStars(){
      if(typeof loadMyRatings !== 'function') return;
      loadMyRatings().then(function(mine){
        document.querySelectorAll('.top100-rate-btn').forEach(function(btn){
          var slug = btn.dataset.slug;
          if(!slug) return;
          var rated = mine.get('project:' + slug);
          var icon = btn.querySelector('svg');
          if(!icon) return;
          if(rated && !icon.classList.contains('top100-rate-icon-filled')){
            icon.outerHTML = ICON_STAR_FILLED;
          } else if(!rated && icon.classList.contains('top100-rate-icon-filled')){
            icon.outerHTML = ICON_STAR;
          }
        });
      }).catch(function(){});
    }

    // bkz. dosya başı yorumu — AuthModal büyük (118KB) olduğundan her sayfada değil, gerekince
    // indirilir (lazy-modals.js İLE AYNI desen, bkz. o dosyadaki loadModule()).
    function ensureAuthModal(cb){
      if(window.AuthModal){ cb(window.AuthModal); return; }
      var s = document.createElement('script');
      s.src = 'js/components/auth-modal.js';
      s.onload = function(){ cb(window.AuthModal); };
      document.head.appendChild(s);
    }

    ratePopupSubmit.addEventListener('click', async function(){
      if(!ratePopupSelected || !ratePopupSlug) return;
      var slug = ratePopupSlug, stars = ratePopupSelected;
      ratePopupSubmit.disabled = true;
      ratePopupSubmit.textContent = 'Gönderiliyor…';
      var res;
      try{
        res = await submitTop100Rating(slug, stars);
      }catch(e){
        ratePopupNotice.textContent = 'Sunucuya ulaşılamadı, lütfen tekrar dene.';
        ratePopupNotice.classList.add('show');
        ratePopupSubmit.disabled = false;
        ratePopupSubmit.textContent = 'Gönder';
        return;
      }
      if(res.status === 401){
        // Kişi hesabına GİRMEDEN Gönder'e bastı — puanı kuyruğa al, giriş popup'ını aç (kullanıcı
        // isteği). Giriş/Üye Ol başarılı olduğunda aşağıdaki 'mimarlab:authchange' dinleyicisi bu
        // puanı otomatik gönderip listeyi tazeler.
        try{ sessionStorage.setItem(PENDING_RATING_KEY, JSON.stringify({ slug: slug, stars: stars })); }catch(e){}
        closeRatePopup();
        ensureAuthModal(function(Modal){ if(Modal) Modal.open('login'); });
        return;
      }
      if(res.ok){
        try{ sessionStorage.removeItem(PENDING_RATING_KEY); }catch(e){}
        closeRatePopup();
        refreshTop100AfterRating();
      } else {
        ratePopupNotice.textContent = 'Puan gönderilemedi, lütfen tekrar dene.';
        ratePopupNotice.classList.add('show');
        ratePopupSubmit.disabled = false;
        ratePopupSubmit.textContent = 'Gönder';
      }
    });

    // Giriş/Üye Ol az önce başarıyla tamamlandıysa (bkz. auth-nav.js#window.refreshAuthNav) ve
    // bekleyen bir puan varsa, kullanıcı hiçbir ek adım atmadan otomatik gönderilir + liste tazelenir
    // (kullanıcı isteği: "puanı otomatik olarak verilsin ve sayfaya yansısın").
    function trySubmitPendingRating(){
      var raw;
      try{ raw = sessionStorage.getItem(PENDING_RATING_KEY); }catch(e){ raw = null; }
      if(!raw) return;
      var pending;
      try{ pending = JSON.parse(raw); }catch(e){ pending = null; }
      if(!pending || !pending.slug || !pending.stars) return;
      try{ sessionStorage.removeItem(PENDING_RATING_KEY); }catch(e){}
      submitTop100Rating(pending.slug, pending.stars).then(function(res){
        if(res.ok) refreshTop100AfterRating();
      }).catch(function(){});
    }
    window.addEventListener('mimarlab:authchange', trySubmitPendingRating);
    // Sayfa AÇILIŞINDA da kontrol edilir — Google/LinkedIn ile giriş sayfayı YENİDEN yüklediğinden
    // (next=%2Fhesabim üzerinden), o akışta 'mimarlab:authchange' bu sayfada YAKALANAMAZ; kullanıcı
    // giriş yaptıktan sonra bu sayfaya geri dönerse sessionStorage'daki kuyruk burada devreye girer.
    whenReady(function(){
      if(typeof savedWidgetReady !== 'undefined'){
        savedWidgetReady.then(function(){ if(currentUser) trySubmitPendingRating(); });
      }
    });

    fetch('/api/public/top100')
      .then(function(res){ return res.ok ? res.json() : { items: [] }; })
      .then(function(data){
        TOP100_ITEMS = data.items || [];
        renderTop100Filters();
        renderTop100(sortedFilteredItems());
        injectListLd(TOP100_ITEMS);
      })
      .catch(function(){
        document.getElementById('top100-list').innerHTML = '<li class="empty-state" style="display:block;">Liste şu anda yüklenemedi, lütfen daha sonra tekrar dene.</li>';
      });
  </script>
