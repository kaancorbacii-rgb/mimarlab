<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --accent:#E08A3E;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --accent:#E8A968;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer{ --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B; }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV (bkz. duello.html'deki AYNI kopya — her sayfa kendi FOUC-safe kopyasını taşır) ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{
    display:none; position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink); padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{
    background:var(--ink); color:rgba(237,240,243,0.7);
    padding:14px 32px; font-size:13.5px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }
  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }

  /* ---------- QUIZ ---------- */
  .quiz-hero{max-width:640px; margin:0 auto; padding:28px 32px 8px; text-align:center;}
  .quiz-hero h1{font-family:'Inter', sans-serif; font-size:28px; font-weight:700; margin:0 0 8px;}
  .quiz-hero p{color:var(--ink-soft); font-size:14.5px; margin:0 0 16px; line-height:1.6;}
  .quiz-progress-pill{display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:var(--paper-card); padding:7px 16px; border-radius:100px; font-size:12.5px; font-weight:700;}

  .quiz-wrap{max-width:640px; margin:24px auto 80px; padding:0 32px;}
  .quiz-card{background:var(--paper-card); border:1px solid var(--line-soft); border-radius:18px; overflow:hidden;}
  .quiz-card-photo{position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--paper-alt);}
  .quiz-card-photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .quiz-card-body{padding:22px 24px 26px;}
  .quiz-question{font-family:'Inter', sans-serif; font-size:19px; font-weight:700; margin:0 0 18px; text-align:center;}
  .quiz-options{display:flex; flex-direction:column; gap:10px;}
  .quiz-option{
    display:flex; align-items:center; gap:10px; min-height:52px; padding:13px 18px;
    background:var(--paper); border:1.5px solid var(--line); border-radius:14px;
    font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink); text-align:left; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .quiz-option:hover:not(:disabled){border-color:var(--walnut);}
  .quiz-option:disabled{cursor:default;}
  .quiz-option.correct{border-color:#3E7A55; background:rgba(62,122,85,0.12); color:#2E5F41;}
  .quiz-option.wrong{border-color:#B84C4C; background:rgba(184,76,76,0.1); color:#8F3A3A;}
  .quiz-option-letter{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--paper-alt);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--ink-soft);
  }
  .quiz-option.correct .quiz-option-letter{background:#3E7A55; color:#fff;}
  .quiz-option.wrong .quiz-option-letter{background:#B84C4C; color:#fff;}

  .quiz-feedback{margin-top:18px; padding:16px 18px; border-radius:14px; background:var(--paper); border:1px solid var(--line-soft);}
  .quiz-feedback-title{font-family:'Inter', sans-serif; font-size:14.5px; font-weight:700; margin:0 0 6px;}
  .quiz-feedback-title.correct{color:#3E7A55;}
  .quiz-feedback-title.wrong{color:#B84C4C;}
  .quiz-feedback p{margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); line-height:1.6;}
  .quiz-feedback-links{display:flex; gap:8px; flex-wrap:wrap;}
  .quiz-feedback-links a{
    display:inline-flex; align-items:center; padding:8px 16px; border-radius:100px;
    border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-soft);
  }
  .quiz-feedback-links a:hover{border-color:var(--walnut); color:var(--ink);}
  .quiz-next-btn{
    width:100%; margin-top:16px; background:var(--ink); color:var(--paper-card); border:none;
    border-radius:100px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .quiz-next-btn:hover{background:var(--walnut);}

  .quiz-result{text-align:center; padding:44px 28px; background:var(--paper-card); border:1px solid var(--line); border-radius:18px;}
  .quiz-result h2{font-family:'Inter', sans-serif; font-size:22px; font-weight:700; margin:0 0 6px;}
  .quiz-result-stats{display:flex; justify-content:center; gap:28px; margin:22px 0;}
  .quiz-result-stat{display:flex; flex-direction:column; gap:2px;}
  .quiz-result-stat-num{font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:700;}
  .quiz-result-stat-label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em;}
  .quiz-result-pct{font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--brass); font-weight:600; margin-bottom:6px;}
  .quiz-result-note{color:var(--ink-soft); font-size:13.5px; margin:18px 0 0;}
  .quiz-result-upsell{margin-top:10px; font-size:13px; color:var(--ink-soft);}

  .quiz-empty{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px;}

  @media (max-width:760px){
    .quiz-hero{padding:22px 18px 4px;}
    .quiz-hero h1{font-size:24px;}
    .quiz-wrap{padding:0 16px; margin-top:18px;}
    .quiz-option{min-height:48px; padding:11px 14px; font-size:13.5px;}
  }
</style>
</head>
<body>
<script src="js/overlay-manager.js" defer></script>
<script src="image-cdn.js"></script>
<script src="auth-nav.js" defer></script>
<script src="catalog-taxonomy.js" defer></script>
<script src="js/components/nav-product-menu.js" defer></script>
<script src="js/components/modal-shell.js" defer></script>
<script src="js/components/lazy-modals.js" defer></script>

  <div id="site-header-mount" data-nav-active="oyun"></div>
  <script src="js/components/site-chrome.js"></script>

  <div class="breadcrumb-bar">
    <a href="index.html">Ana Sayfa</a>
    <span class="sep">&rsaquo;</span>
    <span class="current">Quiz</span>
  </div>

  <div class="quiz-hero">
    <h1>AI Architecture Quiz</h1>
    <p>Günün mimarlık sorularını çöz.</p>
    <div class="quiz-progress-pill" id="quiz-progress-pill">Yükleniyor…</div>
  </div>

  <div class="quiz-wrap" id="quiz-wrap"><div class="quiz-empty">Yükleniyor…</div></div>

  <footer id="site-footer-mount"></footer>

  <script>
    function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
    function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

    var quizWrapEl = document.getElementById('quiz-wrap');
    var progressPillEl = document.getElementById('quiz-progress-pill');
    var currentQuestion = null;
    var answering = false;
    var progress = { limit: 5, used: 0, correctToday: 0, wrongToday: 0 };

    function updateProgressPill(){
      progressPillEl.textContent = 'Bugün ' + progress.used + ' / ' + progress.limit + ' soru';
    }

    // Bir sonraki kademe ipucu — mevcut limitten türetilir (kullanıcı isteği madde 4: agresif satış
    // banner'ı DEĞİL, tek satır ölçülü ipucu). QUIZ_DAILY_LIMITS (bkz. src/routes/quiz.js) İLE AYNI
    // eşleme, sunucudan ayrıca çekmeye gerek yok — her limit değeri tek bir kademeye karşılık gelir.
    var NEXT_TIER_HINT = {
      5: 'Destekçi rozeti ile günlük 7 soru çözebilirsin.',
      7: 'Doğrulanmış Üye rozeti ile günlük 10 soru çözebilirsin.',
      10: 'Altın Üye rozeti ile günlük 15 soru çözebilirsin.',
      15: 'Elmas Üye rozeti ile günlük 25 soru çözebilirsin.',
    };

    function renderResult(){
      var used = progress.used, correct = progress.correctToday, wrong = progress.wrongToday;
      var pct = used > 0 ? Math.round((correct / used) * 100) : 0;
      var hint = NEXT_TIER_HINT[progress.limit];
      quizWrapEl.innerHTML =
        '<div class="quiz-result">' +
          '<h2>Bugünkü Quiz Tamamlandı</h2>' +
          '<p style="color:var(--ink-soft); font-size:13.5px; margin:0;">' + used + ' soru</p>' +
          '<div class="quiz-result-stats">' +
            '<div class="quiz-result-stat"><span class="quiz-result-stat-num">' + correct + '</span><span class="quiz-result-stat-label">Doğru</span></div>' +
            '<div class="quiz-result-stat"><span class="quiz-result-stat-num">' + wrong + '</span><span class="quiz-result-stat-label">Yanlış</span></div>' +
          '</div>' +
          '<div class="quiz-result-pct">Başarı: %' + pct + '</div>' +
          '<p class="quiz-result-note">Yarın tekrar gel.</p>' +
          (hint ? '<p class="quiz-result-upsell">' + escapeHtml(hint) + '</p>' : '') +
        '</div>';
    }

    function optionLetter(i){ return String.fromCharCode(65 + i); }

    function renderQuestion(q){
      currentQuestion = q;
      var optionsHtml = q.options.map(function(opt, i){
        return '<button type="button" class="quiz-option" data-value="' + escapeAttr(opt.value) + '">' +
          '<span class="quiz-option-letter">' + optionLetter(i) + '</span>' +
          '<span>' + escapeHtml(opt.label) + '</span>' +
        '</button>';
      }).join('');
      quizWrapEl.innerHTML =
        '<div class="quiz-card">' +
          '<div class="quiz-card-photo"><img src="' + escapeAttr(cdnImg(q.image, 720)) + '" alt="" loading="eager" decoding="async"></div>' +
          '<div class="quiz-card-body">' +
            '<div class="quiz-question">' + escapeHtml(q.prompt) + '</div>' +
            '<div class="quiz-options" id="quiz-options">' + optionsHtml + '</div>' +
            '<div id="quiz-feedback"></div>' +
          '</div>' +
        '</div>';
      document.getElementById('quiz-options').addEventListener('click', function(e){
        var btn = e.target.closest('.quiz-option');
        if (btn) answer(btn.getAttribute('data-value'));
      });
    }

    function answer(choice){
      if (answering || !currentQuestion) return;
      answering = true;
      var optionsEl = document.getElementById('quiz-options');
      var btns = optionsEl.querySelectorAll('.quiz-option');
      btns.forEach(function(b){ b.disabled = true; });
      fetch('/api/quiz/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ projectId: currentQuestion.projectId, questionType: currentQuestion.questionType, choice: choice }),
      })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, d: d }; }); })
        .then(function(res){
          if (!res.ok) { quizWrapEl.innerHTML = '<div class="quiz-empty">' + escapeHtml((res.d && res.d.error) || 'Bir şeyler ters gitti.') + '</div>'; return; }
          var d = res.d;
          progress.used += 1;
          if (d.correct) progress.correctToday += 1; else progress.wrongToday += 1;
          updateProgressPill();
          btns.forEach(function(b){
            var v = b.getAttribute('data-value');
            if (v === d.correctAnswer) b.classList.add('correct');
            else if (v === choice) b.classList.add('wrong');
          });
          var links = '';
          if (d.projectLink) links += '<a href="' + escapeAttr(d.projectLink) + '" target="_blank" rel="noopener">Projeyi İncele</a>';
          if (d.architectLink) links += '<a href="' + escapeAttr(d.architectLink) + '" target="_blank" rel="noopener">Mimarı İncele</a>';
          document.getElementById('quiz-feedback').innerHTML =
            '<div class="quiz-feedback">' +
              '<div class="quiz-feedback-title ' + (d.correct ? 'correct' : 'wrong') + '">' + (d.correct ? 'Doğru!' : 'Yanlış') + '</div>' +
              '<p>' + escapeHtml(d.explanation || '') + '</p>' +
              (links ? '<div class="quiz-feedback-links">' + links + '</div>' : '') +
            '</div>' +
            '<button type="button" class="quiz-next-btn" id="quiz-next-btn">' + (progress.used >= progress.limit ? 'Sonucu Gör' : 'Sonraki Soru') + '</button>';
          document.getElementById('quiz-next-btn').addEventListener('click', function(){
            if (progress.used >= progress.limit) renderResult(); else loadQuestion();
          });
        })
        .catch(function(){ quizWrapEl.innerHTML = '<div class="quiz-empty">Sunucuya ulaşılamadı, tekrar dene.</div>'; })
        .finally(function(){ answering = false; });
    }

    function loadQuestion(){
      quizWrapEl.innerHTML = '<div class="quiz-empty">Soru yükleniyor…</div>';
      fetch('/api/quiz/question')
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return { ok: r.ok, d: d }; }); })
        .then(function(res){
          if (!res.ok) {
            if (progress.used >= progress.limit) { renderResult(); return; }
            quizWrapEl.innerHTML = '<div class="quiz-empty">' + escapeHtml((res.d && res.d.error) || 'Soru yüklenemedi.') + '</div>';
            return;
          }
          renderQuestion(res.d);
        })
        .catch(function(){ quizWrapEl.innerHTML = '<div class="quiz-empty">Sunucuya ulaşılamadı, tekrar dene.</div>'; });
    }

    function init(){
      fetch('/api/quiz/status')
        .then(function(r){ return r.json(); })
        .then(function(d){
          progress = d;
          updateProgressPill();
          if (progress.used >= progress.limit) renderResult(); else loadQuestion();
        })
        .catch(function(){ quizWrapEl.innerHTML = '<div class="quiz-empty">Quiz yüklenemedi, tekrar dene.</div>'; });
    }

    function whenReady(fn){
      if (document.readyState !== 'loading') fn();
      else document.addEventListener('DOMContentLoaded', fn, { once: true });
    }
    whenReady(init);

    var quizLd = {
      '@context': 'https://schema.org',
      '@type': 'Game',
      name: 'MİMARLAB AI Architecture Quiz',
      description: 'MİMARLAB\'daki gerçek projeler üzerinden günlük mimarlık sorularını çöz.',
      url: 'https://mimarlab.com/quiz',
    };
    var ldScript = document.createElement('script');
    ldScript.type = 'application/ld+json';
    ldScript.textContent = JSON.stringify(quizLd);
    document.head.appendChild(ldScript);
  </script>
