<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('mimarlab-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');document.documentElement.style.colorScheme='dark';}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/logos/site/favicon-32.png">
<link rel="apple-touch-icon" href="/logos/site/favicon-180.png">
<meta name="robots" content="noindex, follow">
<title>Sayfa Bulunamadı (404) — MİMARLAB</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. MİMARLAB'da projeleri, kişileri, firmaları, markaları ve ürünleri keşfetmeye buradan devam edebilirsiniz.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MİMARLAB">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="Sayfa Bulunamadı (404) — MİMARLAB">
<meta property="og:description" content="Aradığınız sayfa bulunamadı. MİMARLAB'da projeleri, kişileri, firmaları, markaları ve ürünleri keşfetmeye buradan devam edebilirsiniz.">
<meta property="og:image" content="https://mimarlab.com/logos/site/mimarlab-og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sayfa Bulunamadı (404) — MİMARLAB">
<meta name="twitter:description" content="Aradığınız sayfa bulunamadı. MİMARLAB'da projeleri, kişileri, firmaları, markaları ve ürünleri keşfetmeye buradan devam edebilirsiniz.">
<meta name="twitter:image" content="https://mimarlab.com/logos/site/mimarlab-og-image.png">
<link rel="stylesheet" href="/fonts/inter.css">
<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D; --ink-soft:#4E6478; --paper:#EDF0F3; --paper-card:#F8FAFB; --paper-alt:#E0E6EC;
    --walnut:#2B425F; --brass:#5B7A9B; --brass-soft:#AFC5D8; --sage:#4F6478; --rust:#7C4B4B; --accent:#E08A3E;
    --line: rgba(27,42,61,0.14); --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:none; box-shadow: 0 0 0 2px var(--brass) inset;}
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:24px; padding:10px 32px; background:rgba(237,240,243,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav-search{flex:1; max-width:380px; display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:9px 16px;}
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{border:none; background:none; outline:none; font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase;}
  .nav-link:hover, .nav-link.active{color:var(--ink);}
  .nav-hamburger{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px; color:var(--ink); align-items:center; justify-content:center;}
  .nav-mobile-menu{display:none; position:absolute; top:100%; right:18px; z-index:95; background:var(--paper-card); border:1px solid var(--line); border-radius:12px; padding:8px; box-shadow:0 12px 28px rgba(27,42,61,0.15); flex-direction:column; min-width:220px;}
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{padding:11px 14px; border-radius:8px; font-size:14.5px; font-weight:500; color:var(--ink); text-transform:uppercase;}
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:9px 14px; margin-bottom:8px;}
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{border:none; background:none; outline:none; font-family:inherit; font-size:16px; width:100%; color:var(--ink);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{background:none; color:var(--ink); padding:8px 17px; border-radius:100px; border:1.5px solid var(--ink); font-size:14px; font-weight:600; white-space:nowrap; text-transform:uppercase;}
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}

  /* ---------- BREADCRUMB ---------- */
  .breadcrumb-bar{background:var(--ink); color:rgba(237,240,243,0.7); padding:14px 32px; font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .breadcrumb-bar a{color:rgba(237,240,243,0.85); font-weight:500;}
  .breadcrumb-bar a:hover{color:var(--brass-soft);}
  .breadcrumb-bar .sep{opacity:0.4;}
  .breadcrumb-bar .current{color:var(--paper); font-weight:600;}

  /* ---------- CONTENT ---------- */
  .content-wrap{max-width:760px; margin:0 auto; padding:56px 32px 90px;}
  .content-eyebrow{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--sage); font-weight:600; margin-bottom:12px;}
  .content-title{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:clamp(28px, 4vw, 38px); font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
  .content-updated{font-size:12.5px; color:var(--ink-soft); margin:0 0 24px;}
  .content-lead{font-size:16px; line-height:1.7; color:var(--ink-soft); margin:0 0 36px;}
  .content-section{margin-bottom:32px;}
  .content-section h2{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:20px; font-weight:700; margin:0 0 12px;}
  .content-section h3{font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:15.5px; font-weight:700; margin:20px 0 8px;}
  .content-section p{font-size:14.5px; line-height:1.75; color:var(--ink-soft); margin:0 0 12px;}
  .content-section a{color:var(--walnut); font-weight:600;}
  .content-section a:hover{text-decoration:underline;}
  .content-section ul{margin:0 0 12px; padding-left:20px; font-size:14.5px; line-height:1.8; color:var(--ink-soft);}
  .content-section li{margin-bottom:4px;}
  .content-toc{background:var(--paper-card); border:1px solid var(--line); border-radius:14px; padding:20px 24px; margin:0 0 36px;}
  .content-toc h2{font-size:14px; margin:0 0 10px;}
  .content-toc ol{margin:0; padding-left:20px; font-size:13.5px; line-height:1.9; color:var(--ink-soft); columns:2; column-gap:24px;}
  .content-toc a{color:var(--ink-soft); font-weight:500;}
  .content-toc a:hover{color:var(--walnut); text-decoration:underline;}
  .cookie-table-wrap{overflow-x:auto; margin:0 0 16px; border:1px solid var(--line); border-radius:12px;}
  .cookie-table{width:100%; border-collapse:collapse; font-size:13px;}
  .cookie-table th, .cookie-table td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  .cookie-table th{background:var(--paper-card); color:var(--ink); font-weight:700; white-space:nowrap;}
  .cookie-table td{color:var(--ink-soft);}
  .cookie-table tr:last-child td{border-bottom:none;}
  .cookie-badge{display:inline-block; font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; background:var(--paper-alt); color:var(--ink); border-radius:100px; padding:3px 9px; white-space:nowrap;}

  /* ---------- FOOTER ---------- */
  .site-footer{background:var(--ink); color:var(--paper);}
  .footer-top{max-width:1080px; margin:0 auto; padding:48px 32px 32px; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:32px;}
  .footer-logo{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .footer-logo-img{height:22px; width:auto; display:block;}
  .footer-brand p{font-size:13px; color:rgba(237,240,243,0.6); line-height:1.6; margin:0 0 16px; max-width:280px;}
  .footer-social{display:flex; gap:14px;}
  .footer-social a{color:var(--paper); opacity:0.75;}
  .footer-social a:hover{opacity:1;}
  .footer-col h4{font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(237,240,243,0.5); margin:0 0 14px; font-weight:600;}
  .footer-col a{display:block; font-size:13.5px; color:rgba(237,240,243,0.85); margin-bottom:11px;}
  .footer-col a:hover{color:var(--brass-soft);}
  .footer-bottom{border-top:1px solid rgba(237,240,243,0.12); text-align:center; padding:18px 32px; font-size:11.5px; line-height:1.7; color:rgba(237,240,243,0.45);}

  @media (max-width:960px){
    .nav{padding:10px 18px; gap:10px;}
    .nav-search{display:none;}
    .nav-links{display:none;}
    .nav-hamburger{display:flex;}
    .nav-right{margin-left:auto;}
  }

  @media (max-width:720px){
    .breadcrumb-bar{padding:12px 18px; font-size:12.5px;}
    .content-wrap{padding:36px 18px 70px;}
    .content-toc ol{columns:1;}
    .footer-top{grid-template-columns:1fr 1fr; gap:28px 20px;}
    .footer-brand{grid-column:1 / -1;}
  }

  /* ---------- 404 SAYFASI ----------
     Sayfa, sitenin DİĞER içerik sayfalarıyla aynı <head>/tema/renk değişkenlerini ve aynı
     header/footer bileşenini (site-chrome.js) kullanır — "bulunamadı" ekranı da sitenin bir
     parçası gibi görünsün diye. Buradaki kurallar yalnızca bu sayfaya özgü yerleşimdir. */
  .nf-wrap{max-width:720px; margin:0 auto; padding:72px 20px 96px; text-align:center;}
  .nf-code{font-size:64px; line-height:1; font-weight:800; margin:0 0 12px; color:var(--brass-soft); letter-spacing:0.02em;}
  .nf-title{font-size:26px; font-weight:700; margin:0 0 12px; color:var(--ink);}
  .nf-lead{font-size:15px; line-height:1.65; color:var(--ink-soft); margin:0 auto 28px; max-width:52ch;}
  /* Arama kutusu bir <form action="/arama"> — JS ÇALIŞMASA DA çalışır (bulunamadı sayfasında
     kullanıcıyı ikinci bir JS bağımlılığına mahkûm etmek doğru olmaz). */
  .nf-search{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 26px;}
  .nf-search input{
    flex:1 1 320px; max-width:420px; height:44px; padding:0 16px; font-size:14.5px;
    color:var(--ink); background:var(--paper-card);
    border:1px solid var(--line); border-radius:100px; outline:none;
  }
  .nf-search input:focus{border-color:var(--brass);}
  .nf-search button{
    height:44px; padding:0 24px; border:none; border-radius:100px; cursor:pointer;
    background:var(--ink); color:var(--paper); font-size:14px; font-weight:700;
  }
  .nf-search button:hover{background:var(--walnut);}
  .nf-sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;}
  .nf-links{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 0 26px;}
  .nf-links a{
    padding:8px 16px; border-radius:100px; text-decoration:none; font-size:13.5px; font-weight:600;
    color:var(--ink); background:var(--paper-card); border:1px solid var(--line);
  }
  .nf-links a:hover{background:var(--paper-alt);}
  .nf-home a{font-size:14px; font-weight:700; color:var(--brass); text-decoration:none;}
  .nf-home a:hover{text-decoration:underline;}
  @media (max-width:560px){
    .nf-wrap{padding:48px 16px 64px;}
    .nf-code{font-size:52px;}
    .nf-title{font-size:22px;}
  }
</style>
<!-- Google Analytics BURADA YÜKLENMEZ (kullanıcı isteği, 2026-09-13 denetim listesi: "Cookie
     banner"). Parçacık bu sayfadan ve diğer 29 sayfadan kaldırıldı; analitik artık YALNIZCA
     ziyaretçi çerez bandında "Kabul Et" dedikten sonra yüklenir. Tek yükleme noktası:
     js/components/site-chrome.js#loadAnalytics (o dosyadaki "ÇEREZ ONAY BANDI" başlıklı blok).
     Bu sayfaya yeniden bir gtag/analytics betiği eklemek onayı BYPASS eder. -->
</head>
<body>
<script src="js/overlay-manager.js" defer></script>
<script src="auth-nav.js" defer></script>
<script src="catalog-taxonomy.js" defer></script>
<script src="js/components/nav-product-menu.js" defer></script>
<script src="js/components/modal-shell.js" defer></script>
<script src="awards-shared.js"></script>
<script src="js/components/lazy-modals.js" defer></script>
<script src="js/components/profession-drawer.js" defer></script>

  <div id="site-header-mount" data-nav-active=""></div>
  <script src="js/components/site-chrome.js"></script>

  <main class="nf-wrap">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title">Bu sayfayı bulamadık</h1>
    <p class="nf-lead">Adres yanlış yazılmış, içerik kaldırılmış ya da bağlantı eskimiş olabilir.
      Aşağıdan aramayı deneyebilir veya bölümlere göz atabilirsiniz.</p>

    <form class="nf-search" action="/arama" method="get" role="search">
      <label class="nf-sr" for="nf-q">Sitede ara</label>
      <input id="nf-q" name="q" type="search" placeholder="Proje, kişi, firma, marka ya da ürün ara" autocomplete="off">
      <button type="submit">Ara</button>
    </form>

    <nav class="nf-links" aria-label="Bölümler">
      <a href="/proje">Projeler</a>
      <a href="/kisi">Kişiler</a>
      <a href="/firma">Firmalar</a>
      <a href="/marka">Markalar</a>
      <a href="/urun">Ürünler</a>
      <a href="/gundem">Gündem</a>
    </nav>

    <p class="nf-home"><a href="/">Ana sayfaya dön</a></p>
  </main>

  <footer id="site-footer-mount"></footer>
</body>
</html>
