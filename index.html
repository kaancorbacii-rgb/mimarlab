<style>
  :root{
    color-scheme: light;
    --ink:#1B2A3D;
    --ink-soft:#4E6478;
    --paper:#EDF0F3;
    --paper-card:#F8FAFB;
    --paper-alt:#E0E6EC;
    --walnut:#2B425F;
    --brass:#5B7A9B;
    --brass-soft:#AFC5D8;
    --sage:#4F6478;
    --rust:#7C4B4B;
    --accent:#E08A3E;
    --accent-soft:#F5CFA0;
    --line: rgba(27,42,61,0.14);
    --line-soft: rgba(27,42,61,0.08);
  }

  :root[data-theme="dark"]{
    color-scheme: dark;
    --ink:#E8ECF1;
    --ink-soft:#93A4B8;
    --paper:#12171F;
    --paper-card:#1A212B;
    --paper-alt:#212A35;
    --walnut:#8FB0DA;
    --brass:#7FA0C4;
    --brass-soft:#2E3F52;
    --sage:#8CA3BA;
    --rust:#D08F8F;
    --accent:#E8A968;
    --accent-soft:#4A3624;
    --good:#5FB37D;
    --bad:#DD7676;
    --line: rgba(232,236,241,0.14);
    --line-soft: rgba(232,236,241,0.08);
  }
  [data-theme="dark"] .nav{background:rgba(18,23,31,0.92);}
  [data-theme="dark"] .site-footer,
  [data-theme="dark"] .cta-band,
  [data-theme="dark"] .breadcrumb-bar{
    --ink:#17202B; --ink-soft:#1E2836; --paper:#EDF0F3; --paper-card:#232C38; --brass-soft:#AFC5D8; --brass:#5B7A9B;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  :focus-visible{
    outline:none;
    box-shadow: 0 0 0 2px var(--brass) inset;
  }
  .nav-search input:focus-visible, .nav-mobile-search input:focus-visible{box-shadow:none;}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:24px;
    padding:10px 32px;
    background:rgba(237,240,243,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav-search{
    flex:1; max-width:380px;
    display:flex; align-items:center; gap:8px;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:100px;
    padding:9px 16px;
  }
  .nav-search svg{flex-shrink:0; opacity:0.5;}
  .nav-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:13.5px; width:100%; color:var(--ink);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:24px; width:auto; display:block;}
  .nav-links{display:flex; align-items:center; gap:20px; margin-left:auto;}
  .nav-link{font-size:14.5px; color:var(--ink-soft); font-weight:500; white-space:nowrap; text-transform:uppercase; background:none; border:none; font-family:inherit;}
  .nav-link:hover{color:var(--ink);}
  /* Ürün açılır menü düğmesi (bkz. js/components/nav-product-menu.js) — bu reset burada, sayfanın
     KENDİ <style>'ında olmalı, yalnızca JS'in enjekte ettiği stilde değil: nav-product-menu.js
     defer'lı olduğundan ilk boyamadan SONRA çalışır, o ana kadar <button> tarayıcı varsayılan
     çerçeve/arkaplanıyla görünüp kaybolan bir gri dikdörtgen gibi çakıyordu (bkz. kullanıcı isteği). */
  .nav-link-wrap{position:relative;}
  .nav-link-trigger{display:flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; margin:0;}
  .nav-link-trigger svg{transition:transform .15s ease;}
  .nav-link-trigger[aria-expanded="true"] svg{transform:rotate(180deg);}

  .nav-hamburger{
    display:none;
    background:none; border:1px solid var(--line);
    border-radius:8px; padding:8px;
    color:var(--ink); align-items:center; justify-content:center;
  }
  .nav-mobile-menu{
    display:none;
    position:absolute; top:100%; right:18px; z-index:95;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:12px; padding:8px;
    box-shadow:0 12px 28px rgba(27,42,61,0.15);
    flex-direction:column; min-width:220px;
    /* Gerçek bulgu (bkz. kullanıcı isteği): position:absolute olduğundan içeriği sayfanın normal akış
       yüksekliğine hiç katılmıyordu — Ürün akordeonu açılıp panel viewport'tan taştığında sayfanın
       kendisi kaydırma ile bu fazlalığı hiç telafi edemiyordu (döküman scrollHeight paneli hesaba
       katmıyor). max-height+overflow-y ile panel KENDİ İÇİNDE kaydırılabilir hale getirilir. */
    max-height:calc(100vh - 90px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .nav-mobile-menu.open{display:flex;}
  .nav-mobile-link{
    padding:11px 14px; border-radius:8px;
    font-size:14.5px; font-weight:500; color:var(--ink);
    text-transform:uppercase;
  }
  .nav-mobile-link:hover{background:var(--paper-alt);}
  .nav-mobile-search{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:100px; padding:9px 14px;
    margin-bottom:8px;
  }
  .nav-mobile-search svg{flex-shrink:0; opacity:0.55;}
  .nav-mobile-search input{
    border:none; background:none; outline:none;
    font-family:inherit; font-size:16px; width:100%; color:var(--ink);
  }
  .nav-mobile-cta{
    width:100%; margin-top:6px;
    background:var(--ink); color:var(--paper-card);
    border:none; padding:12px 14px; border-radius:8px;
    font-size:14.5px; font-weight:600;
  }
  .nav-mobile-cta:hover{background:var(--walnut);}
  .nav-cta{
    background:var(--ink); color:var(--paper-card);
    padding:9px 18px; border-radius:100px; border:none;
    font-size:14px; font-weight:600; white-space:nowrap;
  }
  .nav-cta:hover{background:var(--walnut);}
  .nav-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .nav-rate{
    background:none; color:var(--ink);
    padding:8px 17px; border-radius:100px;
    border:1.5px solid var(--ink);
    font-size:14px; font-weight:600; white-space:nowrap;
    text-transform:uppercase;
  }
  .nav-rate:hover{background:var(--ink); color:var(--paper-card);}
  .nav-toggle{display:none;}

  /* ---------- HERO ---------- */
  .hero{
    /* "Sen de Katıl" butonu DOM'dan kaldırıldı (bkz. kullanıcı isteği) — alt padding, artık hemen
       altındaki carousel'e kesintisiz akması için sıkılaştırıldı (eskiden buton+36px'lik boşluğu
       taşıyordu). Alt padding daha sonra kullanıcı isteğiyle +15px artırıldı (18px → 33px) — metin
       bloğu ile altındaki ana carousel arasındaki boşluk fazla sıkı duruyordu. */
    padding:44px 32px 33px;
    text-align:center;
    max-width:880px; margin:0 auto;
  }
  .eyebrow{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--sage); font-weight:600; margin-bottom:18px;
  }
  .hero h1{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size:clamp(32px, 4.8vw, 54px);
    font-weight:700; line-height:1.16; letter-spacing:-0.03em;
    margin:0 0 14px;
  }
  .hero h1 em{
    font-style:normal; color:var(--accent); font-weight:800;
  }
  .hero-and{color:var(--ink);}
  .hero h1 .q{
    color:var(--accent); font-style:normal;
    margin-left:0.14em; display:inline-block;
  }
  .hero p{
    font-size:16px; color:var(--ink-soft); margin:0; line-height:1.5;
  }
  /* ---------- HOME BENTO GRID ----------
     ALTI KUTU, TEK GRID (kullanıcı isteği, 2026-09-12 — ekli tasarım görseli): solda iki satır
     yüksekliğinde PROJE, sağ sütunda KİŞİ ve FİRMA, altta ÜRÜN (geniş) · MARKA (dar) · GÜNDEM
     (geniş). Beş eşit sütun bu oranların TAMAMINI tek bir şablonla verir: proje 4 sütun, sağ
     sütun 1; alt satırda 2 + 1 + 2. İç içe bir grid (eski .hero-side) BİLEREK kaldırıldı —
     alt satırın sütunları üst satırın sütunlarıyla hizalı kalsın, yükseklikler de tek bir
     satır şablonundan gelsin.

     YÜKSEKLİK: üç satır da `1fr`. Grid'in kendi yüksekliği .proje-slider'ın aspect-ratio'sundan
     (4/3) doğar; iki satıra yayıldığı için fr dağıtımı üçüncü satıra da AYNI yüksekliği verir,
     yani alt satırın kutuları ayrı bir aspect-ratio taşımak zorunda kalmaz.

     TEK ŞABLON, HER GENİŞLİKTE (kullanıcı isteği, 2026-09-12: "Tablet ve mobilde de aynı sistem
     gözüksün, sıralamayı değiştirme"). Şablon hiçbir breakpoint'te YENİDEN DİZİLMEZ: tablet ve
     telefonda da aynı altı kutu, aynı sırayla, yalnızca ÖLÇEKLENEREK görünür. Bu yüzden kutular
     mobilde ayrı bir aspect-ratio da taşımaz — oranlar her yerde grid'in kendisinden gelir.
     Küçük ekranlarda değişen tek şey ölçü/tipografi (bkz. ≤720px ve ≤560px blokları). */
  .bento-grid{
    /* GENİŞLİK 1220 -> 1000 (kullanıcı isteği, 2026-09-12: "Masaüstü görünümde tüm carosel
       sistemi çok alan kaplıyor sağdan ve soldan carosel sistemini küçült"). Sayfanın en geniş
       öğesi bu bloktu; artık footer bandından (1080px) da belirgin biçimde içeride durur, yani
       sistemin en sağ/en sol kenarı sayfa kenarından uzaklaşır. */
    max-width:1000px; margin:0 auto;
    /* Alt boşluk 64px: "Son ..." şeritleri kaldırıldıktan sonra (kullanıcı isteği, 2026-09-12)
       bu blok yeniden sayfanın SONU — footer'dan önceki nefes payı burada durur. */
    padding:0 32px 64px;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(3, 1fr);
    grid-template-areas:
      "proje proje proje proje kisi"
      "proje proje proje proje firma"
      "urun urun marka gundem gundem";
    gap:16px;
  }
  /* Grid track'lerinin içerik minimum genişliğine göre taşmasını önler — varsayılan
     min-width:auto, absolute konumlanmış <img> içeren kartlarda taşmaya yol açar. */
  .bento-grid > *{min-width:0;}
  .card-proje{grid-area:proje;}
  .card-kisi{grid-area:kisi;}
  .card-firma{grid-area:firma;}
  .card-urun{grid-area:urun;}
  .card-marka{grid-area:marka;}
  .card-gundem{grid-area:gundem;}

  /* project slider (left) */
  .proje-slider{
    position:relative; border-radius:20px; overflow:hidden;
    aspect-ratio:4/3; background:var(--paper-alt);
  }
  /* GERÇEK BULGU (tarihsel — artık projeler-data.js hiç yüklenmiyor, bkz. kullanıcı isteği: Faz 3
     anasayfa D1 geçişi): eskiden slider-track ilk statik veriyle HEMEN dolduruluyor, sonra canlı
     /api/projects cevabı gelince FARKLI bir seçkiyle sertçe (innerHTML) değiştiriliyordu — bu da
     sayfa her yenilendiğinde gözle görülür bir "eski içerik → yeni içerik" sıçramasına (FOUC) yol
     açıyordu. Bugün TEK kaynak (/api/projects) olsa da aynı iskelet-sonra-fade-in deseni korunuyor
     çünkü ilk render her koşulda bir network round-trip'ini bekliyor. opacity:0 başlangıç durumu +
     .loaded'da 1'e geçiş,
     içerik HENÜZ hazır değilken boş (.proje-slider'ın kendi background:var(--paper-alt) rengiyle
     nötr bir "iskelet" gibi duran) kapsayıcıyı gösterir; veri gelip DOM'a yazıldığında yumuşak bir
     fade-in ile belirir, sert bir sıçrama olmaz. */
  .slider-track{position:relative; width:100%; height:100%; opacity:0; transition:opacity .4s ease;}
  .slider-track.loaded{opacity:1;}
  /* API isteği başarısız olursa (ağ hatası/5xx) mini-carousel'ler boş bir renkli kutu olarak
     kalmasın diye (bkz. kullanıcı isteği: "boş ekran gösterme") — trackEl'in kendisi bu metni
     ortalar, .proje-slide'ların absolute konumlanmasından etkilenmez. */
  .slider-fallback{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:14px; font-size:12px; color:var(--ink-soft); line-height:1.4;
  }
  .proje-slide{
    position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .6s ease; text-decoration:none; color:inherit; display:block;
  }
  .proje-slide.active{opacity:1; pointer-events:auto; z-index:1;}
  .proje-slide img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  /* Mimar/Firma mini-carousel'lerinde fotoğraf/logo eksikse (bkz. gerçek bulgu: bu daha önce
     kart tamamen HAVUZDAN düşürülerek "gizleniyordu", firma tarafında havuzun tamamı boşalıp
     carousel'in sonsuza dek boş kalmasına yol açıyordu) — kisi.html/firma.html'deki AYNI
     initials/renk baş harfleri düşüşü, tam ekran kaplayan bir kutu olarak burada da kullanılır. */
  .slide-fallback-avatar{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight:700; font-size:42px; color:rgba(255,255,255,0.92);
  }
  /* KATEGORİ ETİKETİ = O KATEGORİNİN LİSTE SAYFASINA BAĞLANTI (kullanıcı isteği, 2026-09-12:
     "Kategorilerin başlıklarına tıklayınca o sayfalar açılsın"). Etiket bu yüzden artık slaytın
     İÇİNDE değil, karusel kapsayıcısının doğrudan çocuğu: slaytların kendisi birer <a>
     (gönderiye gider) ve bir <a> içine ikinci bir <a> konamaz — iç içe bağlantı geçersiz
     HTML'dir, tarayıcı onu dışarı taşıyıp işaretlemeyi bozar. Kapsayıcıda durması ayrıca
     etiketi SABİT kılar: JS yalnızca slayt listesini yazar, etiket her karusel için HTML'de
     bir kez yazılıp orada kalır.
     Metin HTML'de ZATEN büyük harfle yazılır (KİŞİ/ÜRÜN/GÜNDEM): text-transform:uppercase
     Türkçe'de 'i' -> 'I' üretir (lang="tr" olmayan bir alt ağaçta noktalı İ kaybolur), o yüzden
     dönüşüme güvenilmez. */
  .slide-tag{
    position:absolute; top:18px; left:18px; z-index:2;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:11px; letter-spacing:0.1em;
    color:#fff; opacity:0.9;
    background:rgba(27,42,61,0.35); padding:6px 12px; border-radius:100px;
    backdrop-filter:blur(2px);
  }
  a.slide-tag:hover{background:rgba(27,42,61,0.72); opacity:1;}
  .slide-caption{
    position:absolute; left:18px; bottom:18px; right:18px; z-index:2;
    /* 36px = left(18) + right(18). Bu çıkarma İNSET'LERLE BİRLİKTE ÖLÇEKLENMEK ZORUNDA: dar
       breakpoint'lerde inset küçülürken bu değer 36px'te kalırsa altyazı kutusu gereksizce
       daralır — telefonda 68px'lik KİŞİ/FİRMA/MARKA kutularında başlık "Mimar ar…" gibi 3-4
       karaktere iniyordu (headless render'da görüldü). Her media bloğu kendi insetine karşılık
       gelen değeri yazar. */
    width:fit-content; max-width:calc(100% - 36px);
    background:rgba(27,42,61,0.72); backdrop-filter:blur(3px);
    color:#fff; padding:14px 18px; border-radius:12px;
  }
  /* bkz. kullanıcı isteği: uzun bir proje ismi .slide-caption kutusunu yukarı doğru büyütüp
     slaytın görselini kaplayabiliyordu. En fazla 2 satır. line-height/max-height + !important
     (bkz. kullanıcı isteği, gerçek bulgu: son kelimenin -webkit-line-clamp'e rağmen 3. satıra
     taştığı bildirildi) — line-height em cinsinden SABİTLENİP max-height tam 2 satırla (2 ×
     1.25em) sınırlanarak üçüncü satır kesin gizlenir; em birimleri .side-slider/mobil font-size
     override'larıyla (aşağıda) OTOMATİK ölçeklenir, ayrıca dokunmaya gerek yok. */
  /* margin:0 — denetim bulgusu (2026-08-14): bu eleman artık bir <div> değil <h2> (bkz. aşağıdaki
     projectSlideHtml/mimar/marka slide fonksiyonları — carousel'in o an gösterdiği tek proje/mimar/
     firma adı, önceden yalnızca div olduğundan başlık hiyerarşisinde hiç görünmüyordu), tarayıcının
     varsayılan h2 dış boşluğu (margin-block) sıfırlanır ki görsel yerleşim ÖNCEKİYLE BİREBİR AYNI
     kalsın. */
  .slide-title{margin:0; font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:17px; font-weight:700; display:-webkit-box !important; -webkit-line-clamp:2 !important; -webkit-box-orient:vertical !important; overflow:hidden !important; text-overflow:ellipsis !important; word-break:break-word !important; line-height:1.25em !important; max-height:2.5em !important;}
  .slide-designer{font-size:12.5px; color:rgba(255,255,255,0.72); margin-top:3px;}
  .slider-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:3;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(27,42,61,0.45); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .slider-arrow:hover{background:rgba(27,42,61,0.72);}
  .slider-arrow.prev{left:14px;}
  .slider-arrow.next{right:14px;}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

// Proje slider'ı — Faz 3 sonrası (bkz. kullanıcı isteği, docs/architecture-roadmap.md) artık
// projeler-data.js'in statik 571 kayıtlık anlık görüntüsünü istemci tarafında üye gönderileriyle
// serpiştirmiyor: /api/projects?limit=N zaten proje.html'in kullandığı AYNI canonical D1 havuzu
// (statik miras + onaylı üye gönderileri TEK tabloda birleşik, admin düzenlemeleri satırın
// KENDİSİNDE) — varsayılan sıralaması `id DESC` (son eklenen ilk), ayrıca istemci tarafında bir
// interleave/RECENT_WINDOW_MS hesabına gerek kalmadı. GERÇEK BULGU: en yeni satır (id DESC'te ilk)
// bazen görselsiz bir taslak/test kaydı olabiliyor (bkz. yukarıdaki projectSlideHtml öncesi görsel
// filtresi) — bu yüzden 6'dan daha büyük bir tampon (24) çekilip görseli olanlar arasından ilk 6'sı
// alınır, tam olarak eski `projectsWithImages.slice(0,6)` davranışının karşılığı.
const PROJECT_CAROUSEL_FETCH_LIMIT = 24;
// Karusel slot sayısı 9 -> 6 (kullanıcı isteği, 2026-09-12 madde 3: "Ana sayfadaki carosellerde
// gösterilen her bir kategori için gönderi sayısını 6'ya düşür"; üçüncü tur: "Her kategoride
// varsa 6 yoksa olduğu kadar gönderi döngüde olsun" — yani 6 bir ÜST sınır, alt sınır değil:
// daha az kayıt varsa karusel olduğu kadarıyla döner, boş slot/yer tutucu üretilmez).
// Sabit ÜÇ yerde birlikte yaşar: burası, src/index.js#HOME_SLOTS (gömülü veri) ve
// src/lib/homeCarousels.js#HOME_SLOT_COUNT (admin'in elle seçebileceği en fazla kayıt) —
// bkz. scripts/test-2026-09-12-home-rails.mjs, üçünün ayrışmasını deploy'dan önce durdurur.
const PROJECT_CAROUSEL_SLOTS = 6;
// Kişi/Firma/Ürün/Marka/Gündem liste uçlarından TAM karusel slotu kadar kayıt çekilir. Proje ucu
// istisnadır: kapak görseli olmayan kayıtlar elendiğinden 24'lük bir tampondan
// (PROJECT_CAROUSEL_FETCH_LIMIT) ilk 6 GÖRSELLİ proje alınır.
const HOME_LIST_FETCH_LIMIT = PROJECT_CAROUSEL_SLOTS;

// GÜNDEM slaydının görsel türevleri. Diğer karuseller slideImgHtml'in widths/sizes parametrelerini
// çağrı yerinde taşır; gündem görseli çoğunlukla DIŞ bir adres olduğundan (türev üretilemez) kendi
// yardımcı fonksiyonuna sahip ve değerleri burada, tek yerde durur (bkz. gundemSlideImgHtml).
// Kutu HER genişlikte iki grid sütunu kadardır (şablon yeniden dizilmiyor, bkz. .bento-grid):
// 1000px'lik kapsayıcıda ~356px, daha darda kapsayıcının ~%38'i.
const GUNDEM_IMG_WIDTHS = [400, 800, 1600];
const GUNDEM_IMG_SIZES = '(max-width: 1000px) 38vw, 356px';

// GERÇEK BULGU (kullanıcı isteği 2026-08-30, İçeriklerim > Mimar/Firma Profilim popup entegrasyonu):
// auth-modal.js#loadProfileModals artık index.html'e save-widget.js'i DİNAMİK olarak yüklüyor —
// o dosya da AYNI isimlerle (SLUGIFY_TR_MAP/slugify) kendi top-level sabitini/fonksiyonunu tanımlıyor;
// index.html'in kendi kopyası SAYFA YÜKLENİRKEN (bu inline script'in ilk çalışmasında) zaten
// gerektiğinden save-widget.js'i öne almak/gecikmeli yüklemek mümkün değil — burada isim çakışması
// yaşamamak için index.html'e ÖZGÜ bir önek eklendi (yalnızca bu dosyanın 2 çağrı noktası etkilenir).
const IDX_SLUGIFY_TR_MAP = { ç:'c', Ç:'c', ğ:'g', Ğ:'g', ı:'i', I:'i', İ:'i', ö:'o', Ö:'o', ş:'s', Ş:'s', ü:'u', Ü:'u' };
function idxSlugify(text){
  return (text || '')
    .split('').map(ch => IDX_SLUGIFY_TR_MAP[ch] || ch).join('')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// Ofis adı öncelikli, o yoksa künyedeki HAM mimar/ofis isimleri, sonra konum gösterilir (bkz.
// kullanıcı isteği + gerçek bulgu: Kapicciiiinoo projesinin altyazısında künyede hiç eklenmemiş
// bir firma görünüyordu — mimarlardan biri o firmaya KENDİ profilinde ortak olduğu için otomatik
// ekleniyordu). officeNames artık SADECE proje künyesine doğrudan ofis olarak eklenmiş isimleri
// taşır (bkz. src/lib/projectPool.js#OFFICE_NAMES_SQL) — mimarın kişisel ofis bağlantısı üzerinden
// asla türetilmez. Künyede hiç ofis yoksa (yalnızca mimar eklenmişse) p.designer'daki HAM isimler
// (künyede yazan ne ise o) kullanılır, uydurma bir ofis adı gösterilmez.
// project_date serbest metin (bkz. src/routes/project.js#parseProjectDateYear yorumu — "2018-2020",
// "1506-1513" gibi aralıklar olabilir). Carousel altyazısında aralığın TAMAMI değil yalnızca SON
// (en güncel) yıl gösterilir — stringdeki son 4 haneli sayı bu amaçla yeterli; yüzyıl/MÖ gibi
// 4 haneli yıl içermeyen formatlarda ham metne düşülür.
function lastProjectYear(dateStr) {
  if (!dateStr) return '';
  const years = String(dateStr).match(/\d{4}/g);
  return years ? years[years.length - 1] : dateStr;
}

// SLAYT GÖRSELLERİNİN TEMBEL YÜKLENMESİ (performans turu, 2026-09-08). GERÇEK BULGU (canlıda ölçüldü):
// dört karuselin 36 slaytının HEPSİ sayfa açılışında iniyordu (2,4 MB) — `loading="lazy"` burada hiç
// işe yaramıyordu, çünkü slaytlar absolute konumlu ve görünüm alanının İÇİNDE (yalnızca opacity:0);
// tarayıcı "görünür" sayıp hepsini hemen indiriyordu ve ilk (LCP) görsel bant genişliğini 35 görselle
// paylaşıyordu. Artık yalnızca ilk slayt gerçek src/srcset taşır; diğerleri data-src/data-srcset ile
// bekler ve gösterilmeden hemen önce (hydrateSlide) yüklenir — her geçişte BİR SONRAKİ slayt da
// önceden yüklenir ki 0,6sn'lik crossfade boş kareye düşmesin. sizes değerleri src/index.js#HOME_IMG
// ile BİREBİR aynı olmalı (sunucu ilk slaytları <link rel=preload> ile aynı adaylarla önden yükler).
function slideImgHtml(path, widths, sizes, alt, i, className){
  const cls = className ? ` class="${className}"` : '';
  const srcset = path ? cdnSrcset(path, widths) : '';
  const sizesAttr = srcset ? ` sizes="${sizes}"` : '';
  if(i === 0){
    return `<img${cls} src="${escapeAttr(cdnImg(path, 900))}"${srcset ? ` srcset="${escapeAttr(srcset)}"` : ''}${sizesAttr} alt="${escapeAttr(alt)}" loading="eager" decoding="sync" fetchpriority="high">`;
  }
  return `<img${cls} data-src="${escapeAttr(cdnImg(path, 900))}"${srcset ? ` data-srcset="${escapeAttr(srcset)}"` : ''}${sizesAttr} alt="${escapeAttr(alt)}" decoding="async">`;
}
function hydrateSlide(slide){
  const img = slide && slide.querySelector('img[data-src]');
  if(!img) return;
  if(img.dataset.srcset){ img.srcset = img.dataset.srcset; img.removeAttribute('data-srcset'); }
  img.src = img.dataset.src;
  img.removeAttribute('data-src');
}
// Gösterilecek slaytı ve bir sonrakini yükler (otomatik oynatma/ok/kaydırma hep +1 yönünde ilerler;
// geri yönde de hedef slaytın kendisi yüklenir, yalnızca "önceden yükleme" ileri yöne bakar).
function hydrateAround(slides, idx){
  if(!slides.length) return;
  hydrateSlide(slides[idx]);
  if(slides.length > 1) hydrateSlide(slides[(idx + 1) % slides.length]);
}
// İlk render'dan sonra ikinci slayt, sayfa yükü (load) bitince yüklenir — LCP görseliyle bant
// genişliği için yarışmasın diye önce değil.
function hydrateSecondSlideAfterLoad(getSlides){
  const run = () => setTimeout(() => { const s = getSlides(); if(s.length > 1) hydrateSlide(s[1]); }, 600);
  if(document.readyState === 'complete') run();
  else window.addEventListener('load', run, { once: true });
}

function projectSlideHtml(p, i){
  // Konum künyesinde ilçe DEĞİL yalnızca il/şehir gösterilir (bkz. kullanıcı isteği) —
  // il-ilce-data.js#parseLocationFull p.location'ı (ilçe ya da il adı) {city,district}'e çözer.
  const cityName = (typeof parseLocationFull === 'function') ? parseLocationFull(p.location).city : p.location;
  const designerNames = (p.officeNames && p.officeNames.length) ? p.officeNames : (p.designer || []);
  const meta = [designerNames.join(', '), cityName, lastProjectYear(p.date)].filter(Boolean).join(', ');
  const slideImg = (p.images && p.images[0]) || '';
  return `<a class="proje-slide${i === 0 ? ' active' : ''}" href="/proje/${encodeURIComponent(p.slug)}" data-index="${i}">
    ${slideImgHtml(slideImg, [600, 900, 1200], '(max-width: 1000px) 78vw, 744px', p.title, i, '')}
    <div class="slide-caption">
      <h2 class="slide-title">${escapeHtml(p.title)}</h2>
      ${meta ? `<div class="slide-designer">${escapeHtml(meta)}</div>` : ''}
    </div>
  </a>`;
}

// Dokunmatik (mobil/tablet) parmak kaydırması ve trackpad yatay tekerlek hareketini crossfade
// carousel'lerin next/prev fonksiyonlarına bağlar (bkz. kullanıcı isteği: anasayfa carousel'lerine
// dokunmatik/trackpad kaydırma deste ği). Aynı eşik/wheel-lock deseni js/components/gallery.js'deki
// lightbox swipe mantığından alınmıştır. Slaytlar birer <a> linki olduğundan gerçek mouse
// click-and-drag BİLEREK kapsam dışı bırakıldı (link tıklamasını sürüklemeden ayırt etmek ek
// karmaşıklık katardı) — yalnızca touch swipe + wheel deltaX (trackpad iki parmak kaydırma).
function wireSwipe(el, { onNext, onPrev }) {
  const SWIPE_THRESHOLD = 40;
  let startX = 0, startY = 0, active = false, intentHorizontal = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    active = true; intentHorizontal = false;
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (!active || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
    if (!intentHorizontal && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) intentHorizontal = true;
    if (intentHorizontal) e.preventDefault();
  }, { passive: false });
  el.addEventListener('touchend', (e) => {
    if (!active) return;
    active = false;
    if (!intentHorizontal) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (dx <= -SWIPE_THRESHOLD) onNext();
    else if (dx >= SWIPE_THRESHOLD) onPrev();
  });
  let wheelLock = false;
  el.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 350);
    if (e.deltaX > 0) onNext(); else onPrev();
  }, { passive: false });
}

let sliderIndex = 0;
let sliderTimer = null;
let sliderSlugs = '';

function renderSlider(items){
  // Yalnızca slug'a değil kapak görseline de bakılır — aksi halde admin'in onayladığı bir kapak
  // görseli düzenlemesi (bkz. project-edits overlay), aynı 5 proje ana sayfada zaten gösteriliyor
  // olduğu için bu "değişmediyse yeniden çizme" kısayoluna takılıp hiç yansımazdı (gerçek bulgu:
  // Bodrum Evleri'nin kapağı değiştirildiği halde ana sayfada eski görsel kalmaya devam ediyordu).
  const slugs = items.map(p => `${p.slug}:${(p.images && p.images[0]) || ''}`).join('|');
  if(slugs === sliderSlugs) return; // içerik aynıysa mevcut slaytı/otomatik oynatma ilerlemesini bozma
  sliderSlugs = slugs;
  sliderIndex = 0;
  const trackEl = document.getElementById('slider-track');
  trackEl.innerHTML = items.map(projectSlideHtml).join('');
  trackEl.classList.add('loaded');
  mountSlideHotspots(trackEl, items);
  hydrateSecondSlideAfterLoad(() => trackEl.querySelectorAll('.proje-slide'));
  restartAutoplay();
}

// Carousel slaytlarındaki ürün işaretçileri (kullanıcı isteği, 2026-09-04: "proje görselinde
// etiketli ürünler hali hazırdaki dairesel etiket tasarımıyla gözüksünler ve tıklanabilsinler").
//
// Proje/ürün pop-up'larındaki AYNI bileşen kullanılır (js/components/image-hotspots.js) — ayrı bir
// daire tasarımı yazılmaz. Veri /api/projects yükünden gelir: shapeProjectItem coverOnly yolunda
// YALNIZCA kapak görselinin işaretçilerini taşır (bkz. src/lib/projectPool.js).
//
// İki davranış kararı:
//   * fit:'cover' — slayt görseli object-fit:cover ile kırpılıyor (bkz. .proje-slide img);
//     işaretçi katmanı görselin GERÇEKTEN boyandığı dikdörtgene oturmalı, kutusuna değil.
//   * interactive:true + hoverPreview:true (kullanıcı isteği, 2026-09-04: "hotspotların üzerine
//     mouse imleci getirince ya da tablet ve mobilde tıklayınca ürün önizlemesi gözüksün") —
//     masaüstünde üzerine gelmek, dokunmatikte dokunmak AYNI tam önizleme kartını açar (bkz.
//     image-hotspots.js#openFor/hoverPreview); karttaki bağlantı ürün sayfasına götürür. Kart
//     .ih-layer'ın (yani görselin boyandığı dikdörtgenin) İÇİNE kendini sığdırır (bkz.
//     image-hotspots.js#placeCard) — .proje-slider'ın overflow:hidden'ı burada sorun ÇIKARMAZ,
//     kartın boyutu (260px/220px) slider'ın gerçek genişliğinin altında kaldığı sürece (bkz. o
//     dosyadaki "ÖNİZLEME KARTI YALNIZCA LIGHTBOX'TA" notu — o kısıtlama küçük galeri şeritleri
//     içindir, buradaki slider onlardan çok daha geniştir). Nokta tıklaması <a>'yı tetiklemez:
//     ImageHotspots#onLayerClick zaten preventDefault+stopPropagation yapıyor.
// Render artık ayrıştırma sırasında (deferred image-hotspots.js henüz çalışmadan) olabildiğinden
// bileşen yoksa iş DOMContentLoaded'a ertelenir (deferred script'ler ondan önce çalışmayı garanti eder).
let pendingHotspotItems = null;
document.addEventListener('DOMContentLoaded', () => {
  if(pendingHotspotItems){ const items = pendingHotspotItems; pendingHotspotItems = null; mountSlideHotspots(document.getElementById('slider-track'), items); }
});
function mountSlideHotspots(trackEl, items){
  if(typeof ImageHotspots === 'undefined'){ pendingHotspotItems = items; return; }
  pendingHotspotItems = null;
  trackEl.querySelectorAll('.proje-slide').forEach(slide => {
    const idx = parseInt(slide.dataset.index, 10);
    const p = items[idx];
    const img = slide.querySelector('img');
    if(!p || !img) return;
    const cover = (p.images && p.images[0]) || '';
    const dots = (p.imageHotspots && p.imageHotspots[cover]) || [];
    if(!dots.length) return;
    ImageHotspots.mount(slide, img, dots, {
      fit: 'cover',
      interactive: true,
      hoverPreview: true,
    });
  });
}

// /api/projects başarısız olursa (ağ hatası/5xx) — artık statik projeler-data.js yedek kataloğu
// yok, bu yüzden mimar/firma/ürün mini-carousel'leriyle AYNI .slider-fallback deseni (bkz.
// createMiniSlider#renderError) burada da uygulanır.
function renderSliderError(message){
  if(sliderSlugs === '__error__') return;
  sliderSlugs = '__error__';
  clearInterval(sliderTimer);
  const trackEl = document.getElementById('slider-track');
  trackEl.innerHTML = `<div class="slider-fallback">${escapeHtml(message)}</div>`;
  trackEl.classList.add('loaded');
}

function goToSlide(i){
  const slides = document.querySelectorAll('#slider-track .proje-slide');
  if(!slides.length) return;
  sliderIndex = (i + slides.length) % slides.length;
  hydrateAround(slides, sliderIndex);
  slides.forEach((s, idx) => s.classList.toggle('active', idx === sliderIndex));
}
function nextSlide(){ goToSlide(sliderIndex + 1); }
function prevSlide(){ goToSlide(sliderIndex - 1); }

function restartAutoplay(){
  clearInterval(sliderTimer);
  sliderTimer = setInterval(nextSlide, 5000);
}

document.getElementById('slider-next').addEventListener('click', ()=>{ nextSlide(); restartAutoplay(); });
document.getElementById('slider-prev').addEventListener('click', ()=>{ prevSlide(); restartAutoplay(); });
const sliderEl = document.getElementById('proje-slider');
sliderEl.addEventListener('mouseenter', ()=> clearInterval(sliderTimer));
sliderEl.addEventListener('mouseleave', restartAutoplay);
wireSwipe(sliderEl, { onNext: () => { nextSlide(); restartAutoplay(); }, onPrev: () => { prevSlide(); restartAutoplay(); } });

// GERÇEK BULGU (eski, artık geçersiz ama tarihsel bağlam için): projeler-data.js'in STATİK anlık
// görüntüsüyle ERKEN bir renderSlider(...) çağrısı, canlı veri gelince FARKLI bir seçkiyle
// yeniden yazılıp gözle görülür bir içerik sıçramasına (FOUC) yol açıyordu. Bugün de aynı çözüm
// geçerli: TEK render, aşağıdaki Promise.all'ın .then() bloğunda; boş kalan #slider-track kendi
// nötr .proje-slider arka planını (bkz. yukarısı) gösterir, veri gelince .loaded ile fade-in yapar.

// kisi.html/firma.html'in kart havuzunda kullandığı AYNI baş harf/renk düşüşü (initials/
// officeColor) — index.html data.js/badge-shared.js yüklemediğinden burada küçük, kendi kendine
// yeten birer kopyası tutulur (bkz. gerçek bulgu: fotoğrafı/logosu olmayan mimar/firma kartları
// önceden HAVUZDAN tamamen filtrelenip düşürülüyordu, bu da firma tarafında tüm 6'lık havuzun
// boşalıp carousel'in kalıcı olarak boş kalmasına yol açabiliyordu — artık düşürülmek yerine bu
// baş harf rozetiyle gösteriliyorlar).
function slideInitials(name){
  return (name || '').replace(/[—.]/g,' ').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
}
const SLIDE_AVATAR_PALETTE = ['#2B425F','#3E5A78','#5B7A9B','#4F6478','#7C4B4B'];
function slideAvatarColor(name){
  let hash = 0;
  for(let i=0;i<(name||'').length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return SLIDE_AVATAR_PALETTE[Math.abs(hash) % SLIDE_AVATAR_PALETTE.length];
}

// GÜNDEM SLAYDI (kullanıcı isteği, 2026-09-12: ana sayfaya MARKA ve GÜNDEM kutuları eklendi).
// Görsel iki kaynaktan gelebilir ve ayrım js/pages/gundem.js#photoHtml ile BİREBİR aynıdır:
// kendi R2'muzdaki üye görselleri (/media/...) türev/CDN yolundan geçer, dış yayıncı görselleri
// (hotlink) ham adresle kalır. referrerpolicy="no-referrer" her iki durumda da taşınır — bazı
// yayıncılar referrer'lı isteği reddediyor (aynı gerekçe gundem.js'te de yazılı).
// Adres ERİŞİLEMEZ olursa (yayıncı görseli kaldırdı/engelledi) ayrıca bir onerror gerekmez:
// js/components/broken-image-fallback.js belge üzerinde capture fazında `error` dinler ve kırık
// görseli baş harf rozetine çevirir — headless render'da gündem slaytında doğrulandı.
// fetchpriority="high" BİLEREK yok (proje kapağının aksine bu görsel LCP adayı değil).
function gundemSlideImgHtml(src, alt, i){
  const own = typeof src === 'string' && src.startsWith('/media/');
  const url = own ? cdnImg(src, 900) : src;
  const srcset = own ? cdnSrcset(src, GUNDEM_IMG_WIDTHS) : '';
  const sizesAttr = srcset ? ` sizes="${GUNDEM_IMG_SIZES}"` : '';
  if(i === 0){
    return `<img src="${escapeAttr(url)}"${srcset ? ` srcset="${escapeAttr(srcset)}"` : ''}${sizesAttr} alt="${escapeAttr(alt)}" loading="eager" decoding="sync" referrerpolicy="no-referrer">`;
  }
  return `<img data-src="${escapeAttr(url)}"${srcset ? ` data-srcset="${escapeAttr(srcset)}"` : ''}${sizesAttr} alt="${escapeAttr(alt)}" decoding="async" referrerpolicy="no-referrer">`;
}
// Kartın gösterdiği tarih source_published_at'tir (bkz. src/routes/gundem.js#shapeItem) — gündem
// listesindeki kartla aynı biçim.
function gundemSlideDate(value){
  const d = value ? new Date(value) : null;
  if(!d || isNaN(d.getTime())) return '';
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
}
function gundemSlideHtml(g, i){
  const media = g.image
    ? gundemSlideImgHtml(g.image, g.title, i)
    : `<div class="slide-fallback-avatar" style="background:${slideAvatarColor(g.title)}">${escapeHtml(slideInitials(g.title))}</div>`;
  const meta = [gundemSlideDate(g.date), g.sourceName].filter(Boolean).join(' · ');
  return `<a class="proje-slide${i === 0 ? ' active' : ''}" href="/gundem/${encodeURIComponent(g.slug)}" data-index="${i}">
    ${media}
    <div class="slide-caption">
      <h2 class="slide-title">${escapeHtml(g.title)}</h2>
      ${meta ? `<div class="slide-designer">${escapeHtml(meta)}</div>` : ''}
    </div>
  </a>`;
}

// Proje slider'ıyla aynı crossfade + otomatik oynatma + ok/hover davranışını kişi, firma, ürün,
// marka ve gündem mini-carousel'lerinde tekrar kullanmak için genelleştirilmiş fabrika (bkz.
// kullanıcı isteği: "carosel tasarımını temaya uygun yeniden tasarla ... oklarla hareket
// ettirilebilir olsun").
function createMiniSlider(trackId, prevId, nextId, slideHtmlFn, keyFn){
  const trackEl = document.getElementById(trackId);
  const wrapEl = trackEl.closest('.side-slider');
  // gerçek bulgu: cacheKey başlangıçta '' idi — items.map(keyFn).join('|') de BOŞ bir dizi için ''
  // döndüğünden, API "başarıyla" ama sıfır öğeyle döndüğünde key===cacheKey eşleşip render() SESSİZCE
  // hiçbir şey yapmadan çıkıyordu (trackEl asla .loaded almıyor, renderError() da hiç çağrılmıyor —
  // firma carousel'inin kalıcı olarak boş kutu kalmasının asıl nedeni buydu). null hiçbir zaman
  // gerçek bir key ile eşleşmeyeceğinden ilk render (boş dizi dahil) artık her zaman gerçekleşir.
  let index = 0, timer = null, cacheKey = null;

  function render(items){
    const key = items.map(keyFn).join('|');
    if(key === cacheKey) return; // içerik aynıysa mevcut slaytı/otomatik oynatma ilerlemesini bozma
    cacheKey = key;
    index = 0;
    clearInterval(timer);
    trackEl.innerHTML = items.map(slideHtmlFn).join('');
    trackEl.classList.add('loaded');
    hydrateSecondSlideAfterLoad(() => trackEl.querySelectorAll('.proje-slide'));
    restart();
  }
  // API isteği ağ hatası/5xx ile başarısız olduğunda çağrılır — trackEl'i boş bırakmak yerine
  // kısa bir bilgi metni gösterir (bkz. yukarıdaki .slider-fallback yorumu).
  function renderError(message){
    if(cacheKey === '__error__') return;
    cacheKey = '__error__';
    clearInterval(timer);
    trackEl.innerHTML = `<div class="slider-fallback">${escapeHtml(message)}</div>`;
    trackEl.classList.add('loaded');
  }
  function goTo(i){
    const slides = trackEl.querySelectorAll('.proje-slide');
    if(!slides.length) return;
    index = (i + slides.length) % slides.length;
    hydrateAround(slides, index);
    slides.forEach((s, idx) => s.classList.toggle('active', idx === index));
  }
  function next(){ goTo(index + 1); }
  function prev(){ goTo(index - 1); }
  function restart(){ clearInterval(timer); timer = setInterval(next, 5000); }

  document.getElementById(nextId).addEventListener('click', ()=>{ next(); restart(); });
  document.getElementById(prevId).addEventListener('click', ()=>{ prev(); restart(); });
  wrapEl.addEventListener('mouseenter', ()=> clearInterval(timer));
  wrapEl.addEventListener('mouseleave', restart);
  wireSwipe(wrapEl, { onNext: () => { next(); restart(); }, onPrev: () => { prev(); restart(); } });

  return { render, renderError };
}

// Altı karusel — HTML'deki kutu sırası (bkz. .bento-grid grid-template-areas). FİRMA ve MARKA
// AYNI kart/slayt işaretlemesini paylaşır (tek kayıt türü, bkz. officeSlideHtml) ama AYRI
// uçlardan beslenir: /api/offices saf markaları dışlar (firma listesi), ?brands=1 ise yalnızca
// markaları verir — ayrım office-kind.js'te tek kaynaktan gelir.
const kisiSlider = createMiniSlider('kisi-slider-track', 'kisi-prev', 'kisi-next', architectSlideHtml, a => a.name);
const firmaSlider = createMiniSlider('firma-slider-track', 'firma-prev', 'firma-next', officeSlideHtml, o => o.name);
const urunSlider = createMiniSlider('urun-slider-track', 'urun-prev', 'urun-next', urunSlideHtml, p => `${p.slug}|||${p.title}`);
const markaSlider = createMiniSlider('marka-slider-track', 'marka-prev', 'marka-next', officeSlideHtml, o => o.name);
const gundemSlider = createMiniSlider('gundem-slider-track', 'gundem-prev', 'gundem-next', gundemSlideHtml, g => g.slug);

// Ağ hatası/5xx durumunda {items:[]} ile "gerçekten boş" arasında ayrım yapabilmek için (bkz.
// aşağıdaki kullanım — kullanıcı isteği: "API isteği başarısız olursa ... boş ekran gösterme,
// zarif bir hata/fallback görünümü sun") başarısız istekler items:[] YERİNE failed:true döner.
// cache: 'no-store' — GERÇEK BULGU: Cloudflare zone'undaki Browser Cache TTL, origin'in
// Cache-Control: max-age=60 değerini yok sayıp tarayıcıya çok daha uzun bir max-age (gözlemlenen:
// 14400s/4sa) dönebiliyor; bu da ziyaretçinin tarayıcısının /api/projects gibi uçları saatlerce
// AĞA HİÇ GİTMEDEN önbellekten sunmasına, dolayısıyla ana sayfa carousel'inin yeni eklenen
// projeleri asla göstermeyip "takılı" görünmesine yol açıyordu (bkz. kullanıcı isteği). no-store
// bu tarayıcı önbelleğini tamamen devre dışı bırakır — güncellik artık yalnızca edge/CDN katmanının
// s-maxage=300 (5dk) + publicCache.js#invalidatePublicCache ile sınırlanır.
function fetchPublicJson(url){
  // Zaman aşımı + bir kez yeniden deneme (bkz. js/components/site-chrome.js#mlFetch, kullanıcı
  // isteği 2026-09-10: "ana sayfada yüklenme/geç yüklenme") — mobilde askıda kalan tek bir istek
  // karuselleri süresiz gri kutu olarak bırakıyordu. cache:'no-store' gerekçesi yukarıda, korunur.
  return (window.mlFetch ? window.mlFetch(url, { timeoutMs: 12000, retries: 1, init: { cache: 'no-store' } }) : fetch(url, { cache: 'no-store' }))
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .catch(()=>({items:[], failed:true}));
}

// VERİ KAYNAĞI (performans turu, 2026-09-08). Worker, ana sayfa HTML'ini servis ederken ALTI liste
// ucunun sonucunu <head>'e `<script id="ml-home-data" type="application/json">` olarak gömer (bkz.
// src/index.js#loadHomeData — AYNI handler'lar, AYNI Cache API + parmak izi tazeliği). Blok varsa
// hiçbir /api isteği atılmadan, ayrıştırma sırasında HEMEN render edilir; bir bölüm eksikse (null —
// o uç sunucuda başarısız/yavaş kaldıysa) yalnızca o bölüm eskisi gibi istemcide çekilir.
//
// Eski akış: render DOMContentLoaded'a ertelenip fetch'ler orada başlıyordu — 16 deferred script'in
// yeniden doğrulanması (~1sn) + 5 API isteği (0,4-1,1sn) karusellerin görünmesini 2sn+ geciktiriyordu.
// image-cdn.js artık senkron (bkz. yukarıdaki <script> yorumu), bu yüzden DOMContentLoaded beklenmez.
function readHomeSsrData(){
  try{
    const el = document.getElementById('ml-home-data');
    if(!el) return null;
    const d = JSON.parse(el.textContent || 'null');
    // v === 4: gövde artık ALTI bölüm taşır — MARKA ve GÜNDEM karuselleri eklendi (kullanıcı
    // isteği, 2026-09-12 üçüncü tur), bölüm başına karusel slotu kadar (6) kayıt.
    // Sürüm ayrışması iki yönlü de güvenli: tarayıcı önbelleğinden gelen ESKİ bir belge (v:1..3)
    // burada yok sayılıp listeler ağdan çekilir, ESKİ bir belge de yeni (v:4) gövdeyi yok sayar —
    // yani hiçbir durumda yarım dolu bir karusel çizilmez.
    return (d && d.v === 4) ? d : null;
  }catch(e){ return null; }
}
const HOME_SSR = readHomeSsrData();
function ssrList(key){ return HOME_SSR && Array.isArray(HOME_SSR[key]) ? HOME_SSR[key] : null; }

// ANA SAYFA KARUSEL SEÇİMİ (kullanıcı isteği, 2026-09-12 madde 1). Admin panelinin "Ana Sayfa"
// sekmesinden seçilen kayıtlar her karuselin BAŞINA geçer, kalan slotlar ucun doğal sırasıyla
// (son eklenenler/popülerlik) dolar. Sıralamayı SUNUCU yapar: seçim liste ucuna `pin=` olarak
// gider ve orada HAVUZUN TAMAMI üzerinde uygulanır (bkz. src/lib/homeCarousels.js). İstemcide
// yeniden sıralamak YETMEZDİ — çekilen 9/24'lük pencereye düşmeyen bir seçim burada hiç
// görünmezdi (eski "öne çıkan projeler" davranışının sessiz kusuru).
// Bu yüzden yedek fetch yolunda ayarlar listelerden ÖNCE okunur; gömülü veri (#ml-home-data)
// varsa hiçbir istek atılmadığından bu bekleme normal yolda HİÇ oluşmaz.
const HOME_SETTINGS_KEY = { projects: 'featuredProjectSlugs', architects: 'featuredArchitectSlugs', offices: 'featuredOfficeSlugs', products: 'featuredProductSlugs' };
function siteSettingsPromise(){
  // window.__siteSettingsPromise: auth-nav.js duyuru banner'ı için AYNI endpoint'i çekiyor —
  // paylaşılan promise, aynı istek iki kez atılmaz.
  return window.__siteSettingsPromise || (window.__siteSettingsPromise =
    fetch('/api/public/site-settings', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(()=>null));
}
function pinQuery(settings, key){
  // Marka/Gündem karusellerinin admin seçimi YOK (HOME_SETTINGS_KEY'de anahtarları yok) — bu
  // durumda URL'e hiç dokunulmaz; en sıcak önbellek anahtarı korunur (aynı gerekçe
  // src/lib/homeCarousels.js#withPinParam'da da yazılı).
  const settingKey = HOME_SETTINGS_KEY[key];
  const list = (settingKey && settings && settings[settingKey]) || [];
  return list.length ? '&pin=' + encodeURIComponent(list.join(',')) : '';
}

// useSsr=false: gömülü veri yok sayılır, her şey ağdan tazelenir (arka plan yenilemesi, aşağıya bkz.).
function loadHomeSections(useSsr){
  // PIN'Lİ bölümler: admin seçimi yalnızca bu dördünde var (bkz. HOME_SETTINGS_KEY). Dördü de
  // gömülü geldiyse ayarlara hiç bakılmaz (sunucu sıralamayı zaten uyguladı); en az biri eksikse
  // o uç için `pin=` gerekir, o yüzden ayarlar okunur. Marka/Gündem'in seçimi olmadığından
  // eksiklikleri ayar okumayı GEREKTİRMEZ.
  const ssrAll = useSsr && !!(ssrList('projects') && ssrList('architects') && ssrList('offices') && ssrList('products'));
  return (ssrAll ? Promise.resolve(null) : siteSettingsPromise()).then((siteSettings)=>{
  const pick = (key, url) => {
    const list = useSsr ? ssrList(key) : null;
    return list ? Promise.resolve({ items: list }) : fetchPublicJson(url + pinQuery(siteSettings, key));
  };
  return Promise.all([
    // proje.html'in kullandığı AYNI canonical uç (bkz. yukarıdaki PROJECT_CAROUSEL_FETCH_LIMIT
    // yorumu) — statik miras + onaylı üye gönderileri zaten TEK D1 tablosunda birleşik, admin
    // düzenlemeleri/gizlemeleri satırın kendisinde.
    // noPreview=1 — önizleme ("blurlu") kayıtları karusele HİÇ gelmesin (kullanıcı isteği,
    // 2026-09-10 madde 6). Sunucu tarafı gömülü veri de aynı parametreyle çekilir (bkz.
    // src/index.js#loadHomeData); bu satırlar gömülü veri yoksa devreye giren doğrudan fetch
    // yolunu kapsar. Yayına alınan bir kayıt kendiliğinden karusele geri girer.
    pick('projects', '/api/projects?limit=' + PROJECT_CAROUSEL_FETCH_LIMIT + '&noPreview=1'),
    // Mimar/Firma mini-carousel'leri: proje.html/kisi.html/firma.html'in kendi listeleme
    // sayfalarında da kullandığı genel D1 uçları, Proje carousel'iyle AYNI slot sayısıyla
    // (HOME_LIST_FETCH_LIMIT=12: karusel 6 + şerit 6). sort PARAMETRESİZ varsayılanı popülerlik sıralamasıdır (bkz.
    // src/routes/architect.js|office.js#handle*ListRoute — "Default Popularity-Based Sorting").
    pick('architects', '/api/architects?limit=' + HOME_LIST_FETCH_LIMIT + '&noPreview=1'),
    // FİRMA kutusu: /api/offices SAF markaları (yalnızca üretici olan kayıtları) zaten dışlar —
    // firma.html'in kullandığı AYNI uç ve AYNI ayrım (bkz. office-kind.js#isPureBrandOffice).
    pick('offices', '/api/offices?limit=' + HOME_LIST_FETCH_LIMIT + '&noPreview=1'),
    // /api/products?limit=N varsayılan sıralaması id DESC'tir (son eklenen N ürün).
    pick('products', '/api/products?limit=' + HOME_LIST_FETCH_LIMIT + '&noPreview=1'),
    // MARKA kutusu (kullanıcı isteği, 2026-09-12 üçüncü tur): ?brands=1 — marka.html'in kullandığı
    // AYNI süzgeç (bkz. src/routes/office.js#brandsOnly), yani kataloğunda ürünü olan ya da kendini
    // marka kategorisiyle etiketlemiş firmalar. Firma kutusuyla aynı uç olsa da AYRI bir önbellek
    // anahtarı/sıralaması taşır, bu yüzden kendi isteğidir.
    pick('brands', '/api/offices?brands=1&limit=' + HOME_LIST_FETCH_LIMIT + '&noPreview=1'),
    // GÜNDEM kutusu: /api/gundem varsayılan sıralaması en yeni tarihten eskiye (bkz.
    // src/routes/gundem.js#GUNDEM_SORT). Gündem kayıtlarında `preview` kavramı YOK.
    pick('gundem', '/api/gundem?limit=' + HOME_LIST_FETCH_LIMIT),
  ]).then(([yapiRes, architectRes, officeRes, productRes, brandRes, gundemRes])=>{
    if(yapiRes.failed){
      renderSliderError('Projeler şu an yüklenemedi.');
    } else {
      // ÖNİZLEME ("soluk") projeleri karusele GİRMEZ (kullanıcı isteği, 2026-09-10) — sunucu tarafı
      // gömülü veri de aynı filtreyi uygular (bkz. src/index.js#loadHomeData); bu satır, gömülü veri
      // yoksa devreye giren doğrudan fetch yolunu da kapsar.
      const pool = (yapiRes.items || []).filter(p => !p.preview && p.images && p.images[0]);
      renderSlider(pool.slice(0, PROJECT_CAROUSEL_SLOTS));
    }

    // İstek başarısız olursa trackEl kalıcı olarak boş bir renkli kutu olarak kalmasın diye failed:true
    // ayrıca ele alınır. Mimar/Firma fotoğrafı/logosu OLMAYAN öğeleri havuzdan DÜŞÜRMEZ —
    // architectSlideHtml/officeSlideHtml eksik görselde kendi baş harf rozetine düşer.
    // notPreview: sunucu zaten noPreview=1 ile eliyor (bkz. yukarısı) — bu süzgeç, deploy anında
    // edge'de duran ESKİ bir gövdeyi (ya da eski bir gömülü ml-home-data'yı) okuyan tarayıcıda da
    // blurlu kartın vitrine düşmemesini garanti eder; proje karuselindeki AYNI desen.
    const notPreview = (list) => (list || []).filter(x => x && !x.preview);
    // head: "varsa 6, yoksa olduğu kadar" (kullanıcı isteği) — slice üst sınırdır, eksik kayıt
    // yer tutucuyla doldurulmaz; tek kayıt varsa karusel o kayıtta durur (createMiniSlider'ın
    // goTo'su modulo ile döndüğünden tek slaytlı bir karusel de sorunsuz çalışır).
    const head = (list) => notPreview(list).slice(0, PROJECT_CAROUSEL_SLOTS);
    if(architectRes.failed) kisiSlider.renderError('Kişiler şu an yüklenemedi.');
    else kisiSlider.render(head(architectRes.items));

    if(officeRes.failed) firmaSlider.renderError('Firmalar şu an yüklenemedi.');
    else firmaSlider.render(head(officeRes.items));

    if(productRes.failed) urunSlider.renderError('Ürünler şu an yüklenemedi.');
    else urunSlider.render(head(productRes.items));

    if(brandRes.failed) markaSlider.renderError('Markalar şu an yüklenemedi.');
    else markaSlider.render(head(brandRes.items));

    if(gundemRes.failed) gundemSlider.renderError('Gündem içerikleri şu an yüklenemedi.');
    else gundemSlider.render((gundemRes.items || []).slice(0, PROJECT_CAROUSEL_SLOTS));
  });
  });
}

// ANA SAYFADAN VARLIK POPUP'I — AYNI BELGEDE (performans denetimi, 2026-09-12).
// ÖLÇÜLDÜ (headless Chromium, yerel worker — ağ gecikmesi YOKKEN): karuseldeki bir kişi/firma/ürün/
// marka/proje kartı TAM SAYFA gezinmeydi (/kisi/:slug açılır, kisi.html kendi kabuğunu, ~50 isteğini
// ve "boot veil"ini kurar, sonra popup'ı hidrasyonla açar): tıklamadan içeriğe ~300-500 ms. Aynı
// belgede açılan bir popup ~130-170 ms. Canlıda fark TTFB + kabuk + script kadar (saniye mertebesi).
// Çözüm kisi.html#card-grid tıklama dinleyicisinin BİREBİR aynı deseni: modül YALNIZCA ilk tıklamada
// lazy-modals.js zincirinden iner (ana sayfaya ilk yükte hiçbir şey eklenmez — o karar korunur,
// bkz. lazy-modals.js#warmListPageModule), popup AYNI belgede açılır, URL yine history.pushState ile
// kanonik /kisi/:slug vb. yola yazılır (SEO/paylaşım değişmez), kapanış ModalShell'in mevcut
// goBackAndWait yolundan '/'a döner ve karuseller yerinde kalır. Modül inemezse (offline/timeout)
// tarayıcının normal gezinmesine düşülür — kisi.html'deki AYNI güvenlik ağı.
// ModalShell kapanışta başlık/canonical/OG'yi window.__mlSsrDefaults'tan geri yazar (bkz.
// modal-shell.js#resetSsrEntity); ana sayfanın kendi değerleri buradan verilir, aksi halde popup
// kapanınca sekme başlığı son açılan kaydın adında kalırdı.
window.__mlSsrDefaults = window.__mlSsrDefaults || (function(){
  const content = (id) => { const el = document.getElementById(id); return el ? (el.getAttribute('content') || '') : ''; };
  return {
    title: document.title, h1: '', description: content('meta-description'), canonicalUrl: 'https://mimarlab.com/',
    ogType: 'website', image: content('og-image'),
  };
})();
const HOME_ENTITY_MODULE = { proje: 'project', kisi: 'architect', firma: 'office', marka: 'office', urun: 'product' };
document.querySelector('.bento-grid').addEventListener('click', (e) => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest('a[href]');
  if (!a || (a.target && a.target !== '_self')) return;
  const m = (a.getAttribute('href') || '').match(/^\/(proje|kisi|firma|marka|urun)\/([^/?#]+)\/?$/);
  if (!m || /^sayfa-\d+$/.test(m[2])) return;
  // lazy-modals.js (defer) henüz gelmediyse bağlantı doğal davranışla SSR detay sayfasına gider.
  if (typeof LazyModals === 'undefined' || !LazyModals.load) return;
  let slug;
  try { slug = decodeURIComponent(m[2]); } catch (err) { return; }
  e.preventDefault();
  const href = a.href;
  LazyModals.load(HOME_ENTITY_MODULE[m[1]])
    .then(Modal => { if (Modal && Modal.open) return Modal.open(slug, { triggerEl: a, basePath: '/' + m[1] + '/' }); window.location.href = href; })
    .catch((err) => { console.warn('Ana sayfa popup açılamadı, sayfaya gidiliyor:', err); window.location.href = href; });
});

loadHomeSections(true);

// ARKA PLAN YENİLEMESİ — gömülü veri, HTML'in üretildiği andaki (HOME_SSR.t) veridir. Belge Worker'dan
// az önce geldiyse veri API'nin döneceğiyle aynıdır, ek istek gereksiz. Belge tarayıcının kendi
// önbelleğinden geldiyse (max-age=60, geri/ileri gezinme, ya da beklenmedik biçimde daha uzun tutan
// bir ara katman — bkz. fetchPublicJson'daki Browser Cache TTL bulgusu) veri bayat olabilir — sayfa
// yükü bitip görseller indikten sonra sessizce API'den tazelenir; render() içerik değişmemişse hiçbir
// şey yapmaz (aynı anahtar), değiştiyse yeni içerik yazılır (eski "karusel yeni projeyi göstermiyor"
// şikâyetinin güvenlik ağı). Ölçüt yaş: 45sn — ağ üzerinden az önce üretilmiş bir belge bunun çok
// altındadır; istemci saati sapmışsa en kötü durumda gereksiz (ama zararsız) bir yenileme olur.
// (Navigation Timing transferSize BİLEREK kullanılmıyor: yerel testte ağdan gelen belgede bile 0 döndü.)
if(HOME_SSR){
  const navEntry = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || null;
  const age = Date.now() - (Number(HOME_SSR.t) || 0);
  // age < -300000: 5dk'dan büyük NEGATİF yaş saat sapması değil beklenmedik bir durumdur; küçük negatif
  // değerler (istemci saati sunucudan biraz geride — canlıda -61ms görüldü) tazedir, yenileme gerektirmez.
  const maybeStale = age >= 45000 || age < -300000 || (navEntry && navEntry.type === 'back_forward');
  if(maybeStale){
    const refresh = () => setTimeout(() => loadHomeSections(false), 2500);
    if(document.readyState === 'complete') refresh();
    else window.addEventListener('load', refresh, { once: true });
  }
}
</script>
